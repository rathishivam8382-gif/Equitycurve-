// ============================================================
// Image block — paste, drop, or upload
// ============================================================
function ImageBlock({ block, onChange }) {
  // block.content is a data URL (base64) when populated; "" until then.
  const dataUrl = block.content || "";
  const fileRef = useRef(null);
  const [error, setError] = useState(null);
  const MAX_BYTES = 4 * 1024 * 1024; // 4 MB cap per image (storage budget for the note)

  function persist(content) { onChange(block.id, { content }); }

  function handleFile(file) {
    if (!file) return;
    if (!file.type || file.type.indexOf("image/") !== 0) {
      setError("Not an image file");
      return;
    }
    if (file.size > MAX_BYTES) {
      setError("Image too large (max 4 MB) — try compressing it first");
      return;
    }
    const reader = new FileReader();
    reader.onload = function() {
      setError(null);
      persist(reader.result);
    };
    reader.onerror = function() { setError("Couldn't read the file"); };
    reader.readAsDataURL(file);
  }

  function handleSelect(e) {
    const f = e.target.files && e.target.files[0];
    handleFile(f);
    // Clear so the same file can be re-picked
    if (e.target) e.target.value = "";
  }
  function handlePaste(e) {
    const items = (e.clipboardData && e.clipboardData.items) || [];
    for (let i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf("image/") === 0) {
        e.preventDefault();
        handleFile(items[i].getAsFile());
        return;
      }
    }
  }
  function handleDrop(e) {
    e.preventDefault();
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    handleFile(f);
  }
  function handleDragOver(e) { e.preventDefault(); }

  function clearImage() { persist(""); setError(null); }

  return (
    <div className="block">
      <div className="block-row">
        <span className="block-handle">⋮⋮</span>
        <div className="block-content">
          {dataUrl ? (
            <div className="block-image">
              <img src={dataUrl} alt="" />
              <div className="block-image-actions">
                <button className="block-image-btn" onClick={() => fileRef.current && fileRef.current.click()}>Replace</button>
                <button className="block-image-btn block-image-btn-danger" onClick={clearImage}>Clear</button>
                {onRemove && (
                  <button
                    className="block-image-btn block-image-btn-danger"
                    onClick={() => onRemove(block.id)}
                    title="Delete this block"
                  >Delete block</button>
                )}
              </div>
            </div>
          ) : (
            <div
              className="block-image-empty"
              onPaste={handlePaste}
              onDrop={handleDrop}
              onDragOver={handleDragOver}
              tabIndex={0}
              role="button"
              onClick={() => fileRef.current && fileRef.current.click()}
              onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileRef.current && fileRef.current.click(); } }}
            >
              <span className="block-image-empty-icon">🖼</span>
              <span className="block-image-empty-text">
                <strong>Click to upload</strong>, drop a file here, or paste an image
                <span className="block-image-empty-hint">Max 4 MB · stored inside this note</span>
              </span>
              {onRemove && (
                <button
                  className="block-delete-btn block-delete-image-empty"
                  onClick={(e) => { e.stopPropagation(); onRemove(block.id); }}
                  title="Delete this block"
                  aria-label="Delete image block"
                >×</button>
              )}
            </div>
          )}
          <input
            ref={fileRef}
            type="file"
            accept="image/*"
            onChange={handleSelect}
            style={{ display: "none" }}
          />
          {error && <div className="block-image-error">{error}</div>}
        </div>
      </div>
    </div>
  );
}


function Block({ block, isFocused, focusOnMount, onChange, onEnter, onBackspaceEmpty, onArrowUp, onArrowDown, onFocus, onBlur, onSlash, onCheckToggle, onRemove, onPasteBlocks, numbering, titleIndex, highlightTerms, onWikiClick, notesForAutocomplete }) {
  const taRef = useRef(null);
  const [editing, setEditing] = useState(focusOnMount || false);
  const editingRef = useRef(editing);
  editingRef.current = editing;
  // Inline autocomplete state: { kind: "tag"|"wiki", prefix, items, focused }
  const [acState, setAcState] = useState(null);

  useAutoGrow(taRef, block.content);

  useEffect(() => {
    if (focusOnMount && taRef.current) {
      taRef.current.focus();
      const len = (block.content || "").length;
      try { taRef.current.setSelectionRange(len, len); } catch (e) {}
      setEditing(true);
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // CRITICAL UX FIX: when the user clicks a rendered block to edit it,
  // setEditing(true) mounts the textarea — but the user's click was on the
  // (now unmounted) div, not the textarea. Auto-focus the textarea so the
  // user doesn't have to click TWICE to start typing.
  //
  // IMPORTANT: we use `preventScroll: true` and do NOT call setSelectionRange.
  // For a LONG block (e.g. a pasted essay), calling setSelectionRange(len, len)
  // would scroll the page to the END of the textarea — making the content
  // appear to "collapse" because the top has scrolled off-screen. By skipping
  // the cursor move, the textarea stays visually in place. The cursor lands
  // at position 0; the user can click into the text to position it precisely.
  useEffect(() => {
    if (editing && taRef.current && document.activeElement !== taRef.current) {
      const ta = taRef.current;
      const id = requestAnimationFrame(() => {
        if (ta && document.activeElement !== ta) {
          try { ta.focus({ preventScroll: true }); } catch (e) { ta.focus(); }
          // Do NOT move cursor — see comment above.
        }
      });
      return () => cancelAnimationFrame(id);
    }
  }, [editing]);

  // Smart paste: when the user pastes multi-line text, we intercept and ask
  // BlockEditor to split it into multiple blocks (respecting markdown patterns).
  // Single-line pastes fall through to the browser default so paste-position
  // within a textarea works normally.
  function handlePaste(e) {
    // Skip if we have no upstream handler
    if (!onPasteBlocks) return;
    // Don't intercept paste inside code/math — those want raw text
    if (block.type === "code" || block.type === "math") return;

    const cd = e.clipboardData;
    if (!cd) return;
    const text = cd.getData("text/plain");
    if (!text) return;

    // Single line — let the browser handle it normally (preserves caret position etc.)
    if (!text.includes("\n")) return;

    // Multi-line paste — split into blocks
    e.preventDefault();
    const caretPos = taRef.current ? taRef.current.selectionStart : 0;
    onPasteBlocks(block.id, text, caretPos);
  }

  // CRITICAL: any useMemo / hook calls must happen UNCONDITIONALLY before any early
  // returns. Previously, the math useMemo lived inside the `if (block.type === "math")`
  // branch, AFTER the diagram early-return. When a user converted a text block to a
  // diagram via the slash menu, the hook count for that Block instance dropped (because
  // the math useMemo was no longer reached) → React threw "Rendered fewer hooks than
  // expected" and the whole notes section crashed.
  // Fix: compute the math lines unconditionally here. Cheap when block.type !== "math".
  const mathLines = useMemo(() => {
    if (block.type !== "math") return null;
    return evaluateMathBlock(block.content || "");
  }, [block.content, block.type]);

  // Detect if the cursor is currently inside a `#xxx` or `[[xxx` token. If so, surface suggestions.
  // Skip detection inside code/math blocks (raw input wins).
  function refreshAutocomplete() {
    if (block.type === "code" || block.type === "math") { setAcState(null); return; }
    if (!taRef.current) { setAcState(null); return; }
    const ta = taRef.current;
    const pos = ta.selectionStart;
    if (pos == null || pos !== ta.selectionEnd) { setAcState(null); return; }
    const text = ta.value || "";
    const upto = text.slice(0, pos);
    // Wiki-link match: `[[...` where ... has no closing `]]` and no newline
    const wikiMatch = upto.match(/\[\[([^\[\]\n]*)$/);
    if (wikiMatch) {
      const prefix = wikiMatch[1];
      const items = suggestWikiTargets(prefix, notesForAutocomplete || [], 6);
      if (items.length > 0) { setAcState({ kind: "wiki", prefix, items, focused: 0 }); return; }
      setAcState(null); return;
    }
    // Hashtag match: `#xxx` at word boundary
    const tagMatch = upto.match(/(?:^|[^\w])#([a-zA-Z][\w-]{0,30})$/);
    if (tagMatch) {
      const prefix = tagMatch[1];
      const items = suggestTags(prefix, notesForAutocomplete || [], 6);
      // Only show if we have items AND the user has typed at least 1 char (avoids noise on lone `#`)
      if (items.length > 0 && prefix.length > 0) { setAcState({ kind: "tag", prefix, items, focused: 0 }); return; }
      setAcState(null); return;
    }
    setAcState(null);
  }

  // Apply an autocomplete pick by replacing the in-progress token in the text
  function acceptAutocomplete(item) {
    if (!taRef.current || !acState) return;
    const ta = taRef.current;
    const pos = ta.selectionStart;
    const text = ta.value || "";
    const upto = text.slice(0, pos);
    let newUpto, completion;
    if (acState.kind === "wiki") {
      const m = upto.match(/\[\[([^\[\]\n]*)$/);
      if (!m) { setAcState(null); return; }
      const start = m.index + 2;
      newUpto = text.slice(0, start) + item.title + "]]";
      completion = item.title.length + 2; // +2 for ]]
    } else {
      const m = upto.match(/(?:^|[^\w])#([a-zA-Z][\w-]{0,30})$/);
      if (!m) { setAcState(null); return; }
      // The `#` is at m.index + 1 if there's a leading non-word char, else 0
      const hashPos = m.index + (m[0][0] === "#" ? 0 : 1);
      newUpto = text.slice(0, hashPos + 1) + item.tag;
      completion = item.tag.length + 1;
    }
    const newText = newUpto + text.slice(pos);
    const newCursor = newUpto.length;
    onChange(block.id, { content: newText });
    setAcState(null);
    // Restore cursor on next tick
    setTimeout(() => {
      if (taRef.current) {
        taRef.current.focus();
        try { taRef.current.setSelectionRange(newCursor, newCursor); } catch (e) {}
      }
    }, 0);
  }

  function handleKey(e) {
    // Autocomplete navigation (when dropdown is open)
    if (acState && acState.items.length > 0) {
      if (e.key === "ArrowDown") { e.preventDefault(); setAcState(s => Object.assign({}, s, { focused: Math.min(s.items.length - 1, s.focused + 1) })); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); setAcState(s => Object.assign({}, s, { focused: Math.max(0, s.focused - 1) })); return; }
      if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); acceptAutocomplete(acState.items[acState.focused]); return; }
      if (e.key === "Escape") { e.preventDefault(); setAcState(null); return; }
    }

    // Slash menu trigger: works in non-code/math blocks, but ONLY at a
    // word boundary — that is, when the character immediately before the
    // cursor is whitespace, a newline, or nothing (start of block).
    // This way:
    //   - empty block, press / → menu opens ✓
    //   - "Some text " (space before), press / → menu opens ✓
    //   - "TCP/IP" (typing / after "P") → no menu, literal / typed ✓
    //   - "https://" (typing / after ":") → no menu, literal / typed ✓
    //   - "client/server" → no menu ✓
    // To still convert an existing block with content, just position the
    // cursor at the very start of the block (Home key) and press / there,
    // OR use the markdown shortcuts (# , ## , - , etc).
    if (e.key === "/" && (block.type !== "code" && block.type !== "math") && onSlash) {
      const ta = taRef.current;
      const caret = ta ? ta.selectionStart : 0;
      const charBefore = caret > 0 ? (block.content || "").charAt(caret - 1) : "";
      const atWordBoundary = !charBefore || /\s/.test(charBefore);
      if (atWordBoundary) {
        e.preventDefault();
        onSlash(block.id);
        return;
      }
      // Otherwise let the / type as a literal character (e.g. URLs, paths,
      // "and/or", "TCP/IP"). The browser default will insert it.
    }

    // For text-like blocks, Enter splits/creates new block
    if (e.key === "Enter" && !e.shiftKey && block.type !== "code" && block.type !== "math") {
      e.preventDefault();
      onEnter(block.id, taRef.current ? taRef.current.selectionStart : 0);
      return;
    }
    // Inside code/math: plain Enter inserts newline (default behavior).
    // Shift+Enter in text exits to a new text block.
    if (e.key === "Enter" && e.shiftKey && (block.type === "code" || block.type === "math")) {
      e.preventDefault();
      onEnter(block.id, taRef.current ? taRef.current.selectionStart : 0, true);
      return;
    }

    if (e.key === "Backspace") {
      const ta = taRef.current;
      // First check: did the user JUST trigger a markdown conversion?
      // If so and they hit Backspace, undo the conversion (restore the
      // trigger text in a plain text block). 2-second window.
      if (
        lastShortcutRef.current &&
        Date.now() - lastShortcutRef.current.ts < 2000 &&
        ta && ta.selectionStart === 0 && ta.selectionEnd === 0
      ) {
        const trigger = lastShortcutRef.current.trigger;
        lastShortcutRef.current = null;
        e.preventDefault();
        const restored = trigger + (block.content || "");
        onChange(block.id, { type: "text", content: restored, checked: false });
        setTimeout(() => {
          if (taRef.current) {
            try { taRef.current.setSelectionRange(trigger.length, trigger.length); } catch (e) {}
          }
        }, 0);
        return;
      }
      if (ta && ta.selectionStart === 0 && ta.selectionEnd === 0) {
        if ((block.content || "") === "" || block.type !== "text") {
          e.preventDefault();
          onBackspaceEmpty(block.id);
          return;
        }
      }
    }

    if (e.key === "ArrowUp" && taRef.current && taRef.current.selectionStart === 0) {
      e.preventDefault();
      onArrowUp(block.id);
      return;
    }
    if (e.key === "ArrowDown" && taRef.current && taRef.current.selectionStart === (block.content || "").length) {
      e.preventDefault();
      onArrowDown(block.id);
      return;
    }

    // Tab inside code → insert 2 spaces (basic)
    if (e.key === "Tab" && block.type === "code") {
      e.preventDefault();
      const ta = taRef.current;
      if (ta) {
        const start = ta.selectionStart, end = ta.selectionEnd;
        const newVal = (block.content || "").slice(0, start) + "  " + (block.content || "").slice(end);
        onChange(block.id, { content: newVal });
        setTimeout(() => { try { ta.setSelectionRange(start + 2, start + 2); } catch (e) {} }, 0);
      }
    }
  }

  // Track recent markdown-shortcut conversion so Backspace right after
  // can undo it (Notion-style escape hatch when you accidentally trigger
  // a conversion you didn't mean).
  const lastShortcutRef = useRef(null);

  // Markdown shortcut patterns. When the user types one of these at the
  // start of a text block, the block instantly converts. Examples:
  //   "# " → H1,  "## " → H2,  "### " → H3
  //   "- " or "* " → bullet,  "1. " → numbered
  //   "[] " or "[ ] " → unchecked checklist
  //   "[x] " → checked checklist
  //   "> " → blockquote (kept as text with `>` prefix; markdown styles it)
  //   "--- " → divider
  const MARKDOWN_SHORTCUTS = [
    { regex: /^# (.*)$/,           type: "h1" },
    { regex: /^## (.*)$/,          type: "h2" },
    { regex: /^### (.*)$/,         type: "h3" },
    { regex: /^\[ ?\] (.*)$/,      type: "check", checked: false },
    { regex: /^\[x\] (.*)$/i,      type: "check", checked: true },
    { regex: /^[-*] (.*)$/,        type: "bullet" },
    { regex: /^\d+[.)] (.*)$/,     type: "numbered" }
  ];

  function handleChange(e) {
    const newVal = e.target.value;

    // Markdown shortcut detection — only fires for TEXT blocks (so users
    // can edit existing headings without their `#`s being re-processed).
    if (block.type === "text") {
      for (let i = 0; i < MARKDOWN_SHORTCUTS.length; i++) {
        const sc = MARKDOWN_SHORTCUTS[i];
        const m = sc.regex.exec(newVal);
        if (m) {
          const remainder = m[1];
          const trigger = newVal.slice(0, newVal.length - remainder.length);
          // Remember the trigger so Backspace can undo the conversion
          lastShortcutRef.current = { trigger: trigger, ts: Date.now() };
          const updates = { type: sc.type, content: remainder };
          if (sc.checked !== undefined) updates.checked = sc.checked;
          onChange(block.id, updates);
          // Position cursor where it would naturally land after typing
          setTimeout(() => {
            const ta = taRef.current;
            if (ta) {
              try { ta.setSelectionRange(remainder.length, remainder.length); } catch (e) {}
            }
          }, 0);
          return;
        }
      }
    }

    // Clear stale shortcut tracking (anything older than 2 seconds)
    if (lastShortcutRef.current && Date.now() - lastShortcutRef.current.ts > 2000) {
      lastShortcutRef.current = null;
    }

    onChange(block.id, { content: newVal });
    // Defer to next tick so the textarea selection is up to date
    setTimeout(refreshAutocomplete, 0);
  }

  function handleSelect() { setTimeout(refreshAutocomplete, 0); }

  function handleFocus() { setEditing(true); if (onFocus) onFocus(block.id); }
  function handleBlur() {
    setEditing(false);
    // Delay close so a mousedown on a dropdown item can fire before the dropdown unmounts
    setTimeout(() => setAcState(null), 150);
    if (onBlur) onBlur(block.id);
  }

  // === Render dispatcher ===
  const content = block.content || "";

  // Divider — no input
  if (block.type === "divider") {
    return (
      <div className="block block-divider">
        <hr/>
      </div>
    );
  }

  // Diagram block
  if (block.type === "diagram") {
    return <DiagramBlock block={block} onChange={onChange} onRemove={onRemove}/>;
  }

  // Table block
  if (block.type === "table") {
    return <TableBlock block={block} onChange={onChange} onRemove={onRemove}/>;
  }

  // Callout block
  if (block.type === "callout") {
    return <CalloutBlock block={block} onChange={onChange} titleIndex={titleIndex} onWikiClick={onWikiClick} onRemove={onRemove}/>;
  }

  // Image block
  if (block.type === "image") {
    return <ImageBlock block={block} onChange={onChange} onRemove={onRemove}/>;
  }

  // Math block — special handling. Uses the unconditional `mathLines` computed at top of Block.
  if (block.type === "math") {
    const lines = mathLines;
    return (
      <div className="block">
        <div className="block-row">
          <span className="block-handle">⋮⋮</span>
          <div className="block-content">
            <div className="block-math">
              <span className="block-math-label">ƒ math</span>
              {onRemove && (
                <button
                  className="block-delete-btn block-delete-inline block-delete-math"
                  onClick={() => onRemove(block.id)}
                  title="Delete math block"
                  aria-label="Delete math block"
                >×</button>
              )}
              {editing ? (
                <textarea
                  ref={taRef}
                  className="block-math-input"
                  value={content}
                  onChange={handleChange}
                  onKeyDown={handleKey}
                  onFocus={handleFocus}
                  onBlur={handleBlur}
                  placeholder="2 + 3&#10;tax = 0.1&#10;100 * (1 + tax)"
                  spellCheck="false"
                  autoCorrect="off"
                  autoCapitalize="off"
                  rows={Math.max(1, content.split("\n").length)}
                />
              ) : (
                <div className="block-math-rendered" onClick={() => setEditing(true)}>
                  {lines.length === 0 || (lines.length === 1 && lines[0].kind === "blank") ? (
                    <span className="block-rendered-empty">Click to add math — e.g. <code>2+3</code>, <code>tax = 0.1</code>, <code>100*(1+tax)</code></span>
                  ) : lines.map((ln, i) => {
                    if (ln.kind === "blank") return <div key={i} className="block-math-line" style={{height: "1.5em"}}></div>;
                    if (ln.kind === "comment") return <div key={i} className="block-math-line"><span className="block-math-comment">{ln.text}</span></div>;
                    if (ln.kind === "error") return (
                      <div key={i} className="block-math-line">
                        <span className="block-math-expr">{ln.expr}</span>
                        <span className="block-math-error">⚠ {ln.error}</span>
                      </div>
                    );
                    return (
                      <div key={i} className="block-math-line">
                        <span className="block-math-expr">{ln.expr}</span>
                        {!ln.isAssign && <span className="block-math-eq">=</span>}
                        {!ln.isAssign && <span className="block-math-result">{ln.result}</span>}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    );
  }

  // Code block
  if (block.type === "code") {
    const lang = block.lang || detectLanguage(content);
    const highlighted = !editing && content ? highlightCode(content, lang) : null;
    return (
      <div className="block">
        <div className="block-row">
          <span className="block-handle">⋮⋮</span>
          <div className="block-content">
            <div className="block-code">
              {lang && <span className="block-code-label">{lang}</span>}
              {onRemove && (
                <button
                  className="block-delete-btn block-delete-inline block-delete-code"
                  onClick={() => onRemove(block.id)}
                  title="Delete code block"
                  aria-label="Delete code block"
                >×</button>
              )}
              {editing ? (
                <textarea
                  ref={taRef}
                  className="block-code-input"
                  value={content}
                  onChange={handleChange}
                  onKeyDown={handleKey}
                  onFocus={handleFocus}
                  onBlur={handleBlur}
                  placeholder="// paste or type code…"
                  spellCheck="false"
                  autoCorrect="off"
                  autoCapitalize="off"
                  rows={Math.max(1, content.split("\n").length)}
                />
              ) : (
                <pre className="block-code-rendered" onClick={() => setEditing(true)}>
                  {!content ? (
                    <span className="block-rendered-empty">Click to add code…</span>
                  ) : highlighted ? (
                    <code dangerouslySetInnerHTML={{__html: highlighted}}/>
                  ) : (
                    <code>{content}</code>
                  )}
                </pre>
              )}
            </div>
          </div>
        </div>
      </div>
    );
  }

  // Checklist
  if (block.type === "check") {
    return (
      <div className={"block block-check" + (block.checked ? " checked" : "")} style={{position: "relative"}}>
        <div className="block-row">
          <span className="block-handle">⋮⋮</span>
          <div className="block-content" style={{display: "flex", gap: "8px", alignItems: "flex-start"}}>
            <span className={"block-check-box" + (block.checked ? " checked" : "")}
                  onClick={() => onCheckToggle(block.id)} role="checkbox" aria-checked={!!block.checked}/>
            {editing ? (
              <textarea
                ref={taRef}
                className="block-text-input"
                value={content}
                onChange={handleChange}
                onKeyDown={handleKey}
                onFocus={handleFocus}
                onBlur={handleBlur}
                onSelect={handleSelect}
                onPaste={handlePaste}
                placeholder="Checklist item…"
                rows={1}
              />
            ) : (
              <div className="block-rendered" onClick={(e) => {
                const wl = e.target.closest && e.target.closest("[data-wiki]");
                if (wl && onWikiClick) { e.stopPropagation(); onWikiClick(wl.getAttribute("data-wiki")); return; }
                setEditing(true);
              }} dangerouslySetInnerHTML={{__html: content ? renderInline(content, { titleIndex, highlightTerms }) : '<span class="block-rendered-empty">Checklist item…</span>'}}/>
            )}
          </div>
        </div>
        {acState && acState.items.length > 0 && (
          <AutocompletePopover state={acState} onPick={acceptAutocomplete} onClose={() => setAcState(null)}/>
        )}
      </div>
    );
  }

  // Bullet / Numbered / Text / Headings
  let placeholder = "Type, or press / for commands…";
  if (block.type === "h1") placeholder = "Heading 1";
  else if (block.type === "h2") placeholder = "Heading 2";
  else if (block.type === "h3") placeholder = "Heading 3";
  else if (block.type === "bullet") placeholder = "List item…";
  else if (block.type === "numbered") placeholder = "List item…";

  const wrapClass = "block block-" + (block.type === "h1" || block.type === "h2" || block.type === "h3" ? "heading-" + block.type[1] : block.type);

  return (
    <div className={wrapClass} style={{position: "relative"}}>
      <div className="block-row">
        <span className="block-handle">⋮⋮</span>
        <div className="block-content" style={
          block.type === "bullet" ? {display: "flex", alignItems: "flex-start", gap: "8px"} :
          block.type === "numbered" ? {display: "flex", alignItems: "flex-start", gap: "6px"} :
          {}
        }>
          {block.type === "bullet" && <span className="block-bullet-marker" aria-hidden="true">•</span>}
          {block.type === "numbered" && <span className="block-num">{numbering || 1}.</span>}
          {editing ? (
            <textarea
              ref={taRef}
              className="block-text-input"
              value={content}
              onChange={handleChange}
              onKeyDown={handleKey}
              onFocus={handleFocus}
              onBlur={handleBlur}
              onSelect={handleSelect}
              onClick={handleSelect}
              onPaste={handlePaste}
              placeholder={placeholder}
              rows={1}
              style={{flex: 1}}
            />
          ) : (
            <div className="block-rendered" onClick={(e) => {
                const wl = e.target.closest && e.target.closest("[data-wiki]");
                if (wl && onWikiClick) { e.stopPropagation(); onWikiClick(wl.getAttribute("data-wiki")); return; }
                setEditing(true);
              }}
                 style={{flex: block.type === "bullet" || block.type === "numbered" ? 1 : "initial"}}
                 dangerouslySetInnerHTML={{__html: content ? renderInline(content, { titleIndex, highlightTerms }) : '<span class="block-rendered-empty">' + placeholder + '</span>'}}/>
          )}
        </div>
      </div>
      {acState && acState.items.length > 0 && (
        <AutocompletePopover state={acState} onPick={acceptAutocomplete} onClose={() => setAcState(null)}/>
      )}
    </div>
  );
}

// ============================================================
// Inline autocomplete popover (used by Block for #tags and [[wiki]])
// ============================================================
function AutocompletePopover({ state, onPick }) {
  const kind = state.kind;
  return (
    <div className="inline-autocomplete" style={{top: "100%", left: 24, marginTop: 2}}>
      <div className="inline-autocomplete-head">
        {kind === "wiki" ? "Link to note" : "Tag"}
      </div>
      {state.items.map((item, i) => (
        <button
          key={i}
          className={"inline-autocomplete-item" + (i === state.focused ? " focused" : "")}
          onMouseDown={(e) => { e.preventDefault(); onPick(item); }}
        >
          <span className="inline-autocomplete-item-text">
            {kind === "wiki" ? item.title : ("#" + item.tag)}
          </span>
          {kind === "tag" && <span className="inline-autocomplete-item-count">{item.count}</span>}
        </button>
      ))}
    </div>
  );
}

// ============================================================
// Block editor — orchestrates a list of blocks for a note
// ============================================================
function BlockEditor({ blocks, onChange, titleIndex, highlightTerms, onWikiClick, notesForAutocomplete, onFocusChange }) {
  const [focusId, setFocusId] = useState(null);
  const [slashFor, setSlashFor] = useState(null); // block id where slash menu is open
  const [slashQuery, setSlashQuery] = useState("");
  const focusOnMountRef = useRef(null);

  // Notify parent (e.g. NoteFocusView toolbar) when focus changes
  function handleFocusChange(id) {
    setFocusId(id);
    if (onFocusChange) onFocusChange(id);
  }

  // Build numbering for numbered-list blocks (resets on non-numbered)
  const numbering = useMemo(() => {
    const map = {};
    let n = 0;
    for (let i = 0; i < blocks.length; i++) {
      if (blocks[i].type === "numbered") { n++; map[blocks[i].id] = n; }
      else { n = 0; }
    }
    return map;
  }, [blocks]);

  function updateBlock(id, updates) {
    onChange(blocks.map(b => b.id === id ? Object.assign({}, b, updates) : b));
  }

  function handleEnter(id, caretPos, forceText) {
    const idx = blocks.findIndex(b => b.id === id);
    if (idx === -1) return;
    const cur = blocks[idx];
    const content = cur.content || "";

    // For code/math, default Enter is newline (we won't be called); Shift+Enter triggers this with forceText=true.
    let newBlocks = blocks.slice();
    if (forceText || cur.type === "code" || cur.type === "math") {
      // Insert a new empty text block after
      const fresh = newBlock("text", "");
      newBlocks.splice(idx + 1, 0, fresh);
      focusOnMountRef.current = fresh.id;
      onChange(newBlocks);
      return;
    }

    // For empty heading/checklist/bullet/numbered → convert to text instead of splitting
    if (!content && (cur.type !== "text")) {
      newBlocks[idx] = Object.assign({}, cur, { type: "text", checked: false });
      focusOnMountRef.current = cur.id;
      onChange(newBlocks);
      return;
    }

    // Split at caret
    const before = content.slice(0, caretPos);
    const after = content.slice(caretPos);
    // Inherit type for list-like blocks (so Enter inside a bullet creates another bullet)
    const inheritType = (cur.type === "bullet" || cur.type === "numbered" || cur.type === "check") ? cur.type : "text";
    const fresh = newBlock(inheritType, after);
    if (inheritType === "check") fresh.checked = false;
    newBlocks[idx] = Object.assign({}, cur, { content: before });
    newBlocks.splice(idx + 1, 0, fresh);
    focusOnMountRef.current = fresh.id;
    onChange(newBlocks);
  }

  // Smart paste: when the user pastes multi-line text into a block, parse it
  // for markdown patterns and insert as multiple blocks instead of dumping the
  // entire paste into a single textarea.
  //
  // KEY RULE: paste should NEVER change the TYPE of an existing block that has
  // content. If you have "Hello " and paste "# Title\n\nBody", you want:
  //   text("Hello "), h1("Title"), text("Body")
  // NOT:
  //   h1("Hello Title"), text("Body")  ← bug: your "Hello " became part of the heading
  //
  // Only an EMPTY text block (truly empty) can be "consumed" by the first
  // pasted block — that's the natural case of pasting into a fresh blank line.
  function handlePasteBlocks(id, text, caretPos) {
    if (!text) return;
    const idx = blocks.findIndex(b => b.id === id);
    if (idx === -1) return;

    const cur = blocks[idx];
    // Don't touch structured blocks — for code/math/table/etc., the default
    // paste already does the right thing.
    if (cur.type === "code" || cur.type === "math" || cur.type === "table" ||
        cur.type === "callout" || cur.type === "diagram" || cur.type === "image" ||
        cur.type === "divider") {
      return;
    }

    const pasted = parseTextToBlocks(text);
    if (pasted.length === 0) return;

    const content = cur.content || "";
    const caret = (caretPos == null ? content.length : caretPos);
    const before = content.slice(0, caret);
    const after = content.slice(caret);

    const out = blocks.slice();

    // SIMPLE CASE: only one block of pasted content — insert its text at the
    // cursor without changing the current block's type. So pasting "# Title"
    // (which parses to a single h1 block) into the middle of existing text
    // just inserts "Title" inline — it does NOT convert the block to h1.
    if (pasted.length === 1) {
      const merged = before + pasted[0].content + after;
      out[idx] = Object.assign({}, cur, { content: merged });
      focusOnMountRef.current = cur.id;
      onChange(out);
      return;
    }

    // MULTI-BLOCK PASTE
    // Strategy depends on whether the current block has content:

    const TEXT_LIKE = ["text", "h1", "h2", "h3", "bullet", "numbered", "check"];
    let toInsert;

    if (!content && cur.type === "text") {
      // Current block is a fresh empty text block → consume it: replace with
      // the first pasted block, then insert the rest after.
      out[idx] = Object.assign({}, cur, {
        type: pasted[0].type,
        content: pasted[0].content,
        checked: pasted[0].checked || false
      });
      toInsert = pasted.slice(1);
    } else {
      // Current block has content (or is a non-text empty block like H1).
      // Keep it intact — just truncate to "before". All pasted blocks go after.
      // This preserves the original block's TYPE.
      out[idx] = Object.assign({}, cur, { content: before });
      toInsert = pasted.slice();
    }

    // Handle the "after" text (whatever was right of the cursor in the original).
    // Merge it into the LAST pasted block if that block is text-like, otherwise
    // add a separate text block at the end.
    if (after) {
      if (toInsert.length > 0) {
        const lastIdx = toInsert.length - 1;
        const lastBlock = toInsert[lastIdx];
        if (TEXT_LIKE.indexOf(lastBlock.type) >= 0) {
          toInsert[lastIdx] = Object.assign({}, lastBlock, {
            content: lastBlock.content + after
          });
        } else {
          // Last pasted is structured (e.g. divider) — add a new text block for "after"
          toInsert.push(newBlock("text", after));
        }
      } else {
        // toInsert is empty (current was empty text + only 1 pasted block,
        // but we're in the multi-block branch so this shouldn't happen).
        // Defensively append "after" to current block content.
        out[idx] = Object.assign({}, out[idx], { content: out[idx].content + after });
      }
    }

    out.splice(idx + 1, 0, ...toInsert);
    focusOnMountRef.current = toInsert.length > 0 ? toInsert[toInsert.length - 1].id : out[idx].id;
    onChange(out);
  }

  function handleBackspaceEmpty(id) {
    const idx = blocks.findIndex(b => b.id === id);
    if (idx === -1) return;
    const cur = blocks[idx];

    // If not text, convert to text (so backspacing a bullet/heading first un-decorates it)
    if (cur.type !== "text" && (cur.content || "")) {
      onChange(blocks.map(b => b.id === id ? Object.assign({}, b, { type: "text", checked: false }) : b));
      focusOnMountRef.current = id;
      return;
    }

    // Otherwise delete this block and merge into previous
    if (idx === 0) {
      // Already at top with empty → keep one block
      if (blocks.length === 1) return;
      // Delete and focus next
      const next = blocks[1];
      onChange(blocks.slice(1));
      focusOnMountRef.current = next.id;
      return;
    }
    const prev = blocks[idx - 1];
    const merged = (prev.content || "") + (cur.content || "");
    const out = blocks.slice();
    out[idx - 1] = Object.assign({}, prev, { content: merged });
    out.splice(idx, 1);
    focusOnMountRef.current = prev.id;
    onChange(out);
  }

  function handleArrowUp(id) {
    const idx = blocks.findIndex(b => b.id === id);
    if (idx <= 0) return;
    focusOnMountRef.current = blocks[idx - 1].id;
    setFocusId(blocks[idx - 1].id);
  }
  function handleArrowDown(id) {
    const idx = blocks.findIndex(b => b.id === id);
    if (idx === -1 || idx >= blocks.length - 1) return;
    focusOnMountRef.current = blocks[idx + 1].id;
    setFocusId(blocks[idx + 1].id);
  }

  // Remove an entire block (used by the × button on structured blocks
  // like table/diagram/callout/image/code/math, where Backspace inside the
  // block doesn't naturally remove the whole thing).
  function handleRemoveBlock(id) {
    const idx = blocks.findIndex(b => b.id === id);
    if (idx === -1) return;
    const out = blocks.slice();
    out.splice(idx, 1);
    // If we removed the last block, leave an empty text block so the editor
    // never goes to a completely empty state (which renders nothing).
    if (out.length === 0) {
      out.push(newBlock("text", ""));
    }
    // Move focus to the previous block, or to the next if we removed the first
    const focusTarget = idx > 0 ? out[idx - 1] : out[0];
    if (focusTarget) {
      focusOnMountRef.current = focusTarget.id;
      setFocusId(focusTarget.id);
    }
    onChange(out);
  }

  function handleSlashOpen(id) { setSlashFor(id); setSlashQuery(""); }
  function handleSlashPick(type) {
    const id = slashFor;
    setSlashFor(null); setSlashQuery("");
    if (!id) return;
    const idx = blocks.findIndex(b => b.id === id);
    if (idx === -1) return;
    const cur = blocks[idx];
    const existingContent = cur.content || "";

    // STRUCTURED block types (table/diagram/callout/image/divider) need their
    // own data shapes — we replace content rather than preserve.
    const structuredTypes = ["diagram", "table", "callout", "image", "divider"];
    const isStructured = structuredTypes.indexOf(type) >= 0;

    if (type === "divider") {
      // Divider: if current block has content, INSERT a divider AFTER it
      // (don't lose user's existing content). If empty, replace.
      if (existingContent) {
        const divider = newBlock("divider", "");
        const after = newBlock("text", "");
        const out = blocks.slice();
        out.splice(idx + 1, 0, divider, after);
        focusOnMountRef.current = after.id;
        onChange(out);
      } else {
        const divider = Object.assign({}, cur, { type: "divider", content: "", checked: false });
        const after = newBlock("text", "");
        const out = blocks.slice();
        out[idx] = divider;
        out.splice(idx + 1, 0, after);
        focusOnMountRef.current = after.id;
        onChange(out);
      }
      return;
    }

    if (isStructured) {
      // Table / diagram / callout / image: if current has content, insert NEW
      // block after (preserve user's text). If empty, replace.
      let newContent = "";
      if (type === "diagram") newContent = JSON.stringify(defaultDiagramData("tree"));
      else if (type === "table") newContent = JSON.stringify(defaultTableData());
      else if (type === "callout") newContent = JSON.stringify(defaultCalloutData());

      if (existingContent) {
        // Insert new structured block AFTER current one
        const inserted = newBlock(type, "");
        inserted.content = newContent;
        const out = blocks.slice();
        out.splice(idx + 1, 0, inserted);
        focusOnMountRef.current = inserted.id;
        onChange(out);
      } else {
        // Replace empty current block
        const replaced = Object.assign({}, cur, { type, content: newContent, checked: false });
        onChange(blocks.map(b => b.id === id ? replaced : b));
        focusOnMountRef.current = id;
      }
      return;
    }

    // TEXT-LIKE block types (text/h1/h2/h3/bullet/numbered/check/code/math):
    // Convert the current block but PRESERVE its content. This is the
    // critical UX fix — users can now write text first, then convert to
    // any type without retyping.
    const replaced = Object.assign({}, cur, {
      type,
      content: existingContent,
      // Reset checked state when changing TO a check block (fresh checkbox)
      checked: type === "check" ? false : (cur.checked || false)
    });
    onChange(blocks.map(b => b.id === id ? replaced : b));
    focusOnMountRef.current = id;
  }
  function handleSlashClose() { setSlashFor(null); setSlashQuery(""); }

  function handleCheckToggle(id) {
    onChange(blocks.map(b => b.id === id ? Object.assign({}, b, { checked: !b.checked }) : b));
  }

  function addBlockAfter(idx, type) {
    const fresh = newBlock(type || "text", "");
    const out = blocks.slice();
    out.splice(idx + 1, 0, fresh);
    focusOnMountRef.current = fresh.id;
    onChange(out);
  }

  // Reset focusOnMountRef after one tick so it doesn't keep refocusing
  useEffect(() => {
    if (focusOnMountRef.current) {
      const id = focusOnMountRef.current;
      // Clear after render so subsequent renders don't re-focus
      const t = setTimeout(() => { focusOnMountRef.current = null; }, 50);
      return () => clearTimeout(t);
    }
  }, [blocks]);

  if (!blocks || blocks.length === 0) {
    return null;
  }

  return (
    <div className="blocks">
      {blocks.map((b, i) => (
        <div key={b.id} style={{position: "relative"}}>
          <Block
            block={b}
            isFocused={focusId === b.id}
            focusOnMount={focusOnMountRef.current === b.id}
            onChange={updateBlock}
            onEnter={handleEnter}
            onBackspaceEmpty={handleBackspaceEmpty}
            onArrowUp={handleArrowUp}
            onArrowDown={handleArrowDown}
            onFocus={(id) => handleFocusChange(id)}
            onSlash={handleSlashOpen}
            onCheckToggle={handleCheckToggle}
            onRemove={handleRemoveBlock}
            onPasteBlocks={handlePasteBlocks}
            numbering={numbering[b.id]}
            titleIndex={titleIndex}
            highlightTerms={highlightTerms}
            onWikiClick={onWikiClick}
            notesForAutocomplete={notesForAutocomplete}
          />
          {slashFor === b.id && (
            <div style={{position: "absolute", top: "calc(100% - 4px)", left: 24, zIndex: 60}}>
              <SlashMenu query={slashQuery} onPick={handleSlashPick} onClose={handleSlashClose}/>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}


function App() {

  const inputRef = useRef(null);

  useEffect(() => {

      const ss = await loadJSON(STORAGE_KEYS.savedSearches, []);
      const sh = await loadJSON(STORAGE_KEYS.searchHistory, []);

        if (Array.isArray(legacy) && legacy.length > 0) {
          n = legacy.map(note => Object.assign({}, note, {
            blocks: note.blocks && note.blocks.length ? note.blocks : migrateMarkdownToBlocks(note.body || ""),
            body: undefined
          }));
        } else {
          n = [];
        }
      }
      // Safety: any note without blocks gets one + ensure collectionId field + linkedTaskIds
      n = (Array.isArray(n) ? n : []).map(note => {
        const fixed = Object.assign({}, note);
        if (!fixed.blocks || !Array.isArray(fixed.blocks) || fixed.blocks.length === 0) {
          fixed.blocks = migrateMarkdownToBlocks(note.body || "");
        }
        if (fixed.collectionId === undefined) fixed.collectionId = null;
        if (!Array.isArray(fixed.linkedTaskIds)) fixed.linkedTaskIds = [];

      });
      if (!mounted) return;
      const ensureLinks = (arr) => arr.map(x => Object.assign({linkedTaskIds: []}, x, { linkedTaskIds: x.linkedTaskIds || [] }));
      setTasks(Array.isArray(t) ? ensureLinks(t) : []);
      setRecurring(Array.isArray(r) ? ensureLinks(r) : []);
      setNotes(n);
      setCollections(Array.isArray(col) ? col : []);
      setSavedSearches(Array.isArray(ss) ? ss : []);
      setSearchHistory(Array.isArray(sh) ? sh : []);
      setLoaded(true);
    })();
    return () => { mounted = false; };
  }, []);

  useEffect(() => { if (loaded) saveJSON(STORAGE_KEYS.tasks, tasks); }, [tasks, loaded]);
  useEffect(() => { if (loaded) saveJSON(STORAGE_KEYS.recurring, recurring); }, [recurring, loaded]);
  useEffect(() => { if (loaded) saveJSON(STORAGE_KEYS.notes, notes); }, [notes, loaded]);
  useEffect(() => { if (loaded) saveJSON(STORAGE_KEYS.collections, collections); }, [collections, loaded]);
  useEffect(() => { if (loaded) saveJSON(STORAGE_KEYS.savedSearches, savedSearches); }, [savedSearches, loaded]);
  useEffect(() => { if (loaded) saveJSON(STORAGE_KEYS.searchHistory, searchHistory); }, [searchHistory, loaded]);

  // `today` refreshes on a 60s tick AND on tab visibility change, so the planner
  // stays correct across midnight and when the app wakes from background.
  const [todayKey, setTodayKey] = useState(() => formatDate(new Date()));
  useEffect(() => {
    function tick() {
      const k = formatDate(new Date());
      setTodayKey(prev => (prev === k ? prev : k));
    }
    const intervalId = setInterval(tick, 60 * 1000);
    function onVis() { if (document.visibilityState === "visible") tick(); }
    document.addEventListener("visibilitychange", onVis);
    return () => { clearInterval(intervalId); document.removeEventListener("visibilitychange", onVis); };
  }, []);
  const today = useMemo(() => { const d = new Date(); d.setHours(0,0,0,0); return d; }, [todayKey]);
  const weekStart = useMemo(() => getWeekStart(today, weekOffset), [today, weekOffset]);
  const weekDays = useMemo(() => { const arr = []; for (let i = 0; i < 7; i++) arr.push(addDays(weekStart, i)); return arr; }, [weekStart]);
  const preview = useMemo(() => parseInput(input, today), [input, today]);

  function handleAdd() {
    if (!preview || !preview.title) return;
    const item = Object.assign({ id: uid(), createdAt: Date.now(), completed: false, completedDates: {}, notes: "", linkedTaskIds: [] }, preview);
    if (preview.recurring) setRecurring(prev => prev.concat([item]));
    else setTasks(prev => prev.concat([item]));
    setInput("");
  }

  function handleKeyDown(e) { if (e.key === "Enter") { e.preventDefault(); handleAdd(); } }

  function updateTask(item, updates) {
    if (item.recurring) setRecurring(prev => prev.map(r => r.id === item.id ? Object.assign({}, r, updates) : r));
    else setTasks(prev => prev.map(t => t.id === item.id ? Object.assign({}, t, updates) : t));
    if (selected && selected.id === item.id) setSelected(prev => prev ? Object.assign({}, prev, updates) : prev);
  }

  function handleDelete(item) {
    const id = item.id;
    if (item.recurring) setRecurring(prev => prev.filter(r => r.id !== id));
    else setTasks(prev => prev.filter(t => t.id !== id));
    // Remove all incoming task links
    const strip = (arr) => arr.map(t => t.linkedTaskIds ? Object.assign({}, t, { linkedTaskIds: t.linkedTaskIds.filter(lid => lid !== id) }) : t);
    setTasks(strip); setRecurring(strip);
    // Also strip from notes
    setNotes(prev => prev.map(n => n.linkedTaskIds && n.linkedTaskIds.indexOf(id) !== -1
      ? Object.assign({}, n, { linkedTaskIds: n.linkedTaskIds.filter(lid => lid !== id) })
      : n));
    setSelected(null);
  }

  function toggleComplete(item, dateStr, e) {
    if (e) { e.stopPropagation(); e.preventDefault(); }
    if (item.recurring) { const cd = Object.assign({}, item.completedDates || {}); if (cd[dateStr]) delete cd[dateStr]; else cd[dateStr] = true; updateTask(item, { completedDates: cd }); }
    else { updateTask(item, { completed: !item.completed }); }
  }

  function moveTask(item, newDateStr) { if (item.recurring) return; updateTask(item, { date: newDateStr }); }

  // Bidirectional linking
  function linkTask(itemId, targetId) {
    function addLink(arr, idA, idB) {
      return arr.map(t => {
        if (t.id !== idA) return t;
        const cur = t.linkedTaskIds || [];
        if (cur.indexOf(idB) !== -1) return t;
        return Object.assign({}, t, { linkedTaskIds: cur.concat([idB]) });
      });
    }
    setTasks(prev => addLink(addLink(prev, itemId, targetId), targetId, itemId));
    setRecurring(prev => addLink(addLink(prev, itemId, targetId), targetId, itemId));
    if (selected) {
      // Refresh selected with new linkedTaskIds
      setSelected(prev => {
        if (!prev) return prev;
        if (prev.id === itemId) {
          const cur = prev.linkedTaskIds || [];
          if (cur.indexOf(targetId) !== -1) return prev;
          return Object.assign({}, prev, { linkedTaskIds: cur.concat([targetId]) });
        }
        return prev;
      });
    }
  }

  function unlinkTask(itemId, targetId) {
    const removeLink = (arr, idA, idB) => arr.map(t => t.id === idA ? Object.assign({}, t, { linkedTaskIds: (t.linkedTaskIds || []).filter(id => id !== idB) }) : t);
    setTasks(prev => removeLink(removeLink(prev, itemId, targetId), targetId, itemId));
    setRecurring(prev => removeLink(removeLink(prev, itemId, targetId), targetId, itemId));
    if (selected && selected.id === itemId) {
      setSelected(prev => prev ? Object.assign({}, prev, { linkedTaskIds: (prev.linkedTaskIds || []).filter(id => id !== targetId) }) : prev);
    }
  }

  function findTaskById(id) {
    return tasks.find(t => t.id === id) || recurring.find(r => r.id === id) || null;
  }

  function getTasksForDay(date) {
    const dateStr = formatDate(date);
    const dow = date.getDay();
    const oneOff = tasks.filter(t => t.date === dateStr);
    const recur = recurring.filter(r => r.recurring && r.recurring.days.indexOf(dow) !== -1);
    const all = oneOff.concat(recur);
    return all.sort((a, b) => {
      const aTime = a.time ? a.time.hour * 60 + a.time.minute : 9999;
      const bTime = b.time ? b.time.hour * 60 + b.time.minute : 9999;
      if (aTime !== bTime) return aTime - bTime;
      const pOrder = { high: 0, medium: 1, low: 2 };
      const pd = pOrder[a.priority] - pOrder[b.priority];
      if (pd !== 0) return pd;
      return (a.createdAt || 0) - (b.createdAt || 0);
    });
  }

  const weekLabel = useMemo(() => {
    const s = weekDays[0], e = weekDays[6];
    const sm = s.toLocaleString("en-AU", { month: "short" });
    const em = e.toLocaleString("en-AU", { month: "short" });
    const sy = s.getFullYear(), ey = e.getFullYear();
    if (sy !== ey) return s.getDate() + " " + sm + " " + sy + " – " + e.getDate() + " " + em + " " + ey;
    if (sm === em) return s.getDate() + " – " + e.getDate() + " " + em + " " + ey;
    return s.getDate() + " " + sm + " – " + e.getDate() + " " + em + " " + ey;
  }, [weekDays]);

  const handleDragStart = useCallback((task, e) => { if (task.recurring) { e.preventDefault(); return; } setDragging(task); try { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", task.id); } catch (_) {} }, []);
  const handleDragOver = useCallback((dateStr, e) => { if (!dragging) return; e.preventDefault(); try { e.dataTransfer.dropEffect = "move"; } catch (_) {} if (dragOverDay !== dateStr) setDragOverDay(dateStr); }, [dragging, dragOverDay]);
  const handleDrop = useCallback((dateStr, e) => { e.preventDefault(); if (dragging) moveTask(dragging, dateStr); setDragging(null); setDragOverDay(null); }, [dragging]);

  function deleteNote(id) { setNotes(prev => prev.filter(n => n.id !== id)); }
  function togglePinNote(id) { setNotes(prev => prev.map(n => n.id === id ? Object.assign({}, n, { pinned: !n.pinned }) : n)); }

    };

    if (Array.isArray(parsed.savedSearches)) setSavedSearches(parsed.savedSearches);

  }

  // Collections CRUD
  function addCollection(name, type, parentId) {

  }
  function updateCollection(id, updates) {
    setCollections(prev => prev.map(c => c.id === id ? Object.assign({}, c, updates) : c));
  }
  function deleteCollection(id) {
    // Move all notes in this collection (and descendants) to inbox (null)

    setNotes(prev => prev.map(n => descendants.has(n.collectionId) ? Object.assign({}, n, { collectionId: null, updatedAt: Date.now() }) : n));
    // Delete collection + descendants
    setCollections(prev => prev.filter(c => !descendants.has(c.id)));
  }
  function moveCollection(id, newParentId) {
    // Guard: can't move into self or descendant
    if (id === newParentId) return;
    if (newParentId) {
      const descendants = getCollectionWithDescendants(collections, id);
      if (descendants.has(newParentId)) return;
    }
    setCollections(prev => prev.map(c => c.id === id ? Object.assign({}, c, { parentId: newParentId || null }) : c));
  }

  if (!loaded) return <div style={{padding: "40px", textAlign: "center", color: "var(--text-3)"}}>Loading…</div>;

  return (
    <div className="app">
      <div className="header">
        <div>
          <h1>{headingLabel}</h1>
          <p className="sub">{weekLabel}</p>
        </div>
        <div className="nav-buttons">
          <button className="nav-btn" onClick={() => setWeekOffset(w => w - 1)} aria-label="Previous week">‹</button>
          <button className="nav-btn today" onClick={() => setWeekOffset(0)}>Today</button>
          <button className="nav-btn" onClick={() => setWeekOffset(w => w + 1)} aria-label="Next week">›</button>
          <DataMenu onBackup={handleBackupAll} onRestore={handleRestoreAll}/>
        </div>
      </div>

      <QuickAdd input={input} setInput={setInput} preview={preview} onAdd={handleAdd} onKeyDown={handleKeyDown} inputRef={inputRef} showHelp={tasks.length + recurring.length === 0}/>

      <WeekGrid weekDays={weekDays} today={today} getTasksForDay={getTasksForDay} onSelect={setSelected} onToggleComplete={toggleComplete} onDragStart={handleDragStart} onDragOver={handleDragOver} onDrop={handleDrop} onDragEnd={handleDragEnd} dragging={dragging} dragOverDay={dragOverDay} onDayClick={handleDayClick}/>

      <Legend />

      <NotesSection
        notes={notes}
        collections={collections}
        tasks={tasks}
        recurring={recurring}
        savedSearches={savedSearches}
        searchHistory={searchHistory}
        onAddSavedSearch={addSavedSearch}
        onDeleteSavedSearch={deleteSavedSearch}
        onRecordSearchHistory={recordSearchHistory}
        onClearSearchHistory={clearSearchHistory}
        onAddNote={addNote}
        onAddNoteFromTemplate={addNoteFromTemplate}
        onUpdateNote={updateNote}
        onDeleteNote={deleteNote}
        onTogglePin={togglePinNote}
        onMoveNote={moveNoteToCollection}
        onLinkNoteToTask={linkNoteToTask}
        onUnlinkNoteFromTask={unlinkNoteFromTask}
        onOpenTask={setSelected}
        onAddCollection={addCollection}
        onUpdateCollection={updateCollection}
        onDeleteCollection={deleteCollection}
        onMoveCollection={moveCollection}
        navTarget={navTarget}
        onClearNavTarget={() => setNavTarget(null)}
      />

      {selected && (
        <TaskSheet
          item={selected}
          today={today}
          allTasks={tasks}
          allRecurring={recurring}
          allNotes={notes}
          collections={collections}
          findTaskById={findTaskById}
          onClose={() => setSelected(null)}
          onDelete={handleDelete}
          onUpdate={updateTask}
          onOpenTask={setSelected}
          onOpenNote={(noteId) => { setSelected(null); setNavTarget({ noteId, ts: Date.now() }); }}
          onLink={linkTask}
          onUnlink={unlinkTask}
        />
      )}

      {/* Restore-from-backup dialogs (replaces blocked native alert/confirm) */}
      {restoreDialog && restoreDialog.kind === "invalid" && (
        <ConfirmModal
          title="Invalid backup file"
          message="That doesn't look like a planner backup file. Look for a file named 'planner-backup-YYYY-MM-DD.json'."
          confirmLabel="OK"
          onCancel={() => setRestoreDialog(null)}
          onConfirm={() => setRestoreDialog(null)}
        />
      )}
      {restoreDialog && restoreDialog.kind === "error" && (
        <ConfirmModal
          title="Could not read file"
          message={"Error: " + restoreDialog.message}
          confirmLabel="OK"
          onCancel={() => setRestoreDialog(null)}
          onConfirm={() => setRestoreDialog(null)}
        />
      )}
      {restoreDialog && restoreDialog.kind === "confirm" && (() => {
        const p = restoreDialog.payload;
        const counts = {
          tasks: Array.isArray(p.tasks) ? p.tasks.length : 0,
          recurring: Array.isArray(p.recurring) ? p.recurring.length : 0,
          notes: Array.isArray(p.notes) ? p.notes.length : 0,
          collections: Array.isArray(p.collections) ? p.collections.length : 0
        };
        return (
          <ConfirmModal
            title="Restore this backup?"
            message={<span>
              <strong>{counts.tasks}</strong> task{counts.tasks !== 1 ? "s" : ""},{" "}
              <strong>{counts.recurring}</strong> recurring,{" "}
              <strong>{counts.notes}</strong> note{counts.notes !== 1 ? "s" : ""},{" "}
              <strong>{counts.collections}</strong> collection{counts.collections !== 1 ? "s" : ""}.<br/><br/>
              This will <strong>REPLACE</strong> all your current data. The change is permanent on this device.
            </span>}
            confirmLabel="Replace all data"
            danger={true}
            onCancel={() => setRestoreDialog(null)}
            onConfirm={commitRestore}
          />
        );
      })()}
      {restoreDialog && restoreDialog.kind === "success" && (
        <ConfirmModal
          title="Restored"
          message="Your data has been restored. If anything looks stale, refresh the page."
          confirmLabel="OK"
          onCancel={() => setRestoreDialog(null)}
          onConfirm={() => setRestoreDialog(null)}
        />
      )}
    </div>
  );
}

function DataMenu({ onBackup, onRestore }) {

  const popRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    function onDocClick(e) {
      if (popRef.current && !popRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener("mousedown", onDocClick);
    document.addEventListener("touchstart", onDocClick);
    return () => {
      document.removeEventListener("mousedown", onDocClick);
      document.removeEventListener("touchstart", onDocClick);
    };
  }, [open]);

  function handleFile(e) {
    const f = e.target.files && e.target.files[0];
    if (f) onRestore(f);

    e.target.value = "";
    setOpen(false);
  }

  return (
    <div className="data-menu-wrap" ref={popRef}>

              <div className="data-menu-title">Download backup</div>
