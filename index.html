  @media (max-width: 430px) {
    .ws-collection-row { padding: 9px 12px; font-size: 12.5px; }
    .ws-coll-icon { width: 14px; height: 14px; }
  }

  /* New-collection modal */
  .ws-modal {
    position: fixed; inset: 0;
    background: rgba(28, 25, 23, 0.50);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 60;
    display: flex; align-items: center; justify-content: center;
    animation: fade .2s var(--ease-out);
    padding: 16px;
  }
  .ws-modal-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 22px;
    width: 100%; max-width: 400px;
    animation: popin .25s var(--ease-out);
    box-shadow: var(--shadow-xl);
  }
  .ws-modal-title {
    margin: 0 0 14px;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -0.015em;
  }
  .ws-modal-input {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 10px 13px;
    font-size: 14px;
    outline: none;
    transition: all var(--t-fast);
    font-family: inherit;
    color: var(--text);
    letter-spacing: -0.005em;
  }
  .ws-modal-input:hover { border-color: var(--border-strong); }
  .ws-modal-input:focus { border-color: var(--accent); box-shadow: var(--shadow-focus-ring); }
  .ws-modal-label {
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-3);
    margin: 14px 0 8px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .ws-type-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .ws-type-btn {
    padding: 10px 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all var(--t-fast);
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    font-size: 10.5px;
    color: var(--text-2);
    font-weight: 500;
    box-shadow: var(--shadow-xs);
  }
  .ws-type-btn:hover {
    border-color: var(--border-strong);
    background: var(--surface-alt);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  .ws-type-btn.selected {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent-deep);
    font-weight: 600;
  }
  .ws-type-btn-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
  .ws-modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .ws-modal-actions button {
    padding: 9px 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--t-fast);
    box-shadow: var(--shadow-xs);
    letter-spacing: -0.005em;
  }
  .ws-modal-actions button:hover {
    border-color: var(--border-strong);
    background: var(--surface-alt);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  .ws-modal-actions button.primary {
    background: linear-gradient(180deg, var(--text) 0%, #2a2724 100%);
    color: white;
    border-color: var(--text);
    font-weight: 600;
    box-shadow:
      0 1px 2px rgba(28, 25, 23, 0.20),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  .ws-modal-actions button.primary:hover {
    transform: translateY(-1px);
    box-shadow:
      0 4px 10px rgba(28, 25, 23, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.10);
  }
  .ws-modal-actions button.primary:disabled {
    opacity: 0.4; cursor: not-allowed;
    background: var(--text-muted); border-color: var(--text-muted);
    transform: none; box-shadow: none;
  }
  .ws-modal-actions button.primary.danger {
    background: linear-gradient(180deg, var(--danger) 0%, #991818 100%);
    border-color: var(--danger);
    box-shadow:
      0 1px 2px rgba(193, 48, 43, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.10);
  }
  .ws-modal-actions button.primary.danger:hover {
    box-shadow:
      0 4px 10px rgba(193, 48, 43, 0.32),
      inset 0 1px 0 rgba(255, 255, 255, 0.12);
  }
  .ws-modal-text {
    margin: 4px 0 0;
    color: var(--text-2);
    font-size: 13.5px;
    line-height: 1.55;
    letter-spacing: -0.005em;
  }
  .ws-modal-text strong { color: var(--text); font-weight: 600; }

  /* Breadcrumb */
  .ws-breadcrumb { display: flex; align-items: center; gap: 6px; padding: 4px 0 10px; font-size: 12.5px; color: var(--text-2); flex-wrap: wrap; }
  .ws-breadcrumb-item { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; transition: color .12s; }
  .ws-breadcrumb-item:hover { color: var(--text); }
  .ws-breadcrumb-item.current { color: var(--text); font-weight: 500; cursor: default; }
  .ws-breadcrumb-sep { color: var(--text-3); }
  .ws-breadcrumb-actions { display: inline-flex; gap: 4px; margin-left: 8px; }
  .ws-breadcrumb-action {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 9px; font-size: 12px; line-height: 1;
    background: var(--surface); color: var(--text-2);
    border: 1px solid var(--border); border-radius: 999px;
    cursor: pointer; transition: all .12s;
  }
  .ws-breadcrumb-action:hover { background: var(--surface-alt); color: var(--text); border-color: var(--border-strong); }
  .ws-breadcrumb-action.danger:hover { background: #fef2f2; color: var(--danger); border-color: rgba(185,28,28,0.25); }

  /* Note card — draggable affordance */
  .note-card[draggable="true"] { cursor: grab; }
  .note-card[draggable="true"]:active { cursor: grabbing; }
  .note-card.dragging-note { opacity: 0.4; }

  /* ============================================================
     TEMPLATE PICKER (Stage 3)
     ============================================================ */
  .tpl-trigger {
    background: var(--surface); color: var(--text-2);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 9px 13px; font-size: 13px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .15s; cursor: pointer; flex-shrink: 0;
  }
  .tpl-trigger:hover { border-color: var(--border-strong); color: var(--text); background: var(--surface-alt); }
  .tpl-trigger svg { opacity: 0.7; }

  .tpl-modal {
    position: fixed; inset: 0; background: rgba(28, 25, 23, 0.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 60; display: flex; align-items: center; justify-content: center;
    padding: 16px; animation: fade .2s var(--ease-out);
  }
  .tpl-modal-card {
    background: var(--surface);
    border-radius: var(--radius-xl);
    width: 100%; max-width: 760px; max-height: 85vh;
    display: flex; flex-direction: column;
    animation: slideup .28s var(--ease-out);
    overflow: hidden;
    box-shadow: var(--shadow-xl);
  }
  .tpl-modal-header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap;
    background: linear-gradient(180deg, var(--surface-warm) 0%, var(--surface) 100%);
  }
  .tpl-modal-title {
    font-size: 17px; font-weight: 650; margin: 0;
    display: flex; align-items: center; gap: 8px;
    letter-spacing: -0.015em;
  }
  .tpl-modal-close {
    background: transparent; border: 0;
    padding: 6px; cursor: pointer;
    color: var(--text-3);
    border-radius: var(--radius-sm);
    transition: all var(--t-fast);
    display: flex; align-items: center; justify-content: center;
  }
  .tpl-modal-close:hover { background: var(--surface-alt); color: var(--text); }
  .tpl-search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
  .tpl-search {
    width: 100%; padding: 8px 12px 8px 34px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    border-radius: var(--radius-md);
    font-size: 13px; outline: none;
    transition: all var(--t-fast);
    color: var(--text);
  }
  .tpl-search:hover { border-color: var(--border-strong); }
  .tpl-search:focus { background: var(--surface); border-color: var(--accent); box-shadow: var(--shadow-focus-ring); }
  .tpl-search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }

  .tpl-modal-body {
    padding: 14px 18px 18px;
    overflow-y: auto;
    flex: 1;
  }
  .tpl-section-label {
    font-size: 10.5px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin: 14px 0 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .tpl-section-label:first-child { margin-top: 0; }
  .tpl-section-label-type-icon { width: 18px; height: 18px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }

  .tpl-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px;
  }

  .tpl-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 7px; padding: 11px 12px 10px;
    cursor: pointer; transition: all .15s ease;
    text-align: left; display: flex; flex-direction: column; gap: 4px;
    position: relative; overflow: hidden;
  }
  .tpl-card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    pointer-events: none;
  }
  .tpl-card.t-trading::before  { background: #EF9F27; }
  .tpl-card.t-study::before    { background: #7F77DD; }
  .tpl-card.t-coding::before   { background: #378ADD; }
  .tpl-card.t-finance::before  { background: #1D9E75; }
  .tpl-card.t-journal::before  { background: #D4537E; }
  .tpl-card.t-health::before   { background: #639922; }
  .tpl-card.t-project::before  { background: #D85A30; }
  .tpl-card.t-general::before  { background: #888780; }
  .tpl-card:hover {
    border-color: var(--border-strong);
    box-shadow: 0 3px 12px rgba(28,25,23, 0.06);
    transform: translateY(-1px);
  }
  .tpl-card:active { transform: scale(0.98); }
  .tpl-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding-left: 5px; }
  .tpl-card-name {
    font-size: 13px; font-weight: 600; color: var(--text);
    line-height: 1.3; word-break: break-word; flex: 1;
  }
  .tpl-card-type {
    font-size: 9.5px; font-weight: 500; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 2px 6px; border-radius: 999px; flex-shrink: 0;
    background: var(--surface-alt);
  }
  .tpl-card-desc {
    font-size: 11.5px; color: var(--text-2); line-height: 1.45;
    padding-left: 5px;
  }
  .tpl-card-meta {
    margin-top: 4px; padding-left: 5px;
    font-size: 10.5px; color: var(--text-3);
    display: flex; gap: 8px; align-items: center;
    font-feature-settings: 'tnum' 1;
  }
  .tpl-card-block-types { display: flex; gap: 3px; flex-wrap: wrap; }
  .tpl-card-block-tag {
    font-size: 9px; padding: 1px 5px; border-radius: 3px;
    background: var(--surface-alt); color: var(--text-3);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  .tpl-empty {
    padding: 30px 16px; text-align: center; color: var(--text-3); font-size: 13px;
  }

  /* Inline empty state for an empty typed collection */
  .tpl-inline-suggest {
    background: var(--surface-alt); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 14px 14px 12px;
    margin-bottom: 14px;
  }
  .tpl-inline-header {
    font-size: 12px; color: var(--text-2); margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .tpl-inline-header svg { color: var(--accent); opacity: 0.8; }
  .tpl-inline-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px;
  }
  .tpl-inline-grid .tpl-card { padding: 8px 10px 8px 12px; }
  .tpl-inline-grid .tpl-card-name { font-size: 12px; }
  .tpl-inline-grid .tpl-card-desc { font-size: 10.5px; }
  .tpl-inline-grid .tpl-card-type, .tpl-inline-grid .tpl-card-meta { display: none; }
  .tpl-inline-browse {
    margin-top: 8px; padding: 6px 10px;
    background: transparent; border: 1px dashed var(--border-strong);
    border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--text-3);
    transition: all .15s;
  }
  .tpl-inline-browse:hover { border-color: var(--accent); color: var(--accent); }

  /* ============================================================
     STAGE 4 — CALENDAR CONNECTION
     ============================================================ */

  /* Linked tasks row on each note card */
  .note-linked-tasks {
    display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
    margin-top: 10px; padding-left: 36px;
  }
  @media (max-width: 640px) { .note-linked-tasks { padding-left: 0; } }
  .note-linked-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 4px 3px 9px; border-radius: 999px;
    font-size: 11.5px; line-height: 1.3;
    border: 1px solid;
    transition: all .15s;
  }
  .note-linked-chip.cat-trading  { background: rgba(239, 159, 39, 0.10);  color: #8a5c14; border-color: rgba(239, 159, 39, 0.32); }
  .note-linked-chip.cat-study    { background: rgba(127, 119, 221, 0.10); color: #43408a; border-color: rgba(127, 119, 221, 0.32); }
  .note-linked-chip.cat-build    { background: rgba(55, 138, 221, 0.10);  color: #1e5085; border-color: rgba(55, 138, 221, 0.32); }
  .note-linked-chip.cat-cricket  { background: rgba(29, 158, 117, 0.10);  color: #145e44; border-color: rgba(29, 158, 117, 0.32); }
  .note-linked-chip.cat-social   { background: rgba(212, 83, 126, 0.10);  color: #88334e; border-color: rgba(212, 83, 126, 0.32); }
  .note-linked-chip.cat-health   { background: rgba(99, 153, 34, 0.10);   color: #3f6116; border-color: rgba(99, 153, 34, 0.32); }
  .note-linked-chip.cat-personal { background: rgba(216, 90, 48, 0.10);   color: #84371e; border-color: rgba(216, 90, 48, 0.32); }
  .note-linked-chip.cat-admin    { background: rgba(136, 135, 128, 0.10); color: #4a4945; border-color: rgba(136, 135, 128, 0.32); }
  .note-linked-chip:hover { box-shadow: 0 1px 3px rgba(28,25,23,0.06); }
  .note-linked-chip svg { opacity: 0.7; flex-shrink: 0; }
  .note-linked-chip-text {
    cursor: pointer;
    max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .note-linked-chip-text:hover { text-decoration: underline; text-decoration-thickness: 1px; }
  .note-linked-unlink {
    background: transparent; border: 0; padding: 2px 4px;
    color: currentColor; opacity: 0.5; cursor: pointer; border-radius: 999px;
    display: flex; align-items: center; transition: all .12s;
  }
  .note-linked-unlink:hover { opacity: 1; background: rgba(0,0,0,0.07); }
  .note-linked-add {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 999px;
    background: transparent; border: 1px dashed var(--border-strong);
    color: var(--text-3); font-size: 11.5px; cursor: pointer;
    transition: all .15s;
  }
  .note-linked-add:hover { border-color: var(--accent); color: var(--accent); border-style: solid; }
  .note-linked-add svg { opacity: 0.7; }

  /* Task picker modal (smaller than template picker) */
  .task-picker-scrim {
    position: fixed; inset: 0; background: rgba(28, 25, 23, 0.45);
    z-index: 70; display: flex; align-items: center; justify-content: center;
    padding: 16px; animation: fade .15s ease-out;
  }
  .task-picker-card {
    background: var(--surface); border-radius: var(--radius-lg);
    width: 100%; max-width: 460px; max-height: 78vh;
    display: flex; flex-direction: column; overflow: hidden;
    animation: slideup .22s ease-out;
  }
  .task-picker-header {
    padding: 14px 16px 10px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .task-picker-title {
    font-size: 14.5px; font-weight: 600; margin: 0;
    display: flex; align-items: center; gap: 7px; color: var(--text);
  }
  .task-picker-title svg { color: var(--accent); }
  .task-picker-body {
    overflow-y: auto; padding: 4px 8px 12px; flex: 1;
  }
  .task-picker-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 10px; border-radius: 6px; cursor: pointer;
    background: transparent; border: 0; text-align: left;
    transition: background .12s;
  }
  .task-picker-item:hover { background: var(--surface-alt); }
  .task-picker-item-icon {
    flex-shrink: 0; width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 5px;
  }
  .task-picker-item-text {
    flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;
  }
  .task-picker-item-title {
    font-size: 13px; color: var(--text); font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .task-picker-item-when {
    font-size: 11px; color: var(--text-3); font-feature-settings: 'tnum' 1;
  }

  /* Active task banner — appears above capture box when a task is "happening" right now */
  .active-task-banner {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 15px;
    margin-bottom: 12px;
    border-radius: var(--radius);
    border: 1px solid;
    font-size: 13px;
    position: relative;
    animation: notein .3s var(--ease-out);
    box-shadow: var(--shadow-sm);
    font-weight: 500;
    letter-spacing: -0.005em;
    overflow: hidden;
  }
  .active-task-banner::before {
    content: ""; position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: currentColor;
    opacity: 0.65;
  }
  .active-task-banner.cat-trading  { background: linear-gradient(135deg, rgba(239, 159, 39, 0.14), rgba(239, 159, 39, 0.04)); border-color: rgba(239, 159, 39, 0.40); color: #6f4a10; }
  .active-task-banner.cat-study    { background: linear-gradient(135deg, rgba(127, 119, 221, 0.14), rgba(127, 119, 221, 0.04)); border-color: rgba(127, 119, 221, 0.40); color: #353170; }
  .active-task-banner.cat-build    { background: linear-gradient(135deg, rgba(55, 138, 221, 0.14), rgba(55, 138, 221, 0.04)); border-color: rgba(55, 138, 221, 0.40); color: #18406b; }
  .active-task-banner.cat-cricket  { background: linear-gradient(135deg, rgba(29, 158, 117, 0.14), rgba(29, 158, 117, 0.04)); border-color: rgba(29, 158, 117, 0.40); color: #0f4d37; }
  .active-task-banner.cat-social   { background: linear-gradient(135deg, rgba(212, 83, 126, 0.14), rgba(212, 83, 126, 0.04)); border-color: rgba(212, 83, 126, 0.40); color: #6e293f; }
  .active-task-banner.cat-health   { background: linear-gradient(135deg, rgba(99, 153, 34, 0.14), rgba(99, 153, 34, 0.04)); border-color: rgba(99, 153, 34, 0.40); color: #324d11; }
  .active-task-banner.cat-personal { background: linear-gradient(135deg, rgba(216, 90, 48, 0.14), rgba(216, 90, 48, 0.04)); border-color: rgba(216, 90, 48, 0.40); color: #6b2c18; }
  .active-task-banner.cat-admin    { background: linear-gradient(135deg, rgba(136, 135, 128, 0.14), rgba(136, 135, 128, 0.04)); border-color: rgba(136, 135, 128, 0.40); color: #3d3c39; }
  .active-task-pulse {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
    animation: pulse-dot 1.6s ease-in-out infinite;
    box-shadow:
      0 0 10px currentColor,
      0 0 20px currentColor;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 0.5; transform: scale(0.82); }
    50% { opacity: 1; transform: scale(1.0); }
  }
  .active-task-icon {
    flex-shrink: 0; width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.85;
  }
  .active-task-text {
    flex: 1; min-width: 0;
    display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap;
  }
  .active-task-label {
    font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.06em; opacity: 0.7; font-weight: 500;
  }
  .active-task-title {
    font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .active-task-toggle {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; cursor: pointer; user-select: none;
    opacity: 0.85;
    flex-shrink: 0;
  }
  .active-task-toggle:hover { opacity: 1; }
  .active-task-toggle input { margin: 0; cursor: pointer; accent-color: currentColor; }

  /* Today summary — sharp, decisive dark surface with refined gradient */
  .today-summary {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; margin-bottom: 14px;
    background: linear-gradient(135deg, #1c1917 0%, #2a2724 100%);
    border: 1px solid #1c1917;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all var(--t-base);
    color: rgba(255, 255, 255, 0.94);
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.10),
      0 4px 12px -2px rgba(0, 0, 0, 0.14),
      inset 0 1px 0 rgba(255, 255, 255, 0.07);
    position: relative;
    overflow: hidden;
  }
  /* Sharp accent strip on the left edge */
  .today-summary::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg,
      var(--accent-2) 0%,
      var(--accent) 30%,
      var(--accent-deep) 60%,
      var(--accent) 100%);
    background-size: 100% 300%;
    animation: shimmer-vertical 4s ease-in-out infinite;
  }
  @keyframes shimmer-vertical {
    0%, 100% { background-position: 0% 0%; }
    50%      { background-position: 0% 100%; }
  }
  .today-summary:hover {
    background: #25221f;
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.12),
      0 8px 20px -4px rgba(0, 0, 0, 0.18),
      0 0 0 3px var(--accent-glow),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transform: translateY(-1px);
  }
  .today-summary.is-open {
    background: #0f0d0c;
    border-color: #0f0d0c;
    cursor: default;
    transform: none;
  }
  .today-summary.is-open::before { background: linear-gradient(180deg, var(--accent-2) 0%, var(--accent) 100%); }
  .today-summary.is-open:hover { transform: none; }
  .today-summary-icon {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px;
    border-radius: 7px;
    background: rgba(91, 92, 242, 0.16);
    color: var(--accent-2);
    box-shadow: inset 0 0 0 1px rgba(91, 92, 242, 0.28);
  }
  .today-summary.is-open .today-summary-icon {
    background: rgba(255, 255, 255, 0.10);
    color: white;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
  }
  .today-summary-text {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 2px;
  }
  .today-summary-day {
    font-size: 10.5px; font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.10em;
    color: var(--accent-2);
  }
  .today-summary.is-open .today-summary-day { color: rgba(255, 255, 255, 0.50); }
  .today-summary-stats {
    font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
    font-feature-settings: 'tnum' 1;
    color: white;
    letter-spacing: -0.01em;
  }
  .today-summary-stats .dot-sep { opacity: 0.35; }
  .today-summary-arrow {
    flex-shrink: 0;
    font-size: 16px; opacity: 0.6;
    color: white;
    transition: transform var(--t-fast), opacity var(--t-fast);
  }
  .today-summary:hover .today-summary-arrow { transform: translateX(3px); opacity: 1; }

  /* Note card flash when navigated to from elsewhere (e.g., task sheet) */
  @keyframes highlight-flash-anim {
    0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.0); background: var(--surface); }
    15% { box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.30); background: rgba(99, 102, 241, 0.05); }
    100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.0); background: var(--surface); }
  }
  .note-card.highlight-flash {
    animation: highlight-flash-anim 2.4s ease-out;
  }

  /* ============================================================
     STAGE 8 — Smart pass styles
     ============================================================ */

  /* Inline calculator pill (rendered inside text blocks) */
  .inline-calc {
    display: inline-flex; align-items: baseline; gap: 4px;
    padding: 1px 7px; border-radius: 4px;
    background: rgba(99, 102, 241, 0.07);
    border: 1px solid rgba(99, 102, 241, 0.18);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.92em; line-height: 1.3;
    color: var(--text-2);
  }
  .inline-calc-arrow { color: var(--text-3); opacity: 0.7; }
  .inline-calc-result { color: var(--accent); font-weight: 600; }

  /* Search history dropdown (appears below search input on focus) */
  .search-history-pop {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    padding: 4px; z-index: 30;
    animation: notein .12s ease-out;
  }
  .search-history-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px 4px;
    font-size: 10px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .search-history-clear {
    background: transparent; border: 0; padding: 0;
    font-size: 10px; color: var(--text-3); cursor: pointer;
    text-transform: none; letter-spacing: 0;
  }
  .search-history-clear:hover { color: var(--danger); }
  .search-history-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 6px 10px; background: transparent; border: 0;
    border-radius: 4px; text-align: left; cursor: pointer;
    font-size: 12.5px; color: var(--text-2);
    transition: background .1s;
  }
  .search-history-item:hover { background: var(--surface-alt); color: var(--text); }
  .search-history-item svg { opacity: 0.6; flex-shrink: 0; }
  .search-history-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Saved searches pill bar */
  .saved-searches-bar {
    display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
    margin: 6px 0 4px;
  }
  .saved-search-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px 3px 10px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 11.5px; color: var(--text-2); cursor: pointer;
    transition: all .15s;
  }
  .saved-search-pill:hover { border-color: var(--accent); color: var(--accent); }
  .saved-search-pill.active { background: var(--accent); color: white; border-color: var(--accent); }
  .saved-search-pill.active .saved-search-x { color: rgba(255,255,255,0.7); }
  .saved-search-pill svg { opacity: 0.65; flex-shrink: 0; }
  .saved-search-x {
    display: inline-flex; align-items: center; padding: 1px;
    opacity: 0.4; transition: opacity .12s; margin-left: 2px;
  }
  .saved-search-pill:hover .saved-search-x { opacity: 0.9; }
  .saved-search-add {
    padding: 3px 10px; border-radius: 999px;
    background: transparent; border: 1px dashed var(--border-strong);
    font-size: 11.5px; color: var(--text-3); cursor: pointer;
    transition: all .15s;
  }
  .saved-search-add:hover { border-color: var(--accent); color: var(--accent); border-style: solid; }

  /* Smart suggestion banner (template / recent-task) */
  .smart-suggestion-banner {
    display: flex; align-items: center; gap: 11px;
    padding: 11px 13px;
    margin: 8px 0;
    background: linear-gradient(135deg, var(--accent-soft), rgba(91, 92, 242, 0.04));
    border: 1px solid var(--accent-ring);
    border-radius: var(--radius-md);
    animation: notein .25s var(--ease-out);
    box-shadow: var(--shadow-xs);
  }
  .smart-suggestion-banner.kind-recent-task {
    background: linear-gradient(135deg, rgba(127, 119, 221, 0.10), rgba(127, 119, 221, 0.03));
    border-color: rgba(127, 119, 221, 0.30);
  }
  .smart-suggestion-icon {
    flex-shrink: 0; width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-deep) 100%);
    color: white;
    border-radius: 6px;
    font-size: 13px; font-weight: 700;
    box-shadow:
      0 1px 2px rgba(67, 70, 209, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.20);
  }
  .smart-suggestion-text { flex: 1; min-width: 0; }
  .smart-suggestion-line {
    font-size: 13px; color: var(--text);
    line-height: 1.4;
    font-weight: 500;
    letter-spacing: -0.005em;
    overflow: hidden; text-overflow: ellipsis;
  }
  .smart-suggestion-hint {
    font-size: 11px; color: var(--text-3);
    margin-top: 2px; font-style: italic;
    font-weight: 500;
  }
  .smart-suggestion-accept {
    flex-shrink: 0;
    padding: 6px 13px;
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-deep) 100%);
    color: white;
    border: 0;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--t-fast);
    letter-spacing: -0.005em;
    box-shadow:
      0 1px 2px rgba(67, 70, 209, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.18);
  }
  .smart-suggestion-accept:hover {
    transform: translateY(-1px);
    box-shadow:
      0 4px 10px rgba(67, 70, 209, 0.32),
      inset 0 1px 0 rgba(255, 255, 255, 0.22);
  }
  .smart-suggestion-dismiss {
    flex-shrink: 0;
    background: transparent; border: 0;
    padding: 5px;
    color: var(--text-3); cursor: pointer;
    border-radius: 5px;
    display: flex; align-items: center;
    transition: all var(--t-fast);
  }
  .smart-suggestion-dismiss:hover {
    color: var(--text);
    background: rgba(28, 25, 23, 0.06);
  }

  /* Recently-touched panel — sharp, confident */
  .recently-touched {
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-warm) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-xs);
  }
  .recently-touched-head {
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .recently-touched-label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .recently-touched-list {
    display: flex; flex-direction: column; gap: 2px;
  }
  .recently-touched-item {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 6px 8px;
    background: transparent;
    border: 0;
    border-radius: 5px;
    text-align: left;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-2);
    transition: all var(--t-fast);
    font-weight: 500;
    letter-spacing: -0.005em;
  }
  .recently-touched-item:hover {
    background: var(--surface-alt);
    color: var(--text);
  }
  .recently-touched-item-title {
    flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .recently-touched-item-when {
    flex-shrink: 0;
    font-size: 11px;
    color: var(--text-3);
    font-feature-settings: 'tnum' 1;
    font-weight: 500;
  }

  /* Autocomplete dropdown for #hashtags and [[wiki-links]] inside blocks */
  .inline-autocomplete {
    position: absolute; z-index: 65;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    padding: 5px;
    min-width: 200px; max-width: 280px;
    max-height: 220px; overflow-y: auto;
    animation: popin .15s var(--ease-out);
    transform-origin: top left;
  }
  .inline-autocomplete-head {
    padding: 5px 10px;
    font-size: 9.5px; font-weight: 700;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .inline-autocomplete-item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; width: 100%;
    padding: 6px 10px;
    background: transparent; border: 0;
    border-radius: var(--radius-sm);
    text-align: left; cursor: pointer;
    font-size: 12.5px; color: var(--text);
    transition: background var(--t-fast);
    font-weight: 500;
    letter-spacing: -0.005em;
  }
  .inline-autocomplete-item:hover,
  .inline-autocomplete-item.focused {
    background: var(--accent-soft);
    color: var(--accent-deep);
  }
  .inline-autocomplete-item-text {
    flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .inline-autocomplete-item-count {
    flex-shrink: 0; font-size: 11px;
    color: var(--text-3);
    font-feature-settings: 'tnum' 1;
    font-weight: 500;
  }

  /* Make sure the search-wrap is positioned for the history popover */
  .notes-search-wrap { position: relative; }

  /* ============================================================
     STAGE 5 — Wiki-links, backlinks, search filter chips
     ============================================================ */
  .wiki-link {
    color: var(--accent); cursor: pointer; font-weight: 500;
    padding: 0 2px; border-radius: 3px;
    background: rgba(99, 102, 241, 0.07);
    border-bottom: 1px solid rgba(99, 102, 241, 0.35);
    transition: all .12s;
  }
  .wiki-link:hover {
    background: rgba(99, 102, 241, 0.16);
    border-bottom-color: var(--accent);
  }
  .wiki-link.wiki-missing {
    color: #c0382b;
    background: rgba(192, 56, 43, 0.06);
    border-bottom: 1px dashed rgba(192, 56, 43, 0.45);
  }
  .wiki-link.wiki-missing:hover { background: rgba(192, 56, 43, 0.14); }

  .search-hit {
    background: rgba(255, 215, 64, 0.45);
    color: inherit;
    padding: 0 1px; border-radius: 2px;
    font-weight: 500;
  }

  /* Backlinks panel */
  .backlinks {
    margin-top: 12px; padding-top: 10px; padding-left: 36px;
    border-top: 1px dashed var(--border);
  }
  @media (max-width: 640px) { .backlinks { padding-left: 0; } }
  .backlinks-label {
    font-size: 10.5px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .backlinks-label svg { opacity: 0.7; }
  .backlinks-list {
    display: flex; flex-wrap: wrap; gap: 5px;
  }
  .backlink-item {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px;
    background: var(--surface-alt); border: 1px solid var(--border);
    color: var(--text-2); font-size: 11.5px; cursor: pointer;
    transition: all .15s;
    max-width: 240px;
  }
  .backlink-item:hover {
    border-color: var(--accent); color: var(--accent);
    background: rgba(99, 102, 241, 0.04);
  }
  .backlink-title {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* Search-filter chip bar */
  .search-filter-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: 4px 0 12px;
    padding: 7px 10px;
    background: var(--accent-soft);
    border: 1px solid rgba(99, 102, 241, 0.22);
    border-radius: var(--radius-sm);
    animation: notein .15s ease-out;
  }
  .search-filter-count {
    font-size: 11.5px; font-weight: 600; color: var(--accent);
    font-feature-settings: 'tnum' 1;
  }
  .search-filter-chips {
    display: inline-flex; flex-wrap: wrap; gap: 4px;
    flex: 1; min-width: 0;
  }
  .search-filter-chip {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 10.5px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-2);
  }
  .search-filter-chip.kind-tag    { color: #355080; }
  .search-filter-chip.kind-cat    { color: #7c4f1c; }
  .search-filter-chip.kind-coll   { color: #145e44; }
  .search-filter-chip.kind-has    { color: #4a4042; }
  .search-filter-chip.kind-after,
  .search-filter-chip.kind-before { color: var(--accent); }
  .search-filter-chip.kind-term   { color: var(--text); font-style: italic; }
  .search-filter-clear {
    background: transparent; border: 0; padding: 2px 8px;
    font-size: 11px; color: var(--text-3); cursor: pointer;
    border-radius: 3px; transition: all .12s;
  }
  .search-filter-clear:hover { color: var(--danger); background: rgba(192, 56, 43, 0.05); }

  /* Search input clear button */
  .notes-search-wrap { position: relative; }
  .notes-search-clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: transparent; border: 0; padding: 4px;
    color: var(--text-3); cursor: pointer; border-radius: 3px;
    display: flex; align-items: center; transition: all .12s;
  }
  .notes-search-clear:hover { color: var(--text); background: var(--surface-alt); }
  .notes-search-wrap input { padding-right: 26px; }

  /* ============================================================
     STAGE 6 — Polish: heatmap, focus, shortcuts, sidebar footer
     ============================================================ */

  /* Activity heatmap */
  .activity-heatmap {
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-warm) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px 12px;
    margin-bottom: 14px;
    position: relative;
    box-shadow: var(--shadow-xs);
  }
  .heatmap-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 10px; margin-bottom: 12px;
    font-size: 11px;
  }
  .heatmap-head-left { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .heatmap-title {
    font-weight: 700;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 0.10em;
    font-size: 10.5px;
  }
  .heatmap-subtitle {
    color: var(--text-3);
    font-size: 11.5px;
    letter-spacing: -0.005em;
    font-weight: 500;
  }
  .heatmap-total {
    color: var(--text-2);
    font-size: 11.5px;
    font-feature-settings: 'tnum' 1;
    text-align: right; white-space: nowrap; flex-shrink: 0;
    font-weight: 500;
  }
  .heatmap-total strong { color: var(--text); font-weight: 700; }
  .heatmap-grid-wrap { display: flex; flex-direction: column; gap: 3px; max-width: 260px; }
  /* Weekday labels along the top (S M T W T F S) */
  .heatmap-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
    font-size: 9.5px; color: var(--text-3);
    letter-spacing: 0.08em; font-weight: 600;
    text-align: center; padding: 0 0 3px;
  }
  /* Outer grid: one column of weeks stacked vertically (4 rows = 4 weeks) */
  .heatmap-grid { display: grid; grid-template-columns: 1fr; gap: 3px; }
  /* Each week row: 7 day cells arranged horizontally */
  .heatmap-col { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }

  /* On narrow screens, the calendar takes full width */
  @media (max-width: 800px) {
    .heatmap-grid-wrap { max-width: 100%; }
  }
  .heatmap-cell {
    aspect-ratio: 1 / 1;
    border-radius: 4px;
    cursor: pointer;
    transition:
      outline-color var(--t-fast),
      transform var(--t-fast),
      box-shadow var(--t-fast),
      background var(--t-fast);
    outline: 1px solid transparent;
    position: relative;
  }
  .heatmap-cell.is-future { cursor: default; opacity: 0.3; }
  .heatmap-cell.is-today {
    outline: 1.5px solid var(--accent);
    outline-offset: 1.5px;
    z-index: 3;
  }
  .heatmap-cell.is-active {
    transform: scale(1.18);
    outline: 1.5px solid var(--text);
    outline-offset: 1px;
    z-index: 2;
  }
  .heatmap-cell.is-armed { outline-color: var(--danger); }
  .heatmap-cell:not(.is-future):hover { transform: scale(1.12); outline-color: var(--text-2); }
  /* Indigo activity palette */
  .heatmap-cell.level-0 {
    background: #ece8de;
    box-shadow: inset 0 0 0 0.5px rgba(28, 25, 23, 0.08);
  }
  .heatmap-cell.level-1 {
    background: rgba(91, 92, 242, 0.22);
    box-shadow: inset 0 0 0 0.5px rgba(91, 92, 242, 0.22);
  }
  .heatmap-cell.level-2 {
    background: rgba(91, 92, 242, 0.45);
    box-shadow: inset 0 0 0 0.5px rgba(67, 70, 209, 0.35);
  }
  .heatmap-cell.level-3 {
    background: rgba(91, 92, 242, 0.72);
    box-shadow: inset 0 0 0 0.5px rgba(67, 70, 209, 0.50);
  }
  .heatmap-cell.level-4 {
    background: var(--accent);
    box-shadow:
      inset 0 0 0 0.5px var(--accent-deep),
      0 1px 2px rgba(91, 92, 242, 0.25);
  }
  .heatmap-foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-top: 10px;
    font-size: 10px; color: var(--text-3);
    flex-wrap: wrap;
  }
  .heatmap-foot-hint { font-style: italic; letter-spacing: -0.003em; flex: 1; min-width: 0; }
  .heatmap-legend {
    display: flex; align-items: center; gap: 4px;
    font-size: 10px; color: var(--text-3);
    flex-shrink: 0; font-weight: 500;
  }
  .heatmap-legend .heatmap-cell { width: 11px; height: 11px; cursor: default; }
  .heatmap-legend-label { letter-spacing: 0.04em; font-weight: 600; }

  /* Sidebar footer (Export + Shortcuts buttons) */
  .ws-sidebar-footer {
    margin-top: 8px;
    border-top: 1px solid var(--border);
    padding-top: 8px;
    display: flex; gap: 4px;
  }
  @media (max-width: 800px) {
    .ws-sidebar-footer {
      /* Keep them accessible on mobile — show inline as small pill buttons */
      display: flex;
      margin-top: 0;
      border-top: 0;
      padding-top: 0;
      padding-left: 4px;
      gap: 6px;
      flex-shrink: 0;
      align-items: center;
    }
    .ws-sidebar-footer .ws-footer-btn {
      flex: 0 0 auto;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11.5px;
      min-height: 32px;
    }
  }
  .ws-footer-btn {
    flex: 1;
    display: inline-flex;
    align-items: center; justify-content: center;
    gap: 6px;
    padding: 7px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 11.5px;

function pad(n) { return String(n).padStart(2, "0"); }
function formatDate(d) { return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function formatTime(t) { if (!t) return ""; return pad(t.hour) + ":" + pad(t.minute); }
function parseTimeStr(str) { if (!str) return null; const m = str.match(/^(\d{1,2}):(\d{2})$/); if (!m) return null; const h = parseInt(m[1], 10), mn = parseInt(m[2], 10); if (h < 0 || h > 23 || mn < 0 || mn > 59) return null; return { hour: h, minute: mn }; }
function getWeekStart(d, offset) { if (offset == null) offset = 0; const r = new Date(d); r.setHours(0,0,0,0); const day = r.getDay(); const diff = day === 0 ? -6 : 1 - day; r.setDate(r.getDate() + diff + offset * 7); return r; }
function uid() { return Math.random().toString(36).slice(2, 11); }
function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function formatDuration(min) { if (!min || min <= 0) return ""; if (min >= 60) { const h = min / 60; return (Math.round(h * 10) / 10).toString().replace(/\.0$/, "") + "h"; } return min + "m"; }
function computeEndTime(time, duration) { if (!time) return null; const total = time.hour * 60 + time.minute + (duration || 0); return { hour: Math.floor(total / 60) % 24, minute: total % 60 }; }
function computeDuration(start, end) { if (!start || !end) return 0; let s = start.hour * 60 + start.minute; let e = end.hour * 60 + end.minute; if (e <= s) e += 24 * 60; return e - s; }

function relativeTimeLabel(ts) {
  const now = Date.now();
  const diff = now - ts;
  const dt = new Date(ts);
  const time = dt.toLocaleTimeString("en-AU", { hour: "2-digit", minute: "2-digit", hour12: false });
  if (diff < 60 * 1000) return "just now · " + time;
  if (diff < 60 * 60 * 1000) return Math.floor(diff / 60000) + "m ago · " + time;
  const today = new Date(); today.setHours(0,0,0,0);
  const dtDay = new Date(dt); dtDay.setHours(0,0,0,0);
  const dayDiff = Math.round((today - dtDay) / (24*60*60*1000));
  if (dayDiff === 0) return "today · " + time;
  if (dayDiff === 1) return "yesterday · " + time;
  if (dayDiff < 7) return dayDiff + "d ago · " + time;
  return dt.toLocaleDateString("en-AU", { day: "numeric", month: "short" }) + " · " + time;
}

function makeTaskLabel(task) {
  let when = "";
  if (task.recurring) {
    const days = task.recurring.days;
    if (days.length === 7) when = "every day";
    else if (days.length === 5 && days.indexOf(0) === -1 && days.indexOf(6) === -1) when = "weekdays";
    else if (days.length === 2 && days.indexOf(0) !== -1 && days.indexOf(6) !== -1) when = "weekends";
    else when = days.map(d => DAY_NAMES_SHORT[d]).join(" · ");
  } else if (task.date) {
    const dt = new Date(task.date + "T00:00:00");
    when = dt.toLocaleString("en-AU", { weekday: "short", day: "numeric", month: "short" });
  }
  let t = "";
  if (task.time) {
    t = " " + formatTime(task.time);
    if (task.endTime) t += "–" + formatTime(task.endTime);
  }
  return { title: task.title, when: when + t };
}

// Find the task whose time window contains `now` (for note auto-link suggestions)
function getActiveTask(tasks, recurring, now) {
  if (!now) now = new Date();
  const dateStr = formatDate(now);
  const dow = now.getDay();
  const nowMin = now.getHours() * 60 + now.getMinutes();

  function inWindow(t) {
    if (!t.time) return false;
    const startMin = t.time.hour * 60 + t.time.minute;
    let endMin;
    if (t.endTime) endMin = t.endTime.hour * 60 + t.endTime.minute;
    else if (t.duration) endMin = startMin + t.duration;
    else endMin = startMin + 60;
    if (endMin <= startMin) return false; // skip overnight for stage 4
    return nowMin >= startMin && nowMin < endMin;
  }

  for (let i = 0; i < tasks.length; i++) {
    const t = tasks[i];
    if (t.date !== dateStr) continue;
    if (inWindow(t)) return t;
  }
  for (let i = 0; i < recurring.length; i++) {
    const r = recurring[i];
    if (!r.recurring || r.recurring.days.indexOf(dow) === -1) continue;
    if (inWindow(r)) return r;
  }
  return null;
}

// Check if a date timestamp is today (local time)
function isToday(ts) {
  if (!ts) return false;
  const d = new Date(ts);
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
}

// Extract #hashtags from note body (skips code blocks/inline code, requires letter-start)
function extractTags(body) {
  if (!body) return [];
  const stripped = body.replace(/```[\s\S]*?```/g, " ").replace(/`[^`]*`/g, " ");
  const re = /(?:^|[^\w])#([a-zA-Z][\w-]{0,30})/g;
  const tags = [];
  let m;
  while ((m = re.exec(stripped)) !== null) {
    const tag = m[1].toLowerCase();
    if (tags.indexOf(tag) === -1) tags.push(tag);
  }
  return tags;
}

// Build {tag: count} across every note (for autocomplete + recency ranking)
function buildTagFrequency(notes) {
  const freq = {};
  for (let i = 0; i < notes.length; i++) {
    const tags = extractTags(blocksToText(notes[i].blocks || []));
    for (let j = 0; j < tags.length; j++) {
      freq[tags[j]] = (freq[tags[j]] || 0) + 1;
    }
  }
  return freq;
}

// Suggest tag completions ranked by frequency × recency.
// `prefix` is the chars after `#` the user has typed.
function suggestTags(prefix, notes, limit) {
  const freq = buildTagFrequency(notes);
  const p = (prefix || "").toLowerCase();
  const items = [];
  for (const tag in freq) {
    if (!p || tag.indexOf(p) === 0) items.push({ tag, count: freq[tag] });
  }
  items.sort((a, b) => b.count - a.count);
  return items.slice(0, limit || 6);
}

// Suggest wiki-link target completions: existing note titles ranked by recency.
function suggestWikiTargets(prefix, notes, limit) {
  const p = (prefix || "").toLowerCase();
  const seen = {};
  const items = [];
  for (let i = 0; i < notes.length; i++) {
    const t = deriveTitleFromBlocks(notes[i].blocks || []);
    if (!t) continue;
    const tNorm = wikiNormalizeTitle(t);
    if (seen[tNorm]) continue;
    seen[tNorm] = true;
    if (!p || tNorm.indexOf(p) === 0 || tNorm.indexOf(" " + p) !== -1) {
      items.push({ title: t, normalized: tNorm, updatedAt: notes[i].updatedAt || notes[i].createdAt });
    }
  }
  items.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  return items.slice(0, limit || 6);
}

// Find tasks active in a window around `now`:
//   - currently active (already handled by getActiveTask)
//   - completed within the last `lookbackMs` ms (default 2h)
//   - upcoming within the next `lookaheadMs` ms (default 1h)
// Returns { active, recent, upcoming }.
function getTaskWindow(tasks, recurring, now, lookbackMs, lookaheadMs) {
  if (!now) now = new Date();
  if (lookbackMs == null) lookbackMs = 2 * 60 * 60 * 1000;
  if (lookaheadMs == null) lookaheadMs = 60 * 60 * 1000;
  const dateStr = formatDate(now);
  const dow = now.getDay();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const lookbackMin = lookbackMs / (60 * 1000);
  const lookaheadMin = lookaheadMs / (60 * 1000);
  const out = { active: null, recent: [], upcoming: [] };

  function classify(t, isRecurring) {
    if (!t.time) return;
    const startMin = t.time.hour * 60 + t.time.minute;
    let endMin;
    if (t.endTime) endMin = t.endTime.hour * 60 + t.endTime.minute;
    else if (t.duration) endMin = startMin + t.duration;
    else endMin = startMin + 60;
    if (endMin <= startMin) return; // skip overnight
    if (nowMin >= startMin && nowMin < endMin) {
      if (!out.active) out.active = t;
    } else if (nowMin >= endMin && nowMin - endMin <= lookbackMin) {
      out.recent.push({ task: t, minutesAgo: nowMin - endMin });
    } else if (startMin > nowMin && startMin - nowMin <= lookaheadMin) {
      out.upcoming.push({ task: t, minutesUntil: startMin - nowMin });
    }
  }
  for (let i = 0; i < tasks.length; i++) {
    if (tasks[i].date !== dateStr) continue;
    classify(tasks[i], false);
  }
  for (let i = 0; i < recurring.length; i++) {
    if (!recurring[i].recurring || recurring[i].recurring.days.indexOf(dow) === -1) continue;
    classify(recurring[i], true);
  }
  // Sort recents by most-recent first; upcomings by soonest first
  out.recent.sort((a, b) => a.minutesAgo - b.minutesAgo);
  out.upcoming.sort((a, b) => a.minutesUntil - b.minutesUntil);
  return out;
}

// Infer a template family from the content of a freshly-saved note.
// Returns { family, confidence, hint } or null if no clear pattern.
// All detection is keyword + regex based — deterministic, no AI.
function inferTemplateFamily(blocks) {
  if (!Array.isArray(blocks) || blocks.length === 0) return null;
  const text = blocksToText(blocks).toLowerCase();
  if (text.length < 30) return null; // not enough content to classify

  const signals = {};

  // Trade journal: ticker (3-5 caps) + R-multiple OR entry/stop/target keywords
  const tickerMatch = text.match(/\b[A-Z]{2,5}\b/g) || (blocksToText(blocks).match(/\b[A-Z]{2,5}\b/g) || []);
  const hasTicker = tickerMatch && tickerMatch.length > 0;
  const hasRMultiple = /[+-]?\d+(\.\d+)?\s*r\b|\br[:\s]*\d|risk[:\s]|reward[:\s]/i.test(blocksToText(blocks));
  const hasTradeWords = /\b(entry|stop|target|setup|long|short|breakout|reversal|pnl|p&l|stopped out|took profit)\b/.test(text);
  if (hasTicker && (hasRMultiple || hasTradeWords)) signals.trading = (hasRMultiple ? 2 : 1) + (hasTradeWords ? 1 : 0);

  // Lecture notes: course code OR teacher + dated + structured points
  const hasCourseCode = /\b[a-z]{3,4}\s?\d{3,4}\b/i.test(blocksToText(blocks));
  const hasLectureWords = /\b(lecture|prof\.?|professor|chapter|theorem|definition|axiom|lemma|proof)\b/.test(text);
  if (hasCourseCode || (hasLectureWords && (blocks.filter(b => b.type === "h2" || b.type === "h3").length > 0))) {
    signals.study = (hasCourseCode ? 2 : 0) + (hasLectureWords ? 1 : 0);
  }

  // Decision log: comparing options with pros/cons or "decided"/"option a vs"
  const hasDecisionWords = /\b(pros?|cons?|decided|option [ab1-3]|vs\.?|verdict|chose|will go with)\b/.test(text);
  const bulletCount = blocks.filter(b => b.type === "bullet").length;
  if (hasDecisionWords && bulletCount >= 3) signals.decision = 2;

  // Meeting notes: attendees + action items
  const hasMeetingWords = /\b(attendees?|present|agenda|action items?|next steps?|follow.?up)\b/.test(text);
  if (hasMeetingWords) signals.meeting = 2;

  // Bug/debug: stack trace, error, fix
  const hasBugWords = /\b(bug|error|stack ?trace|fix|repro|reproduce|crash|exception)\b/.test(text);
  const hasCode = blocks.some(b => b.type === "code");
  if (hasBugWords && hasCode) signals.bug = 2;

  // Daily reflection: "today", "felt", "tomorrow", or 3-things pattern
  const hasReflectionWords = /\b(today i|felt|grateful|tomorrow|what went well|what could)\b/.test(text);
  // Journal needs at least the reflection-word marker; bump it to score 2 so it crosses threshold
  if (hasReflectionWords && bulletCount >= 2) signals.journal = 2;

  // Pick the highest-scoring signal above threshold
  let best = null; let bestScore = 1;
  for (const k in signals) {
    if (signals[k] > bestScore) { best = k; bestScore = signals[k]; }
  }
  if (!best) return null;

  const families = {
    trading: { family: "trading", label: "Trade journal", hint: "ticker, R-multiple, or trade verbs" },
    study: { family: "study", label: "Lecture / chapter notes", hint: "course code or lecture vocabulary" },
    decision: { family: "decision", label: "Decision log", hint: "comparing options, pros/cons" },
    meeting: { family: "meeting", label: "Meeting notes", hint: "attendees, action items" },
    bug: { family: "bug", label: "Bug report", hint: "error/crash/fix with code" },
    journal: { family: "journal", label: "Daily reflection", hint: "today/felt/tomorrow pattern" }
  };
  return Object.assign({ confidence: bestScore }, families[best]);
}

// Pick a real template id matching the inferred family.
// Looks for a template whose `type` or `family` matches, prefers the "Quick" variant.
function pickTemplateForFamily(inferredFamily, allTemplates) {
  if (!inferredFamily) return null;
  // Map inferred family → preferred (type, family substring) hints
  const map = {
    trading: { type: "trading", familyHint: "journal" },
    study: { type: "study", familyHint: "lecture" },
    decision: { type: "project", familyHint: "decision" },
    meeting: { type: "project", familyHint: "meeting" },
    bug: { type: "coding", familyHint: "bug" },
    journal: { type: "journal", familyHint: "daily" }
  };
  const m = map[inferredFamily];
  if (!m) return null;
  // First pass: type + family hint + Quick variant
  let candidates = allTemplates.filter(t => t.type === m.type && (t.family || "").toLowerCase().indexOf(m.familyHint) !== -1);
  if (candidates.length === 0) candidates = allTemplates.filter(t => t.type === m.type);
  if (candidates.length === 0) return null;
  // Prefer Quick variant
  const quick = candidates.find(t => (t.variant || "").toLowerCase() === "quick");
  return quick || candidates[0];
}

// Parse a search query into structured filters + free-text terms.
// Operators: #tag, cat:X, coll:X, has:type, after:DATE, before:DATE
// Date shortcuts: today, yesterday, last-week, last-month
function parseSearchQuery(raw) {
  const out = { tags: [], cats: [], colls: [], has: [], after: null, before: null, terms: [] };
  if (!raw || !raw.trim()) return out;

  // Tokenize preserving quoted phrases
  const tokens = [];
  const re = /"([^"]+)"|(\S+)/g;
  let m;
  while ((m = re.exec(raw)) !== null) {
    tokens.push(m[1] != null ? m[1] : m[2]);
  }

  function parseDateShortcut(v) {
    const t = v.toLowerCase();
    const now = new Date();
    const startOfDay = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
    if (t === "today") return startOfDay(now);
    if (t === "yesterday") { const d = new Date(now); d.setDate(d.getDate() - 1); return startOfDay(d); }
    if (t === "last-week" || t === "week") { const d = new Date(now); d.setDate(d.getDate() - 7); return startOfDay(d); }
    if (t === "last-month" || t === "month") { const d = new Date(now); d.setMonth(d.getMonth() - 1); return startOfDay(d); }
    // YYYY-MM-DD
    if (/^\d{4}-\d{2}-\d{2}$/.test(t)) { const d = new Date(t + "T00:00:00"); if (!isNaN(d.getTime())) return d.getTime(); }
    return null;
  }

  for (let i = 0; i < tokens.length; i++) {
    const tok = tokens[i];
    if (!tok) continue;
    // Hashtag
    if (tok[0] === "#" && tok.length > 1) { out.tags.push(tok.slice(1).toLowerCase()); continue; }
    // Operator:value
    const colonIdx = tok.indexOf(":");
    if (colonIdx > 0 && colonIdx < tok.length - 1) {
      const op = tok.slice(0, colonIdx).toLowerCase();
      const val = tok.slice(colonIdx + 1).toLowerCase();
      if (op === "cat" || op === "category") { out.cats.push(val); continue; }
      if (op === "coll" || op === "collection") { out.colls.push(val); continue; }
      if (op === "has") { out.has.push(val); continue; }
      if (op === "after") { const d = parseDateShortcut(val); if (d != null) out.after = d; continue; }
      if (op === "before") {
        const d = parseDateShortcut(val);
        // For "before:X", treat as end-of-day so notes from that day are included
        if (d != null) out.before = d + (24 * 60 * 60 * 1000) - 1;
        continue;
      }
    }
    // Bare term
    out.terms.push(tok.toLowerCase());
  }
  return out;
}

// Does this note match the parsed query?
function matchesQuery(note, parsed, collections) {
  if (!parsed) return true;
  const blocks = note.blocks || [];
  const text = blocksToText(blocks).toLowerCase();
  // Tag filter
  if (parsed.tags.length > 0) {
    const noteTags = extractTags(blocksToText(blocks));
    for (let i = 0; i < parsed.tags.length; i++) {
      if (noteTags.indexOf(parsed.tags[i]) === -1) return false;
    }
  }
  // Category filter
  if (parsed.cats.length > 0) {
    if (!note.category) return false;
    if (parsed.cats.indexOf(note.category.toLowerCase()) === -1) return false;
  }
  // Collection filter (matches by collection name partial)
  if (parsed.colls.length > 0) {
    if (!note.collectionId) return false;
    const coll = (collections || []).find(c => c.id === note.collectionId);
    if (!coll) return false;
    const cName = (coll.name || "").toLowerCase();
    for (let i = 0; i < parsed.colls.length; i++) {
      if (cName.indexOf(parsed.colls[i]) === -1) return false;
    }
  }
  // Has-type filter
  if (parsed.has.length > 0) {
    const types = {};
    for (let i = 0; i < blocks.length; i++) types[blocks[i].type] = true;
    for (let i = 0; i < parsed.has.length; i++) {
      const h = parsed.has[i];
      // Aliases
      const want = h === "checklist" ? "check" : (h === "checkbox" ? "check" : h);
      if (!types[want]) return false;
    }
  }
  // Date range
  if (parsed.after != null && note.createdAt < parsed.after) return false;
  if (parsed.before != null && note.createdAt > parsed.before) return false;
  // Free-text terms — all must appear in the text
  for (let i = 0; i < parsed.terms.length; i++) {
    if (text.indexOf(parsed.terms[i]) === -1) return false;
  }
  return true;
}

// Extract wiki-link targets `[[note title]]` from text (skips inside code blocks/inline code)
function extractWikiLinks(text) {
  if (!text) return [];
  const stripped = text.replace(/```[\s\S]*?```/g, " ").replace(/`[^`]*`/g, " ");
  const re = /\[\[([^\]\n]{1,100})\]\]/g;
  const out = [];
  let m;
  while ((m = re.exec(stripped)) !== null) {
    const target = m[1].trim();
    if (target && out.indexOf(target) === -1) out.push(target);
  }
  return out;
}

// Build a lookup map: lowercase wiki-friendly title → note object.
// We strip trailing #hashtags from titles so a heading "# ORCL Q3 #earnings"
// is still matchable via [[ORCL Q3]].
function wikiNormalizeTitle(t) {
  if (!t) return "";
  // Strip trailing hashtag clauses like " #foo #bar"
  return t.replace(/(?:\s+#[a-zA-Z][\w-]{0,30})+\s*$/, "").trim().toLowerCase();
}
function buildTitleIndex(notes) {
  const idx = {};
  for (let i = 0; i < notes.length; i++) {
    const n = notes[i];
    const t = deriveTitleFromBlocks(n.blocks || []);
    if (t) {
      const key = wikiNormalizeTitle(t);
      if (key && !idx[key]) idx[key] = n;
    }
  }
  return idx;
}

// For a given note, find all other notes that mention it via [[title]]
function findBacklinks(note, allNotes) {
  if (!note) return [];
  const myTitle = wikiNormalizeTitle(deriveTitleFromBlocks(note.blocks || []) || "");
  if (!myTitle) return [];
  const out = [];
  for (let i = 0; i < allNotes.length; i++) {
    const other = allNotes[i];
    if (other.id === note.id) continue;
    const targets = extractWikiLinks(blocksToText(other.blocks || []));
    for (let j = 0; j < targets.length; j++) {
      if (wikiNormalizeTitle(targets[j]) === myTitle) { out.push(other); break; }
    }
  }
  return out;
}

// Build heatmap grid: 8 weeks × 7 days, anchored on today (rightmost column).
// Each cell = { date: Date, dateStr: "YYYY-MM-DD", count: N, isToday: bool, inFuture: bool }
function buildHeatmapGrid(notes, weeks) {
  const cols = weeks || 8;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  // The rightmost column is the current week (Sun-Sat).
  // Compute the Saturday of the current week as the anchor.
  const dow = today.getDay();
  const rightAnchor = new Date(today);
  rightAnchor.setDate(today.getDate() + (6 - dow));
  // Tally notes by dateStr
  const tally = {};
  for (let i = 0; i < notes.length; i++) {
    const d = new Date(notes[i].createdAt);
    const k = formatDate(d);
    tally[k] = (tally[k] || 0) + 1;
  }
  // Walk back cols*7 - 1 days from rightAnchor
  const grid = [];
  for (let c = 0; c < cols; c++) {
    const col = [];
    for (let r = 0; r < 7; r++) {
      const cellDate = new Date(rightAnchor);
      // offset: column from right is (cols - 1 - c) weeks back; row r is r-th day of that week
      cellDate.setDate(rightAnchor.getDate() - ((cols - 1 - c) * 7) - (6 - r));
      const dateStr = formatDate(cellDate);
      const count = tally[dateStr] || 0;
      const isToday = cellDate.getTime() === today.getTime();
      const inFuture = cellDate.getTime() > today.getTime();
      col.push({ date: cellDate, dateStr, count, isToday, inFuture });
    }
    grid.push(col);
  }
  return grid;
}

// Convert a single note to a markdown string (block-by-block)
function noteToMarkdown(note) {
  const blocks = note.blocks || [];
  const title = deriveTitleFromBlocks(blocks) || "Untitled note";
  const dt = new Date(note.createdAt);
  const dateLine = dt.toLocaleString("en-AU", { weekday: "long", day: "numeric", month: "long", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true });
  const lines = [];
  lines.push("## " + title);
  lines.push("*" + dateLine + (note.category ? " · " + note.category : "") + "*");
  lines.push("");
  // Skip the first non-empty block if it became the title, to avoid duplication
  let firstContentIdx = -1;
  for (let i = 0; i < blocks.length; i++) {
    if ((blocks[i].content || "").trim()) { firstContentIdx = i; break; }
  }
  const bodyBlocks = firstContentIdx >= 0 ? blocks.slice(firstContentIdx + 1) : blocks;
  lines.push(blocksToText(bodyBlocks));
  return lines.join("\n");
}

// Convert an array of notes + their collections into one markdown document
function notesToMarkdownExport(notes, collections, scopeLabel) {
  const out = [];
  out.push("# " + (scopeLabel || "Notes export"));
  out.push("");
  out.push("*Exported " + new Date().toLocaleString("en-AU") + " · " + notes.length + " note" + (notes.length !== 1 ? "s" : "") + "*");
  out.push("");
  out.push("---");
  out.push("");
  // Group by collection
  const grouped = {};
  for (let i = 0; i < notes.length; i++) {
    const cid = notes[i].collectionId || "__inbox";
    if (!grouped[cid]) grouped[cid] = [];
    grouped[cid].push(notes[i]);
  }
  // Render each group
  const collOrder = ["__inbox"].concat(collections.map(c => c.id).filter(id => grouped[id]));
  for (let i = 0; i < collOrder.length; i++) {
    const cid = collOrder[i];
    if (!grouped[cid]) continue;
    const coll = cid === "__inbox" ? null : collections.find(c => c.id === cid);
    out.push("");
    out.push("# " + (coll ? coll.name : "Inbox"));
    out.push("");
    const sorted = grouped[cid].slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    for (let j = 0; j < sorted.length; j++) {
      out.push(noteToMarkdown(sorted[j]));
      out.push("");
      out.push("---");
      out.push("");
    }
  }
  return out.join("\n");
}

// Trigger a download of a text blob as a file
function downloadTextFile(text, filename) {
  try {
    const blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) { console.error("Download failed:", e); }
}

// ============================================================
// Time-range normalizer
// ============================================================
function normalizeRange(sh, sm, sMer, eh, em, eMer) {
  let startHr = sh, endHr = eh;
  if (sMer === "pm" && startHr < 12) startHr += 12;
  if (sMer === "am" && startHr === 12) startHr = 0;
  if (eMer === "pm" && endHr < 12) endHr += 12;
  if (eMer === "am" && endHr === 12) endHr = 0;
  if (!sMer && !eMer) { if (sh <= 12 && eh <= 12 && eh < sh && eh >= 1) endHr += 12; }
  else if (!sMer && eMer === "pm") { if (sh <= 6 && sh < eh) startHr += 12; }
  let startMin = startHr * 60 + sm;
  let endMin = endHr * 60 + em;
  if (endMin <= startMin) endMin += 24 * 60;
  return { startMin, endMin };
}

function detectCategory(text) {
  const lowerInput = " " + (text || "").toLowerCase() + " ";
  let bestCat = DEFAULT_CAT, bestScore = 0;
  for (let i = 0; i < CAT_ORDER.length; i++) {
    const cat = CAT_ORDER[i]; const def = CATEGORIES[cat];
    let score = 0;
    for (let j = 0; j < def.keywords.length; j++) {
      const kw = def.keywords[j];
      const re = new RegExp("\\b" + escapeRe(kw) + "\\b", "i");
      if (re.test(lowerInput)) score += kw.length + 2;
    }
    if (score > bestScore) { bestScore = score; bestCat = cat; }
  }
  return bestCat;
}

// ============================================================
// Parser (for tasks only — notes are NOT auto-tagged)
// ============================================================
function parseInput(input, today) {
  if (!input || !input.trim()) return null;
  if (!today) today = new Date();
  const original = input.trim();
  const result = { title: original, category: DEFAULT_CAT, priority: "low", time: null, duration: 45, endTime: null, date: null, recurring: null, notes: "", linkedTaskIds: [] };
  const strips = [];

  else if (/!/.test(original) || /\b(important|high priority)\b/i.test(original)) { result.priority = "medium"; strips.push(/!/g); strips.push(/\b(important|high priority)\b/gi); }

  let recurMatched = false;

  if (/\b(every\s*day|everyday|daily|each\s*day|nightly)\b/i.test(original)) { result.recurring = { days: [0,1,2,3,4,5,6] }; strips.push(/\b(every\s*day|everyday|daily|each\s*day|nightly)\b/gi); recurMatched = true; }
  else if (/\bweekdays?\b/i.test(original)) { result.recurring = { days: [1,2,3,4,5] }; strips.push(/\bweekdays?\b/gi); recurMatched = true; }
  else if (/\bweekends?\b/i.test(original)) { result.recurring = { days: [0,6] }; strips.push(/\bweekends?\b/gi); recurMatched = true; }

      const pm = original.match(pluralRe);

        while ((m = re.exec(pm[1])) !== null) { const d = DAY_MAP[m[1].slice(0,-1).toLowerCase()]; if (d !== undefined && days.indexOf(d) === -1) days.push(d); }

      const dm = original.match(dayRe);

  const rm = original.match(rangeRe);
  if (rm) {
    const sh = parseInt(rm[1], 10);
    const sm_ = rm[2] ? parseInt(rm[2], 10) : 0;
    const sMer = rm[3] ? rm[3].toLowerCase() : null;
    const eh = parseInt(rm[4], 10);
    const em_ = rm[5] ? parseInt(rm[5], 10) : 0;
    const eMer = rm[6] ? rm[6].toLowerCase() : null;
    const hasMer = sMer || eMer;

    else {

        else if (/\bevening\b/i.test(original))   { result.time = { hour: 19, minute: 0 }; strips.push(/\b(?:in the\s+)?evening\b/gi); }
        else if (/\bnight\b/i.test(original))     { result.time = { hour: 21, minute: 0 }; strips.push(/\b(?:at\s+)?night\b/gi); }
        else if (/\bnoon\b/i.test(original))      { result.time = { hour: 12, minute: 0 }; strips.push(/\b(?:at\s+)?noon\b/gi); }
        else if (/\bmidnight\b/i.test(original))  { result.time = { hour: 0, minute: 0 };  strips.push(/\b(?:at\s+)?midnight\b/gi); }

    }
  }

  if (!rangeMatched) {
    const dur = original.match(/\b(\d+(?:\.\d+)?)\s*(h(?:ours?|rs?)?|m(?:ins?|inutes?)?)\b/i);
    if (dur) { const n = parseFloat(dur[1]); const unit = dur[2].toLowerCase(); if (unit.charAt(0) === "h") result.duration = Math.round(n * 60); else result.duration = Math.round(n); strips.push(new RegExp(escapeRe(dur[0]), "gi")); if (result.time) result.endTime = computeEndTime(result.time, result.duration); }

  for (let i = 0; i < strips.length; i++) title = title.replace(strips[i], " ");

  while (prev !== title) { prev = title; title = title.replace(/^(at|on|by|from|to|in|the|a|an|and|or|@|-|–|—|,|;|:|\.)\s+/i, "").replace(/\s+(at|on|by|from|to|in|and|or|@|-|–|—|,|;|:|\.)$/i, "").trim(); }
  if (title.length > 0) result.title = title.charAt(0).toUpperCase() + title.slice(1);
  if (!result.title || result.title.length < 2) result.title = original;
  return result;
}

function resolveDayKey(key) { const k = key.toLowerCase(); if (DAY_MAP[k] !== undefined) return DAY_MAP[k]; const prefixes = ["sun","mon","tue","wed","thu","fri","sat"]; for (let i = 0; i < prefixes.length; i++) { if (k.indexOf(prefixes[i]) === 0) return DAY_MAP[prefixes[i]]; } return null; }

}

// Helpers
function newCollection(name, type, parentId) {
  return {
    id: uid(),
    name: name || "Untitled",
    type: type || "general",
    parentId: parentId || null,
    order: Date.now(),
    createdAt: Date.now()
  };
}

function getChildCollections(collections, parentId) {
  return collections.filter(c => (c.parentId || null) === (parentId || null)).sort((a, b) => (a.order || 0) - (b.order || 0));
}

function getCollectionPath(collections, id) {
  // Returns array of {id, name} from root to this collection
  const map = {};
  for (let i = 0; i < collections.length; i++) map[collections[i].id] = collections[i];
  const path = [];
  let cur = map[id];
  let guard = 0;
  while (cur && guard < 20) {
    path.unshift(cur);
    cur = cur.parentId ? map[cur.parentId] : null;
    guard++;
  }
  return path;
}

function getCollectionWithDescendants(collections, id) {
  // Returns set of ids: this id + all descendants
  const out = new Set([id]);
  let added = true;
  while (added) {
    added = false;
    for (let i = 0; i < collections.length; i++) {
      const c = collections[i];
      if (c.parentId && out.has(c.parentId) && !out.has(c.id)) {
        out.add(c.id);
        added = true;
      }
    }
  }
  return out;
}

// Get suggested templates for a collection type (prioritize type-matching, then general/journal as universals)
function suggestedTemplates(collectionType, limit) {
  const out = [];
  const seen = new Set();
  function pushAll(arr) {
    for (let i = 0; i < arr.length; i++) {
      if (!seen.has(arr[i].id)) { seen.add(arr[i].id); out.push(arr[i]); }
    }
  }
  if (collectionType) {
    pushAll(TEMPLATES.filter(t => t.type === collectionType));
  }
  pushAll(TEMPLATES.filter(t => t.type === "general"));
  pushAll(TEMPLATES.filter(t => t.type === "journal"));
  return out.slice(0, limit || 8);
}

// Group templates by type for the "all" view
function templatesByType() {
  const map = {};
  for (let i = 0; i < TEMPLATES.length; i++) {
    const t = TEMPLATES[i];
    if (!map[t.type]) map[t.type] = [];
    map[t.type].push(t);
  }
  return map;
}

// ============================================================
// Parse pasted text (with markdown patterns) into block array.
// Used when the user pastes multi-line content into a block —
// we split on newlines and detect markdown patterns so the paste
// preserves the original document structure rather than dumping
// everything into one giant paragraph.
// ============================================================
function parseTextToBlocks(text) {
  if (!text) return [];
  // Normalize line endings
  const normalized = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  const lines = normalized.split("\n");
  const result = [];

  // Track whether we're inside a fenced code block (```...```) so we keep
  // the code together as a single code block.
  let inCode = false;
  let codeBuffer = [];
  let codeLang = "";

  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const trimmed = raw.trim();

    // Fenced code block start/end
    const fenceMatch = /^```(\w*)?\s*$/.exec(trimmed);
    if (fenceMatch) {
      if (inCode) {
        // Close code block
        const codeBlock = newBlock("code", codeBuffer.join("\n"));
        if (codeLang) codeBlock.lang = codeLang;
        result.push(codeBlock);
        codeBuffer = [];
        codeLang = "";
        inCode = false;
      } else {
        inCode = true;
        codeLang = fenceMatch[1] || "";
      }
      continue;
    }
    if (inCode) {
      codeBuffer.push(raw);
      continue;
    }

    // Empty lines are paragraph separators — skip them (blocks already separate).
    if (!trimmed) continue;

    // Detect markdown patterns in priority order
    let m;
    // H1
    if ((m = /^#\s+(.+)$/.exec(trimmed))) { result.push(newBlock("h1", m[1])); continue; }
    // H2
    if ((m = /^##\s+(.+)$/.exec(trimmed))) { result.push(newBlock("h2", m[1])); continue; }
    // H3
    if ((m = /^###\s+(.+)$/.exec(trimmed))) { result.push(newBlock("h3", m[1])); continue; }
    // Checklist (unchecked) — must be checked BEFORE plain bullet
    if ((m = /^[-*+]\s+\[\s?\]\s+(.+)$/.exec(trimmed))) {
      const b = newBlock("check", m[1]); b.checked = false; result.push(b); continue;
    }
    // Checklist (checked)
    if ((m = /^[-*+]\s+\[x\]\s+(.+)$/i.exec(trimmed))) {
      const b = newBlock("check", m[1]); b.checked = true; result.push(b); continue;
    }
    // Bullet
    if ((m = /^[-*+]\s+(.+)$/.exec(trimmed))) { result.push(newBlock("bullet", m[1])); continue; }
    // Numbered list
    if ((m = /^\d+[.)]\s+(.+)$/.exec(trimmed))) { result.push(newBlock("numbered", m[1])); continue; }
    // Blockquote — keep the > prefix so renderInline can handle it
    if ((m = /^>\s+(.+)$/.exec(trimmed))) { result.push(newBlock("text", "> " + m[1])); continue; }
    // Divider
    if (/^(---+|\*\*\*+|___+)$/.test(trimmed)) { result.push(newBlock("divider", "")); continue; }

    // Plain text paragraph (preserve original line, not trimmed)
    result.push(newBlock("text", raw));
  }

  // Handle case where code block was never closed
  if (inCode && codeBuffer.length > 0) {
    const codeBlock = newBlock("code", codeBuffer.join("\n"));
    if (codeLang) codeBlock.lang = codeLang;
    result.push(codeBlock);
  }

  // Always return at least one block
  if (result.length === 0) result.push(newBlock("text", text));
  return result;
}
