      <div className="cat-picker-sep"/>
      {CAT_ORDER.map(k => (
        <button key={k} className={"cat-picker-item" + (current === k ? " active" : "")} onClick={() => { onPick(k); onClose(); }}>
          <span className={"cat-picker-tile cat-" + k}><CatIcon cat={k} size={11}/></span>
          {CATEGORIES[k].label}
        </button>
      ))}
    </div>
  );
}

function NoteCard({ note, onUpdate, onDelete, onTogglePin, onTagClick, onDragStart, onDragEnd, isDragging, isHighlighted, innerRef, allTasks, allRecurring, pickerOpenForThis, onOpenTaskPicker, onCloseTaskPicker, onLinkTask, onUnlinkTask, onOpenTask, titleIndex, highlightTerms, onWikiClick, backlinks, onOpenNote, onFocus, notesForAutocomplete, isCollapsed, onToggleCollapse }) {
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [pickerOpen, setPickerOpen] = useState(false);

  const blocks = note.blocks || [];
  const cleanTitle = useMemo(() => deriveTitleFromBlocks(blocks), [blocks]);
  const serialized = useMemo(() => blocksToText(blocks), [blocks]);
  const tags = useMemo(() => extractTags(serialized), [serialized]);

  // For the collapsed preview line: take the FIRST non-title text from the
  // note body. Skip the block that became the title (usually block 0 if it
  // was an H1 or first text line). Show up to ~120 chars.
  const collapsedPreview = useMemo(() => {
    if (!isCollapsed) return "";
    // Find first block whose text doesn't match the title (skip title block)
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      // Skip structured/visual-only blocks
      if (b.type === "divider" || b.type === "image" || b.type === "table" ||
          b.type === "callout" || b.type === "diagram") continue;
      const text = (b.content || "").trim();
      if (!text) continue;
      // Skip if this block IS the title (matches cleanTitle word-for-word)
      if (text === cleanTitle || text.replace(/^#+\s*/, "") === cleanTitle) continue;
      // Found a preview line — strip markdown markers for cleaner preview
      const cleaned = text.replace(/^#+\s+/, "").replace(/^[-*+]\s+/, "").replace(/^\d+\.\s+/, "").replace(/^\[[ x]?\]\s+/, "");
      return cleaned.length > 120 ? cleaned.slice(0, 117) + "…" : cleaned;
    }
    return "";
  }, [blocks, cleanTitle, isCollapsed]);

  // Block count badge — for the collapsed state, useful at a glance
  const blockCountLabel = useMemo(() => {
    const n = blocks.length;
    if (n === 0) return "0 blocks";
    if (n === 1) return "1 block";
    return n + " blocks";
  }, [blocks.length]);

  const linkedTasks = useMemo(() => {
    const ids = note.linkedTaskIds || [];
    if (ids.length === 0) return [];
    const out = [];
    const all = (allTasks || []).concat(allRecurring || []);
    for (let i = 0; i < ids.length; i++) {
      const found = all.find(t => t.id === ids[i]);
      if (found) out.push(found);
    }
    return out;
  }, [note.linkedTaskIds, allTasks, allRecurring]);

  function updateBlocks(nextBlocks) {
    onUpdate(note.id, { blocks: nextBlocks });
  }

  const metaLabel = relativeTimeLabel(note.createdAt);
  const dt = new Date(note.createdAt);
  const fullDate = dt.toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short", year: dt.getFullYear() !== new Date().getFullYear() ? "numeric" : undefined });
  const catKey = note.category || "untagged";

  function handleStripDragStart(e) {
    if (onDragStart) onDragStart(e);
  }

  return (
    <div ref={innerRef} className={"note-card cat-" + catKey + (note.pinned ? " pinned" : "") + (isDragging ? " dragging-note" : "") + (isHighlighted ? " highlight-flash" : "")}>
      <div
        draggable={!!onDragStart}
        onDragStart={handleStripDragStart}
        onDragEnd={onDragEnd}
        style={{cursor: onDragStart ? "grab" : "default"}}
        title="Drag to move into a collection"
      >
        <TimeStrip timestamp={note.createdAt} category={note.category}/>
      </div>
      <div className="note-card-body">
        <div className="note-card-header">
          <div className="note-cat-badge-wrap">
            <button className={"note-cat-badge cat-" + catKey} onClick={(e) => { e.stopPropagation(); setPickerOpen(o => !o); }} onMouseDown={(e) => e.stopPropagation()} aria-label="Change tag">
              {note.category ? <CatIcon cat={note.category} size={14}/> : <PlusIcon size={10}/>}
            </button>
            {pickerOpen && (<NoteCatPicker current={note.category} onPick={(c) => onUpdate(note.id, { category: c })} onClose={() => setPickerOpen(false)}/>)}
          </div>
          <div className="note-title-wrap">
            <h3 className="note-title">{cleanTitle || "Untitled note"}</h3>
            <p className="note-card-meta"><span>{metaLabel}</span><span className="dot-sep">·</span><span>{fullDate}</span></p>
          </div>
          <div className="note-actions">
            {onToggleCollapse && (
              <button
                className={"note-action note-collapse-btn" + (isCollapsed ? " is-collapsed" : "")}
                onClick={(e) => { e.stopPropagation(); onToggleCollapse(); }}
                aria-label={isCollapsed ? "Expand note" : "Collapse note"}
                title={isCollapsed ? "Expand" : "Collapse"}
              >
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                  {isCollapsed
                    ? <path d="M4 6 L8 10 L12 6"/>   /* chevron down — click to expand */
                    : <path d="M4 10 L8 6 L12 10"/>  /* chevron up — click to collapse */
                  }
                </svg>
              </button>
            )}
            {onFocus && (
              <button className="note-action note-focus-btn" onClick={(e) => { e.stopPropagation(); onFocus(note.id); }} aria-label="Expand note" title="Expand to full screen">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                  <path d="M9 2 H14 V7"/>
                  <path d="M14 2 L9 7"/>
                  <path d="M7 14 H2 V9"/>
                  <path d="M2 14 L7 9"/>
                </svg>
              </button>
            )}
            <button className={"note-action" + (note.pinned ? " active" : "")} onClick={(e) => { e.stopPropagation(); onTogglePin(note.id); }} aria-label={note.pinned ? "Unpin" : "Pin"} title={note.pinned ? "Unpin" : "Pin to top"}>
              <PinIcon size={14} filled={note.pinned}/>
            </button>
            <button className={"note-action danger" + (confirmDelete ? " confirm" : "")} onClick={(e) => { e.stopPropagation(); if (confirmDelete) { onDelete(note.id); } else { setConfirmDelete(true); setTimeout(() => setConfirmDelete(false), 2500); } }} aria-label={confirmDelete ? "Click again to confirm delete" : "Delete"} title={confirmDelete ? "Click again to confirm" : "Delete"}>
              <TrashIcon size={14}/>
            </button>
          </div>
        </div>

        {/* COLLAPSED STATE: show preview line + block count, hide blocks/tags/backlinks */}
        {isCollapsed ? (
          <div className="note-collapsed-summary" onClick={onToggleCollapse}>
            {collapsedPreview && (
              <span className="note-collapsed-preview">{collapsedPreview}</span>
            )}
            <span className="note-collapsed-meta">
              {tags.length > 0 && (
                <span className="note-collapsed-tags">
                  {tags.slice(0, 3).map(t => "#" + t).join(" ")}
                  {tags.length > 3 && " +" + (tags.length - 3)}
                </span>
              )}
              <span className="note-collapsed-blockcount">{blockCountLabel}</span>
            </span>
          </div>
        ) : (
          <>
            <BlockEditor blocks={blocks} onChange={updateBlocks} titleIndex={titleIndex} highlightTerms={highlightTerms} onWikiClick={onWikiClick} notesForAutocomplete={notesForAutocomplete}/>

            {tags.length > 0 && (
              <div className="note-tags">
                {tags.map(t => (
                  <button key={t} className="note-tag" onClick={(e) => { e.stopPropagation(); if (onTagClick) onTagClick(t); }}>#{t}</button>
                ))}
              </div>
            )}
          </>
        )}

        {/* Linked tasks — hidden when collapsed (visible in summary instead) */}
        {!isCollapsed && (
          <div className="note-linked-tasks">
            {linkedTasks.map(t => {
              const lab = makeTaskLabel(t);
              return (
                <span key={t.id} className={"note-linked-chip cat-" + t.category}>
                  <LinkIcon size={10}/>
                  <span className="note-linked-chip-text" onClick={() => onOpenTask && onOpenTask(t)} title="Open task">
                    {lab.title}
                  </span>
                  <button className="note-linked-unlink" onClick={(e) => { e.stopPropagation(); onUnlinkTask(note.id, t.id); }} aria-label="Unlink" title="Unlink">
                    <XIcon size={9}/>
                  </button>
                </span>
              );
            })}
            {onOpenTaskPicker && (
              <button className="note-linked-add" onClick={(e) => { e.stopPropagation(); onOpenTaskPicker(); }}>
                <LinkIcon size={10}/> Link task
              </button>
            )}
          </div>
        )}

        {pickerOpenForThis && (
          <TaskPickerForNote
            note={note}
            allTasks={allTasks}
            allRecurring={allRecurring}
            onClose={onCloseTaskPicker}
            onPick={(taskId) => { onLinkTask(note.id, taskId); onCloseTaskPicker(); }}
          />
        )}

        {!isCollapsed && backlinks && backlinks.length > 0 && (
          <div className="backlinks">
            <div className="backlinks-label">
              <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M9 5.5 H12 A3 3 0 0 1 12 11 H10"/><path d="M7 11 H4 A3 3 0 0 1 4 5 H6.5"/><path d="M6.5 8 H9.5"/></svg>
              Mentioned in {backlinks.length} note{backlinks.length !== 1 ? "s" : ""}
            </div>
            <div className="backlinks-list">
              {backlinks.map(b => {
                const t = deriveTitleFromBlocks(b.blocks || []) || "Untitled note";
                const catKey = b.category || "admin";
                return (
                  <button key={b.id} className={"backlink-item cat-" + catKey} onClick={(e) => { e.stopPropagation(); if (onOpenNote) onOpenNote(b.id); }}>
                    {b.category && <CatIcon cat={b.category} size={10}/>}
                    <span className="backlink-title">{t}</span>
                  </button>
                );
              })}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ============================================================
// Task picker for note ↔ task linking
// ============================================================
function TaskPickerForNote({ note, allTasks, allRecurring, onClose, onPick }) {
  const [query, setQuery] = useState("");
  const searchRef = useRef(null);
  useEffect(() => { if (searchRef.current) searchRef.current.focus(); }, []);

  // Build sorted candidate list: today's tasks first, then upcoming, then recurring, exclude already-linked
  const candidates = useMemo(() => {
    const linkedSet = new Set(note.linkedTaskIds || []);
    const todayStr = formatDate(new Date());
    const oneOff = (allTasks || []).filter(t => !linkedSet.has(t.id));
    const recur = (allRecurring || []).filter(r => !linkedSet.has(r.id));
    // Sort one-off by date (today first)
    oneOff.sort((a, b) => {
      const aIsToday = a.date === todayStr;
      const bIsToday = b.date === todayStr;
      if (aIsToday !== bIsToday) return aIsToday ? -1 : 1;
      return (a.date || "").localeCompare(b.date || "");
    });
    return { oneOff, recur };
  }, [note.linkedTaskIds, allTasks, allRecurring]);

  function matches(t) {
    if (!query.trim()) return true;
    const q = query.trim().toLowerCase();
    return (t.title || "").toLowerCase().indexOf(q) !== -1 || (t.category || "").indexOf(q) !== -1;
  }

  const oneOffFiltered = candidates.oneOff.filter(matches).slice(0, 30);
  const recurFiltered = candidates.recur.filter(matches).slice(0, 15);

  function handleScrim(e) { if (e.target === e.currentTarget) onClose(); }

  return (
    <div className="task-picker-scrim" onClick={handleScrim}>
      <div className="task-picker-card">
        <div className="task-picker-header">
          <h3 className="task-picker-title">
            <LinkIcon size={13}/>
            Link to a task
          </h3>
          <button className="tpl-modal-close" onClick={onClose} aria-label="Close"><XIcon size={14}/></button>
        </div>
        <div className="tpl-search-wrap" style={{margin: "8px 14px 4px"}}>
          <span className="tpl-search-icon"><SearchIcon size={13}/></span>
          <input
            ref={searchRef}
            type="text" className="tpl-search"
            placeholder="Search tasks…"
            value={query}
            onChange={e => setQuery(e.target.value)}
            onKeyDown={e => { if (e.key === "Escape") onClose(); }}
          />
        </div>
        <div className="task-picker-body">
          {oneOffFiltered.length === 0 && recurFiltered.length === 0 && (
            <div className="tpl-empty">No matching tasks.</div>
          )}
          {oneOffFiltered.length > 0 && (
            <>
              <div className="tpl-section-label">Tasks</div>
              {oneOffFiltered.map(t => {
                const lab = makeTaskLabel(t);
                return (
                  <button key={t.id} className="task-picker-item" onClick={() => onPick(t.id)}>
                    <span className={"task-picker-item-icon cat-" + t.category}><CatIcon cat={t.category} size={11}/></span>
                    <span className="task-picker-item-text">
                      <span className="task-picker-item-title">{lab.title}</span>
                      <span className="task-picker-item-when">{lab.when}</span>
                    </span>
                  </button>
                );
              })}
            </>
          )}
          {recurFiltered.length > 0 && (
            <>
              <div className="tpl-section-label">Recurring</div>
              {recurFiltered.map(t => {
                const lab = makeTaskLabel(t);
                return (
                  <button key={t.id} className="task-picker-item" onClick={() => onPick(t.id)}>
                    <span className={"task-picker-item-icon cat-" + t.category}><CatIcon cat={t.category} size={11}/></span>
                    <span className="task-picker-item-text">
                      <span className="task-picker-item-title">{lab.title}</span>
                      <span className="task-picker-item-when">{lab.when} ↻</span>
                    </span>
                  </button>
                );
              })}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

// Today summary
// ============================================================
// ============================================================
// Search-filter chips — show active operators with one-click clear
// ============================================================
function SearchFilterChips({ parsed, matchCount, onClear }) {
  const chips = [];
  parsed.tags.forEach(t => chips.push({ label: "#" + t, kind: "tag" }));
  parsed.cats.forEach(c => chips.push({ label: "cat:" + c, kind: "cat" }));
  parsed.colls.forEach(c => chips.push({ label: "coll:" + c, kind: "coll" }));
  parsed.has.forEach(h => chips.push({ label: "has:" + h, kind: "has" }));
  if (parsed.after != null) chips.push({ label: "after:" + new Date(parsed.after).toLocaleDateString("en-AU", { day: "numeric", month: "short" }), kind: "after" });
  if (parsed.before != null) chips.push({ label: "before:" + new Date(parsed.before).toLocaleDateString("en-AU", { day: "numeric", month: "short" }), kind: "before" });
  parsed.terms.forEach(t => chips.push({ label: '"' + t + '"', kind: "term" }));
  return (
    <div className="search-filter-bar">
      <span className="search-filter-count">{matchCount} match{matchCount !== 1 ? "es" : ""}</span>
      <span className="search-filter-chips">
        {chips.map((c, i) => (
          <span key={i} className={"search-filter-chip kind-" + c.kind}>{c.label}</span>
        ))}
      </span>
      <button className="search-filter-clear" onClick={onClear}>Clear</button>
    </div>
  );
}

              <span className="recently-touched-item-when">{when}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ============================================================
// Activity heatmap — 4 weeks of note creation density (one month)
// ============================================================
function ActivityHeatmap({ notes, onPickDate }) {
  const grid = useMemo(() => buildHeatmapGrid(notes, 4), [notes]);
  const [hoverCell, setHoverCell] = useState(null);
  const [touchedCell, setTouchedCell] = useState(null);
  const total = useMemo(() => grid.reduce((s, col) => s + col.reduce((ss, c) => ss + c.count, 0), 0), [grid]);

  // Bucket count → intensity level 0–4
  function level(n) {
    if (n === 0) return 0;
    if (n === 1) return 1;
    if (n <= 3) return 2;
    if (n <= 6) return 3;
    return 4;
  }

  function fmtFull(d) {
    return d.toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "long" });
  }
  function fmtShort(d) {
    return d.toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short" });
  }

  // Active cell: prefer hover (desktop), fall back to last-touched (mobile)
  const active = hoverCell || touchedCell;

  function handleCellClick(cell) {
    if (cell.inFuture) return;
    // First tap on mobile: show the info; second tap on same cell: filter
    if (touchedCell && touchedCell.dateStr === cell.dateStr) {
      if (onPickDate) onPickDate(cell.dateStr);
      setTouchedCell(null);
    } else {
      setTouchedCell(cell);
      // Desktop with mouse: also filter immediately (hover already showed info)
      if (hoverCell && onPickDate) onPickDate(cell.dateStr);
    }
  }

  return (
    <div className="activity-heatmap">
      <div className="heatmap-head">
        <div className="heatmap-head-left">
          <span className="heatmap-title">Note activity</span>
          <span className="heatmap-subtitle">Notes captured each day · last 4 weeks</span>
        </div>
        <span className="heatmap-total">
          {active
            ? (<span><strong>{active.count}</strong> note{active.count !== 1 ? "s" : ""} · {fmtShort(active.date)}</span>)
            : (<span>{total} note{total !== 1 ? "s" : ""} total</span>)
          }
        </span>
      </div>
      <div className="heatmap-grid-wrap">
        <div className="heatmap-weekdays">
          <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>
        <div className="heatmap-grid">
          {grid.map((col, ci) => (
            <div key={ci} className="heatmap-col">
              {col.map((cell, ri) => {
                const isActive = active && active.dateStr === cell.dateStr;
                const isArmed = touchedCell && touchedCell.dateStr === cell.dateStr;
                return (
                  <div
                    key={ri}
                    className={"heatmap-cell level-" + level(cell.count) + (cell.isToday ? " is-today" : "") + (cell.inFuture ? " is-future" : "") + (isActive ? " is-active" : "") + (isArmed ? " is-armed" : "")}
                    onMouseEnter={() => setHoverCell(cell)}
                    onMouseLeave={() => setHoverCell(null)}
                    onClick={() => handleCellClick(cell)}
                    role="button"
                    tabIndex={0}
                    aria-label={cell.count + " notes on " + fmtFull(cell.date)}
                  />
                );
              })}
            </div>
          ))}
        </div>
      </div>
      <div className="heatmap-foot">
        <span className="heatmap-foot-hint">
          {touchedCell
            ? "Tap again to view notes from this day"
            : "Tap a cell to see details · tap again to filter"}
        </span>
        <div className="heatmap-legend">
          <span className="heatmap-legend-label">Less</span>
          <span className="heatmap-cell level-0"/>
          <span className="heatmap-cell level-1"/>
          <span className="heatmap-cell level-2"/>
          <span className="heatmap-cell level-3"/>
          <span className="heatmap-cell level-4"/>
          <span className="heatmap-legend-label">More</span>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// Note focus view — fullscreen single-note editing with full toolbar
// ============================================================
function NoteFocusView({ note, collections, titleIndex, onWikiClick, onClose, onUpdate, onDelete, onTogglePin }) {
  const blocks = note.blocks || [];
  const title = deriveTitleFromBlocks(blocks) || "Untitled note";
  const dt = new Date(note.createdAt);
  const dateLine = dt.toLocaleString("en-AU", { weekday: "long", day: "numeric", month: "long", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true });
  const coll = note.collectionId ? (collections || []).find(c => c.id === note.collectionId) : null;
  const currentCollectionType = coll ? coll.type : null;

  // UI state inside the focus view
  const [templatePickerOpen, setTemplatePickerOpen] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [savedFlash, setSavedFlash] = useState(false);
  // The block currently being edited — used by the format toolbar so
  // tapping a button affects "this block" (whichever has the cursor).
  const [focusedBlockId, setFocusedBlockId] = useState(null);

  // Word / block count for the status bar
  const stats = useMemo(() => {
    const text = blocksToText(blocks).trim();
    const words = text ? text.split(/\s+/).filter(Boolean).length : 0;
    const chars = text.length;
    return { words, chars, blockCount: blocks.length };
  }, [blocks]);

  // Last-updated formatter
  const lastUpdated = useMemo(() => {
    if (!note.updatedAt) return null;
    const ms = Date.now() - new Date(note.updatedAt).getTime();
    if (ms < 60_000) return "Saved just now";
    const mins = Math.floor(ms / 60_000);
    if (mins < 60) return "Saved " + mins + "m ago";
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return "Saved " + hrs + "h ago";
    return "Saved " + new Date(note.updatedAt).toLocaleDateString("en-AU", { day: "numeric", month: "short" });
  }, [note.updatedAt]);

  useEffect(() => {
    function onKey(e) {
      // Don't capture Escape while a child dialog is open
      if (e.key === "Escape" && !templatePickerOpen && !confirmDelete) onClose();
    }
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, [onClose, templatePickerOpen, confirmDelete]);

  function updateBlocks(next) {
    onUpdate(note.id, { blocks: next });
    setSavedFlash(true);
    setTimeout(() => setSavedFlash(false), 800);
  }

  // Convert the currently-focused block to a new type. Preserves the block's
  // existing content for text-like types; for structured types (table, callout,
  // divider, etc.) inserts a NEW block after instead of destroying content.
  // This is the function each toolbar button calls.
  function convertFocusedBlock(type) {
    // If no block is focused yet, fall back to the LAST block (most likely
    // where the user was working). If still nothing, do nothing.
    const targetId = focusedBlockId || (blocks.length > 0 ? blocks[blocks.length - 1].id : null);
    if (!targetId) return;
    const idx = blocks.findIndex(b => b.id === targetId);
    if (idx === -1) return;
    const cur = blocks[idx];

    const textLikeTypes = ["text", "h1", "h2", "h3", "bullet", "numbered", "check", "code", "math"];
    const structuredTypes = ["divider", "table", "callout", "image", "diagram"];

    if (textLikeTypes.indexOf(type) >= 0) {
      // Convert in place — keep content
      const updated = blocks.map(b => b.id === targetId
        ? Object.assign({}, b, {
            type: type,
            checked: type === "check" ? false : (b.checked || false)
          })
        : b);
      updateBlocks(updated);
      return;
    }

    if (structuredTypes.indexOf(type) >= 0) {
      // Structured: if current block has content, INSERT AFTER. Otherwise replace.
      const hasContent = (cur.content || "").length > 0 && cur.type !== "text" || (cur.type === "text" && (cur.content || "").trim().length > 0);
      let payload = newBlock(type, "");
      // newBlock seeds the correct default JSON for structured types
      if (hasContent) {
        const out = blocks.slice();
        out.splice(idx + 1, 0, payload);
        // For divider, also add an empty text block after so user can keep writing
        if (type === "divider") {
          out.splice(idx + 2, 0, newBlock("text", ""));
        }
        updateBlocks(out);
      } else {
        // Replace current empty block
        const replaced = Object.assign({}, cur, payload, { id: cur.id });
        const out = blocks.map(b => b.id === targetId ? replaced : b);
        if (type === "divider") {
          // Add a follow-up text block after the divider
          const dividerIdx = out.findIndex(b => b.id === targetId);
          out.splice(dividerIdx + 1, 0, newBlock("text", ""));
        }
        updateBlocks(out);
      }
    }
  }
  function handleScrim(e) {
    if (e.target === e.currentTarget && !templatePickerOpen && !confirmDelete) onClose();
  }
  function applyTemplate(tpl) {
    // Append template blocks to the existing note (preserves your current content)
    const tplBlocks = tpl.blocks.map(b => Object.assign({}, b, { id: uid() }));
    const newBlocks = (blocks || []).concat(tplBlocks);
    onUpdate(note.id, { blocks: newBlocks, templateId: tpl.id });
    setTemplatePickerOpen(false);
    setSavedFlash(true);
    setTimeout(() => setSavedFlash(false), 800);
  }
  function handleDelete() {
    if (onDelete) onDelete(note.id);
    setConfirmDelete(false);
    onClose();
  }
  function handleMoveCollection(newCollectionId) {
    onUpdate(note.id, { collectionId: newCollectionId || null });
  }

  // Active block type — used to highlight the matching button in the toolbar
  const activeBlockType = useMemo(() => {
    if (!focusedBlockId) return null;
    const b = blocks.find(x => x.id === focusedBlockId);
    return b ? b.type : null;
  }, [focusedBlockId, blocks]);

  return (
    <div className="focus-overlay" onClick={handleScrim}>
      <div className="focus-card">
        {/* Toolbar — sticky top with all actions */}
        <div className="focus-toolbar">
          <div className="focus-toolbar-left">
            <button className="focus-tool-btn focus-tool-back" onClick={onClose} title="Back (Esc)">
              <BackIcon size={14}/>
              <span>Back</span>
            </button>
            <span className="focus-toolbar-sep"/>
            <span className={"focus-save-status" + (savedFlash ? " is-flash" : "")}>
              {savedFlash ? "Saving…" : lastUpdated || "Auto-saved"}
            </span>
          </div>
          <div className="focus-toolbar-right">
            <button
              className="focus-tool-btn"
              onClick={() => setTemplatePickerOpen(true)}
              title="Insert template content"
            >
              <TemplateIcon size={13}/>
              <span className="focus-tool-label">Templates</span>
            </button>
            <button
              className={"focus-tool-btn" + (note.pinned ? " is-active" : "")}
              onClick={() => onTogglePin && onTogglePin(note.id)}
              title={note.pinned ? "Unpin note" : "Pin note"}
            >
              <PinIcon size={13}/>
              <span className="focus-tool-label">{note.pinned ? "Pinned" : "Pin"}</span>
            </button>
            <button
              className="focus-tool-btn focus-tool-danger"
              onClick={() => setConfirmDelete(true)}
              title="Delete note"
            >
              <TrashIcon size={13}/>
              <span className="focus-tool-label">Delete</span>
            </button>
            <span className="focus-toolbar-sep"/>
            <button className="focus-tool-btn focus-tool-close" onClick={onClose} title="Close (Esc)" aria-label="Close">
              <XIcon size={14}/>
            </button>
          </div>
        </div>

        {/* Meta strip — date, collection chip */}
        <div className="focus-meta-strip">
          <span className="focus-meta-line">{dateLine}</span>
          {coll && (
            <>
              <span className="focus-meta-dot">·</span>
              <span className={"focus-meta-collection focus-meta-type-" + coll.type}>
                {coll.name}
              </span>
            </>
          )}
        </div>

        {/* Title */}
        <div className="focus-title-wrap">
          <h1 className="focus-title">{title}</h1>
        </div>

        {/* Format toolbar — tap a block, then tap a button to convert it.
            Using onMouseDown + preventDefault keeps the textarea focused so
            the keyboard doesn't dismiss on mobile after the conversion. */}
        <div className="focus-format-toolbar" role="toolbar" aria-label="Format block">
          {[
            { type: "text",     label: "Text",   icon: "¶"   },
            { type: "h1",       label: "H1",     icon: "H1"  },
            { type: "h2",       label: "H2",     icon: "H2"  },
            { type: "h3",       label: "H3",     icon: "H3"  },
            { sep: true },
            { type: "bullet",   label: "Bullet", icon: "•"   },
            { type: "numbered", label: "List",   icon: "1."  },
            { type: "check",    label: "Check",  icon: "☐"   },
            { sep: true },
            { type: "code",     label: "Code",   icon: "</>" },
            { type: "callout",  label: "Note",   icon: "❝"   },
            { type: "divider",  label: "Divider",icon: "─"   },
            { type: "table",    label: "Table",  icon: "⊞"   }
          ].map((b, i) => b.sep ? (
            <span key={"sep-" + i} className="focus-format-sep" aria-hidden="true"/>
          ) : (
            <button
              key={b.type}
              type="button"
              className={"focus-format-btn" + (activeBlockType === b.type ? " is-active" : "")}
              onMouseDown={(e) => {
                e.preventDefault();
                convertFocusedBlock(b.type);
              }}
              title={b.label}
              aria-label={b.label}
            >
              <span className="focus-format-btn-icon">{b.icon}</span>
              <span className="focus-format-btn-label">{b.label}</span>
            </button>
          ))}
        </div>

        {/* Editor body */}
        <div className="focus-body">
          <BlockEditor
            blocks={blocks}
            onChange={updateBlocks}
            titleIndex={titleIndex}
            onWikiClick={onWikiClick}
            onFocusChange={setFocusedBlockId}
          />
        </div>

        {/* Status bar at the bottom */}
        <div className="focus-statusbar">
          <span className="focus-status-item">{stats.words} {stats.words === 1 ? "word" : "words"}</span>
          <span className="focus-status-dot">·</span>
          <span className="focus-status-item">{stats.chars} chars</span>
          <span className="focus-status-dot">·</span>
          <span className="focus-status-item">{stats.blockCount} {stats.blockCount === 1 ? "block" : "blocks"}</span>
          <span className="focus-status-spacer"/>
          <span className="focus-status-hint">Type <kbd>/</kbd> for slash commands · <kbd>Esc</kbd> to exit</span>
        </div>

        {/* Template picker — opens inside focus mode */}
        {templatePickerOpen && (
          <TemplatePicker
            currentCollectionType={currentCollectionType}
            currentCollectionName={coll ? coll.name : null}
            onClose={() => setTemplatePickerOpen(false)}
            onPick={applyTemplate}
          />
        )}

        {/* Delete confirm */}
        {confirmDelete && (
          <ConfirmModal
            title="Delete this note?"
            message={'"' + title + '" will be permanently removed. This cannot be undone.'}
            confirmLabel="Delete"
            danger
            onCancel={() => setConfirmDelete(false)}
            onConfirm={handleDelete}
          />
        )}
      </div>
    </div>
  );
}

// ============================================================
// Task sheet — with PRO NOTES + templates + linking
// ============================================================
function TaskSheet({ item, today, allTasks, allRecurring, allNotes, collections, findTaskById, onClose, onDelete, onUpdate, onOpenTask, onOpenNote, onLink, onUnlink }) {
  const [notes, setNotes] = useState(item.notes || "");
  const [linkSelect, setLinkSelect] = useState("");
  const notesRef = useRef(null);
  const sheetRef = useRef(null);
  const saveRef = useRef(notes);
  saveRef.current = notes;
  const itemIdRef = useRef(item.id);

  // Re-init notes + link selector + scroll when switching to a linked task
  useEffect(() => {
    if (itemIdRef.current !== item.id) {
      itemIdRef.current = item.id;
      setNotes(item.notes || "");
      setLinkSelect("");
      if (sheetRef.current) sheetRef.current.scrollTop = 0;
    }
  }, [item.id, item.notes]);

  // Save on unmount
  useEffect(() => {
    return () => { if (saveRef.current !== item.notes) onUpdate(item, { notes: saveRef.current }); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Debounced save while typing
  useEffect(() => {
    const id = setTimeout(() => { if (notes !== item.notes) onUpdate(item, { notes }); }, 600);
    return () => clearTimeout(id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [notes]);

  function handleScrimClick(e) { if (e.target === e.currentTarget) onClose(); }
  function setPriority(p) { onUpdate(item, { priority: p }); }
  function setMoveDate(dateStr) { if (item.recurring) return; onUpdate(item, { date: dateStr }); }
  function handleStartTimeChange(e) { const parsed = parseTimeStr(e.target.value); if (!parsed) return; const updates = { time: parsed }; if (item.endTime) updates.duration = computeDuration(parsed, item.endTime); onUpdate(item, updates); }
  function handleEndTimeChange(e) { const parsed = parseTimeStr(e.target.value); if (!parsed) return; if (!item.time) return; onUpdate(item, { endTime: parsed, duration: computeDuration(item.time, parsed) }); }
  function clearTime() { onUpdate(item, { time: null, endTime: null, duration: 45 }); }
  function addTime() { onUpdate(item, { time: { hour: 9, minute: 0 }, endTime: { hour: 10, minute: 0 }, duration: 60 }); }

  function insertTemplate(name) {
    const next = appendTemplate(notes, name);
    setNotes(next);
    setTimeout(() => { if (notesRef.current) { notesRef.current.focus(); notesRef.current.setSelectionRange(next.length, next.length); notesRef.current.scrollTop = notesRef.current.scrollHeight; } }, 0);
  }

  function flushNotesAnd(fn) {
    if (saveRef.current !== item.notes) onUpdate(item, { notes: saveRef.current });
    fn();
  }

  function handleLink() {
    if (!linkSelect) return;
    onLink(item.id, linkSelect);
    setLinkSelect("");
  }

  function openLinked(linkedId) {
    const linked = findTaskById(linkedId);
    if (!linked) return;
    flushNotesAnd(() => onOpenTask(linked));
  }

  let when = "";
  if (item.recurring) {
    const days = item.recurring.days;
    if (days.length === 7) when = "Every day";
    else if (days.length === 5 && days.indexOf(0) === -1 && days.indexOf(6) === -1) when = "Weekdays";
    else if (days.length === 2 && days.indexOf(0) !== -1 && days.indexOf(6) !== -1) when = "Weekends";
    else when = "Every " + days.map(d => DAY_NAMES_FULL[d]).join(", ");
  } else if (item.date) {
    const dt = new Date(item.date + "T00:00:00");
    when = dt.toLocaleString("en-AU", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }
  const catDef = CATEGORIES[item.category] || CATEGORIES[DEFAULT_CAT];
  const durStr = item.time && item.endTime ? formatDuration(computeDuration(item.time, item.endTime)) : "";

  const moveOptions = [];
  for (let i = 0; i < 14; i++) { const d = addDays(today, i); moveOptions.push({ dateStr: formatDate(d), label: i === 0 ? "Today" : i === 1 ? "Tmrw" : DAY_NAMES_SHORT[d.getDay()], day: i === 0 || i === 1 ? "" : d.getDate().toString() }); }

  // Linking candidates: all tasks + recurring except self and already-linked
  const linkedIds = item.linkedTaskIds || [];
  const allCandidates = useMemo(() => {
    const arr = [];
    for (let i = 0; i < allTasks.length; i++) { const t = allTasks[i]; if (t.id !== item.id && linkedIds.indexOf(t.id) === -1) arr.push(t); }
    for (let i = 0; i < allRecurring.length; i++) { const r = allRecurring[i]; if (r.id !== item.id && linkedIds.indexOf(r.id) === -1) arr.push(r); }
    return arr;
  }, [allTasks, allRecurring, item.id, linkedIds]);

  const linkedTasks = linkedIds.map(id => findTaskById(id)).filter(Boolean);

  return (
    <div className="scrim" onClick={handleScrimClick}>
      <div className="sheet" role="dialog" aria-modal="true" ref={sheetRef}>
        <span className={"sheet-cat cat-" + item.category}><CatIcon cat={item.category} size={12}/>{catDef.label}</span>
        <h2 className="sheet-title">{item.title}</h2>
        <p className="sheet-meta">{when}</p>

        <div className="sheet-section">
          <span className="sheet-label">Time</span>
          {item.time ? (
            <div className="time-edit-row">
              <input type="time" className="time-input" value={formatTime(item.time)} onChange={handleStartTimeChange} aria-label="Start time"/>
              <span className="time-sep">→</span>
              <input type="time" className="time-input" value={item.endTime ? formatTime(item.endTime) : ""} onChange={handleEndTimeChange} aria-label="End time"/>
              {durStr && <span className="time-dur">{durStr}</span>}
              <button className="time-clear-btn" onClick={clearTime}>All day</button>
            </div>
          ) : (<button className="time-add-btn" onClick={addTime}>+ Set time</button>)}
        </div>

        <div className="sheet-section">
          <span className="sheet-label">Priority</span>
          <div className="prio-row">
            <button className={"prio-btn" + (item.priority === "low" ? " active" : "")} onClick={() => setPriority("low")}>Low</button>
            <button className={"prio-btn med" + (item.priority === "medium" ? " active med" : "")} onClick={() => setPriority("medium")}>Medium</button>
            <button className={"prio-btn high" + (item.priority === "high" ? " active high" : "")} onClick={() => setPriority("high")}>High</button>
          </div>
        </div>

        {!item.recurring && (
          <div className="sheet-section">
            <span className="sheet-label">Move to</span>
            <div className="move-row">
              {moveOptions.map((opt, i) => (
                <button key={i} className={"move-btn" + (item.date === opt.dateStr ? " current" : "")} onClick={() => setMoveDate(opt.dateStr)}>
                  {opt.day && <span className="move-day">{opt.label}</span>}
                  {opt.day ? opt.day : opt.label}
                </button>
              ))}
            </div>
          </div>
        )}

        <div className="sheet-section">
          <span className="sheet-label">Pro notes</span>
          <textarea ref={notesRef} className="notes-input" value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Notes for this task — markdown supported. Use the buttons below to stamp in mini-templates." rows={5}/>
          <div className="tpl-row">
            <button className="tpl-btn" onClick={() => insertTemplate("checklist")}>+ Checklist</button>
            <button className="tpl-btn" onClick={() => insertTemplate("plan")}>+ Plan</button>
            <button className="tpl-btn" onClick={() => insertTemplate("journal")}>+ Journal</button>
            <button className="tpl-btn" onClick={() => insertTemplate("outcome")}>+ Outcome</button>
          </div>
        </div>

        <div className="sheet-section">
          <span className="sheet-label">Link another task</span>
          <div className="link-row">
            <select className="link-select" value={linkSelect} onChange={e => setLinkSelect(e.target.value)}>
              <option value="">{allCandidates.length === 0 ? "Nothing else to link" : "Pick a task to link…"}</option>
              {allCandidates.map(c => {
                const lab = makeTaskLabel(c);
                return <option key={c.id} value={c.id}>{lab.title} — {lab.when}{c.recurring ? " (recurring)" : ""}</option>;
              })}
            </select>
            <button className="link-btn" onClick={handleLink} disabled={!linkSelect}>Link</button>
          </div>
          <div className="linked-list">
            {linkedTasks.length === 0 ? (
              <p className="linked-empty">No linked tasks yet. Link prep → execution → journal so they stay connected.</p>
            ) : linkedTasks.map(lt => {
              const lab = makeTaskLabel(lt);
              return (
                <div key={lt.id} className="linked-item" onClick={() => openLinked(lt.id)} role="button" tabIndex={0}>
                  <span className={"linked-item-icon cat-" + lt.category}><CatIcon cat={lt.category} size={12}/></span>
                  <span className="linked-item-text">{lab.title}<span className="when">— {lab.when}{lt.recurring ? " (↻)" : ""}</span></span>
                  <button className="linked-unlink" onClick={(e) => { e.stopPropagation(); onUnlink(item.id, lt.id); }} aria-label="Unlink" title="Unlink"><XIcon size={11}/></button>
                </div>
              );
            })}
          </div>
        </div>

        {allNotes && (() => {
          const linkedNotes = allNotes.filter(n => n.linkedTaskIds && n.linkedTaskIds.indexOf(item.id) !== -1);
          return (
            <div className="sheet-section">
              <span className="sheet-label">Linked notes</span>
              <div className="linked-list">
                {linkedNotes.length === 0 ? (
                  <p className="linked-empty">No notes linked to this task yet. Notes captured during this task's time window will auto-link.</p>
                ) : linkedNotes.map(ln => {
                  const title = deriveTitleFromBlocks(ln.blocks || []) || "Untitled note";
                  const dt = new Date(ln.createdAt);
                  const when = dt.toLocaleString("en-AU", { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit", hour12: true });
                  const collectionName = ln.collectionId && collections ? (collections.find(c => c.id === ln.collectionId) || {}).name : null;
                  const catKey = ln.category || "admin";
                  return (
                    <div key={ln.id} className="linked-item" onClick={() => onOpenNote && onOpenNote(ln.id)} role="button" tabIndex={0} title="Open note">
                      <span className={"linked-item-icon cat-" + catKey}>
                        {ln.category ? <CatIcon cat={ln.category} size={12}/> : <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><path d="M3 2.5 H11 L13 4.5 V13.5 H3 Z M11 2.5 V4.5 H13"/></svg>}
                      </span>
                      <span className="linked-item-text">
                        {title}
                        <span className="when">— {when}{collectionName ? " · " + collectionName : ""}</span>
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })()}

        {item.recurring && (<p style={{margin: "14px 0 0", color: "var(--text-3)", fontSize: 11.5}}><RecurIcon size={11}/> This is a recurring task. Deleting removes all occurrences and unlinks it from everything.</p>)}

        <div className="sheet-actions">
          <button className="sheet-btn" onClick={onClose}>Close</button>
          <button className="sheet-btn danger" onClick={() => onDelete(item)}>Delete</button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
