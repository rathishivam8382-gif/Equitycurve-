    width: 16px; text-align: center;
    color: var(--text-3);
    font-size: 12px;
    font-weight: 600;
  }
  .table-menu-item.active .table-menu-icon,
  .table-menu-item:hover .table-menu-icon { color: inherit; }
  .table-menu-label { flex: 1; }
  .table-menu-check {
    color: var(--accent);
    font-size: 12px;
    flex-shrink: 0;
  }
  .table-menu-sep {
    height: 1px;
    background: linear-gradient(to right, transparent, var(--border), transparent);
    margin: 5px 4px;
  }

  /* Select option editor — small portal card with add/remove flow. */
  .table-options-editor {
    background: rgba(255, 255, 255, 0.96);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    backdrop-filter: saturate(180%) blur(24px);
    border: 1px solid rgba(28, 25, 23, 0.08);
    border-radius: 12px;
    box-shadow:
      0 2px 4px rgba(28, 25, 23, 0.04),
      0 10px 24px -6px rgba(28, 25, 23, 0.10),
      0 24px 56px -14px rgba(28, 25, 23, 0.20);
    padding: 10px;
    width: 240px;
    animation: tableMenuOpen .2s cubic-bezier(0.32, 0.72, 0, 1);
    transform-origin: top left;
  }
  .table-options-editor-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-3);
    padding: 0 4px 8px;
    font-weight: 600;
  }
  .table-options-editor-list {
    max-height: 200px;
    overflow-y: auto;
    margin-bottom: 6px;
  }
  .table-options-editor-empty {
    font-size: 12px;
    color: var(--text-3);
    padding: 6px 4px 8px;
    font-style: italic;
  }
  .table-options-editor-row {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 4px;
    border-radius: 5px;
    font-size: 13px;
  }
  .table-options-editor-row:hover { background: var(--surface-alt); }
  .table-options-editor-bullet { color: var(--text-3); flex-shrink: 0; }
  .table-options-editor-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .table-options-editor-del {
    background: transparent; border: 0; cursor: pointer;
    color: var(--text-3); font-size: 14px; padding: 2px 6px;
    border-radius: 4px; line-height: 1;
  }
  .table-options-editor-del:hover { color: var(--danger); background: var(--surface-alt); }
  .table-options-editor-add {
    display: flex; gap: 6px;
    padding: 6px 0 4px;
    border-top: 1px solid var(--border);
  }
  .table-options-editor-input {
    flex: 1; min-width: 0;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
    outline: none;
  }
  .table-options-editor-input:focus { border-color: var(--accent); }
  .table-options-editor-add-btn,
  .table-options-editor-done {
    background: var(--accent-soft);
    color: var(--accent-deep);
    border: 1px solid rgba(91, 92, 242, 0.22);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: filter .15s;
  }
  .table-options-editor-add-btn:hover, .table-options-editor-done:hover { filter: brightness(0.96); }
  .table-options-editor-footer {
    display: flex; justify-content: flex-end;
    padding-top: 4px;
  }

  /* End Phase 4 table CSS */

  /* ============ Phase 5: cell range selection ============ */
  /* Tinted background for cells inside the selection rectangle. The
     !important is required because td-num/td-check/td-select rules also
     style background; we want selection to dominate. */
  .block-table td.cell-selected {
    background: linear-gradient(0deg, rgba(91, 92, 242, 0.14), rgba(91, 92, 242, 0.14)) !important;
  }
  .block-table td.cell-selected input.block-table-cell {
    background: transparent;
  }
  /* Anchor cell — slightly stronger fill + an inset accent ring so the
     user can see where their selection started. */
  .block-table td.cell-anchor {
    background: linear-gradient(0deg, rgba(91, 92, 242, 0.22), rgba(91, 92, 242, 0.22)) !important;
    box-shadow: inset 0 0 0 1.5px var(--accent);
  }
  /* While inside a selection range, dim the input border so the cell
     visually merges with the highlight. */
  .block-table td.cell-selected.cell-selected input.block-table-cell:not(:focus) {
    border-color: transparent;
  }

  /* Action-bar spacer pushes the selection-related buttons to the right. */
  .block-table-actions { flex-wrap: wrap; }
  .block-table-actions-spacer { flex: 1; min-width: 8px; }
  .block-table-action-primary {
    background: var(--accent-soft) !important;
    color: var(--accent-deep) !important;
    border-color: rgba(91, 92, 242, 0.32) !important;
    font-weight: 600;
  }
  .block-table-action-primary:hover { filter: brightness(0.97); }

  /* On mobile the actions bar is tight — let the row wrap and shrink
     padding slightly so all buttons stay visible. */
  @media (max-width: 600px) {
    .block-table-actions { gap: 5px; padding: 5px 6px; }
    .block-table-add { padding: 4px 8px; font-size: 11px; }
  }
  /* End Phase 5 table CSS */

  /* ============ Callout block ============ */
  .block-callout {
    border-left: 4px solid;
    border-radius: var(--radius-md);
    padding: 12px 16px 14px;
    margin: 4px 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-xs);
    animation: popin .25s var(--ease-out);
    transition: box-shadow var(--t-base), transform var(--t-fast);
  }
  .block-callout:hover {
    box-shadow: var(--shadow-sm);
    transform: translateY(-1px);
  }
  .block-callout-info    { border-left-color: #378ADD; background: linear-gradient(90deg, rgba(55, 138, 221, 0.08), transparent 65%); }
  .block-callout-tip     { border-left-color: #16a34a; background: linear-gradient(90deg, rgba(22, 163, 74, 0.08), transparent 65%); }
  .block-callout-warning { border-left-color: #d97706; background: linear-gradient(90deg, rgba(217, 119, 6, 0.08), transparent 65%); }
  .block-callout-danger  { border-left-color: #c1302b; background: linear-gradient(90deg, rgba(193, 48, 43, 0.08), transparent 65%); }
  .block-callout-quote   { border-left-color: #7F77DD; background: linear-gradient(90deg, rgba(127, 119, 221, 0.08), transparent 65%); }
  .block-callout-note    { border-left-color: #57534e; background: linear-gradient(90deg, rgba(87, 83, 78, 0.08), transparent 65%); }
  .block-callout-head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
  }
  .block-callout-icon { font-size: 15px; line-height: 1; }
  .block-callout-info    .block-callout-icon { color: #378ADD; }
  .block-callout-tip     .block-callout-icon { color: #16a34a; }
  .block-callout-warning .block-callout-icon { color: #d97706; }
  .block-callout-danger  .block-callout-icon { color: #c1302b; }
  .block-callout-quote   .block-callout-icon { color: #7F77DD; }
  .block-callout-note    .block-callout-icon { color: #57534e; }
  .block-callout-kind-select {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-2);
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 4px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
  }
  .block-callout-kind-select:hover {
    background: var(--surface-alt);
    border-color: var(--border);
  }
  .block-callout-kind-select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .block-callout-body { font-size: 13.5px; line-height: 1.55; color: var(--text); }
  .block-callout-input {
    width: 100%;
    border: 0;
    background: transparent;
    padding: 2px 0;
    outline: none;
    font-family: inherit;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text);
    resize: none;
    min-height: 1.55em;
  }
  .block-callout-rendered {
    cursor: text;
    min-height: 1.55em;
    word-break: break-word;
  }
  .block-callout-quote .block-callout-body {
    font-style: italic;
    color: var(--text-2);
  }

  /* ============ Image block ============ */
  .block-image {
    position: relative;
    border-radius: var(--radius-md);
    overflow: hidden;
    background: var(--surface-alt);
    margin: 4px 0;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    animation: popin .3s var(--ease-out);
    transition: box-shadow var(--t-base), transform var(--t-fast);
  }
  /* Phase 6: image + diagram blocks accept an optional width % so the user
     can shrink them when they want a thumbnail rather than a hero image.
     The wrap sets the rendered width; the inner block fills it. Default
     stays 100% so existing images are unchanged. */
  .block-resizable-wrap {
    position: relative;
    width: var(--block-width, 100%);
    max-width: 100%;
    transition: width .12s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .block-resizable-wrap.is-resizing {
    transition: none;
  }
  /* Corner resize handle — bottom-right grab spot. Hidden until the user
     hovers the block; always faintly visible on touch devices for
     discoverability. */
  .block-resize-handle {
    position: absolute;
    right: -4px;
    bottom: -4px;
    width: 18px;
    height: 18px;
    background: var(--accent);
    border: 2px solid var(--surface);
    border-radius: 50%;
    cursor: nwse-resize;
    z-index: 5;
    opacity: 0;
    transition: opacity .15s, transform .15s;
    touch-action: none;
    box-shadow: 0 1px 4px rgba(28, 25, 23, 0.18);
  }
  .block-resizable-wrap:hover .block-resize-handle { opacity: 0.85; }
  .block-resize-handle:hover { opacity: 1 !important; transform: scale(1.1); }
  .block-resize-handle.is-active { opacity: 1; transform: scale(1.15); }
  /* Width indicator floats above the handle while dragging. */
  .block-resize-indicator {
    position: absolute;
    right: 24px;
    bottom: -2px;
    background: rgba(28, 25, 23, 0.86);
    color: #fff;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    pointer-events: none;
    z-index: 6;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(28, 25, 23, 0.20);
  }
  body.block-resizing,
  body.block-resizing * {
    cursor: nwse-resize !important;
    user-select: none !important;
  }
  @media (hover: none) {
    .block-resize-handle { opacity: 0.4; }
  }
  /* Tiny toast-style confirmation when copy-as-image succeeds. */
  .block-image-toast {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(28, 25, 23, 0.92);
    color: #fff;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    pointer-events: none;
    z-index: 8;
    animation: imageToastIn .25s ease-out;
  }
  @keyframes imageToastIn {
    from { opacity: 0; transform: translate(-50%, 4px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }
  .block-image:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .block-image img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 600px;
    object-fit: contain;
    background: #fafaf9;
  }
  .block-image-actions {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    gap: 5px;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity var(--t-fast), transform var(--t-fast);
  }
  .block-image:hover .block-image-actions {
    opacity: 1;
    transform: translateY(0);
  }
  .block-image-btn {
    background: rgba(28, 25, 23, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: white;
    border: none;
    padding: 6px 11px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--t-fast);
    letter-spacing: -0.003em;
  }
  .block-image-btn:hover {
    background: rgba(28, 25, 23, 0.95);
    transform: translateY(-1px);
  }
  .block-image-btn-danger:hover { background: var(--danger); }
  .block-image-empty {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px 18px;
    border: 1.5px dashed var(--border-strong);
    border-radius: 10px;
    background: var(--surface-alt);
    cursor: pointer;
    transition: all .15s;
    margin: 4px 0;
  }
  .block-image-empty:hover, .block-image-empty:focus-visible {
    border-color: var(--accent);
    background: var(--accent-soft);
    outline: none;
  }
  .block-image-empty-icon { font-size: 28px; line-height: 1; }
  .block-image-empty-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 13px;
    color: var(--text-2);
  }
  .block-image-empty-text strong { color: var(--text); font-weight: 500; }
  .block-image-empty-hint { font-size: 11px; color: var(--text-3); }
  .block-image-error {
    margin-top: 6px;
    padding: 6px 10px;
    background: var(--danger-soft);
    color: var(--danger);
    border-radius: 5px;
    font-size: 12px;
  }
  @media (max-width: 800px) {
    .block-image img { max-height: 420px; }
    .block-image-actions { opacity: 1; }
    .block-image-empty { padding: 16px 14px; gap: 10px; }
    .block-image-empty-icon { font-size: 22px; }
  }

  /* ============ Block delete buttons (structured blocks) ============ */
  /* Generic floating × that sits in the top-right corner of structured blocks
     like table, callout, image-empty. Shows on hover (always on mobile). */
  .block-delete-btn {
    background: transparent;
    border: 0;
    color: var(--text-3);
    font-size: 18px;
    line-height: 1;
    width: 24px;
    height: 24px;
    border-radius: 5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all .15s ease;
    padding: 0;
  }
  .block-delete-btn:hover {
    background: var(--danger-soft);
    color: var(--danger);
  }
  /* Floating overlay variant — absolute-positioned in top-right of the block */
  .block-delete-table, .block-delete-callout, .block-delete-image-empty {
    position: absolute;
    top: 6px;
    right: 6px;
    opacity: 0;
    z-index: 2;
  }
  .block-table-wrap { position: relative; }
  .block-callout { position: relative; }
  .block-image-empty { position: relative; }
  .block-table-wrap:hover .block-delete-table,
  .block-callout:hover .block-delete-callout,
  .block-image-empty:hover .block-delete-image-empty {
    opacity: 0.85;
  }
  .block-delete-table:hover, .block-delete-callout:hover, .block-delete-image-empty:hover {
    opacity: 1 !important;
  }
  /* Inline variant — sits in the toolbar of math/code/diagram */
  .block-delete-inline {
    font-size: 16px;
    width: 22px;
    height: 22px;
    opacity: 0.4;
  }
  .block-math:hover .block-delete-inline,
  .block-code:hover .block-delete-inline,
  .diagram-block:hover .block-delete-inline {
    opacity: 0.75;
  }
  .block-delete-inline:hover {
    opacity: 1 !important;
  }
  .block-delete-math {
    margin-left: auto;
  }
  .block-delete-code {
    position: absolute;
    top: 4px;
    right: 4px;
    z-index: 2;
  }
  .block-code { position: relative; }
  /* On mobile, always show the delete buttons so they're discoverable */
  @media (max-width: 800px) {
    .block-delete-table, .block-delete-callout, .block-delete-image-empty {
      opacity: 0.65;
    }
    .block-delete-inline {
      opacity: 0.65;
    }
  }

  /* Slash menu */
  .slash-menu {
    position: absolute; z-index: 60;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    padding: 6px;
    min-width: 250px; max-height: 320px;
    overflow-y: auto;
    animation: popin .18s var(--ease-out);
    transform-origin: top left;
  }
  .slash-item {
    display: flex; align-items: center; gap: 11px;
    padding: 8px 11px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    background: transparent; border: 0;
    width: 100%; text-align: left;
    font-size: 13px; color: var(--text);
    transition: all var(--t-fast);
    letter-spacing: -0.005em;
    position: relative;
  }
  .slash-item:hover { background: var(--surface-alt); }
  .slash-item.focused {
    background: var(--accent-soft);
    color: var(--accent-deep);
    transform: translateX(2px);
  }
  .slash-item.focused::before {
    content: ""; position: absolute;
    left: 0; top: 8px; bottom: 8px;
    width: 2px;
    background: var(--accent);
    border-radius: 0 2px 2px 0;
  }
  .slash-icon {
    width: 30px; height: 30px;
    border-radius: 7px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-alt);
    color: var(--text-2);
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-size: 12px; font-weight: 600;
    border: 1px solid var(--border);
    transition: all var(--t-fast);
  }
  .slash-item.focused .slash-icon {
    background: linear-gradient(135deg, var(--surface), var(--accent-soft));
    border-color: var(--accent-ring);
    color: var(--accent-deep);
    box-shadow: var(--shadow-xs);
  }
  .slash-item-text { flex: 1; min-width: 0; }
  .slash-item-name { font-weight: 600; }
  .slash-item-desc {
    font-size: 11.5px; color: var(--text-3);
    margin-top: 2px;
    font-weight: 400;
    letter-spacing: -0.003em;
  }
  .slash-item.focused .slash-item-desc { color: var(--accent-deep); opacity: 0.65; }
  .slash-item-key {
    font-size: 10.5px; color: var(--text-3);
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-weight: 500;
  }
  .slash-section-label {
    font-size: 9.5px; font-weight: 700;
    color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 7px 11px 4px;
  }

  /* Add-block button (between blocks on hover) */
  .add-block-row {
    height: 4px; margin: 0; position: relative;
    transition: height var(--t-fast);
  }
  .add-block-row:hover { height: 24px; }
  .add-block-btn {
    position: absolute; left: 22px; right: 0; top: 50%; transform: translateY(-50%);
    height: 18px; background: transparent; border: 0;
    display: none; align-items: center; gap: 7px;
    font-size: 11px; color: var(--text-3); cursor: pointer;
    transition: color var(--t-fast);
    animation: fade .2s var(--ease-out);
    font-weight: 500;
  }
  .add-block-row:hover .add-block-btn { display: flex; }
  .add-block-btn::before {
    content: ""; flex-shrink: 0; width: 16px; height: 16px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 4px;
    transition: all var(--t-fast);
    background-image: linear-gradient(currentColor, currentColor), linear-gradient(currentColor, currentColor);
    background-size: 8px 1.5px, 1.5px 8px;
    background-position: center;
    background-repeat: no-repeat;
  }
  .add-block-btn:hover { color: var(--accent); }
  .add-block-btn:hover::before {
    background-color: var(--accent-soft);
    border-color: var(--accent-ring);
  }

  /* Block-level animation when newly inserted via slash menu or enter */
  .block {
    animation: block-in 0.22s var(--ease-out);
  }
  @keyframes block-in {
    0%   { opacity: 0; transform: translateY(-2px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  /* Block handle hover refined */
  .block-handle {
    transition: opacity var(--t-fast), color var(--t-fast), transform var(--t-fast);
  }
  .block-handle:hover {
    transform: scale(1.15);
  }

  /* ============================================================
     WORKSPACE LAYOUT (Stage 2) — sidebar + main pane
     ============================================================ */
  .workspace { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 20px; margin-top: 14px; align-items: flex-start; }
  .ws-main { min-width: 0; }

  /* Sidebar — desktop */
  .ws-sidebar {
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-warm) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 10px;
    position: sticky; top: 16px;
    max-height: calc(100vh - 32px); overflow-y: auto;
    box-shadow: var(--shadow-xs);
  }
  .ws-section-label {
    font-size: 10px; font-weight: 700;
    color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 6px 10px 6px;
  }
  .ws-tree { display: flex; flex-direction: column; gap: 1px; }
  .ws-collection-row {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer; font-size: 13px;
    color: var(--text);
    transition: background var(--t-fast), color var(--t-fast);
    user-select: none; min-width: 0;
    font-weight: 500;
    letter-spacing: -0.005em;
  }
  .ws-collection-row:hover { background: var(--surface-alt); }
  .ws-collection-row.selected {
    background: var(--accent-soft);
    color: var(--accent-deep);
    font-weight: 600;
  }
  .ws-collection-row.selected .ws-coll-icon { color: var(--accent-deep); }
  .ws-collection-row.drag-target { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .ws-caret {
    width: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.5;
    transition: transform var(--t-fast);
    font-size: 9px;
  }
  .ws-caret.expanded { transform: rotate(90deg); }
  .ws-caret.empty { opacity: 0; pointer-events: none; }
  .ws-coll-icon { width: 16px; height: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .ws-coll-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-coll-count {
    font-size: 11px; color: var(--text-3);
    font-feature-settings: 'tnum' 1; opacity: 0.7;
    flex-shrink: 0; font-weight: 500;
  }
  .ws-collection-row.selected .ws-coll-count { color: var(--accent-deep); opacity: 0.8; }
  .ws-collection-children { padding-left: 14px; display: flex; flex-direction: column; gap: 1px; border-left: 1px solid var(--border); margin-left: 14px; }
  .ws-collection-actions { opacity: 0; display: flex; gap: 1px; flex-shrink: 0; transition: opacity var(--t-fast); }
  .ws-collection-row:hover .ws-collection-actions { opacity: 1; }
  .ws-coll-action {
    padding: 3px 5px; background: transparent; border: 0;
    color: var(--text-3); border-radius: 4px; cursor: pointer;
    transition: all var(--t-fast);
    display: flex; align-items: center;
  }
  .ws-coll-action:hover { background: var(--surface); color: var(--text); }
  .ws-coll-action.danger:hover { color: var(--danger); background: var(--danger-soft); }
  .ws-new-collection { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
  .ws-new-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 10px; width: 100%;
    background: transparent;
    border: 1.5px dashed var(--border-strong);
    border-radius: var(--radius-sm);
    cursor: pointer; font-size: 12.5px;
    color: var(--text-3);
    transition: all var(--t-fast);
    font-weight: 500;
  }
  .ws-new-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
    border-style: solid;
  }
  .ws-empty-hint { font-size: 11.5px; color: var(--text-3); padding: 10px; font-style: italic; line-height: 1.5; }

  /* ============================================================
     MOBILE — sidebar becomes a horizontal pill rail
     Uses display:contents to flatten nested wrappers so every
     .ws-collection-row becomes a direct flex item.
     ============================================================ */
  @media (max-width: 800px) {
    .workspace { grid-template-columns: 1fr; gap: 12px; }

    .ws-sidebar {
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 0;
      position: static;
      max-height: none;
      overflow: visible;
    }
    .ws-sidebar-inner {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 2px 0 6px;
    }

    /* Dissolve all structural wrappers so every collection row
       becomes a direct sibling inside .ws-sidebar-inner */
    .ws-tree,
    .ws-tree-item,
    .ws-collection-children {
      display: contents;
    }
    /* If a browser doesn't support display:contents, fall back to keeping them inline */
    @supports not (display: contents) {
      .ws-tree, .ws-tree-item { display: inline-flex; gap: 6px; }
      .ws-collection-children { display: none !important; }
    }

    .ws-section-label,
    .ws-empty-hint,
    .ws-collection-actions { display: none !important; }
    .ws-caret { display: none !important; }
    /* On mobile, hide nested collection children — flat rail only */
    .ws-collection-children { display: none !important; }
    /* Show "New collection" as an inline pill at the end of the rail */
    .ws-new-collection {
      flex: 0 0 auto;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
    }
    .ws-new-collection .ws-new-btn {
      padding: 8px 14px;
      min-height: 38px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px dashed var(--border-strong);
      background: transparent;
      color: var(--text-2);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
    }
    .ws-new-collection .ws-new-btn:hover { background: var(--surface); color: var(--text); }

    .ws-collection-row {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      min-height: 38px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      white-space: nowrap;
      font-size: 13px;
      scroll-snap-align: start;
      transition: background .15s, border-color .15s, color .15s;
    }
    .ws-collection-row:active { transform: scale(0.97); }
    .ws-collection-row.selected {
      background: var(--text);
      color: white;
      border-color: var(--text);
    }
    .ws-collection-row.selected .ws-coll-icon,
    .ws-collection-row.selected .ws-coll-count { color: white; opacity: 0.95; }
    .ws-collection-row.drag-target {
      box-shadow: 0 0 0 2px var(--accent);
      border-color: var(--accent);
    }
    .ws-coll-count {
      background: var(--surface-alt);
      color: var(--text-3);
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 10.5px;
      min-width: 18px;
      text-align: center;
    }
    .ws-collection-row.selected .ws-coll-count {
      background: rgba(255,255,255,0.18);
      color: white;
    }
  }

  /* iPhone Pro / Pro Max — tighten spacing slightly but keep tap targets */
  @media (max-width: 430px) {
    .ws-collection-row { padding: 9px 12px; font-size: 12.5px; }
    .ws-coll-icon { width: 14px; height: 14px; }
  }

  /* New-collection modal */
  .ws-modal {
    position: fixed; inset: 0;
    background: rgba(28, 25, 23, 0.50);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 60;
    display: flex; align-items: center; justify-content: center;
    animation: fade .2s var(--ease-out);
    padding: 16px;
  }
  .ws-modal-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 22px;
    width: 100%; max-width: 400px;
    animation: popin .25s var(--ease-out);
    box-shadow: var(--shadow-xl);
  }
  .ws-modal-title {
    margin: 0 0 14px;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -0.015em;
  }
  .ws-modal-input {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 10px 13px;
    font-size: 14px;
    outline: none;
    transition: all var(--t-fast);
    font-family: inherit;
    color: var(--text);
    letter-spacing: -0.005em;
  }
  .ws-modal-input:hover { border-color: var(--border-strong); }
  .ws-modal-input:focus { border-color: var(--accent); box-shadow: var(--shadow-focus-ring); }
  .ws-modal-label {
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-3);
    margin: 14px 0 8px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .ws-type-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .ws-type-btn {
    padding: 10px 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all var(--t-fast);
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
    font-size: 10.5px;
    color: var(--text-2);
    font-weight: 500;
    box-shadow: var(--shadow-xs);
  }
  .ws-type-btn:hover {
    border-color: var(--border-strong);
    background: var(--surface-alt);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  .ws-type-btn.selected {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent-deep);
    font-weight: 600;
  }
  .ws-type-btn-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
  .ws-modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .ws-modal-actions button {
    padding: 9px 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-md);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--t-fast);
    box-shadow: var(--shadow-xs);
    letter-spacing: -0.005em;
  }
  .ws-modal-actions button:hover {
    border-color: var(--border-strong);
    background: var(--surface-alt);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  .ws-modal-actions button.primary {
    background: linear-gradient(180deg, var(--text) 0%, #2a2724 100%);
    color: white;
    border-color: var(--text);
    font-weight: 600;
    box-shadow:
      0 1px 2px rgba(28, 25, 23, 0.20),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  .ws-modal-actions button.primary:hover {
    transform: translateY(-1px);
    box-shadow:
      0 4px 10px rgba(28, 25, 23, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.10);
  }
  .ws-modal-actions button.primary:disabled {
    opacity: 0.4; cursor: not-allowed;
    background: var(--text-muted); border-color: var(--text-muted);
    transform: none; box-shadow: none;
  }
  .ws-modal-actions button.primary.danger {
    background: linear-gradient(180deg, var(--danger) 0%, #991818 100%);
    border-color: var(--danger);
    box-shadow:
      0 1px 2px rgba(193, 48, 43, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.10);
  }
  .ws-modal-actions button.primary.danger:hover {
    box-shadow:
      0 4px 10px rgba(193, 48, 43, 0.32),
      inset 0 1px 0 rgba(255, 255, 255, 0.12);
  }
  .ws-modal-text {
    margin: 4px 0 0;
    color: var(--text-2);
    font-size: 13.5px;
    line-height: 1.55;
    letter-spacing: -0.005em;
  }
  .ws-modal-text strong { color: var(--text); font-weight: 600; }

  /* Breadcrumb */
  .ws-breadcrumb { display: flex; align-items: center; gap: 6px; padding: 4px 0 10px; font-size: 12.5px; color: var(--text-2); flex-wrap: wrap; }
  .ws-breadcrumb-item { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; transition: color .12s; }
  .ws-breadcrumb-item:hover { color: var(--text); }
  .ws-breadcrumb-item.current { color: var(--text); font-weight: 500; cursor: default; }
  .ws-breadcrumb-sep { color: var(--text-3); }
  .ws-breadcrumb-actions { display: inline-flex; gap: 4px; margin-left: 8px; }
  .ws-breadcrumb-action {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 9px; font-size: 12px; line-height: 1;
    background: var(--surface); color: var(--text-2);
    border: 1px solid var(--border); border-radius: 999px;
    cursor: pointer; transition: all .12s;
  }
  .ws-breadcrumb-action:hover { background: var(--surface-alt); color: var(--text); border-color: var(--border-strong); }
  .ws-breadcrumb-action.danger:hover { background: #fef2f2; color: var(--danger); border-color: rgba(185,28,28,0.25); }

  /* Note card — draggable affordance */
  .note-card[draggable="true"] { cursor: grab; }
  .note-card[draggable="true"]:active { cursor: grabbing; }
  .note-card.dragging-note { opacity: 0.4; }

  /* ============================================================
     TEMPLATE PICKER (Stage 3)
     ============================================================ */
  .tpl-trigger {
    background: var(--surface); color: var(--text-2);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 9px 13px; font-size: 13px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .15s; cursor: pointer; flex-shrink: 0;
  }
  .tpl-trigger:hover { border-color: var(--border-strong); color: var(--text); background: var(--surface-alt); }
  .tpl-trigger svg { opacity: 0.7; }

  .tpl-modal {
    position: fixed; inset: 0; background: rgba(28, 25, 23, 0.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 60; display: flex; align-items: center; justify-content: center;
    padding: 16px; animation: fade .2s var(--ease-out);
  }
  .tpl-modal-card {
    background: var(--surface);
    border-radius: var(--radius-xl);
    width: 100%; max-width: 760px; max-height: 85vh;
    display: flex; flex-direction: column;
    animation: slideup .28s var(--ease-out);
    overflow: hidden;
    box-shadow: var(--shadow-xl);
  }
  .tpl-modal-header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap;
    background: linear-gradient(180deg, var(--surface-warm) 0%, var(--surface) 100%);
  }
  .tpl-modal-title {
    font-size: 17px; font-weight: 650; margin: 0;
    display: flex; align-items: center; gap: 8px;
    letter-spacing: -0.015em;
  }
  .tpl-modal-close {
    background: transparent; border: 0;
    padding: 6px; cursor: pointer;
    color: var(--text-3);
    border-radius: var(--radius-sm);
    transition: all var(--t-fast);
    display: flex; align-items: center; justify-content: center;
  }
  .tpl-modal-close:hover { background: var(--surface-alt); color: var(--text); }
  .tpl-search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
  .tpl-search {
    width: 100%; padding: 8px 12px 8px 34px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    border-radius: var(--radius-md);
    font-size: 13px; outline: none;
    transition: all var(--t-fast);
    color: var(--text);
  }
  .tpl-search:hover { border-color: var(--border-strong); }
  .tpl-search:focus { background: var(--surface); border-color: var(--accent); box-shadow: var(--shadow-focus-ring); }
  .tpl-search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }

  .tpl-modal-body {
    padding: 14px 18px 18px;
    overflow-y: auto;
    flex: 1;
  }
  .tpl-section-label {
    font-size: 10.5px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin: 14px 0 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .tpl-section-label:first-child { margin-top: 0; }
  .tpl-section-label-type-icon { width: 18px; height: 18px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }

  .tpl-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px;
  }

  .tpl-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 7px; padding: 11px 12px 10px;
    cursor: pointer; transition: all .15s ease;
    text-align: left; display: flex; flex-direction: column; gap: 4px;
    position: relative; overflow: hidden;
  }
  .tpl-card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    pointer-events: none;
  }
  .tpl-card.t-trading::before  { background: #EF9F27; }
  .tpl-card.t-study::before    { background: #7F77DD; }
  .tpl-card.t-coding::before   { background: #378ADD; }
  .tpl-card.t-finance::before  { background: #EAB308; }
  .tpl-card.t-journal::before  { background: #D4537E; }
  .tpl-card.t-health::before   { background: #639922; }
  .tpl-card.t-project::before  { background: #D85A30; }
  .tpl-card.t-general::before  { background: #888780; }
  .tpl-card:hover {
    border-color: var(--border-strong);
    box-shadow: 0 3px 12px rgba(28,25,23, 0.06);
    transform: translateY(-1px);
  }
  .tpl-card:active { transform: scale(0.98); }

  /* ============================================================
     HIDE TEMPLATE controls — small × button in the top-right of each
     template card. Only appears on hover (desktop) or always (touch).
     The wrap div is needed because the card itself is a button — we
     can't nest buttons. The hide button sits absolutely positioned
     over the card.
     ============================================================ */
  .tpl-card-wrap { position: relative; }
  .tpl-card-hide {
    position: absolute;
    top: 6px; right: 6px;
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface);
    color: var(--text-3);
    border: 1px solid var(--border);
    border-radius: 50%;
    font-size: 14px; line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: all var(--t-fast);
    z-index: 2;
    font-family: inherit;
    padding: 0;
  }
  .tpl-card-wrap:hover .tpl-card-hide { opacity: 1; }
  .tpl-card-hide:hover {
    background: var(--danger);
    color: white;
    border-color: var(--danger);
    transform: scale(1.1);
  }
  /* On touch devices (no hover), keep the × always visible so users
     can actually tap it. */
  @media (hover: none) or (pointer: coarse) {
    .tpl-card-hide { opacity: 0.7; }
  }
  /* Hidden section at the bottom of the picker — collapsed by default,
     expandable via toggle. */
  .tpl-hidden-section {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
  }
  .tpl-hidden-toggle {
    background: transparent;
    border: 0;
    color: var(--text-3);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: var(--radius-sm);
    font-family: inherit;
    transition: background var(--t-fast), color var(--t-fast);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tpl-hidden-toggle:hover {
    background: var(--surface-alt);
    color: var(--text);
  }
  .tpl-grid-hidden { margin-top: 10px; }
  .tpl-card-wrap-hidden .tpl-card-dimmed {
    opacity: 0.55;
    pointer-events: none;
  }
  .tpl-card-restore {
    position: absolute;
    top: 6px; right: 6px;
    background: var(--accent);
    color: white;
    border: 0;
    border-radius: var(--radius-sm);
    padding: 4px 10px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all var(--t-fast);
    z-index: 2;
  }
  .tpl-card-restore:hover {
    background: var(--accent-deep);
    transform: translateY(-1px);
  }
  .tpl-card-restore:active {
    transform: translateY(0) scale(0.97);
  }
  .tpl-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding-left: 5px; }
  .tpl-card-name {
    font-size: 13px; font-weight: 600; color: var(--text);
    line-height: 1.3; word-break: break-word; flex: 1;
  }
  .tpl-card-type {
    font-size: 9.5px; font-weight: 500; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 2px 6px; border-radius: 999px; flex-shrink: 0;
    background: var(--surface-alt);
  }
  .tpl-card-desc {
    font-size: 11.5px; color: var(--text-2); line-height: 1.45;
    padding-left: 5px;
  }
  .tpl-card-meta {
    margin-top: 4px; padding-left: 5px;
    font-size: 10.5px; color: var(--text-3);
    display: flex; gap: 8px; align-items: center;
    font-feature-settings: 'tnum' 1;
  }
  .tpl-card-block-types { display: flex; gap: 3px; flex-wrap: wrap; }
  .tpl-card-block-tag {
    font-size: 9px; padding: 1px 5px; border-radius: 3px;
    background: var(--surface-alt); color: var(--text-3);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  .tpl-empty {
    padding: 30px 16px; text-align: center; color: var(--text-3); font-size: 13px;
  }

  /* Inline empty state for an empty typed collection */
  .tpl-inline-suggest {
    background: var(--surface-alt); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 14px 14px 12px;
    margin-bottom: 14px;
  }
  .tpl-inline-header {
    font-size: 12px; color: var(--text-2); margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .tpl-inline-header svg { color: var(--accent); opacity: 0.8; }
  .tpl-inline-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px;
  }
  .tpl-inline-grid .tpl-card { padding: 8px 10px 8px 12px; }
  .tpl-inline-grid .tpl-card-name { font-size: 12px; }
  .tpl-inline-grid .tpl-card-desc { font-size: 10.5px; }
  .tpl-inline-grid .tpl-card-type, .tpl-inline-grid .tpl-card-meta { display: none; }
  .tpl-inline-browse {
    margin-top: 8px; padding: 6px 10px;
    background: transparent; border: 1px dashed var(--border-strong);
    border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--text-3);
    transition: all .15s;
  }
  .tpl-inline-browse:hover { border-color: var(--accent); color: var(--accent); }

  /* ============================================================
     STAGE 4 — CALENDAR CONNECTION
     ============================================================ */

  /* Linked tasks row on each note card */
  .note-linked-tasks {
    display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
    margin-top: 10px; padding-left: 36px;
  }
  @media (max-width: 640px) { .note-linked-tasks { padding-left: 0; } }
  .note-linked-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 4px 3px 9px; border-radius: 999px;
    font-size: 11.5px; line-height: 1.3;
    border: 1px solid;
    transition: all .15s;
  }
  .note-linked-chip.cat-trading  { background: rgba(239, 159, 39, 0.10);  color: #8a5c14; border-color: rgba(239, 159, 39, 0.32); }
  .note-linked-chip.cat-study    { background: rgba(127, 119, 221, 0.10); color: #43408a; border-color: rgba(127, 119, 221, 0.32); }
  .note-linked-chip.cat-build    { background: rgba(55, 138, 221, 0.10);  color: #1e5085; border-color: rgba(55, 138, 221, 0.32); }
  .note-linked-chip.cat-cricket  { background: rgba(29, 158, 117, 0.10);  color: #145e44; border-color: rgba(29, 158, 117, 0.32); }
  .note-linked-chip.cat-social   { background: rgba(212, 83, 126, 0.10);  color: #88334e; border-color: rgba(212, 83, 126, 0.32); }
  .note-linked-chip.cat-health   { background: rgba(99, 153, 34, 0.10);   color: #3f6116; border-color: rgba(99, 153, 34, 0.32); }
  .note-linked-chip.cat-personal { background: rgba(216, 90, 48, 0.10);   color: #84371e; border-color: rgba(216, 90, 48, 0.32); }
  .note-linked-chip.cat-finance  { background: rgba(202, 138, 4, 0.10);    color: #713F12; border-color: rgba(202, 138, 4, 0.32); }
  .note-linked-chip.cat-admin    { background: rgba(136, 135, 128, 0.10); color: #4a4945; border-color: rgba(136, 135, 128, 0.32); }
  .note-linked-chip:hover { box-shadow: 0 1px 3px rgba(28,25,23,0.06); }
  .note-linked-chip svg { opacity: 0.7; flex-shrink: 0; }
  .note-linked-chip-text {
    cursor: pointer;
    max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .note-linked-chip-text:hover { text-decoration: underline; text-decoration-thickness: 1px; }
  .note-linked-unlink {
    background: transparent; border: 0; padding: 2px 4px;
    color: currentColor; opacity: 0.5; cursor: pointer; border-radius: 999px;
    display: flex; align-items: center; transition: all .12s;
  }
  .note-linked-unlink:hover { opacity: 1; background: rgba(0,0,0,0.07); }
  .note-linked-add {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 999px;
    background: transparent; border: 1px dashed var(--border-strong);
    color: var(--text-3); font-size: 11.5px; cursor: pointer;
    transition: all .15s;
  }
  .note-linked-add:hover { border-color: var(--accent); color: var(--accent); border-style: solid; }
  .note-linked-add svg { opacity: 0.7; }

  /* Task picker modal (smaller than template picker) */
  .task-picker-scrim {
    position: fixed; inset: 0; background: rgba(28, 25, 23, 0.45);
    z-index: 70; display: flex; align-items: center; justify-content: center;
    padding: 16px; animation: fade .15s ease-out;
  }
  .task-picker-card {
    background: var(--surface); border-radius: var(--radius-lg);
    width: 100%; max-width: 460px; max-height: 78vh;
    display: flex; flex-direction: column; overflow: hidden;
    animation: slideup .22s ease-out;
  }
  .task-picker-header {
    padding: 14px 16px 10px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .task-picker-title {
    font-size: 14.5px; font-weight: 600; margin: 0;
    display: flex; align-items: center; gap: 7px; color: var(--text);
  }
  .task-picker-title svg { color: var(--accent); }
  .task-picker-body {
    overflow-y: auto; padding: 4px 8px 12px; flex: 1;
  }
  .task-picker-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 10px; border-radius: 6px; cursor: pointer;
    background: transparent; border: 0; text-align: left;
    transition: background .12s;
  }
  .task-picker-item:hover { background: var(--surface-alt); }
  .task-picker-item-icon {
    flex-shrink: 0; width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 5px;
  }
  .task-picker-item-text {
    flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;
  }
  .task-picker-item-title {
    font-size: 13px; color: var(--text); font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .task-picker-item-when {
    font-size: 11px; color: var(--text-3); font-feature-settings: 'tnum' 1;
  }

  /* Active task banner — appears above capture box when a task is "happening" right now */
  .active-task-banner {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 15px;
    margin-bottom: 12px;
    border-radius: var(--radius);
    border: 1px solid;
    font-size: 13px;
    position: relative;
    animation: notein .3s var(--ease-out);
    box-shadow: var(--shadow-sm);
    font-weight: 500;
    letter-spacing: -0.005em;
    overflow: hidden;
  }
  .active-task-banner::before {
    content: ""; position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: currentColor;
    opacity: 0.65;
  }
  /* Phase A: align with the pastel system used across task cards,
     note cards, and metric sheet rows. Pastel fades in from the left,
     deeper on this banner (60%) than note cards (35%) because the
     banner is the most prominent surface — it's announcing "this is
     active right now". Border picks up the brand hue at low alpha;
     ink color stays the brand-deep tone for readability. */
  .active-task-banner.cat-trading  { background: linear-gradient(90deg, #fdf2dc 0%, var(--surface) 60%); border-color: rgba(239, 159, 39, 0.40); color: #6f4a10; }
  .active-task-banner.cat-study    { background: linear-gradient(90deg, #ecebfb 0%, var(--surface) 60%); border-color: rgba(127, 119, 221, 0.40); color: #353170; }
  .active-task-banner.cat-build    { background: linear-gradient(90deg, #e2effa 0%, var(--surface) 60%); border-color: rgba(55, 138, 221, 0.40); color: #18406b; }
  .active-task-banner.cat-cricket  { background: linear-gradient(90deg, #def0e7 0%, var(--surface) 60%); border-color: rgba(29, 158, 117, 0.40); color: #0f4d37; }
  .active-task-banner.cat-social   { background: linear-gradient(90deg, #fbe4ec 0%, var(--surface) 60%); border-color: rgba(212, 83, 126, 0.40); color: #6e293f; }
  .active-task-banner.cat-health   { background: linear-gradient(90deg, #e7f0d8 0%, var(--surface) 60%); border-color: rgba(99, 153, 34, 0.40); color: #324d11; }
  .active-task-banner.cat-personal { background: linear-gradient(90deg, #fbe5da 0%, var(--surface) 60%); border-color: rgba(216, 90, 48, 0.40); color: #6b2c18; }
  .active-task-banner.cat-finance  { background: linear-gradient(90deg, #faefcb 0%, var(--surface) 60%); border-color: rgba(202, 138, 4, 0.40); color: #713F12; }
  .active-task-banner.cat-admin    { background: linear-gradient(90deg, #ededeb 0%, var(--surface) 60%); border-color: rgba(136, 135, 128, 0.40); color: #3d3c39; }
  /* LIVE override — any category goes red. !important is needed
     because the .cat-* selectors above all set background+color, and
     we want is-live to win regardless of which category is also set. */
  .active-task-banner.is-live {
    background: linear-gradient(90deg, #fde2e0 0%, var(--surface) 60%) !important;
    border-color: rgba(193, 48, 43, 0.55) !important;
    color: var(--danger) !important;
    box-shadow:
      0 0 0 1px rgba(193, 48, 43, 0.10),
      0 4px 14px -3px rgba(193, 48, 43, 0.18);
  }
  .active-task-pulse {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
    animation: pulse-dot 1.6s ease-in-out infinite;
    box-shadow:
      0 0 10px currentColor,
      0 0 20px currentColor;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 0.5; transform: scale(0.82); }
    50% { opacity: 1; transform: scale(1.0); }
  }
  .active-task-icon {
    flex-shrink: 0; width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.85;
  }
  .active-task-text {
    flex: 1; min-width: 0;
    display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap;
  }
  .active-task-label {
    font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.06em; opacity: 0.7; font-weight: 500;
  }
  .active-task-title {
    font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .active-task-toggle {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; cursor: pointer; user-select: none;
    opacity: 0.85;
    flex-shrink: 0;
  }
  .active-task-toggle:hover { opacity: 1; }
  .active-task-toggle input { margin: 0; cursor: pointer; accent-color: currentColor; }

  /* Today summary — sharp, decisive dark surface with refined gradient */
  .today-summary {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; margin-bottom: 14px;
    background: linear-gradient(135deg, #1c1917 0%, #2a2724 100%);
    border: 1px solid #1c1917;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all var(--t-base);
    color: rgba(255, 255, 255, 0.94);
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.10),
      0 4px 12px -2px rgba(0, 0, 0, 0.14),
      inset 0 1px 0 rgba(255, 255, 255, 0.07);
    position: relative;
    overflow: hidden;
  }
  /* Sharp accent strip on the left edge */
  .today-summary::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg,
      var(--accent-2) 0%,
      var(--accent) 30%,
      var(--accent-deep) 60%,
      var(--accent) 100%);
    background-size: 100% 300%;
    animation: shimmer-vertical 4s ease-in-out infinite;
  }
  @keyframes shimmer-vertical {
    0%, 100% { background-position: 0% 0%; }
    50%      { background-position: 0% 100%; }
  }
  .today-summary:hover {
    background: #25221f;
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.12),
      0 8px 20px -4px rgba(0, 0, 0, 0.18),
      0 0 0 3px var(--accent-glow),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transform: translateY(-1px);
  }
  .today-summary.is-open {
    background: #0f0d0c;
    border-color: #0f0d0c;
    cursor: default;
    transform: none;
  }
  .today-summary.is-open::before { background: linear-gradient(180deg, var(--accent-2) 0%, var(--accent) 100%); }
  .today-summary.is-open:hover { transform: none; }
  .today-summary-icon {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px;
    border-radius: 7px;
    background: rgba(91, 92, 242, 0.16);
    color: var(--accent-2);
    box-shadow: inset 0 0 0 1px rgba(91, 92, 242, 0.28);
  }
  .today-summary.is-open .today-summary-icon {
    background: rgba(255, 255, 255, 0.10);
    color: white;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
  }
  .today-summary-text {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 2px;
  }
  .today-summary-day {
    font-size: 10.5px; font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.10em;
    color: var(--accent-2);
  }
  .today-summary.is-open .today-summary-day { color: rgba(255, 255, 255, 0.50); }
  .today-summary-stats {
    font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
    font-feature-settings: 'tnum' 1;
    color: white;
    letter-spacing: -0.01em;
  }
  .today-summary-stats .dot-sep { opacity: 0.35; }
  .today-summary-arrow {
    flex-shrink: 0;
    font-size: 16px; opacity: 0.6;
    color: white;
    transition: transform var(--t-fast), opacity var(--t-fast);
  }
  .today-summary:hover .today-summary-arrow { transform: translateX(3px); opacity: 1; }

  /* Note card flash when navigated to from elsewhere (e.g., task sheet) */
  @keyframes highlight-flash-anim {
    0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.0); background: var(--surface); }
    15% { box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.30); background: rgba(99, 102, 241, 0.05); }
    100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.0); background: var(--surface); }
  }
  .note-card.highlight-flash {
    animation: highlight-flash-anim 2.4s ease-out;
  }

  /* ============================================================
     STAGE 8 — Smart pass styles
     ============================================================ */

  /* Inline calculator pill (rendered inside text blocks) */
  .inline-calc {
    display: inline-flex; align-items: baseline; gap: 4px;
    padding: 1px 7px; border-radius: 4px;
    background: rgba(99, 102, 241, 0.07);
    border: 1px solid rgba(99, 102, 241, 0.18);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.92em; line-height: 1.3;
    color: var(--text-2);
  }
  .inline-calc-arrow { color: var(--text-3); opacity: 0.7; }
  .inline-calc-result { color: var(--accent); font-weight: 600; }

  /* Search history dropdown (appears below search input on focus) */
  .search-history-pop {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    padding: 4px; z-index: 30;
    animation: notein .12s ease-out;
  }
  .search-history-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px 4px;
    font-size: 10px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .search-history-clear {
    background: transparent; border: 0; padding: 0;
    font-size: 10px; color: var(--text-3); cursor: pointer;
    text-transform: none; letter-spacing: 0;
  }
  .search-history-clear:hover { color: var(--danger); }
  .search-history-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 6px 10px; background: transparent; border: 0;
    border-radius: 4px; text-align: left; cursor: pointer;
    font-size: 12.5px; color: var(--text-2);
    transition: background .1s;
  }
  .search-history-item:hover { background: var(--surface-alt); color: var(--text); }
  .search-history-item svg { opacity: 0.6; flex-shrink: 0; }
  .search-history-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Saved searches pill bar */
  .saved-searches-bar {
    display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
    margin: 6px 0 4px;
  }
  .saved-search-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px 3px 10px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 11.5px; color: var(--text-2); cursor: pointer;
    transition: all .15s;
  }
  .saved-search-pill:hover { border-color: var(--accent); color: var(--accent); }
  .saved-search-pill.active { background: var(--accent); color: white; border-color: var(--accent); }
  .saved-search-pill.active .saved-search-x { color: rgba(255,255,255,0.7); }
  .saved-search-pill svg { opacity: 0.65; flex-shrink: 0; }
  .saved-search-x {
    display: inline-flex; align-items: center; padding: 1px;
    opacity: 0.4; transition: opacity .12s; margin-left: 2px;
  }
  .saved-search-pill:hover .saved-search-x { opacity: 0.9; }
  .saved-search-add {
    padding: 3px 10px; border-radius: 999px;
    background: transparent; border: 1px dashed var(--border-strong);
    font-size: 11.5px; color: var(--text-3); cursor: pointer;
    transition: all .15s;
  }
  .saved-search-add:hover { border-color: var(--accent); color: var(--accent); border-style: solid; }

  /* Smart suggestion banner (template / recent-task) */
  .smart-suggestion-banner {
    display: flex; align-items: center; gap: 11px;
    padding: 11px 13px;
    margin: 8px 0;
    background: linear-gradient(135deg, var(--accent-soft), rgba(91, 92, 242, 0.04));
    border: 1px solid var(--accent-ring);
    border-radius: var(--radius-md);
    animation: notein .25s var(--ease-out);
    box-shadow: var(--shadow-xs);
  }
  .smart-suggestion-banner.kind-recent-task {
    background: linear-gradient(135deg, rgba(127, 119, 221, 0.10), rgba(127, 119, 221, 0.03));
    border-color: rgba(127, 119, 221, 0.30);
  }
  .smart-suggestion-icon {
    flex-shrink: 0; width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-deep) 100%);
    color: white;
    border-radius: 6px;
    font-size: 13px; font-weight: 700;
    box-shadow:
      0 1px 2px rgba(67, 70, 209, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.20);
  }
  .smart-suggestion-text { flex: 1; min-width: 0; }
  .smart-suggestion-line {
    font-size: 13px; color: var(--text);
    line-height: 1.4;
    font-weight: 500;
    letter-spacing: -0.005em;
    overflow: hidden; text-overflow: ellipsis;
  }
  .smart-suggestion-hint {
    font-size: 11px; color: var(--text-3);
    margin-top: 2px; font-style: italic;
    font-weight: 500;
  }
  .smart-suggestion-accept {
    flex-shrink: 0;
    padding: 6px 13px;
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-deep) 100%);
    color: white;
    border: 0;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--t-fast);
    letter-spacing: -0.005em;
    box-shadow:
      0 1px 2px rgba(67, 70, 209, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.18);
  }
  .smart-suggestion-accept:hover {
    transform: translateY(-1px);
    box-shadow:
      0 4px 10px rgba(67, 70, 209, 0.32),
      inset 0 1px 0 rgba(255, 255, 255, 0.22);
  }
  .smart-suggestion-dismiss {
    flex-shrink: 0;
    background: transparent; border: 0;
    padding: 5px;
    color: var(--text-3); cursor: pointer;
    border-radius: 5px;
    display: flex; align-items: center;
    transition: all var(--t-fast);
  }
  .smart-suggestion-dismiss:hover {
    color: var(--text);
    background: rgba(28, 25, 23, 0.06);
  }

  /* Recently-touched panel — sharp, confident */
  .recently-touched {
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-warm) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-xs);
  }
  .recently-touched-head {
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .recently-touched-label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .recently-touched-list {
    display: flex; flex-direction: column; gap: 2px;
  }
  .recently-touched-item {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 6px 8px;
    background: transparent;
    border: 0;
    border-radius: 5px;
    text-align: left;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-2);
    transition: all var(--t-fast);
    font-weight: 500;
    letter-spacing: -0.005em;
  }
  .recently-touched-item:hover {
    background: var(--surface-alt);
    color: var(--text);
  }
  .recently-touched-item-title {
    flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .recently-touched-item-when {
    flex-shrink: 0;
    font-size: 11px;
    color: var(--text-3);
    font-feature-settings: 'tnum' 1;
    font-weight: 500;
  }

  /* Autocomplete dropdown for #hashtags and [[wiki-links]] inside blocks */
  .inline-autocomplete {
    position: absolute; z-index: 65;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    padding: 5px;
    min-width: 200px; max-width: 280px;
    max-height: 220px; overflow-y: auto;
    animation: popin .15s var(--ease-out);
    transform-origin: top left;
  }
  .inline-autocomplete-head {
    padding: 5px 10px;
    font-size: 9.5px; font-weight: 700;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .inline-autocomplete-item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; width: 100%;
    padding: 6px 10px;
    background: transparent; border: 0;
    border-radius: var(--radius-sm);
    text-align: left; cursor: pointer;
    font-size: 12.5px; color: var(--text);
    transition: background var(--t-fast);
    font-weight: 500;
    letter-spacing: -0.005em;
  }
  .inline-autocomplete-item:hover,
  .inline-autocomplete-item.focused {
    background: var(--accent-soft);
    color: var(--accent-deep);
  }
  .inline-autocomplete-item-text {
    flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .inline-autocomplete-item-count {
    flex-shrink: 0; font-size: 11px;
    color: var(--text-3);
    font-feature-settings: 'tnum' 1;
    font-weight: 500;
  }
  /* Phase 8: type badge prefix on @-mention autocomplete items so the
     user can tell at a glance whether a row is a note, task, or
     recurring item. Each kind gets its own background tint. */
  .inline-autocomplete-badge {
    flex-shrink: 0;
    width: 18px; height: 18px;
    border-radius: 5px;
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 10px;
    line-height: 1;
    margin-right: 7px;
    background: var(--surface-alt);
    color: var(--text-2);
  }
  .inline-autocomplete-badge.ac-badge-note      { background: rgba(91, 92, 242, 0.14);  color: var(--accent-deep); }
  .inline-autocomplete-badge.ac-badge-task      { background: rgba(99, 153, 34, 0.14);  color: #3F5E0E; }
  .inline-autocomplete-badge.ac-badge-recurring { background: rgba(127, 119, 221, 0.14); color: #3F3B82; }

  /* Make sure the search-wrap is positioned for the history popover */
  .notes-search-wrap { position: relative; }

  /* ============================================================
     STAGE 5 — Wiki-links, backlinks, search filter chips
     ============================================================ */
  .wiki-link {
    color: var(--accent); cursor: pointer; font-weight: 500;
    padding: 0 2px; border-radius: 3px;
    background: rgba(99, 102, 241, 0.07);
    border-bottom: 1px solid rgba(99, 102, 241, 0.35);
    transition: all .12s;
  }
  .wiki-link:hover {
    background: rgba(99, 102, 241, 0.16);
    border-bottom-color: var(--accent);
  }
  .wiki-link.wiki-missing {
    color: #c0382b;
    background: rgba(192, 56, 43, 0.06);
    border-bottom: 1px dashed rgba(192, 56, 43, 0.45);
  }
  .wiki-link.wiki-missing:hover { background: rgba(192, 56, 43, 0.14); }

  .search-hit {
    background: rgba(255, 215, 64, 0.45);
    color: inherit;
    padding: 0 1px; border-radius: 2px;
    font-weight: 500;
  }

  /* Backlinks panel */
  .backlinks {
    margin-top: 12px; padding-top: 10px; padding-left: 36px;
    border-top: 1px dashed var(--border);
  }
  @media (max-width: 640px) { .backlinks { padding-left: 0; } }
  .backlinks-label {
    font-size: 10.5px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .backlinks-label svg { opacity: 0.7; }
  .backlinks-list {
    display: flex; flex-wrap: wrap; gap: 5px;
  }
  .backlink-item {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px;
    background: var(--surface-alt); border: 1px solid var(--border);
    color: var(--text-2); font-size: 11.5px; cursor: pointer;
    transition: all .15s;
    max-width: 240px;
  }
  .backlink-item:hover {
    border-color: var(--accent); color: var(--accent);
    background: rgba(99, 102, 241, 0.04);
  }
  .backlink-title {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* Search-filter chip bar */
  .search-filter-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: 4px 0 12px;
    padding: 7px 10px;
    background: var(--accent-soft);
    border: 1px solid rgba(99, 102, 241, 0.22);
    border-radius: var(--radius-sm);
    animation: notein .15s ease-out;
  }
  .search-filter-count {
    font-size: 11.5px; font-weight: 600; color: var(--accent);
    font-feature-settings: 'tnum' 1;
  }
  .search-filter-chips {
    display: inline-flex; flex-wrap: wrap; gap: 4px;
    flex: 1; min-width: 0;
  }
  .search-filter-chip {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 10.5px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-2);
  }
  .search-filter-chip.kind-tag    { color: #355080; }
  .search-filter-chip.kind-cat    { color: #7c4f1c; }
  .search-filter-chip.kind-coll   { color: #145e44; }
  .search-filter-chip.kind-has    { color: #4a4042; }
  .search-filter-chip.kind-after,
  .search-filter-chip.kind-before { color: var(--accent); }
  .search-filter-chip.kind-term   { color: var(--text); font-style: italic; }
  .search-filter-clear {
    background: transparent; border: 0; padding: 2px 8px;
    font-size: 11px; color: var(--text-3); cursor: pointer;
    border-radius: 3px; transition: all .12s;
  }
  .search-filter-clear:hover { color: var(--danger); background: rgba(192, 56, 43, 0.05); }

  /* Search input clear button */
  .notes-search-wrap { position: relative; }
  .notes-search-clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: transparent; border: 0; padding: 4px;
    color: var(--text-3); cursor: pointer; border-radius: 3px;
    display: flex; align-items: center; transition: all .12s;
  }
  .notes-search-clear:hover { color: var(--text); background: var(--surface-alt); }
  .notes-search-wrap input { padding-right: 26px; }

  /* ============================================================
     STAGE 6 — Polish: heatmap, focus, shortcuts, sidebar footer
     ============================================================ */

  /* Activity heatmap */
  .activity-heatmap {
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-warm) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px 12px;
    margin-bottom: 14px;
    position: relative;
    box-shadow: var(--shadow-xs);
  }
  .heatmap-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 10px; margin-bottom: 12px;
    font-size: 11px;
  }
  .heatmap-head-left { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .heatmap-title {
    font-weight: 700;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 0.10em;
    font-size: 10.5px;
  }
  .heatmap-subtitle {
    color: var(--text-3);
    font-size: 11.5px;
    letter-spacing: -0.005em;
    font-weight: 500;
  }
  .heatmap-total {
    color: var(--text-2);
    font-size: 11.5px;
    font-feature-settings: 'tnum' 1;
    text-align: right; white-space: nowrap; flex-shrink: 0;
    font-weight: 500;
  }
  .heatmap-total strong { color: var(--text); font-weight: 700; }
  .heatmap-grid-wrap { display: flex; flex-direction: column; gap: 3px; max-width: 260px; }
  /* Weekday labels along the top (S M T W T F S) */
  .heatmap-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
    font-size: 9.5px; color: var(--text-3);
    letter-spacing: 0.08em; font-weight: 600;
    text-align: center; padding: 0 0 3px;
  }
  /* Outer grid: one column of weeks stacked vertically (4 rows = 4 weeks) */
  .heatmap-grid { display: grid; grid-template-columns: 1fr; gap: 3px; }
  /* Each week row: 7 day cells arranged horizontally */
  .heatmap-col { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }

  /* On narrow screens, the calendar takes full width */
  @media (max-width: 800px) {
    .heatmap-grid-wrap { max-width: 100%; }
  }
  .heatmap-cell {
    aspect-ratio: 1 / 1;
    border-radius: 4px;
    cursor: pointer;
    transition:
      outline-color var(--t-fast),
      transform var(--t-fast),
      box-shadow var(--t-fast),
      background var(--t-fast);
    outline: 1px solid transparent;
    position: relative;
  }
  .heatmap-cell.is-future { cursor: default; opacity: 0.3; }
  .heatmap-cell.is-today {
    outline: 1.5px solid var(--accent);
    outline-offset: 1.5px;
    z-index: 3;
  }
  .heatmap-cell.is-active {
    transform: scale(1.18);
    outline: 1.5px solid var(--text);
    outline-offset: 1px;
    z-index: 2;
  }
  .heatmap-cell.is-armed { outline-color: var(--danger); }
  .heatmap-cell:not(.is-future):hover { transform: scale(1.12); outline-color: var(--text-2); }
  /* Indigo activity palette */
  .heatmap-cell.level-0 {
    background: #ece8de;
    box-shadow: inset 0 0 0 0.5px rgba(28, 25, 23, 0.08);
  }
  .heatmap-cell.level-1 {
    background: rgba(91, 92, 242, 0.22);
    box-shadow: inset 0 0 0 0.5px rgba(91, 92, 242, 0.22);
  }
  .heatmap-cell.level-2 {
    background: rgba(91, 92, 242, 0.45);
    box-shadow: inset 0 0 0 0.5px rgba(67, 70, 209, 0.35);
  }
  .heatmap-cell.level-3 {
    background: rgba(91, 92, 242, 0.72);
    box-shadow: inset 0 0 0 0.5px rgba(67, 70, 209, 0.50);
  }
  .heatmap-cell.level-4 {
    background: var(--accent);
    box-shadow:
      inset 0 0 0 0.5px var(--accent-deep),
      0 1px 2px rgba(91, 92, 242, 0.25);
  }
  .heatmap-foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-top: 10px;
    font-size: 10px; color: var(--text-3);
    flex-wrap: wrap;
  }
  .heatmap-foot-hint { font-style: italic; letter-spacing: -0.003em; flex: 1; min-width: 0; }
  .heatmap-legend {
    display: flex; align-items: center; gap: 4px;
    font-size: 10px; color: var(--text-3);
    flex-shrink: 0; font-weight: 500;
  }
  .heatmap-legend .heatmap-cell { width: 11px; height: 11px; cursor: default; }
  .heatmap-legend-label { letter-spacing: 0.04em; font-weight: 600; }

  /* Sidebar footer (Export + Shortcuts buttons) */
  .ws-sidebar-footer {
    margin-top: 8px;
    border-top: 1px solid var(--border);
    padding-top: 8px;
    display: flex; gap: 4px;
  }
  @media (max-width: 800px) {
    .ws-sidebar-footer {
      /* Keep them accessible on mobile — show inline as small pill buttons */
      display: flex;
      margin-top: 0;
      border-top: 0;
      padding-top: 0;
      padding-left: 4px;
      gap: 6px;
      flex-shrink: 0;
      align-items: center;
    }
    .ws-sidebar-footer .ws-footer-btn {
      flex: 0 0 auto;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11.5px;
      min-height: 32px;
    }
  }
  .ws-footer-btn {
    flex: 1;
    display: inline-flex;
    align-items: center; justify-content: center;
    gap: 6px;
    padding: 7px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 11.5px;
    color: var(--text-2);
    font-weight: 500;
    cursor: pointer;
    transition: all var(--t-fast);
    box-shadow: var(--shadow-xs);
    letter-spacing: -0.005em;
  }
  .ws-footer-btn:hover:not(:disabled) {
    border-color: var(--accent-ring);
    color: var(--accent-deep);
    background: var(--accent-soft);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  .ws-footer-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .ws-footer-btn svg { opacity: 0.75; }

  /* Focus mode overlay */
  .focus-overlay {
    position: fixed; inset: 0; z-index: 75;
    background: rgba(28, 25, 23, 0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    animation: fade .25s var(--ease-out);
    overflow-y: auto;
  }
  .focus-card {
    background: var(--surface);
    width: 100%; max-width: 900px;
    min-height: 60vh; max-height: 92vh;
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-xl);
    display: flex; flex-direction: column;
    animation: slideup .3s var(--ease-out);
    overflow: hidden;
    position: relative;
  }

  /* Toolbar — sticky top with refined depth */
  .focus-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    padding: 11px 18px;
    background: linear-gradient(180deg, var(--surface-warm) 0%, var(--surface-alt) 100%);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .focus-toolbar-left, .focus-toolbar-right {
    display: flex; align-items: center; gap: 4px;
  }
  .focus-toolbar-sep {
    display: inline-block;
    width: 1px; height: 20px;
    background: var(--border-strong);
    margin: 0 6px;
    opacity: 0.7;
  }
  .focus-tool-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-2);
    padding: 7px 11px;
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--t-fast);
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 32px;
    letter-spacing: -0.005em;
    position: relative;
  }
  .focus-tool-btn:hover {
    background: var(--surface);
    border-color: var(--border);
    color: var(--text);
    box-shadow: var(--shadow-xs);
    transform: translateY(-1px);
  }
  .focus-tool-btn:active {
    transform: translateY(0);
    box-shadow: none;
  }
  .focus-tool-btn.is-active {
    background: linear-gradient(135deg, var(--accent-soft), rgba(91, 92, 242, 0.04));
    border-color: var(--accent-ring);
    color: var(--accent-deep);
    font-weight: 600;
    box-shadow: var(--shadow-xs);
  }
  .focus-tool-btn.is-active:hover {
    box-shadow: var(--shadow-sm);
  }
  .focus-tool-btn.focus-tool-danger:hover {
    background: var(--danger-soft);
    color: var(--danger);
    border-color: rgba(193, 48, 43, 0.22);
  }
  .focus-tool-back {
    color: var(--text);
    font-weight: 600;
  }
  .focus-tool-back:hover {
    background: var(--surface);
    border-color: var(--border-strong);
    box-shadow: var(--shadow-sm);
  }
  .focus-tool-close {
    padding: 7px 9px;
  }
  .focus-save-status {
    font-size: 11.5px;
    color: var(--text-3);
    font-feature-settings: 'tnum' 1;
    transition: color var(--t-base);
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    font-weight: 500;
    letter-spacing: -0.005em;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .focus-save-status::before {
    content: ""; width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background var(--t-base), box-shadow var(--t-base);
  }
  .focus-save-status.is-flash {
    color: var(--success);
    background: var(--success-soft);
    font-weight: 600;
    animation: soft-pulse 0.4s var(--ease-spring);
  }
  .focus-save-status.is-flash::before {
    background: var(--success);
    box-shadow: 0 0 8px rgba(22, 163, 74, 0.40);
  }

  /* Meta strip + title area */
  /* Meta strip + title area */
  .focus-meta-strip {
    padding: 20px 36px 6px;
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap;
    animation: fade .35s var(--ease-out) backwards;
    animation-delay: 80ms;
  }
  .focus-meta-line {
    font-size: 11px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.10em;
    font-weight: 600;
    font-feature-settings: 'tnum' 1;
  }
  .focus-meta-dot { color: var(--text-muted); opacity: 0.8; font-weight: 700; }
  .focus-meta-collection {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    color: var(--text-2);
    font-weight: 600;
    letter-spacing: -0.005em;
