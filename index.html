// Instantiate a template's blocks (fresh IDs) with variable expansion.
//
// Supported tokens (Phase 9):
//   {{date}}        → today in user-friendly form ("Sun, 24 May 2026")
//   {{date.iso}}    → today in YYYY-MM-DD
//   {{time}}        → current local time ("18:42")
//   {{day}}         → day of week ("Sunday")
//   {{week_of}}     → Monday of the current week, YYYY-MM-DD
//   {{tomorrow}}    → tomorrow YYYY-MM-DD
//   {{prompt:Label}} → placeholder asking for user input; replaced via the
//                     `prompts` map argument (key = label exactly as
//                     written, value = the user-supplied answer). When
//                     no answer is given, falls back to an empty string.
//   {{cursor}}      → cursor-landing marker; we strip it and remember
//                     which block contained it so BlockEditor can focus
//                     that block after insertion.
//
// Returns { blocks, cursorBlockId } — the second value is the new id
// of the block that contained the {{cursor}} marker, or null if none.
function instantiateTemplate(tpl, prompts) {
  if (!tpl || !tpl.blocks) {
    return {
      blocks: [{
        id: uid(),
        type: "text",
        content: "",
        checked: false
      }],
      cursorBlockId: null
    };
  }
  const now = new Date();
  const pad = n => (n < 10 ? "0" : "") + n;
  const isoDate = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate());
  const friendly = now.toLocaleDateString("en-AU", {
    weekday: "short",
    day: "numeric",
    month: "short",
    year: "numeric"
  });
  const dayName = now.toLocaleDateString("en-AU", {
    weekday: "long"
  });
  const timeStr = pad(now.getHours()) + ":" + pad(now.getMinutes());
  // Week-of-Monday: 0=Sun, 1=Mon... offset back to nearest Monday.
  const dow = now.getDay();
  const mondayOffset = dow === 0 ? -6 : 1 - dow;
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + mondayOffset);
  const weekIso = monday.getFullYear() + "-" + pad(monday.getMonth() + 1) + "-" + pad(monday.getDate());
  const tom = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const tomIso = tom.getFullYear() + "-" + pad(tom.getMonth() + 1) + "-" + pad(tom.getDate());
  const replacements = {
    "{{date}}": friendly,
    "{{date.iso}}": isoDate,
    "{{time}}": timeStr,
    "{{day}}": dayName,
    "{{week_of}}": weekIso,
    "{{tomorrow}}": tomIso
  };
  function expand(text) {
    if (!text) return text;
    let out = text;
    // Static date/time tokens
    Object.keys(replacements).forEach(k => {
      if (out.indexOf(k) !== -1) out = out.split(k).join(replacements[k]);
    });
    // Prompt tokens — {{prompt:Label}}. The label is matched case-
    // sensitively against the supplied prompts map. Missing answers
    // leave an empty placeholder so the user can fill in later.
    out = out.replace(/\{\{prompt:([^}]+)\}\}/g, (_, label) => {
      const ans = prompts && prompts[label.trim()];
      return ans != null ? ans : "";
    });
    return out;
  }
  let cursorBlockId = null;
  const blocks = tpl.blocks.map(b => {
    const id = uid();
    let content = expand(b.content || "");
    // {{cursor}} marker — find first occurrence, record the new block id,
    // and strip the marker so it isn't visible in the final text.
    if (content.indexOf("{{cursor}}") !== -1) {
      if (!cursorBlockId) cursorBlockId = id;
      content = content.split("{{cursor}}").join("");
    }
    return {
      id,
      type: b.type,
      content,
      checked: !!b.checked,
      lang: b.lang || undefined
    };
  });
  return {
    blocks,
    cursorBlockId
  };
}

// Extract the labels of all {{prompt:Label}} tokens in a template.
// Returns an array of unique labels in document order — used by the
// pre-insert dialog to ask the user for each variable before expansion.
function extractTemplatePrompts(tpl) {
  if (!tpl || !tpl.blocks) return [];
  const seen = new Set();
  const out = [];
  for (const b of tpl.blocks) {
    const content = b.content || "";
    const re = /\{\{prompt:([^}]+)\}\}/g;
    let m;
    while ((m = re.exec(content)) !== null) {
      const label = m[1].trim();
      if (!seen.has(label)) {
        seen.add(label);
        out.push(label);
      }
    }
  }
  return out;
}

// Get suggested templates for a collection type (prioritize type-matching, then general/journal as universals)
function suggestedTemplates(collectionType, limit) {
  const out = [];
  const seen = new Set();
  function pushAll(arr) {
    for (let i = 0; i < arr.length; i++) {
      if (!seen.has(arr[i].id)) {
        seen.add(arr[i].id);
        out.push(arr[i]);
      }
    }
  }
  if (collectionType) {
    pushAll(TEMPLATES.filter(t => t.type === collectionType));
  }
  pushAll(TEMPLATES.filter(t => t.type === "general"));
  pushAll(TEMPLATES.filter(t => t.type === "journal"));
  return out.slice(0, limit || 8);
}

// Group templates by type for the "all" view
function templatesByType() {
  const map = {};
  for (let i = 0; i < TEMPLATES.length; i++) {
    const t = TEMPLATES[i];
    if (!map[t.type]) map[t.type] = [];
    map[t.type].push(t);
  }
  return map;
}

function newBlock(type, content) {
  const b = {
    id: uid(),
    type: type || "text",
    content: content == null ? "" : content,
    checked: false
  };
  // Structured blocks get a default data shape on creation
  if (type === "diagram") {
    b.content = JSON.stringify(defaultDiagramData("tree"));

// ============================================================
// Parse pasted text (with markdown patterns) into block array.
// Used when the user pastes multi-line content into a block —
// we split on newlines and detect markdown patterns so the paste
// preserves the original document structure rather than dumping
// everything into one giant paragraph.
// ============================================================

// --- Smart-paste detectors ------------------------------------
// These run BEFORE the line-by-line markdown parser. If one of them can
// confidently turn the whole paste into a single typed block (currently
// only tables), parseTextToBlocks returns that block instead of treating
// the input as prose. Each detector returns null when it isn't confident,
// so a no-match just falls through to the existing markdown parser.

// Markdown table:
//   | h1 | h2 | h3 |
//   |----|----|----|
//   | a  | b  | c  |
// Strict: requires a header row, a separator row of dashes, and at least
// one body row, all enclosed in pipes. Mixed prose around the table
// disqualifies it (the whole paste must be the table).
function detectMarkdownTablePaste(text) {
  const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n").map(l => l.trim()).filter(Boolean);
  if (lines.length < 3) return null;
  for (let i = 0; i < lines.length; i++) {
    if (!/^\|.*\|$/.test(lines[i])) return null;
  }
  // Separator row must be the second non-empty line
  if (!/^\|[\s\-:|]+\|$/.test(lines[1]) || lines[1].indexOf("-") < 0) return null;
  function splitRow(l) {
    return l.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  }
  const headers = splitRow(lines[0]);
  if (headers.length < 1) return null;
  const body = lines.slice(2).map(splitRow).map(row => {
    if (row.length < headers.length) return row.concat(new Array(headers.length - row.length).fill(""));
    if (row.length > headers.length) return row.slice(0, headers.length);
    return row;
  });
  if (body.length === 0) return null;
  const block = newBlock("table");
  block.content = JSON.stringify({
    headers,
    rows: body
  });
  return block;
}

// Tab-separated values (Excel / Google Sheets clipboard):
//   "value\tvalue\tvalue\nvalue\tvalue\tvalue"
// Requires: 2+ rows, ≥ 2 columns, and every row has the same column count.
// The first row is promoted to headers (matching Excel paste convention).
function detectTsvPaste(text) {
  const lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
  while (lines.length > 0 && lines[lines.length - 1] === "") lines.pop();
  if (lines.length < 2) return null;
  const firstCols = lines[0].split("\t").length;
  if (firstCols < 2) return null;
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].split("\t").length !== firstCols) return null;
  }
  const cellRows = lines.map(l => l.split("\t"));
  const headers = cellRows[0];
  const rows = cellRows.slice(1);
  if (rows.length === 0) return null;
  const block = newBlock("table");
  block.content = JSON.stringify({
    headers,
    rows
  });
  return block;
}

// JSON array of plain objects:
//   [{ "ticker": "ORCL", "rr": 2.5 }, { "ticker": "BABA", "rr": 1.8 }]
// Union of keys (in first-seen order) becomes the headers, values become
// cells. Nested objects are stringified rather than expanded — keeps the
// table flat and predictable.
function detectJsonArrayPaste(text) {
  const trimmed = text.trim();
  if (!trimmed.startsWith("[") || !trimmed.endsWith("]")) return null;
  let parsed;
  try {
    parsed = JSON.parse(trimmed);
  } catch (e) {

  const headers = [];
  for (let i = 0; i < parsed.length; i++) {
    const keys = Object.keys(parsed[i]);
    for (let j = 0; j < keys.length; j++) {

        seen[keys[j]] = 1;
        headers.push(keys[j]);

  const rows = parsed.map(obj => headers.map(h => {
    const v = obj[h];
    if (v == null) return "";
    if (typeof v === "object") return JSON.stringify(v);
    return String(v);
  }));

  block.content = JSON.stringify({

  const structured = detectStructuredPaste(text);

  // the code together as a single code block.

        result.push(codeBlock);
        codeBuffer = [];
        codeLang = "";
        inCode = false;
      } else {
        inCode = true;
        codeLang = fenceMatch[1] || "";

      continue;
    }
    if (inCode) {
      codeBuffer.push(raw);
      continue;

    if (!trimmed) continue;

      result.push(newBlock("h1", m[1]));
      continue;
    }
    // H2
    if (m = /^##\s+(.+)$/.exec(trimmed)) {
      result.push(newBlock("h2", m[1]));
      continue;
    }
    // H3
    if (m = /^###\s+(.+)$/.exec(trimmed)) {
      result.push(newBlock("h3", m[1]));
      continue;
    }
    // Checklist (unchecked) — must be checked BEFORE plain bullet
    if (m = /^[-*+]\s+\[\s?\]\s+(.+)$/.exec(trimmed)) {
      const b = newBlock("check", m[1]);
      b.checked = false;
      result.push(b);
      continue;
    }
    // Checklist (checked)
    if (m = /^[-*+]\s+\[x\]\s+(.+)$/i.exec(trimmed)) {
      const b = newBlock("check", m[1]);
      b.checked = true;
      result.push(b);
      continue;
    }
    // Bullet
    if (m = /^[-*+]\s+(.+)$/.exec(trimmed)) {
      result.push(newBlock("bullet", m[1]));
      continue;
    }
    // Numbered list
    if (m = /^\d+[.)]\s+(.+)$/.exec(trimmed)) {
      result.push(newBlock("numbered", m[1]));
      continue;
    }

    if (m = /^>\s+(.+)$/.exec(trimmed)) {
      result.push(newBlock("text", "> " + m[1]));
      continue;

      result.push(newBlock("divider", ""));
      continue;
    }

    result.push(newBlock("text", raw));

  if (inCode && codeBuffer.length > 0) {
    const codeBlock = newBlock("code", codeBuffer.join("\n"));
    if (codeLang) codeBlock.lang = codeLang;
    result.push(codeBlock);
  }

  if (result.length === 0) result.push(newBlock("text", text));
  return result;
}

// --- Markdown → blocks migration (one-way, lossless for our subset) ---
function migrateMarkdownToBlocks(md) {
  if (!md || !md.trim()) return [newBlock("text", "")];
  const blocks = [];
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    // Code fence
    if (/^```/.test(line.trim())) {
      const lang = line.trim().slice(3).trim();
      const codeLines = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i].trim())) {
        codeLines.push(lines[i]);
        i++;
      }
      if (i < lines.length) i++; // skip closing fence
      const codeBlock = newBlock("code", codeLines.join("\n"));
      if (lang) codeBlock.lang = lang;
      blocks.push(codeBlock);
      continue;
    }
    // Headings
    const hMatch = line.match(/^(#{1,3})\s+(.*)$/);
    if (hMatch) {
      blocks.push(newBlock("h" + hMatch[1].length, hMatch[2].trim()));
      i++;
      continue;
    }
    // Checklist
    const cMatch = line.match(/^\s*[-*]\s+\[([ xX])\]\s+(.*)$/);
    if (cMatch) {
      const b = newBlock("check", cMatch[2].trim());
      b.checked = cMatch[1].toLowerCase() === "x";
      blocks.push(b);
      i++;
      continue;
    }
    // Bullet
    const bMatch = line.match(/^\s*[-*]\s+(.*)$/);
    if (bMatch) {
      blocks.push(newBlock("bullet", bMatch[1].trim()));
      i++;
      continue;
    }
    // Numbered
    const nMatch = line.match(/^\s*\d+[\.\)]\s+(.*)$/);
    if (nMatch) {
      blocks.push(newBlock("numbered", nMatch[1].trim()));
      i++;
      continue;
    }
    // Divider
    if (/^---+\s*$/.test(line) || /^\*\*\*+\s*$/.test(line)) {
      blocks.push(newBlock("divider", ""));
      i++;
      continue;
    }
    // Blank line → skip (paragraphs are single-line in our system; multi-line paras get merged)
    if (!line.trim()) {
      i++;
      continue;
    }
    // Paragraph: gather contiguous non-blank, non-special lines
    const paraLines = [line];
    i++;
    while (i < lines.length) {
      const next = lines[i];
      if (!next.trim()) break;
      if (/^```/.test(next.trim())) break;
      if (/^(#{1,3})\s/.test(next)) break;
      if (/^\s*[-*]\s/.test(next)) break;
      if (/^\s*\d+[\.\)]\s/.test(next)) break;
      if (/^---+\s*$/.test(next) || /^\*\*\*+\s*$/.test(next)) break;
      paraLines.push(next);
      i++;
    }
    blocks.push(newBlock("text", paraLines.join(" ").trim()));
  }
  if (blocks.length === 0) blocks.push(newBlock("text", ""));
  return blocks;
}

// Convert blocks back to a markdown string (for search, export, derived title)

        return "# " + b.content;
      case "h2":
        return "## " + b.content;
      case "h3":
        return "### " + b.content;
      case "bullet":
        return "- " + b.content;
      case "numbered":
        return "1. " + b.content;
      case "check":
        return "- [" + (b.checked ? "x" : " ") + "] " + b.content;
      case "code":
        return "```" + (b.lang || "") + "\n" + b.content + "\n```";
      case "math":
        return b.content;
      case "divider":
        return "---";
      case "diagram":

          // Extract text labels from the diagram so they're searchable and exportable
          try {
            const data = JSON.parse(b.content || "{}");
            if (data.kind === "bar") {

              for (const d of data.data || []) lines.push((d.label || "") + ": " + d.value);

          return "[Diagram]";

      case "table":
        {

          try {
            const data = JSON.parse(b.content || "{}");

            const rows = Array.isArray(data.rows) ? data.rows : [];
            const lines = [];
            if (headers.length) lines.push("| " + headers.join(" | ") + " |");
            for (const r of rows) {
              if (Array.isArray(r)) lines.push("| " + r.join(" | ") + " |");
            }
            return lines.join("\n");
          } catch (e) {}
          return "[Table]";
        }
      case "callout":
        {
          try {
            const data = JSON.parse(b.content || "{}");
            const kind = data.kind || "info";
            const text = data.text || "";
            return "[" + kind + "] " + text;
          } catch (e) {}
          return "[Callout]";
        }
      case "image":
        return "[Image]";
      default:
        return b.content;
    }
  }).filter(s => s != null).join("\n");
}
function deriveTitleFromBlocks(blocks) {
  if (!Array.isArray(blocks)) return "";
  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    const c = (b.content || "").trim();
    if (c) return c.replace(/^#{1,6}\s+/, "").split("\n")[0];
  }
  return "";
}

// --- Math evaluation ---
// Strip $ and commas from numbers, detect leading currency
function evaluateMathExpression(expr, scope) {
  if (typeof math === "undefined") return {
    error: "math library not loaded"
  };
  const trimmed = expr.trim();
  if (!trimmed) return {
    empty: true
  };
  // Detect leading currency symbol(s) anywhere — we strip them, evaluate, and report the most common
  const currencyMatches = trimmed.match(/[$£€¥₹]/g);
  const currency = currencyMatches && currencyMatches.length > 0 ? currencyMatches[0] : null;
  // Clean the expression: strip currency symbols, strip thousands commas inside numbers
  let cleaned = trimmed.replace(/[$£€¥₹]/g, "");
  // Strip commas between digits (1,000 → 1000) but not between args of a function (sin(1, 2))
  cleaned = cleaned.replace(/(\d),(\d{3})\b/g, "$1$2").replace(/(\d),(\d{3})\b/g, "$1$2"); // run twice
  try {
    const result = math.evaluate(cleaned, scope);
    return {
      result,
      currency
    };
  } catch (e) {
    return {
      error: e.message || "invalid"
    };
  }

function formatMathResult(result, currency) {

    // Smart rounding: 6 significant digits, trim trailing zeros
    let s;
    if (Math.abs(result) >= 1e15 || Math.abs(result) > 0 && Math.abs(result) < 1e-4) {
      s = result.toExponential(4);
    } else {
      s = Number(result.toFixed(6)).toString();
    }
    if (currency) {
      // Format with thousands separators, 2 decimals if it looks like money
      const n = Number(result);
      const fixed = Math.abs(n) >= 1 || n === 0 ? n.toFixed(2) : s;
      const withCommas = fixed.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return currency + withCommas;
    }
    return s;
  }
  if (result && typeof result.toString === "function") {
    try {
      return result.toString();
    } catch (e) {
      return String(result);
    }
  }
  return String(result);
}

// --- Math block evaluator (multi-line, with variable scope) ---
function evaluateMathBlock(content) {
  const scope = {};
  const lines = (content || "").split("\n");
  const rendered = [];
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    if (!raw.trim()) {
      rendered.push({
        kind: "blank"
      });
      continue;
    }
    // Comment lines start with # or //
    if (/^\s*(#|\/\/)/.test(raw)) {
      rendered.push({
        kind: "comment",
        text: raw
      });
      continue;
    }
    const {
      result,
      currency,
      error,
      empty
    } = evaluateMathExpression(raw, scope);
    if (empty) {
      rendered.push({
        kind: "blank"
      });
      continue;
    }
    if (error) {
      rendered.push({
        kind: "error",
        expr: raw,
        error
      });
      continue;
    }
    // Detect a single assignment (`x = 5` or `x = total / people`).
    // Excludes equality comparisons (`==`) and chained assigns (`x = y = z`).
    const isAssign = /^\s*[a-zA-Z_]\w*\s*=/.test(raw) && !/=.*=/.test(raw.replace(/==/g, ""));

    // already visible, no point repeating it) from "computed RHS"
    // (e.g. `per_person = total / people` — value is HIDDEN behind the
    // expression and the user wants to see what it evaluated to).
    let rhsLiteral = false;
    if (isAssign) {
      const eqIdx = raw.indexOf("=");
      const rhs = raw.slice(eqIdx + 1).trim();
      // Pure number literal: optional currency, optional sign, digits,
      // optional decimal. Anything with operators/variables doesn't match.
      rhsLiteral = /^[$£€¥₹]?-?\d+(\.\d+)?$/.test(rhs);
    }
    rendered.push({
      kind: "line",
      expr: raw,
      result: formatMathResult(result, currency),
      isAssign,
      rhsLiteral
    });
  }
  return rendered;
}

// --- Code language auto-detect ---
const COMMON_LANGS = ["python", "javascript", "typescript", "java", "rust", "go", "ruby", "bash", "shell", "json", "yaml", "html", "css", "sql", "c", "cpp"];

  if (typeof hljs === "undefined") return null;
  try {

        language: lang,

  } catch (e) {

// --- Inline markdown rendering (only for text/heading/bullet/check/numbered blocks) ---
function renderInline(text, opts) {

  // We greedily grab until whitespace, comma, semicolon, or end of segment.
  // Skip if already inside a wiki-link or other special construct.

    // Skip if it looks like part of an HTML tag/code (defensive)
    if (expr.indexOf('<') !== -1 || expr.indexOf('>') !== -1) return match;
    try {
      const cleaned = expr.replace(/,/g, "").replace(/\$/g, "").replace(/£/g, "").replace(/€/g, "").replace(/¥/g, "").replace(/₹/g, "");
      // Reject if no math operators or function calls
      if (!/[\+\-\*\/\^\(]|sqrt|sin|cos|tan|log|ln|abs|round|floor|ceil/.test(cleaned)) return match;
      const v = math.evaluate(cleaned);
      if (v == null || typeof v === "object" && !v.isUnit) return match;
      let out;
      if (typeof v === "number") {
        if (!isFinite(v)) return match;
        // Money formatting heuristic
        if (/\$|£|€|¥|₹/.test(expr)) {
          const sym = (expr.match(/[\$£€¥₹]/) || ["$"])[0];
          out = sym + v.toFixed(2);
        } else if (Math.abs(v - Math.round(v)) < 1e-9) {
          out = String(Math.round(v));
        } else {
          out = v.toFixed(4).replace(/\.?0+$/, "");
        }
      } else {
        out = String(v);
      }
      return lead + '<span class="inline-calc">=' + expr + ' <span class="inline-calc-arrow">→</span> <span class="inline-calc-result">' + out + '</span></span>';
    } catch (e) {
      return match;
    }
  });

  s = s.replace(/\[\[([^\]\n]{1,100})\]\]/g, function (_, target) {
    const trimmed = target.trim();
    const exists = opts && opts.titleIndex ? !!opts.titleIndex[trimmed.toLowerCase()] : true;
    const cls = "wiki-link" + (exists ? "" : " wiki-missing");
    return '<span class="' + cls + '" data-wiki="' + trimmed.replace(/"/g, "&quot;") + '">' + trimmed + '</span>';
  });

  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

  s = s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

  if (opts && Array.isArray(opts.highlightTerms) && opts.highlightTerms.length > 0) {
    for (let i = 0; i < opts.highlightTerms.length; i++) {
      const term = opts.highlightTerms[i];
      if (!term || term.length < 2) continue;
      const re = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
      s = s.replace(re, '<mark class="search-hit">$1</mark>');
    }
  }
  return s;
}

// --- Slash menu filtering ---

  const q = query.toLowerCase();
  return SLASH_ITEMS.filter(it => {
    if (it.type.indexOf(q) !== -1) return true;
    for (let i = 0; i < it.keywords.length; i++) {
      if (it.keywords[i].indexOf(q) !== -1) return true;
    }
    return false;
  });
}

// Auto-grow textarea hook
