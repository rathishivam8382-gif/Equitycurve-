<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1a1614" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>Week Planner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js" crossorigin></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github.min.css" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    /* Base — warm cream with a touch more yellow than the original
       (#f3f1ea → #f7f4ec). Sits closer to the reference image's
       off-white container without losing the paper feel. */
    --bg: #f7f4ec;
    --bg-tint-warm: #fdfaf2;
    --bg-tint-cool: #f5f2ea;
    --surface: #fffdf7;
    --surface-alt: #f1eee6;
    --surface-warm: #f9f5ea;
    --surface-cool: #f4f1e8;
    --surface-elev: #fffdf7;
    --surface-overlay: rgba(255, 253, 247, 0.78);

    /* Borders */
    --border: rgba(28, 25, 23, 0.10);
    --border-strong: rgba(28, 25, 23, 0.18);
    --border-warm: rgba(120, 88, 40, 0.14);
    --border-focus: rgba(91, 92, 242, 0.50);

    /* Text — true near-black for stronger headlines (#1c1917 → #111) */
    --text: #111111;
    --text-2: #3f3f3f;
    --text-3: #76716a;
    --text-muted: #b8b3aa;

    /* Accent — indigo restored. The brand color across chrome
       (buttons, focus rings, active states, today highlight). */
    --accent: #5b5cf2;
    --accent-2: #7e80f5;
    --accent-deep: #4346d1;
    --accent-soft: rgba(91, 92, 242, 0.085);
    --accent-glow: rgba(91, 92, 242, 0.16);
    --accent-ring: rgba(91, 92, 242, 0.30);

    /* Semantic */
    --danger: #c1302b;
    --danger-soft: rgba(193, 48, 43, 0.08);
    --success: #16a34a;
    --success-soft: rgba(22, 163, 74, 0.08);
    --warning: #d97706;
    --warning-soft: rgba(217, 119, 6, 0.08);

    /* LifeOS pastel palette — flat desaturated tones for content blocks
       (task cards in step 2). Each color has a paired ink token for
       text rendered on top. These do NOT replace per-category colors
       (Trading=orange etc. still applies) — they're a parallel system
       for role-based coloring (positive / focus / calm / warning). */
    --life-green:      #9fd795;
    --life-green-ink:  #123315;
    --life-coral:      #e97873;
    --life-coral-ink:  #3b1110;
    --life-blue:       #84c8e8;
    --life-blue-ink:   #102d3a;
    --life-yellow:     #f2cf6b;
    --life-yellow-ink: #3a2a0c;
    --life-purple:     #9d8cf4;
    --life-purple-ink: #21194a;

    /* Radii — bumped slightly so cards feel a touch softer
       (10 → 12 base, 14 → 16 large). Matches the reference's
       generous rounding without going pillowy. */
    --radius: 12px;
    --radius-sm: 7px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --radius-pill: 999px;

    /* Sharp, architectural shadows — tight blur, deliberate offsets.
       Premium UI uses focused shadows that DEFINE edges, not gauzy halos.
       Each tier has a hairline contact shadow + a tight ambient. */
    --shadow-xs:
      0 1px 1px rgba(28, 25, 23, 0.04),
      inset 0 0 0 0.5px rgba(28, 25, 23, 0.06);
    --shadow-sm:
      0 1px 1px rgba(28, 25, 23, 0.04),
      0 2px 4px -2px rgba(28, 25, 23, 0.06),
      inset 0 0 0 0.5px rgba(28, 25, 23, 0.05);
    --shadow-md:
      0 1px 1px rgba(28, 25, 23, 0.04),
      0 4px 8px -3px rgba(28, 25, 23, 0.08),
      inset 0 0 0 0.5px rgba(28, 25, 23, 0.06);
    --shadow-lg:
      0 2px 2px rgba(28, 25, 23, 0.04),
      0 12px 24px -8px rgba(28, 25, 23, 0.14),
      inset 0 0 0 0.5px rgba(28, 25, 23, 0.06);
    --shadow-xl:
      0 4px 4px rgba(28, 25, 23, 0.04),
      0 24px 48px -16px rgba(28, 25, 23, 0.20),
      inset 0 0 0 0.5px rgba(28, 25, 23, 0.06);
    --shadow-glow-accent: 0 0 0 3px var(--accent-glow);
    --shadow-focus-ring: 0 0 0 3px var(--accent-glow);
    --card-shadow: var(--shadow-sm);

    /* Transition timing — natural ease curves instead of linear */
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --t-fast: 120ms var(--ease-out);
    --t-base: 180ms var(--ease-out);
    --t-slow: 280ms var(--ease-out);

    /* Spacing scale (for new components going forward) */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 48px;

    /* Empty-state panel wash — light milky in light mode. Overridden
       to a near-invisible warm wash in dark (see dark :root). */
    --empty-wash: rgba(255, 255, 255, 0.6);
  }

  /* ============================================================
     DARK MODE — Phase 1: token foundation
     Triggered by iOS / macOS / Android system Dark Mode setting via
     prefers-color-scheme: dark. No app-level toggle (intentional —
     follows the system, matches every modern iOS app).

     Strategy:
       - Background tiers: warm DARK, not pure black. Inverse of the
         cream palette — preserves the same "paper" character.
       - Surfaces sit lighter than bg so cards still elevate.
       - Text: warm off-white, never pure white.
       - Borders: light strokes at low opacity (inverted from
         light-mode's dark strokes).
       - Accent (indigo) bumped slightly brighter — dark surfaces
         absorb saturation so accent needs more pop to feel right.
       - Shadows stay dark (true black) at higher opacity since the
         surface is already dark; the contact shadow is what defines
         the elevation.
       - Inset hairlines flip from dark to light — they're now
         catching the highlight on top of the card edge.
       - Semantic colors (danger, success, warning) brighten slightly.
       - Pastel category fills (--life-* and the .task.cat-* fills)
         are NOT redefined here — they'll come in Phase 2 since each
         needs careful per-category tuning. For now they'll render as
         their cream-mode hues which is bright but legible.

     The :root variable hierarchy is preserved, just remapped — every
     component referencing var(--surface) etc. should work without
     code changes. Components doing inline hardcoded colors (Phase 3
     audit) may still look wrong. ============================================ */
  @media (prefers-color-scheme: dark) {
    :root {
      /* Base — deep warm charcoal. Body goes darker (#141210) so the
         surfaces (#221e1a+) lift clearly above it. The gap between
         --bg and --surface is what creates perceived depth; in the
         first pass it was too small and everything looked flat. */
      --bg: #141210;
      --bg-tint-warm: #18150f;
      --bg-tint-cool: #131216;
      --surface: #221e1a;
      --surface-alt: #2b2620;
      --surface-warm: #29231c;
      --surface-cool: #232020;
      --surface-elev: #2e2922;
      --surface-overlay: rgba(34, 30, 26, 0.86);

      /* Empty-state wash — near-invisible warm sheen on dark (the
         light-mode value was a milky white panel, the #1 eyesore). */
      --empty-wash: rgba(255, 248, 236, 0.02);

      /* Borders — light strokes (low alpha) replace the dark strokes
         used in light mode. These read as quiet edge definition
         against the dark surfaces. */
      --border: rgba(255, 248, 236, 0.10);
      --border-strong: rgba(255, 248, 236, 0.20);
      --border-warm: rgba(255, 220, 150, 0.10);
      --border-focus: rgba(126, 128, 245, 0.55);

      /* Text — warm off-white, never #fff (which feels harsh on dark) */
      --text: #ece6dc;
      --text-2: #bdb6ac;
      --text-3: #847d72;
      --text-muted: #5b554d;

      /* Accent — indigo brightens. Light-mode --accent (#5b5cf2) sits
         on cream and reads well; on dark, we shift to its lighter
         sibling (formerly --accent-2) so it doesn't disappear. */
      --accent: #8587f7;
      --accent-2: #9a9bf9;
      --accent-deep: #6364ef;
      --accent-soft: rgba(133, 135, 247, 0.14);
      --accent-glow: rgba(133, 135, 247, 0.28);
      --accent-ring: rgba(133, 135, 247, 0.45);

      /* Semantic — brighter for dark contrast */
      --danger: #e8514c;
      --danger-soft: rgba(232, 81, 76, 0.16);
      --success: #3ec97a;
      --success-soft: rgba(62, 201, 122, 0.14);
      --warning: #e8a83e;
      --warning-soft: rgba(232, 168, 62, 0.14);

      /* Shadows — true black at higher opacity. The inset hairline
         FLIPS from dark (light-mode highlight on white) to light
         (dark-mode rim-light on dark). This is the difference that
         makes cards feel layered on dark surfaces. */
      --shadow-xs:
        0 1px 1px rgba(0, 0, 0, 0.30),
        inset 0 0 0 0.5px rgba(255, 248, 236, 0.04);
      --shadow-sm:
        0 1px 2px rgba(0, 0, 0, 0.32),
        0 2px 4px -2px rgba(0, 0, 0, 0.20),
        inset 0 0 0 0.5px rgba(255, 248, 236, 0.05);
      --shadow-md:
        0 2px 3px rgba(0, 0, 0, 0.30),
        0 6px 12px -3px rgba(0, 0, 0, 0.30),
        inset 0 0 0 0.5px rgba(255, 248, 236, 0.06);
      --shadow-lg:
        0 4px 6px rgba(0, 0, 0, 0.32),
        0 14px 28px -8px rgba(0, 0, 0, 0.45),
        inset 0 0 0 0.5px rgba(255, 248, 236, 0.06);
      --shadow-xl:
        0 6px 8px rgba(0, 0, 0, 0.34),
        0 28px 52px -16px rgba(0, 0, 0, 0.55),
        inset 0 0 0 0.5px rgba(255, 248, 236, 0.07);
    }

    /* Body background — replace the warm pastel radial gradients
       (which assume a cream base) with a single subtle warm vignette
       that adds depth to the dark surface without looking colored. */
    body {
      background-image:
        radial-gradient(ellipse 1100px 700px at 12% -10%, rgba(255, 215, 130, 0.04), transparent 55%),
        radial-gradient(ellipse 1000px 800px at 100% 110%, rgba(133, 135, 247, 0.05), transparent 50%) !important;
    }

    /* Native form controls (date pickers, time inputs, scrollbars)
       are told to render in dark via the color-scheme property —
       this is the modern way to make them match without per-element
       styling. */
    html { color-scheme: dark; }

    /* --------------------------------------------------------------
       DARK MODE — Phase 2: pastel category fills
       Each of the 9 categories gets a dark-pastel surface + a light-
       pastel ink. The brand mid-tone (used in stripes / icons / focus)
       stays the same — it reads against both cream AND dark cocoa.

       Mapping per category:
         Light pastel bg  →  Dark pastel bg     (L≈15-20%)
         Dark brand ink   →  Light brand ink    (L≈70-75%)
         Border alpha     ↑  (dark needs more opacity to be visible)

       Affects 6 surfaces in one sweep:
         .task                          (full block fill — week grid)
         .note-card                     (left-edge wash, 35% fade)
         .metric-sheet-row              (left-edge wash, 40% fade)
         .cat-*  (generic chips)        (small pill fills)
         .active-task-banner            (left-edge wash, 60% fade)
         .tpl-card.t-*                  (template picker cards)
       -------------------------------------------------------------- */

    /* === Task cards (full pastel block) ===
       Richer than the first pass — more chroma, slightly higher
       luminance so they read as deliberate color, not mud. Each is
       the brand hue at roughly L22 / moderate saturation. */
    .task.cat-trading  { background: #4a3414; border-color: rgba(239, 159, 39, 0.38); }
    .task.cat-study    { background: #2e2c54; border-color: rgba(127, 119, 221, 0.42); }
    .task.cat-build    { background: #16304d; border-color: rgba(55, 138, 221, 0.42); }
    .task.cat-cricket  { background: #143d33; border-color: rgba(29, 158, 117, 0.40); }
    .task.cat-social   { background: #472434; border-color: rgba(212, 83, 126, 0.42); }
    .task.cat-health   { background: #2c4019; border-color: rgba(99, 153, 34, 0.42); }
    .task.cat-personal { background: #4a2817; border-color: rgba(216, 90, 48, 0.42); }
    .task.cat-finance  { background: #41360f; border-color: rgba(234, 179, 8, 0.42); }
    .task.cat-admin    { background: #2f2d30; border-color: rgba(180, 175, 165, 0.26); }

    /* The task card's top white-gloss highlight (::after) becomes a
       quiet light rim instead — needs to be very subtle on dark. */
    .task::after {
      background: linear-gradient(180deg, rgba(255, 248, 236, 0.06), rgba(255, 248, 236, 0)) !important;
    }

    /* === Note cards (left-edge pastel wash) === */
    .note-card.cat-trading  { background: linear-gradient(90deg, #4a3414 0%, var(--surface) 35%); }
    .note-card.cat-study    { background: linear-gradient(90deg, #2e2c54 0%, var(--surface) 35%); }
    .note-card.cat-build    { background: linear-gradient(90deg, #16304d 0%, var(--surface) 35%); }
    .note-card.cat-cricket  { background: linear-gradient(90deg, #143d33 0%, var(--surface) 35%); }
    .note-card.cat-social   { background: linear-gradient(90deg, #472434 0%, var(--surface) 35%); }
    .note-card.cat-health   { background: linear-gradient(90deg, #2c4019 0%, var(--surface) 35%); }
    .note-card.cat-personal { background: linear-gradient(90deg, #4a2817 0%, var(--surface) 35%); }
    .note-card.cat-finance  { background: linear-gradient(90deg, #41360f 0%, var(--surface) 35%); }
    .note-card.cat-admin    { background: linear-gradient(90deg, #2f2d30 0%, var(--surface) 35%); }

    /* === MetricSheet rows (left-edge wash, 40% fade) === */
    .metric-sheet-row.cat-trading  { background: linear-gradient(90deg, #4a3414 0%, var(--surface) 40%); }
    .metric-sheet-row.cat-study    { background: linear-gradient(90deg, #2e2c54 0%, var(--surface) 40%); }
    .metric-sheet-row.cat-build    { background: linear-gradient(90deg, #16304d 0%, var(--surface) 40%); }
    .metric-sheet-row.cat-cricket  { background: linear-gradient(90deg, #143d33 0%, var(--surface) 40%); }
    .metric-sheet-row.cat-social   { background: linear-gradient(90deg, #472434 0%, var(--surface) 40%); }
    .metric-sheet-row.cat-health   { background: linear-gradient(90deg, #2c4019 0%, var(--surface) 40%); }
    .metric-sheet-row.cat-personal { background: linear-gradient(90deg, #4a2817 0%, var(--surface) 40%); }
    .metric-sheet-row.cat-finance  { background: linear-gradient(90deg, #41360f 0%, var(--surface) 40%); }
    .metric-sheet-row.cat-admin    { background: linear-gradient(90deg, #2f2d30 0%, var(--surface) 40%); }

    /* === Generic category chips (legend, QuickAdd preview, today
       card pills, sheet category badges, etc.) — small pills.
       Richer fills + brighter ink so they read crisply, not muddy. */
    .cat-trading  { background: #4a3414; color: #f7c989; }
    .cat-study    { background: #2e2c54; color: #c4c0f5; }
    .cat-build    { background: #16304d; color: #93c4f0; }
    .cat-cricket  { background: #143d33; color: #84d4b3; }
    .cat-social   { background: #472434; color: #f0a8bf; }
    .cat-health   { background: #2c4019; color: #b3d585; }
    .cat-personal { background: #4a2817; color: #f0ad94; }
    .cat-finance  { background: #41360f; color: #f0d178; }
    .cat-admin    { background: #2f2d30; color: #bcbab6; }

    /* === Active task banner (60% pastel fade, brighter ink for the
       most prominent surface) === */
    .active-task-banner.cat-trading  { background: linear-gradient(90deg, #4a3414 0%, var(--surface) 60%); border-color: rgba(239, 159, 39, 0.50); color: #f7c989; }
    .active-task-banner.cat-study    { background: linear-gradient(90deg, #2e2c54 0%, var(--surface) 60%); border-color: rgba(127, 119, 221, 0.50); color: #c4c0f5; }
    .active-task-banner.cat-build    { background: linear-gradient(90deg, #16304d 0%, var(--surface) 60%); border-color: rgba(55, 138, 221, 0.50); color: #93c4f0; }
    .active-task-banner.cat-cricket  { background: linear-gradient(90deg, #143d33 0%, var(--surface) 60%); border-color: rgba(29, 158, 117, 0.50); color: #84d4b3; }
    .active-task-banner.cat-social   { background: linear-gradient(90deg, #472434 0%, var(--surface) 60%); border-color: rgba(212, 83, 126, 0.50); color: #f0a8bf; }
    .active-task-banner.cat-health   { background: linear-gradient(90deg, #2c4019 0%, var(--surface) 60%); border-color: rgba(99, 153, 34, 0.50); color: #b3d585; }
    .active-task-banner.cat-personal { background: linear-gradient(90deg, #4a2817 0%, var(--surface) 60%); border-color: rgba(216, 90, 48, 0.50); color: #f0ad94; }
    .active-task-banner.cat-finance  { background: linear-gradient(90deg, #41360f 0%, var(--surface) 60%); border-color: rgba(234, 179, 8, 0.50); color: #f0d178; }
    .active-task-banner.cat-admin    { background: linear-gradient(90deg, #2f2d30 0%, var(--surface) 60%); border-color: rgba(180, 175, 165, 0.36); color: #bcbab6; }

    /* === Template picker cards (t-* uses templates' own category
       set, with mappings to closest brand pastel) === */
    .tpl-card.t-trading  { background: linear-gradient(90deg, #4a3414 0%, var(--surface-warm) 35%); }
    .tpl-card.t-study    { background: linear-gradient(90deg, #2e2c54 0%, var(--surface-warm) 35%); }
    .tpl-card.t-coding   { background: linear-gradient(90deg, #16304d 0%, var(--surface-warm) 35%); }
    .tpl-card.t-finance  { background: linear-gradient(90deg, #41360f 0%, var(--surface-warm) 35%); }
    .tpl-card.t-journal  { background: linear-gradient(90deg, #472434 0%, var(--surface-warm) 35%); }
    .tpl-card.t-health   { background: linear-gradient(90deg, #2c4019 0%, var(--surface-warm) 35%); }
    .tpl-card.t-project  { background: linear-gradient(90deg, #4a2817 0%, var(--surface-warm) 35%); }
    .tpl-card.t-general  { background: linear-gradient(90deg, #2f2d30 0%, var(--surface-warm) 35%); }

    /* === Task .done state on dark — currently the .done class sets
       opacity: 0.55 which is fine. Title color (var(--text)) is
       inherited so it auto-fixes. */

    /* --------------------------------------------------------------
       DARK MODE — Phase 3: hardcoded-color cleanup
       Catches the elements that hardcode light-assuming colors and
       bypass the token system. Each override here corresponds to a
       spot that looked wrong on dark in Phase 1/2.
       -------------------------------------------------------------- */

    /* Scrollbar thumb — was dark-on-light; flip to light-on-dark. */
    ::-webkit-scrollbar-thumb { background: rgba(255, 248, 236, 0.14); }
    ::-webkit-scrollbar-thumb:hover { background-color: rgba(255, 248, 236, 0.24); }

    /* Count badge inside today-card pills + similar small chips that
       used a dark wash — flip to light wash so the digit is legible. */
    .today-card-cat-pill-count { background: rgba(255, 248, 236, 0.14); }

    /* Decorative sketchy underline under the "Notes" heading — the SVG
       has a hardcoded near-black stroke (%23111111) that vanishes on
       dark. Re-point it to a light cream stroke (%23ece6dc). */
    .notes-header h2 {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 90 6' fill='none' stroke='%23ece6dc' stroke-width='1.6' stroke-linecap='round'><path d='M2 4 C 18 1.2, 36 5, 54 2.5 S 84 4.8, 88 3.4' /></svg>");
    }
    /* Hand-drawn arrow between Today card and dashboard — same fix,
       light stroke, and slightly higher opacity so it reads on dark. */
    .lifeos-arrow {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 36' fill='none' stroke='%23ece6dc' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M4 4 C 8 14, 14 22, 26 26'/><path d='M20 22 L26 26 L23 19'/></svg>");
      opacity: 0.45;
    }

    /* Header title gradient — the light-mode h1 uses a dark-to-grey
       text gradient (#text → #4a4541). On dark that's near-invisible.
       Flip to a light gradient. */
    .header h1 {
      background: linear-gradient(135deg, var(--text) 0%, #b8b1a6 50%, var(--text) 100%);
      -webkit-background-clip: text;
      background-clip: text;
    }

    /* Smart-suggestion hover + any rgba(28,25,23) hover washes →
       light wash. Catches the most common "darken on hover" pattern. */
    .smart-suggestion-dismiss:hover { background: rgba(255, 248, 236, 0.07); }

    /* --------------------------------------------------------------
       DARK MODE — Phase 4: final polish
       Frosted popovers, today-column tint, gloss gradients, and the
       remaining state colors that assumed a light base.
       -------------------------------------------------------------- */

    /* Frosted-glass popovers (category picker, table menu, select
       option editor) hardcode near-opaque WHITE — glaring on dark.
       Repoint to a near-opaque dark surface, keep the blur. */
    .cat-picker,
    .table-menu,
    .table-options-editor {
      background: rgba(42, 38, 34, 0.96) !important;
      border-color: var(--border-strong) !important;
    }

    /* Today column wash hardcodes light-mode indigo rgba(91,92,242).
       Repoint to the (brighter) dark accent via token alpha. */
    .day-col.today {
      background: linear-gradient(180deg,
        rgba(133, 135, 247, 0.12) 0%,
        rgba(133, 135, 247, 0.05) 30%,
        transparent 100%);
    }

    /* Gloss gradients (rgba(255,255,255,0.6)) used as top-edge sheen on
       note cards, capture bar, table header shimmer → light rim at much
       lower alpha so they don't milk-out on dark. */
    .note-card-glow,
    .note-capture-shimmer,
    .table-header-shimmer {
      background: linear-gradient(90deg, transparent, rgba(255, 248, 236, 0.08), transparent) !important;
    }
    .notes-empty-icon {
      background: linear-gradient(180deg, rgba(255, 248, 236, 0.05) 0%, transparent 100%) !important;
    }

    /* TimeStrip ticks were faint white verticals — slightly brighten so
       they remain visible against dark category washes. */
    .time-strip-tick { background: rgba(255, 248, 236, 0.16) !important; }

    /* Inline option / kbd backgrounds that used light fills. */
    .shortcuts-list dt kbd {
      background: var(--surface-alt);
      border-color: var(--border);
      color: var(--text);
    }

    /* Drag ghost — keep it readable; it inherits category fill which is
       now dark-pastel, but add a stronger shadow so it lifts off. */
    .task-drag-ghost {
      box-shadow:
        0 8px 24px -4px rgba(0, 0, 0, 0.55),
        0 2px 6px rgba(0, 0, 0, 0.40) !important;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
    font-size: 14px; line-height: 1.5; overflow-x: hidden;
    /* Crisp text rendering across all platforms */
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11", "ss01";
    -webkit-text-size-adjust: 100%;
  }
  /* Soft warm-to-cool background wash + very subtle paper grain.
     Gives the page atmospheric depth without muddying surfaces. */
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse 1100px 700px at 12% -10%, rgba(255, 232, 188, 0.28), transparent 55%),
      radial-gradient(ellipse 1000px 800px at 100% 110%, rgba(159, 215, 149, 0.06), transparent 50%);
    background-attachment: fixed, fixed;
  }
  /* Native form controls inherit our typography and respect modern color */
  input, button, textarea, select {
    font: inherit;
    color: inherit;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  /* Universal keyboard focus ring. Anywhere we don't override locally,
     a keyboard user gets a clear, accessible accent outline. Mouse and
     touch (:focus without :focus-visible) stay clean. The previous rule
     suppressed all focus indication, which broke keyboard navigation —
     this restores it without affecting pointer interactions. */
  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
  /* Buttons / links: a softer ring that hugs the rounded corners */
  button:focus-visible,
  a:focus-visible,
  [role="button"]:focus-visible,
  [role="checkbox"]:focus-visible,
  [role="tab"]:focus-visible,
  [role="menuitem"]:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px var(--accent-glow), 0 0 0 1.5px var(--accent);
  }
  /* Inputs / textareas / selects: outer ring rather than offset outline */
  input:focus-visible,
  textarea:focus-visible,
  select:focus-visible {
    outline: none;
    /* If a component already supplies its own focus styling (e.g. our
       table cells, the search box), the more-specific rule wins. */
  }
  /* Tabular numerals everywhere that matters for alignment */
  .num, time, .num-tabular { font-feature-settings: "tnum" 1, "cv02", "cv03"; }
  /* Smoother scroll behavior for in-page nav */
  html { scroll-behavior: smooth; }
  /* Selection color matches accent */
  ::selection { background: var(--accent-glow); color: var(--accent-deep); }
  /* Subtle thinner scrollbars (webkit) */
  ::-webkit-scrollbar { width: 10px; height: 10px; }

  /* Visually-hidden utility — content stays available to screen readers
     but is removed from the visual layout. Used on loading announcements,
     icon-only buttons, etc. */
  .visually-hidden {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0);
    white-space: nowrap; border: 0;
  }

  /* ============================================================
     SAVE-ERROR BANNER — appears at the top of the planner if the
     storage write fails (e.g. iOS Safari private mode or full quota).
     Quiet but firm: matches the planner's warm palette, doesn't
     redirect attention with alarming reds, but unmistakably an alert.
     ============================================================ */
  .save-error-banner {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    background: linear-gradient(180deg, #FEF3C7 0%, #FDE68A 100%);
    border: 1px solid #F59E0B;
    border-radius: var(--radius-md);
    color: #78350F;
    box-shadow: var(--shadow-sm);
    animation: notein 0.25s var(--ease-out);
  }
  .save-error-icon {
    flex-shrink: 0;
    font-size: 18px; line-height: 1;
    padding-top: 1px;
    color: #B45309;
  }
  .save-error-body { flex: 1; min-width: 0; line-height: 1.45; }
  .save-error-body strong { display: block; font-weight: 600; font-size: 13px; }
  .save-error-body span { display: block; font-size: 12.5px; color: #78350F; margin-top: 2px; }
  .save-error-close {
    flex-shrink: 0;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    border: 0; border-radius: 6px;
    color: #78350F;
    font-size: 18px; line-height: 1;
    cursor: pointer;
    transition: background var(--t-fast);
  }
  .save-error-close:hover { background: rgba(120, 53, 15, 0.08); }

  /* ============================================================
     MERGE UNDO TOAST — appears at the bottom of the screen after a
     task merge, with an Undo button. Auto-dismisses after 8 seconds.
     ============================================================ */
  .merge-undo-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px 12px 16px;
    background: #1F1F1F;
    color: #FAFAF8;
    border-radius: 12px;
    box-shadow:
      0 10px 28px -6px rgba(0, 0, 0, 0.40),
      0 4px 10px -2px rgba(0, 0, 0, 0.20);
    z-index: 9000;
    max-width: calc(100vw - 32px);
    min-width: 280px;
    animation: undoToastIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    font-size: 13.5px;
  }
  @keyframes undoToastIn {
    from {
      opacity: 0;
      transform: translateX(-50%) translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  }
  .merge-undo-icon {
    flex-shrink: 0;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(91, 92, 242, 0.25);
    color: var(--accent);
    border-radius: 50%;
    font-weight: 700;
    font-size: 15px;
  }
  .merge-undo-body { flex: 1; min-width: 0; line-height: 1.4; }
  .merge-undo-body strong {
    display: block;
    font-weight: 600;
    font-size: 13.5px;
    color: #FAFAF8;
  }
  .merge-undo-body span {
    display: block;
    font-size: 12px;
    color: #BDBDBD;
    margin-top: 1px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 220px;
  }
  .merge-undo-btn {
    flex-shrink: 0;
    background: var(--accent);
    color: white;
    border: 0;
    border-radius: 6px;
    padding: 7px 14px;
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
    font-family: inherit;
    transition: background var(--t-fast), transform var(--t-fast);
  }
  .merge-undo-btn:hover {
    background: var(--accent-deep);
    transform: translateY(-1px);
  }
  .merge-undo-btn:active {
    transform: translateY(0);
  }
  .merge-undo-close {
    flex-shrink: 0;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    border: 0;
    border-radius: 6px;
    color: #888;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    transition: background var(--t-fast), color var(--t-fast);
  }
  .merge-undo-close:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #FAFAF8;
  }
  @media (max-width: 480px) {
    .merge-undo-toast {
      left: 16px;
      right: 16px;
      transform: none;
      min-width: 0;
    }
    @keyframes undoToastIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  }

  /* ============================================================
     LOADING SKELETON — matches the live layout's silhouette so the
     paint-to-content transition feels instant rather than jarring.
     ============================================================ */
  .skeleton {
    position: relative;
    background: linear-gradient(90deg,
      var(--surface-alt) 0%,
      rgba(28, 25, 23, 0.06) 50%,
      var(--surface-alt) 100%);
    background-size: 200% 100%;
    border-radius: 6px;
    animation: skelShimmer 1.4s ease-in-out infinite;
  }
  @keyframes skelShimmer {
    0%   { background-position: 200% 50%; }
    100% { background-position: -200% 50%; }
  }
  .app-loading { padding-top: 6px; }
  .skel-title    { width: 280px; max-width: 70%; height: 42px; margin-left: 22px; border-radius: 8px; }
  .skel-sub      { width: 200px; max-width: 50%; height: 14px; margin: 14px 0 0 22px; }
  .skel-nav      { width: 200px; height: 36px; border-radius: 10px; }
  .skel-quickadd { width: 100%; height: 56px; border-radius: 14px; margin-bottom: 16px; }
  .skel-grid     { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .skel-day      { display: flex; flex-direction: column; padding: 12px 6px; border-right: 1px solid var(--border); }
  .skel-day:last-child { border-right: 0; }
  .skel-day-head { width: 50%; height: 36px; margin: 0 auto 12px; border-radius: 6px; }
  .skel-day-body { width: 100%; height: 220px; border-radius: 8px; }
  @media (max-width: 800px) {
    .skel-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); overflow: hidden; }
    .skel-day-body { height: 180px; }
  }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(28, 25, 23, 0.10);
    border-radius: 10px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: rgba(28, 25, 23, 0.20); background-clip: padding-box; border: 2px solid transparent; }
  button { cursor: pointer; }
  /* Default disabled style — components can override but every button gets
     a sensible baseline so disabled affordances don't depend on remembering
     to add a per-component rule. */
  button[disabled],
  button:disabled,
  [aria-disabled="true"] {
    cursor: not-allowed;
    opacity: 0.5;
  }
  .app { max-width: 1280px; margin: 0 auto; padding: 24px 24px 80px; padding-bottom: calc(80px + env(safe-area-inset-bottom)); overflow-x: clip; }

  .header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; margin-bottom: 24px; flex-wrap: wrap;
    position: relative;
  }
  .header h1 {
    margin: 0;
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -0.04em;
    background: linear-gradient(135deg, var(--text) 0%, #4a4541 50%, var(--text) 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    position: relative; display: inline-block; padding-left: 22px;
    line-height: 1.02;
  }
  .header h1::before {
    content: ""; position: absolute; left: 0; top: 6px; bottom: 6px;
    width: 5px;
    border-radius: 5px;
    background: linear-gradient(180deg,
      var(--accent-2) 0%,
      var(--accent) 30%,
      var(--accent-deep) 60%,
      var(--accent) 100%);
    background-size: 100% 300%;
    animation: shimmer-vertical 5s ease-in-out infinite;
    box-shadow:
      0 0 16px var(--accent-glow),
      0 0 32px rgba(91, 92, 242, 0.10);
  }
  /* Subtle glow halo behind the title */
  .header h1::after {
    content: ""; position: absolute;
    left: 22px; top: 30%; right: 0; bottom: 0;
    background: radial-gradient(ellipse 200px 30px at 0% 50%, rgba(91, 92, 242, 0.10), transparent 70%);
    pointer-events: none; z-index: -1;
  }
  .header .sub {
    margin: 8px 0 0 22px;
    color: var(--text-2);
    font-size: 14px;
    font-weight: 500;
    font-feature-settings: 'tnum' 1, 'cv02', 'cv03';
    letter-spacing: -0.01em;
  }
  .nav-buttons { display: flex; gap: 6px; align-items: center; }
  .data-menu-wrap { position: relative; }
  .data-btn { display: inline-flex; align-items: center; justify-content: center; padding: 0 10px; }
  .data-menu {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 50;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    padding: 7px; min-width: 280px;
    animation: notein .18s var(--ease-out);
  }
  .data-menu-head {
    font-size: 10.5px; font-weight: 700;
    color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 7px 11px 5px;
  }
  .data-menu-item {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 9px 11px; background: transparent; border: 0;
    border-radius: var(--radius-sm); text-align: left; cursor: pointer;
    color: var(--text);
    transition: background var(--t-fast);
    font-weight: 500;
    letter-spacing: -0.005em;
  }
  .data-menu-item:hover { background: var(--surface-alt); }
  .data-menu-icon {
    flex-shrink: 0; width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--accent-soft), rgba(91, 92, 242, 0.04));
    color: var(--accent-deep);
    border-radius: 7px;
    font-size: 15px; font-weight: 600;
    border: 1px solid var(--accent-ring);
  }
  .data-menu-title {
    font-size: 13px; font-weight: 600;
    letter-spacing: -0.005em;
  }
  .data-menu-sub {
    font-size: 11.5px; color: var(--text-3);
    margin-top: 2px;
    font-weight: 400;
  }
  .data-menu-foot {
    padding: 8px 10px 4px; margin-top: 4px;
    border-top: 1px solid var(--border);
    font-size: 10.5px; color: var(--text-3); line-height: 1.45;
  }
  .nav-btn {
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-warm) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 14px;
    font-size: 13px;
    transition: all var(--t-fast);
    min-height: 36px;
    box-shadow: var(--shadow-xs);
    color: var(--text);
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .nav-btn:hover {
    border-color: var(--border-strong);
    background: var(--surface-alt);
    box-shadow: var(--shadow-sm);
    transform: translateY(-1px);
  }
  .nav-btn:active {
    background: var(--surface-alt);
    transform: translateY(0);
    box-shadow: var(--shadow-xs);
  }
  .nav-btn.today {
    font-weight: 700;
    color: var(--accent-deep);
    border-color: var(--accent-ring);
    background: var(--accent-soft);
  }
  .nav-btn.today:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
    box-shadow: var(--shadow-sm);
  }
  /* When already on the current week, the Today button is disabled. Keep
     its accent styling — it's still telling the user "this is the active
     week" — but suppress hover lift and lower its perceived weight so it
     doesn't fight the back/forward chevrons for attention. */
  .nav-btn.today:disabled {
    opacity: 0.7;
    cursor: default;
    transform: none !important;
    box-shadow: var(--shadow-xs);
  }
  .nav-btn.today:disabled:hover {
    background: var(--accent-soft);
    border-color: var(--accent-ring);
    box-shadow: var(--shadow-xs);
    transform: none;
  }

  .quickadd {
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-warm) 100%);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 18px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-xs);
    transition: box-shadow var(--t-base), border-color var(--t-base);
  }
  .quickadd:focus-within {
    box-shadow: var(--shadow-sm);
    border-color: var(--border-strong);
  }
  .qa-row { display: flex; align-items: center; gap: 10px; }
  .qa-icon { width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--accent); }
  .qa-input {
    flex: 1; min-width: 0; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 10px 13px; font-size: 14px; outline: none;
    transition: border-color var(--t-fast), box-shadow var(--t-fast), background var(--t-fast);
    color: var(--text);
    letter-spacing: -0.005em;
  }
  .qa-input:hover { border-color: var(--border-strong); }
  .qa-input:focus { border-color: var(--accent); box-shadow: var(--shadow-focus-ring); background: var(--surface); }
  .qa-input::placeholder { color: var(--text-3); }
  /* iOS Safari auto-zooms when a focused input has font-size < 16px.
     Bump the apparent font-size on small viewports to keep the planner
     calm when the keyboard appears. */
  @media (max-width: 600px) {
    .qa-input { font-size: 16px; }
  }
  .qa-add {
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-deep) 100%);
    color: white; border: none; border-radius: var(--radius-md);
    padding: 10px 18px; font-size: 13px; font-weight: 600;
    transition: all var(--t-fast);
    flex-shrink: 0;
    box-shadow:
      0 1px 2px rgba(67, 70, 209, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      inset 0 -1px 0 rgba(0, 0, 0, 0.08);
    letter-spacing: -0.005em;
  }
  .qa-add:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow:
      0 4px 10px rgba(67, 70, 209, 0.32),
      inset 0 1px 0 rgba(255, 255, 255, 0.22),
      inset 0 -1px 0 rgba(0, 0, 0, 0.08);
  }
  .qa-add:disabled {
    opacity: 0.4; cursor: not-allowed;
    background: var(--text-muted);
    box-shadow: none;
  }
  .qa-add:not(:disabled):active {
    transform: translateY(0) scale(0.98);
    box-shadow:
      0 1px 1px rgba(67, 70, 209, 0.20),
      inset 0 1px 0 rgba(255, 255, 255, 0.10);
  }
  .qa-preview { margin-top: 10px; padding-left: 32px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--text-2); }
  .qa-preview .label { color: var(--text-3); margin-right: 2px; }
  .qa-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 500; line-height: 1.4; }
  .qa-chip svg { opacity: 0.85; }
  /* Clickable category chip in the quickadd preview. Wrap is for positioning
     the dropdown picker; button gets hover/active feedback so it's clearly
     interactive. */
  .qa-chip-wrap { position: relative; display: inline-block; }
  .qa-chip-btn {
    border: 0;
    cursor: pointer;
    font-family: inherit;
    transition: filter var(--t-fast), transform var(--t-fast), box-shadow var(--t-fast);
    box-shadow: var(--shadow-xs);
  }
  .qa-chip-btn:hover {
    filter: brightness(1.04);
    box-shadow: var(--shadow-sm);
    transform: translateY(-0.5px);
  }
  .qa-chip-btn:active { transform: translateY(0); filter: brightness(0.97); }
  .qa-chip-wrap .cat-picker {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 100;
    min-width: 180px;
  }
  .qa-chip-time { background: var(--surface); border: 1px solid var(--border); color: var(--text-2); font-weight: 400; }
  .qa-chip-prio-high { background: #FCEBEB; color: #791F1F; }
  .qa-chip-prio-med { background: #FAEEDA; color: #854F0B; }
  .qa-chip-recur { background: var(--surface); border: 1px solid var(--border); color: var(--text-2); font-weight: 400; }
  .qa-help { margin-top: 8px; padding-left: 32px; font-size: 11.5px; color: var(--text-3); line-height: 1.5; }
  .qa-help code { background: var(--surface); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; font-size: 10.5px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .grid-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  /* Desktop: single grid with 7 column track. Each day-col is one column. */
  /* 21-day continuous strip — 7 prev + 7 current + 7 next days.
     Always a horizontal scroller. On desktop, 7 columns visible at a
     time. On mobile, 3 columns visible. User can scroll back/forth
     freely, and drag-and-drop works across all 21 days. */
  .week-scroll {
    display: flex;
    flex-direction: row;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .week-scroll::-webkit-scrollbar { display: none; }
  .day-col {
    flex: 0 0 calc(100% / 7);
    scroll-snap-align: start;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--border);
    min-width: 0;
    transition: background var(--t-base);
  }
  .day-col:last-child { border-right: 0; }
  .day-col.today {
    background: linear-gradient(180deg,
      rgba(91, 92, 242, 0.08) 0%,
      rgba(91, 92, 242, 0.03) 30%,
      transparent 100%);
  }
  .day-head {
    padding: 12px 6px;
    text-align: center;
    font-size: 11.5px;
    color: var(--text-2);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .day-head .num {
    display: block;
    font-size: 17px;
    color: var(--text);
    font-weight: 600;
    margin-top: 3px;
    letter-spacing: -0.015em;
    font-feature-settings: 'tnum' 1;
  }
  .day-head.today {
    background: linear-gradient(180deg, var(--surface) 0%, var(--accent-soft) 100%);
    color: var(--accent-deep);
    border-bottom-color: var(--accent-ring);
  }
  .day-head.today .num {
    color: var(--accent-deep);
    font-weight: 700;
  }
  .day-cell {
    padding: 8px 5px;
    min-height: 320px;
    display: flex; flex-direction: column; gap: 5px;
    min-width: 0;
    transition: background var(--t-fast), box-shadow var(--t-fast);
    cursor: pointer;
  }
  .day-cell.today { background: transparent; }
  .day-cell.drag-over {
    background: var(--accent-soft);
    box-shadow: inset 0 0 0 2px var(--accent);
  }

  /* Mobile: narrower columns so 3 days fit on a phone screen. */
  @media (max-width: 800px) {
    .grid-wrap { border-radius: var(--radius-lg); }
    .day-col {
      flex: 0 0 33.333%;
    }
    .day-head { font-size: 12px; padding: 11px 4px; }
    .day-head .num { font-size: 16px; }
    /* Replaces a hard-coded 1400px which produced enormous empty scroll
       on phones. Viewport-relative keeps cells tall enough to be a real
       drop target on a phone, but adapts to actual screen height. */
    .day-cell { min-height: min(72vh, 720px); padding: 9px 6px; }
  }
  /* iPhone Pro Max — slightly wider columns so 3 fit comfortably */
  @media (max-width: 430px) {
    .day-col { flex: 0 0 33.333%; }
    .day-head .num { font-size: 15.5px; }
    .day-cell { min-height: min(74vh, 760px); }
  }
  /* Empty-day affordance: a faint dotted outline on day cells with no
     tasks, only visible on hover (desktop) or always on touch. Gives the
     user a quiet "add here" cue without cluttering busy days. */
  .day-cell:empty {
    position: relative;
  }
  .day-cell:empty::after {
    content: "Tap to add";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: var(--text-3);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: -0.005em;
    opacity: 0;
    transition: opacity var(--t-base);
    pointer-events: none;
    white-space: nowrap;
  }
  .day-cell:empty:hover::after { opacity: 0.55; }
  @media (hover: none) {
    .day-cell:empty::after { opacity: 0.35; }
  }

  /* Task block — strong category-coloured left bar, glass sheen, priority dot, celebration */
  .task {
    position: relative;
    padding: 10px 10px 9px 15px;
    border-radius: 12px;
    font-size: 11.5px;
    line-height: 1.35;
    cursor: grab;
    transition:
      transform var(--t-fast),
      opacity var(--t-fast),
      box-shadow var(--t-base),
      border-color var(--t-fast),
      background var(--t-base);
    min-width: 0; overflow: hidden;
    display: flex; gap: 7px; align-items: flex-start;
    border: 1px solid rgba(28, 25, 23, 0.06);
    isolation: isolate;
    background: var(--surface);
    box-shadow:
      0 1px 1.5px rgba(28, 25, 23, 0.05),
      inset 0 1px 0 rgba(255, 255, 255, 0.5);
  }
  .task::before {
    /* Category accent stripe — kept as a quiet emphasis on the left.
       The pastel fill below carries most of the color identity now,
       so the stripe is narrower and quieter than before. */
    content: ""; position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    pointer-events: none; z-index: 1;
    transition: opacity var(--t-fast);
  }
  .task::after {
    /* Subtle top highlight — kept but quieter, no longer competing
       with the pastel fill. */
    content: ""; position: absolute;
    top: 0; left: 4px; right: 0; height: 14px;
    background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0));
    pointer-events: none; z-index: 1;
    border-radius: 0 12px 0 0;
  }

  /* Category pastel fills.
     Each pastel is the brand hue at ~12-15% saturation — soft enough
     that two adjacent tasks of different categories look like a calm
     palette, not a rainbow. Brand-color recognition is preserved.
     The ::before stripe darkens slightly per category for emphasis. */
  .task.cat-trading  { background: #fdf2dc; border-color: rgba(239, 159, 39, 0.22); }
  .task.cat-study    { background: #ecebfb; border-color: rgba(127, 119, 221, 0.22); }
  .task.cat-build    { background: #e2effa; border-color: rgba(55, 138, 221, 0.22); }
  .task.cat-cricket  { background: #def0e7; border-color: rgba(29, 158, 117, 0.22); }
  .task.cat-social   { background: #fbe4ec; border-color: rgba(212, 83, 126, 0.22); }
  .task.cat-health   { background: #e7f0d8; border-color: rgba(99, 153, 34, 0.22); }
  .task.cat-personal { background: #fbe5da; border-color: rgba(216, 90, 48, 0.22); }
  .task.cat-finance  { background: #faefcb; border-color: rgba(234, 179, 8, 0.28); }
  .task.cat-admin    { background: #ededeb; border-color: rgba(136, 135, 128, 0.25); }

  /* LIVE state — pulsing red on the left stripe and a subtle outer
     glow. The card itself stays in its category color so you can
     still parse what kind of task is live. The stripe overrides the
     category color while live, and the ::before pulse loops. */
  .task.is-live {
    border-color: var(--danger);
    box-shadow:
      0 0 0 1px rgba(193, 48, 43, 0.20),
      0 4px 14px -2px rgba(193, 48, 43, 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.55);
  }
  .task.is-live::before {
    background: var(--danger) !important;
    width: 4px;
    animation: task-live-stripe 1400ms ease-in-out infinite;
    box-shadow: 0 0 8px rgba(193, 48, 43, 0.5);
  }
  @keyframes task-live-stripe {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(193, 48, 43, 0.5); }
    50%      { opacity: 0.7; box-shadow: 0 0 6px 2px rgba(193, 48, 43, 0.4); }
  }
  @media (prefers-reduced-motion: reduce) {
    .task.is-live::before { animation: none; }
  }

  .task.cat-trading::before  { background: #EF9F27; }
  .task.cat-study::before    { background: #7F77DD; }
  .task.cat-build::before    { background: #378ADD; }
  .task.cat-cricket::before  { background: #1D9E75; }
  .task.cat-social::before   { background: #D4537E; }
  .task.cat-health::before   { background: #639922; }
  .task.cat-personal::before { background: #D85A30; }
  .task.cat-finance::before  { background: #EAB308; }
  .task.cat-admin::before    { background: #888780; }

  .task:hover {
    box-shadow:
      0 4px 14px rgba(28, 25, 23, 0.10),
      0 1px 2px rgba(28, 25, 23, 0.06),
      inset 0 1px 0 rgba(255, 255, 255, 0.55);
    transform: translateY(-1px);
  }
  .task:active {
    cursor: grabbing;
    transform: scale(0.97);
    box-shadow:
      0 1px 2px rgba(28, 25, 23, 0.06),
      inset 0 1px 0 rgba(255, 255, 255, 0.4);
  }
  .task.dragging { opacity: 0.35; }
  /* Touch-driven drag: the source task fades while the user holds it
     up; the ghost is a fixed-position clone that follows the finger. */
  .task-drag-ghost {
    transform-origin: 0 0;
    box-shadow:
      0 14px 30px -8px rgba(28, 25, 23, 0.40),
      0 4px 10px -2px rgba(28, 25, 23, 0.20),
      0 0 0 1px rgba(91, 92, 242, 0.30);
    opacity: 0.95;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--accent);
    will-change: transform;
    transition: none !important;
  }
  /* While a drag is active globally: block text selection + iOS callout,
     keep grab cursor on desktop. Touch-action is handled by JS
     preventDefault on touchmove, not by CSS — so the user can still
     manually scroll the planner before a drag is engaged. */
  body.task-dragging {
    cursor: grabbing !important;
    user-select: none !important;
    -webkit-user-select: none !important;
    overflow: hidden;
  }
  body.task-dragging .task { cursor: grabbing !important; }

  /* MERGE TARGET — destination task pulses with an accent ring while
     the user is hovering a dragged task over it. Releases the drag
     here triggers the merge. */
  .task.merge-target {
    background: linear-gradient(135deg, var(--accent-soft), var(--surface) 70%) !important;
    border: 2px solid var(--accent) !important;
    box-shadow:
      0 0 0 4px rgba(91, 92, 242, 0.12),
      0 8px 24px -6px rgba(91, 92, 242, 0.35) !important;
    transform: scale(1.04);
    z-index: 5;
    position: relative;
    animation: mergeTargetPulse 1.1s ease-in-out infinite;
  }
  @keyframes mergeTargetPulse {
    0%, 100% {
      box-shadow:
        0 0 0 4px rgba(91, 92, 242, 0.12),
        0 8px 24px -6px rgba(91, 92, 242, 0.35);
    }
    50% {
      box-shadow:
        0 0 0 6px rgba(91, 92, 242, 0.22),
        0 12px 30px -4px rgba(91, 92, 242, 0.50);
    }
  }
  /* A little "+" badge in the top-right corner of the merge target so
     the user knows what releasing here will do. */
  .task.merge-target::after {
    content: "+";
    position: absolute;
    top: -10px;
    right: -10px;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: white;
    border-radius: 50%;
    font-weight: 700;
    font-size: 15px;
    line-height: 1;
    box-shadow: 0 2px 6px rgba(91, 92, 242, 0.5);
    animation: mergeBadgeBounce 1.1s ease-in-out infinite;
  }
  @keyframes mergeBadgeBounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }

  /* JUST-MERGED — the destination task plays this absorb animation
     for ~600ms after a successful merge: bounce + glow + a ring that
     ripples outward + accent-color sparkles bursting from the centre. */
  .task.just-merged {
    animation: mergeAbsorb 600ms cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
  }
  @keyframes mergeAbsorb {
    0% {
      transform: scale(1);
      background: var(--surface);
    }
    25% {
      transform: scale(1.14);
      background: linear-gradient(135deg, var(--accent-soft), var(--surface));
      box-shadow:
        0 0 0 8px rgba(91, 92, 242, 0.20),
        0 14px 34px -4px rgba(91, 92, 242, 0.45);
    }
    60% {
      transform: scale(0.97);
    }
    100% {
      transform: scale(1);
      background: var(--surface);
    }
  }
  /* Ripple ring expanding outward from the task border — like a stone
     dropping into water. Uses ::before so it doesn't conflict with the
     merge-target "+" badge (which uses ::after). */
  .task.just-merged::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    border: 2px solid var(--accent);
    pointer-events: none;
    animation: mergeRipple 0.75s ease-out forwards;
    z-index: 1;
  }
  @keyframes mergeRipple {
    0% {
      transform: scale(1);
      opacity: 0.85;
      border-width: 2px;
    }
    100% {
      transform: scale(1.55);
      opacity: 0;
      border-width: 1px;
    }
  }
  /* Sparkle particles — small accent-colour dots that burst outward
     from the centre of the just-merged task. Spawned in JS via
     buildMergeBurst(), positioned via CSS variables. */
  .merge-spark {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.3);
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    z-index: 4;
    box-shadow: 0 0 6px currentColor;
    animation: mergeSparkFly 0.75s ease-out forwards;
  }
  @keyframes mergeSparkFly {
    0% {
      transform: translate(-50%, -50%) scale(0.3);
      opacity: 1;
    }
    30% {
      transform: translate(calc(-50% + var(--dx) * 0.5), calc(-50% + var(--dy) * 0.5)) scale(1.1);
      opacity: 1;
    }
    100% {
      transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.5);
      opacity: 0;
    }
  }
  /* Suppress iOS copy/paste callout during long-press drag-and-drop —
     this lets HTML5 native drag work cleanly on iOS Safari without
     getting interrupted by the system text-selection menu. */
  .task {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  /* Drop-target highlight — clear, finger-friendly visual when a task
     is hovering over a valid day cell. */
  .day-cell.drag-over {
    background: var(--accent-soft);
    box-shadow:
      inset 0 0 0 2px var(--accent),
      0 0 24px -6px rgba(91, 92, 242, 0.45);
    transition: background 80ms ease-out, box-shadow 80ms ease-out;
  }
  .task .check { flex-shrink: 0; width: 14px; height: 14px; border: 1.5px solid currentColor; border-radius: 50%; margin-top: 1px; opacity: 0.7; display: flex; align-items: center; justify-content: center; transition: background var(--t-fast), opacity var(--t-fast); cursor: pointer; position: relative; z-index: 2; }
  .task .check:hover { opacity: 1; }
  .task .check.done { background: currentColor; opacity: 1; }
  .task .check.done::after { content: ""; width: 6px; height: 3px; border-left: 1.5px solid; border-bottom: 1.5px solid; transform: rotate(-45deg) translate(0px, -1px); color: var(--surface); }
  .task .check.fresh-done { animation: check-pop .55s var(--ease-spring); }
  @keyframes check-pop { 0% { transform: scale(1); } 35% { transform: scale(1.4); } 100% { transform: scale(1); } }
  .task .t-body { flex: 1; min-width: 0; position: relative; z-index: 2; }
  .task .t-time {
    font-weight: 700; display: block;
    font-feature-settings: 'tnum' 1;
    letter-spacing: -0.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 11.5px; line-height: 1.2;
  }
  .task .t-title-row { display: flex; align-items: center; gap: 4px; min-width: 0; margin-top: 2px; }
  .task .t-title-row svg { flex-shrink: 0; opacity: 0.85; }
  .task .t-title {
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis;
    word-break: break-word; white-space: nowrap;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  /* Completed tasks: gently muted, no strikethrough. The pastel fill
     fades back so completed tasks visually recede without looking
     "crossed out and ugly". */
  .task.done {
    opacity: 0.55;
  }
  .task.done .t-time, .task.done .t-title { opacity: 0.85; }
  .task.done::before { opacity: 0.4; }
  .task.done::after { opacity: 0.3; }
  /* Priority dot */
  .task .priority-dot { position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 50%; z-index: 2; pointer-events: none; }
  .task.high .priority-dot { background: var(--danger); box-shadow: 0 0 0 2px rgba(193, 48, 43, 0.20), 0 0 8px rgba(193, 48, 43, 0.30); }
  .task.med  .priority-dot { background: var(--warning); box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.18); }
  /* Meta indicators */
  .task .t-meta { position: absolute; bottom: 4px; right: 6px; display: flex; gap: 4px; opacity: 0.55; pointer-events: none; z-index: 2; }
  /* Merge badge in t-meta — when a task has absorbed others, show the
     Venn-style icon. If multiple have been merged, show a tiny count
     next to it. Keeps tile compact. */
  .t-meta-merge {
    display: inline-flex;
    align-items: center;
    gap: 1px;
    color: var(--accent-deep);
    opacity: 1;
  }
  .t-meta-merge-count {
    font-size: 9px;
    font-weight: 700;
    line-height: 1;
    margin-left: 1px;
    font-feature-settings: 'tnum' 1;
  }
  /* Celebration */
  .task.celebrating { overflow: visible; z-index: 10; animation: task-celebrate .5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes task-celebrate { 0% { transform: scale(1); } 25% { transform: scale(1.04); } 100% { transform: scale(1); } }
  .confetti { position: absolute; left: 13px; top: 14px; pointer-events: none; animation: confetti-fly .95s cubic-bezier(0.18, 0.62, 0.42, 1) forwards; z-index: 3; }
  @keyframes confetti-fly {
    0% { transform: translate(0, 0) rotate(0) scale(0.3); opacity: 0; }
    15% { opacity: 1; transform: translate(calc(var(--dx) * 0.35), calc(var(--dy) * 0.35)) rotate(calc(var(--rot) * 0.3)) scale(1); }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.5); opacity: 0; }
  }

  /* Generic category chips — used by QuickAdd preview chips, legend
     pills, sheet category badges, link chips, and more.
     Pastel fills match the .task.cat-* blocks so the visual language
     is consistent everywhere a category appears. Ink colors are the
     existing brand-deep tones for readability on the pastel fills. */
  .cat-trading  { background: #fdf2dc; color: #633806; }
  .cat-study    { background: #ecebfb; color: #3C3489; }
  .cat-build    { background: #e2effa; color: #0C447C; }
  .cat-cricket  { background: #def0e7; color: #085041; }
  .cat-social   { background: #fbe4ec; color: #72243E; }
  .cat-health   { background: #e7f0d8; color: #3B6D11; }
  .cat-finance  { background: #faefcb; color: #713F12; }
  .cat-admin    { background: #ededeb; color: #444441; }
  .cat-personal { background: #fbe5da; color: #712B13; }
  .cat-untagged { background: var(--surface-alt); color: var(--text-3); }

  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; font-size: 12px; color: var(--text-2); }
  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 11px 4px 6px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: -0.005em;
    transition: all var(--t-fast);
    box-shadow: var(--shadow-xs);
  }
  .legend-item:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  .legend-icon { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 5px; }
  /* Per-category tinted pills — subtle background + matching border so each category visually pops */
  .legend-item-trading  { background: rgba(239, 159, 39, 0.10);  border-color: rgba(239, 159, 39, 0.40);  color: #6f4a10; }
  .legend-item-study    { background: rgba(127, 119, 221, 0.10); border-color: rgba(127, 119, 221, 0.40); color: #353170; }
  .legend-item-build    { background: rgba(55, 138, 221, 0.10);  border-color: rgba(55, 138, 221, 0.40);  color: #18406b; }
  .legend-item-cricket  { background: rgba(29, 158, 117, 0.10);  border-color: rgba(29, 158, 117, 0.40);  color: #0d5840; }
  .legend-item-social   { background: rgba(212, 83, 126, 0.10);  border-color: rgba(212, 83, 126, 0.40);  color: #7a2e4d; }
  .legend-item-health   { background: rgba(99, 153, 34, 0.10);   border-color: rgba(99, 153, 34, 0.40);   color: #355316; }
  .legend-item-personal { background: rgba(216, 90, 48, 0.10);   border-color: rgba(216, 90, 48, 0.40);   color: #7d2e15; }
  .legend-item-finance  { background: rgba(202, 138, 4, 0.10);   border-color: rgba(202, 138, 4, 0.40);   color: #713F12; }
  .legend-item-admin    { background: rgba(136, 135, 128, 0.10); border-color: rgba(136, 135, 128, 0.40); color: #4a4945; }

  /* Sheet */
  .scrim { position: fixed; inset: 0; background: rgba(28, 25, 23, 0.4); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease-out; }
  /* Body scroll lock — when a modal is open we add this class. Prevents
     the page underneath from scrolling, which is especially important on
     iOS where the modal would otherwise feel "floaty" while the rest of
     the page slides around behind it. */
  body.modal-open {
    overflow: hidden;
    touch-action: none;
  }
  /* ============================================================
     ANIMATIONS — premium motion library
     ============================================================ */
  @keyframes fade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes slideup {
    from { transform: translateY(20px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  /* Subtle drop-in for cards/notes — slight scale gives more polish than pure translate */
  @keyframes notein {
    0%   { opacity: 0; transform: translateY(-4px) scale(0.985); }
    60%  { opacity: 1; }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  /* Soft pop-in — for modals, popovers */
  @keyframes popin {
    0%   { opacity: 0; transform: scale(0.95) translateY(8px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  /* Scale-in with overshoot — for celebration / success moments */
  @keyframes scalein {
    0%   { transform: scale(0.4); opacity: 0; }
    70%  { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1);   opacity: 1; }
  }
  /* Smooth gradient shimmer — for accent strips, loading skeletons */
  @keyframes shimmer {
    0%   { background-position: -200% 50%; }
    100% { background-position: 200% 50%; }
  }
  /* Soft attention pulse — for save flash, success */
  @keyframes soft-pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.04); }
  }
  /* Smooth checkmark draw */
  @keyframes check-draw {
    0%   { stroke-dashoffset: 16; }
    100% { stroke-dashoffset: 0; }
  }
  /* Slide-in from right — for toasts/notifications */
  @keyframes slidein-right {
    from { transform: translateX(20px); opacity: 0; }
    to   { transform: translateX(0);    opacity: 1; }
  }
  /* Stagger animation delays for note cards — uses nth-child up to 12 */
  .notes-feed > * { animation-fill-mode: backwards; }
  .notes-feed > *:nth-child(1)  { animation-delay: 0ms; }
  .notes-feed > *:nth-child(2)  { animation-delay: 35ms; }
  .notes-feed > *:nth-child(3)  { animation-delay: 70ms; }
  .notes-feed > *:nth-child(4)  { animation-delay: 105ms; }
  .notes-feed > *:nth-child(5)  { animation-delay: 140ms; }
  .notes-feed > *:nth-child(6)  { animation-delay: 175ms; }
  .notes-feed > *:nth-child(7)  { animation-delay: 210ms; }
  .notes-feed > *:nth-child(8)  { animation-delay: 245ms; }
  .notes-feed > *:nth-child(9)  { animation-delay: 280ms; }
  .notes-feed > *:nth-child(10) { animation-delay: 315ms; }
  .notes-feed > *:nth-child(11) { animation-delay: 350ms; }
  .notes-feed > *:nth-child(12) { animation-delay: 385ms; }

  /* Respect users who prefer reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
  .sheet {
    background: var(--surface);
    width: 100%; max-width: 480px;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    animation: slideup .35s var(--ease-out);
    max-height: 88vh; overflow-y: auto;
    box-shadow: var(--shadow-xl);
  }
  @media (min-width: 600px) { .scrim { align-items: center; } .sheet { border-radius: var(--radius-lg); margin: 20px; padding-bottom: 18px; max-height: 80vh; } }

  /* Phase C: pastel category band at the top of the TaskSheet.
     When you open a task, the modal shows that task's category color
     as a 5px band along the top edge — the same hue as the task card
     you tapped. Subtle, but ties the modal back to its origin.
     Implemented with pseudo-elements so it doesn't disrupt the
     sheet's existing layout/padding. */
  .sheet-task {
    position: relative;
    isolation: isolate;
  }
  .sheet-task::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    background: transparent;
    pointer-events: none;
    z-index: 1;
  }
  .sheet-task::after {
    /* Soft pastel halo below the band — fades into the sheet surface
       so the colored bar doesn't feel pasted on. */
    content: "";
    position: absolute;
    top: 5px;
    left: 0;
    right: 0;
    height: 70px;
    background: transparent;
    pointer-events: none;
    z-index: 0;
  }
  .sheet-task.cat-trading::before  { background: #EF9F27; }
  .sheet-task.cat-study::before    { background: #7F77DD; }
  .sheet-task.cat-build::before    { background: #378ADD; }
  .sheet-task.cat-cricket::before  { background: #1D9E75; }
  .sheet-task.cat-social::before   { background: #D4537E; }
  .sheet-task.cat-health::before   { background: #639922; }
  .sheet-task.cat-personal::before { background: #D85A30; }
  .sheet-task.cat-finance::before  { background: #EAB308; }
  .sheet-task.cat-admin::before    { background: #888780; }
  .sheet-task.cat-trading::after  { background: linear-gradient(180deg, rgba(239, 159, 39, 0.10) 0%, transparent 100%); }
  .sheet-task.cat-study::after    { background: linear-gradient(180deg, rgba(127, 119, 221, 0.10) 0%, transparent 100%); }
  .sheet-task.cat-build::after    { background: linear-gradient(180deg, rgba(55, 138, 221, 0.10) 0%, transparent 100%); }
  .sheet-task.cat-cricket::after  { background: linear-gradient(180deg, rgba(29, 158, 117, 0.10) 0%, transparent 100%); }
  .sheet-task.cat-social::after   { background: linear-gradient(180deg, rgba(212, 83, 126, 0.10) 0%, transparent 100%); }
  .sheet-task.cat-health::after   { background: linear-gradient(180deg, rgba(99, 153, 34, 0.10) 0%, transparent 100%); }
  .sheet-task.cat-personal::after { background: linear-gradient(180deg, rgba(216, 90, 48, 0.10) 0%, transparent 100%); }
  .sheet-task.cat-finance::after  { background: linear-gradient(180deg, rgba(234, 179, 8, 0.10) 0%, transparent 100%); }
  .sheet-task.cat-admin::after    { background: linear-gradient(180deg, rgba(136, 135, 128, 0.10) 0%, transparent 100%); }
  /* Sheet content sits above the pastel halo. */
  .sheet-task > * { position: relative; z-index: 1; }

  /* LIVE state on the TaskSheet: red band override + red halo +
     a slim "● LIVE • started 8:23pm" banner at the top of content.
     Overrides category color while live — clear visual that this
     task is currently in progress. */
  .sheet-task.is-live::before {
    background: var(--danger) !important;
    animation: sheet-live-band-pulse 1600ms ease-in-out infinite;
  }
  .sheet-task.is-live::after {
    background: linear-gradient(180deg, rgba(193, 48, 43, 0.12) 0%, transparent 100%) !important;
  }
  @keyframes sheet-live-band-pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.65; }
  }
  .sheet-live-banner {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 6px 0 12px;
    padding: 7px 12px;
    background: var(--danger-soft);
    border: 1px solid rgba(193, 48, 43, 0.30);
    border-radius: var(--radius);
    font-size: 11.5px;
    font-weight: 600;
    color: var(--danger);
    letter-spacing: 0.02em;
  }
  .sheet-live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--danger);
    flex-shrink: 0;
    box-shadow: 0 0 0 0 var(--danger);
    animation: sheet-live-banner-pulse 1400ms ease-in-out infinite;
  }
  @keyframes sheet-live-banner-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(193, 48, 43, 0.6); transform: scale(1); }
    50%      { box-shadow: 0 0 0 6px transparent; transform: scale(1.18); }
  }
  .sheet-live-text {
    font-weight: 800;
    letter-spacing: 0.10em;
  }
  .sheet-live-meta {
    font-weight: 500;
    color: rgba(193, 48, 43, 0.75);
    letter-spacing: 0.01em;
  }
  @media (prefers-reduced-motion: reduce) {
    .sheet-task.is-live::before,
    .sheet-live-dot { animation: none; }
  }

  .sheet-cat {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 11px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
    letter-spacing: -0.005em;
    box-shadow: var(--shadow-xs);
  }
  .sheet-cat svg { opacity: 0.85; }
  /* Position wrap holds the cat badge + the dropdown picker. */
  .sheet-cat-wrap {
    position: relative;
    display: inline-block;
  }
  /* Button variant of the badge — same look, plus hover/active affordances
     to make it discoverable as an interactive control. */
  .sheet-cat-btn {
    border: 0;
    cursor: pointer;
    font-family: inherit;
    transition: filter var(--t-fast), transform var(--t-fast), box-shadow var(--t-fast);
  }
  .sheet-cat-btn:hover {
    filter: brightness(1.04);
    box-shadow: var(--shadow-sm);
    transform: translateY(-0.5px);
  }
  .sheet-cat-btn:active {
    transform: translateY(0);
    filter: brightness(0.98);
  }
  /* When the picker is anchored to the cat badge inside the sheet, position
     it just below the badge so it doesn't push other content around. */
  .sheet-cat-wrap .cat-picker {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 10;
    min-width: 180px;
  }
  .sheet-title {
    margin: 12px 0 4px;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.02em;
    word-break: break-word;
  }
  /* Phase 10: task-title becomes click-to-edit. Hover/focus reveals a
     subtle outline so the user knows it's interactive. The contenteditable
     trick avoids reflow during the swap between display and edit modes. */
  .sheet-title-edit {
    margin: 12px 0 4px;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.02em;
    word-break: break-word;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 4px 6px;
    margin-left: -6px;
    color: var(--text);
    cursor: text;
    transition: background .15s, border-color .15s;
    width: calc(100% + 12px);
    box-sizing: border-box;
    font-family: inherit;
    resize: none;
    outline: none;
    display: block;
  }
  .sheet-title-edit:hover:not(:focus) { background: var(--surface-alt); }
  .sheet-title-edit:focus {
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .sheet-meta {
    color: var(--text-2);
    font-size: 13px;
    margin: 0;
    font-weight: 500;
    letter-spacing: -0.005em;
  }
  .sheet-section { margin-top: 18px; }
  .sheet-label {
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-3);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .time-edit-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .time-input {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 7px 12px;
    font-size: 13px; min-width: 132px;
    transition: all var(--t-fast);
    font-family: inherit;
    color: var(--text);
    box-shadow: var(--shadow-xs);
  }
  .time-input:hover { border-color: var(--border-strong); }
  .time-input:focus { outline: none; border-color: var(--accent); box-shadow: var(--shadow-focus-ring); }
  /* Date input — same look as the time inputs above. Native date picker
     on iOS/Android, custom UI on desktop browsers. */
  .date-input {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 7px 12px;
    font-size: 13px;
    min-width: 180px;
    transition: all var(--t-fast);
    font-family: inherit;
    color: var(--text);
    box-shadow: var(--shadow-xs);
  }
  .date-input:hover { border-color: var(--border-strong); }
  .date-input:focus { outline: none; border-color: var(--accent); box-shadow: var(--shadow-focus-ring); }
  .time-sep { color: var(--text-3); font-size: 13px; font-weight: 500; }
  .time-dur {
    color: var(--text-2); font-size: 12px;
    padding-left: 4px;
    font-feature-settings: 'tnum' 1;
    font-weight: 500;
  }
  .time-clear-btn, .time-add-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 7px 12px;
    font-size: 12.5px;
    color: var(--text-2);
    font-weight: 500;
    transition: all var(--t-fast);
    box-shadow: var(--shadow-xs);
  }
  .time-clear-btn:hover, .time-add-btn:hover {
    border-color: var(--border-strong);
    background: var(--surface-alt);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  /* Live button — sits next to "All day". In its default state it
     looks like the other time buttons but with a small accent dot.
     Once the task is live, it switches to "Stop" with a saturated
     red background and a pulsing dot — clear that it's a stateful
     button you can tap again to end. */
  .time-live-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-md);
    padding: 7px 12px;
    font-size: 12.5px;
    color: var(--text);
    font-weight: 600;
    letter-spacing: -0.005em;
    transition: all var(--t-fast);
    box-shadow: var(--shadow-xs);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .time-live-btn:hover {
    border-color: var(--danger);
    background: var(--danger-soft);
    color: var(--danger);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  .time-live-btn:active { transform: translateY(0); }
  .time-live-btn:focus-visible {
    outline: 2px solid var(--border-focus);
    outline-offset: 2px;
  }
  .time-live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--danger);
    flex-shrink: 0;
    box-shadow: 0 0 0 0 var(--danger);
  }
  /* When ACTIVE: solid red fill, white text, pulsing dot, slightly
     stronger shadow. The "Stop" label + pulse makes the active
     state read as "tap to end". */
  .time-live-btn.is-live {
    background: var(--danger);
    color: white;
    border-color: var(--danger);
    box-shadow:
      0 1px 2px rgba(193, 48, 43, 0.20),
      0 6px 14px -4px rgba(193, 48, 43, 0.30);
  }
  .time-live-btn.is-live:hover {
    background: #a82723;
    color: white;
    border-color: #a82723;
  }
  .time-live-btn.is-live .time-live-dot {
    background: white;
    animation: time-live-pulse 1400ms ease-in-out infinite;
  }
  @keyframes time-live-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.6); transform: scale(1); }
    50%      { box-shadow: 0 0 0 5px rgba(255, 255, 255, 0); transform: scale(1.15); }
  }
  @media (prefers-reduced-motion: reduce) {
    .time-live-btn.is-live .time-live-dot { animation: none; }
  }
  .prio-row { display: flex; gap: 6px; }

  /* Recurring section — 7 day-of-week toggle pills + shortcuts row.
     One-off tasks: all pills off. Tap any pill → converts to a
     recurring task with that single day. Tap more pills → adds more
     days. Tap the last active pill off → reverts to one-off.
     Shortcuts: Weekdays, Daily, and (when recurring) Stop. */
  .recur-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }
  .recur-day-btn {
    padding: 8px 0;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-md);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text-3);
    transition: all var(--t-fast);
    cursor: pointer;
    box-shadow: var(--shadow-xs);
    -webkit-tap-highlight-color: transparent;
    /* Slight letter-spacing tightening on small caps */
    text-transform: uppercase;
  }
  .recur-day-btn:hover {
    border-color: var(--border-strong);
    color: var(--text);
    transform: translateY(-1px);
  }
  .recur-day-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    box-shadow:
      0 1px 2px var(--accent-glow),
      0 4px 10px -3px var(--accent-glow);
  }
  .recur-day-btn.active:hover {
    background: var(--accent-deep);
    border-color: var(--accent-deep);
  }
  .recur-day-btn:focus-visible {
    outline: 2px solid var(--border-focus);
    outline-offset: 2px;
  }
  .recur-shortcuts {
