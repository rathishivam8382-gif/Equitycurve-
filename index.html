    flex-shrink: 0;
    padding: 5px 12px;
    background: var(--accent); color: white;
    border: 0; border-radius: 5px;
    font-size: 11.5px; font-weight: 600; cursor: pointer;
    transition: all .12s;
  }
  .smart-suggestion-accept:hover { background: var(--accent-strong, #4f46e5); transform: translateY(-1px); }
  .smart-suggestion-dismiss {
    flex-shrink: 0;
    background: transparent; border: 0; padding: 4px;
    color: var(--text-3); cursor: pointer;
    border-radius: 4px; display: flex; align-items: center;
    transition: all .12s;
  }
  .smart-suggestion-dismiss:hover { color: var(--text); background: rgba(0,0,0,0.05); }

  /* Recently-touched panel */
  .recently-touched {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 12px;
    margin-bottom: 12px;
  }
  .recently-touched-head { margin-bottom: 6px; }
  .recently-touched-label {
    font-size: 10px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .recently-touched-list {
    display: flex; flex-direction: column; gap: 3px;
  }
  .recently-touched-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 5px 8px; background: transparent; border: 0;
    border-radius: 4px; text-align: left; cursor: pointer;
    font-size: 12.5px; color: var(--text-2);
    transition: background .12s;
  }
  .recently-touched-item:hover { background: var(--surface-alt); color: var(--text); }
  .recently-touched-item-title {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .recently-touched-item-when {
    flex-shrink: 0; font-size: 10.5px; color: var(--text-3);
    font-feature-settings: 'tnum' 1;
  }

  /* Autocomplete dropdown for #hashtags and [[wiki-links]] inside blocks */
  .inline-autocomplete {
    position: absolute; z-index: 65;
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,0.10);
    padding: 4px; min-width: 180px; max-width: 280px;
    max-height: 220px; overflow-y: auto;
    animation: notein .1s ease-out;
  }
  .inline-autocomplete-head {
    padding: 4px 9px;
    font-size: 9.5px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .inline-autocomplete-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
    padding: 5px 9px; background: transparent; border: 0;
    border-radius: 4px; text-align: left; cursor: pointer;
    font-size: 12.5px; color: var(--text);
  }
  .inline-autocomplete-item:hover, .inline-autocomplete-item.focused { background: var(--accent-soft); color: var(--accent); }
  .inline-autocomplete-item-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inline-autocomplete-item-count {
    flex-shrink: 0; font-size: 10.5px; color: var(--text-3);
    font-feature-settings: 'tnum' 1;
  }

  /* Make sure the search-wrap is positioned for the history popover */
  .notes-search-wrap { position: relative; }

  /* ============================================================
     STAGE 5 — Wiki-links, backlinks, search filter chips
     ============================================================ */
  .wiki-link {
    color: var(--accent); cursor: pointer; font-weight: 500;
    padding: 0 2px; border-radius: 3px;
    background: rgba(99, 102, 241, 0.07);
    border-bottom: 1px solid rgba(99, 102, 241, 0.35);
    transition: all .12s;
  }
  .wiki-link:hover {
    background: rgba(99, 102, 241, 0.16);
    border-bottom-color: var(--accent);
  }
  .wiki-link.wiki-missing {
    color: #c0382b;
    background: rgba(192, 56, 43, 0.06);
    border-bottom: 1px dashed rgba(192, 56, 43, 0.45);
  }
  .wiki-link.wiki-missing:hover { background: rgba(192, 56, 43, 0.14); }

  .search-hit {
    background: rgba(255, 215, 64, 0.45);
    color: inherit;
    padding: 0 1px; border-radius: 2px;
    font-weight: 500;
  }

  /* Backlinks panel */
  .backlinks {
    margin-top: 12px; padding-top: 10px; padding-left: 36px;
    border-top: 1px dashed var(--border);
  }
  @media (max-width: 640px) { .backlinks { padding-left: 0; } }
  .backlinks-label {
    font-size: 10.5px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .backlinks-label svg { opacity: 0.7; }
  .backlinks-list {
    display: flex; flex-wrap: wrap; gap: 5px;
  }
  .backlink-item {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px;
    background: var(--surface-alt); border: 1px solid var(--border);
    color: var(--text-2); font-size: 11.5px; cursor: pointer;
    transition: all .15s;
    max-width: 240px;
  }
  .backlink-item:hover {
    border-color: var(--accent); color: var(--accent);
    background: rgba(99, 102, 241, 0.04);
  }
  .backlink-title {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* Search-filter chip bar */
  .search-filter-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: 4px 0 12px;
    padding: 7px 10px;
    background: var(--accent-soft);
    border: 1px solid rgba(99, 102, 241, 0.22);
    border-radius: var(--radius-sm);
    animation: notein .15s ease-out;
  }
  .search-filter-count {
    font-size: 11.5px; font-weight: 600; color: var(--accent);
    font-feature-settings: 'tnum' 1;
  }
  .search-filter-chips {
    display: inline-flex; flex-wrap: wrap; gap: 4px;
    flex: 1; min-width: 0;
  }
  .search-filter-chip {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 10.5px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-2);
  }
  .search-filter-chip.kind-tag    { color: #355080; }
  .search-filter-chip.kind-cat    { color: #7c4f1c; }
  .search-filter-chip.kind-coll   { color: #145e44; }
  .search-filter-chip.kind-has    { color: #4a4042; }
  .search-filter-chip.kind-after,
  .search-filter-chip.kind-before { color: var(--accent); }
  .search-filter-chip.kind-term   { color: var(--text); font-style: italic; }
  .search-filter-clear {
    background: transparent; border: 0; padding: 2px 8px;
    font-size: 11px; color: var(--text-3); cursor: pointer;
    border-radius: 3px; transition: all .12s;
  }
  .search-filter-clear:hover { color: var(--danger); background: rgba(192, 56, 43, 0.05); }

  /* Search input clear button */
  .notes-search-wrap { position: relative; }
  .notes-search-clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: transparent; border: 0; padding: 4px;
    color: var(--text-3); cursor: pointer; border-radius: 3px;

function pad(n) { return String(n).padStart(2, "0"); }
function formatDate(d) { return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function formatTime(t) { if (!t) return ""; return pad(t.hour) + ":" + pad(t.minute); }
function parseTimeStr(str) { if (!str) return null; const m = str.match(/^(\d{1,2}):(\d{2})$/); if (!m) return null; const h = parseInt(m[1], 10), mn = parseInt(m[2], 10); if (h < 0 || h > 23 || mn < 0 || mn > 59) return null; return { hour: h, minute: mn }; }

function computeDuration(start, end) { if (!start || !end) return 0; let s = start.hour * 60 + start.minute; let e = end.hour * 60 + end.minute; if (e <= s) e += 24 * 60; return e - s; }

function relativeTimeLabel(ts) {
  const now = Date.now();
  const diff = now - ts;
  const dt = new Date(ts);
  const time = dt.toLocaleTimeString("en-AU", { hour: "2-digit", minute: "2-digit", hour12: false });
  if (diff < 60 * 1000) return "just now · " + time;
  if (diff < 60 * 60 * 1000) return Math.floor(diff / 60000) + "m ago · " + time;
  const today = new Date(); today.setHours(0,0,0,0);
  const dtDay = new Date(dt); dtDay.setHours(0,0,0,0);
  const dayDiff = Math.round((today - dtDay) / (24*60*60*1000));

  if (dayDiff < 7) return dayDiff + "d ago · " + time;

function makeTaskLabel(task) {
  let when = "";
  if (task.recurring) {
    const days = task.recurring.days;
    if (days.length === 7) when = "every day";

  return { title: task.title, when: when + t };
}

// Find the task whose time window contains `now` (for note auto-link suggestions)
function getActiveTask(tasks, recurring, now) {
  if (!now) now = new Date();
  const dateStr = formatDate(now);
  const dow = now.getDay();
  const nowMin = now.getHours() * 60 + now.getMinutes();

  function inWindow(t) {
    if (!t.time) return false;
    const startMin = t.time.hour * 60 + t.time.minute;
    let endMin;
    if (t.endTime) endMin = t.endTime.hour * 60 + t.endTime.minute;
    else if (t.duration) endMin = startMin + t.duration;
    else endMin = startMin + 60;
    if (endMin <= startMin) return false; // skip overnight for stage 4
    return nowMin >= startMin && nowMin < endMin;
  }

  for (let i = 0; i < tasks.length; i++) {
    const t = tasks[i];
    if (t.date !== dateStr) continue;
    if (inWindow(t)) return t;
  }
  for (let i = 0; i < recurring.length; i++) {
    const r = recurring[i];
    if (!r.recurring || r.recurring.days.indexOf(dow) === -1) continue;
    if (inWindow(r)) return r;
  }
  return null;
}

// Check if a date timestamp is today (local time)
function isToday(ts) {
  if (!ts) return false;
  const d = new Date(ts);
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
}

// Extract #hashtags from note body (skips code blocks/inline code, requires letter-start)
function extractTags(body) {
  if (!body) return [];
  const stripped = body.replace(/```[\s\S]*?```/g, " ").replace(/`[^`]*`/g, " ");
  const re = /(?:^|[^\w])#([a-zA-Z][\w-]{0,30})/g;
  const tags = [];
  let m;
  while ((m = re.exec(stripped)) !== null) {
    const tag = m[1].toLowerCase();
    if (tags.indexOf(tag) === -1) tags.push(tag);
  }
  return tags;
}

// ============================================================
// STAGE 8 — Smart pass: corpus stats, template inference, autocomplete sources
// ============================================================

// Build {tag: count} across every note (for autocomplete + recency ranking)
function buildTagFrequency(notes) {
  const freq = {};
  for (let i = 0; i < notes.length; i++) {
    const tags = extractTags(blocksToText(notes[i].blocks || []));
    for (let j = 0; j < tags.length; j++) {
      freq[tags[j]] = (freq[tags[j]] || 0) + 1;
    }
  }
  return freq;
}

// Suggest tag completions ranked by frequency × recency.
// `prefix` is the chars after `#` the user has typed.
function suggestTags(prefix, notes, limit) {
  const freq = buildTagFrequency(notes);
  const p = (prefix || "").toLowerCase();
  const items = [];
  for (const tag in freq) {
    if (!p || tag.indexOf(p) === 0) items.push({ tag, count: freq[tag] });
  }
  items.sort((a, b) => b.count - a.count);
  return items.slice(0, limit || 6);
}

// Suggest wiki-link target completions: existing note titles ranked by recency.
function suggestWikiTargets(prefix, notes, limit) {
  const p = (prefix || "").toLowerCase();
  const seen = {};
  const items = [];
  for (let i = 0; i < notes.length; i++) {
    const t = deriveTitleFromBlocks(notes[i].blocks || []);
    if (!t) continue;
    const tNorm = wikiNormalizeTitle(t);
    if (seen[tNorm]) continue;
    seen[tNorm] = true;
    if (!p || tNorm.indexOf(p) === 0 || tNorm.indexOf(" " + p) !== -1) {
      items.push({ title: t, normalized: tNorm, updatedAt: notes[i].updatedAt || notes[i].createdAt });
    }
  }
  items.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  return items.slice(0, limit || 6);
}

// Find tasks active in a window around `now`:
//   - currently active (already handled by getActiveTask)
//   - completed within the last `lookbackMs` ms (default 2h)
//   - upcoming within the next `lookaheadMs` ms (default 1h)
// Returns { active, recent, upcoming }.
function getTaskWindow(tasks, recurring, now, lookbackMs, lookaheadMs) {
  if (!now) now = new Date();
  if (lookbackMs == null) lookbackMs = 2 * 60 * 60 * 1000;
  if (lookaheadMs == null) lookaheadMs = 60 * 60 * 1000;
  const dateStr = formatDate(now);
  const dow = now.getDay();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const lookbackMin = lookbackMs / (60 * 1000);
  const lookaheadMin = lookaheadMs / (60 * 1000);
  const out = { active: null, recent: [], upcoming: [] };

  function classify(t, isRecurring) {
    if (!t.time) return;
    const startMin = t.time.hour * 60 + t.time.minute;
    let endMin;
    if (t.endTime) endMin = t.endTime.hour * 60 + t.endTime.minute;
    else if (t.duration) endMin = startMin + t.duration;
    else endMin = startMin + 60;
    if (endMin <= startMin) return; // skip overnight
    if (nowMin >= startMin && nowMin < endMin) {
      if (!out.active) out.active = t;
    } else if (nowMin >= endMin && nowMin - endMin <= lookbackMin) {
      out.recent.push({ task: t, minutesAgo: nowMin - endMin });
    } else if (startMin > nowMin && startMin - nowMin <= lookaheadMin) {
      out.upcoming.push({ task: t, minutesUntil: startMin - nowMin });
    }
  }
  for (let i = 0; i < tasks.length; i++) {
    if (tasks[i].date !== dateStr) continue;
    classify(tasks[i], false);
  }
  for (let i = 0; i < recurring.length; i++) {
    if (!recurring[i].recurring || recurring[i].recurring.days.indexOf(dow) === -1) continue;
    classify(recurring[i], true);
  }
  // Sort recents by most-recent first; upcomings by soonest first
  out.recent.sort((a, b) => a.minutesAgo - b.minutesAgo);
  out.upcoming.sort((a, b) => a.minutesUntil - b.minutesUntil);
  return out;
}

// Infer a template family from the content of a freshly-saved note.
// Returns { family, confidence, hint } or null if no clear pattern.
// All detection is keyword + regex based — deterministic, no AI.
function inferTemplateFamily(blocks) {
  if (!Array.isArray(blocks) || blocks.length === 0) return null;
  const text = blocksToText(blocks).toLowerCase();
  if (text.length < 30) return null; // not enough content to classify

  const signals = {};

  // Trade journal: ticker (3-5 caps) + R-multiple OR entry/stop/target keywords
  const tickerMatch = text.match(/\b[A-Z]{2,5}\b/g) || (blocksToText(blocks).match(/\b[A-Z]{2,5}\b/g) || []);
  const hasTicker = tickerMatch && tickerMatch.length > 0;
  const hasRMultiple = /[+-]?\d+(\.\d+)?\s*r\b|\br[:\s]*\d|risk[:\s]|reward[:\s]/i.test(blocksToText(blocks));
  const hasTradeWords = /\b(entry|stop|target|setup|long|short|breakout|reversal|pnl|p&l|stopped out|took profit)\b/.test(text);
  if (hasTicker && (hasRMultiple || hasTradeWords)) signals.trading = (hasRMultiple ? 2 : 1) + (hasTradeWords ? 1 : 0);

  // Lecture notes: course code OR teacher + dated + structured points
  const hasCourseCode = /\b[a-z]{3,4}\s?\d{3,4}\b/i.test(blocksToText(blocks));
  const hasLectureWords = /\b(lecture|prof\.?|professor|chapter|theorem|definition|axiom|lemma|proof)\b/.test(text);
  if (hasCourseCode || (hasLectureWords && (blocks.filter(b => b.type === "h2" || b.type === "h3").length > 0))) {
    signals.study = (hasCourseCode ? 2 : 0) + (hasLectureWords ? 1 : 0);
  }

  // Decision log: comparing options with pros/cons or "decided"/"option a vs"
  const hasDecisionWords = /\b(pros?|cons?|decided|option [ab1-3]|vs\.?|verdict|chose|will go with)\b/.test(text);
  const bulletCount = blocks.filter(b => b.type === "bullet").length;
  if (hasDecisionWords && bulletCount >= 3) signals.decision = 2;

  // Meeting notes: attendees + action items
  const hasMeetingWords = /\b(attendees?|present|agenda|action items?|next steps?|follow.?up)\b/.test(text);
  if (hasMeetingWords) signals.meeting = 2;

  // Bug/debug: stack trace, error, fix
  const hasBugWords = /\b(bug|error|stack ?trace|fix|repro|reproduce|crash|exception)\b/.test(text);
  const hasCode = blocks.some(b => b.type === "code");
  if (hasBugWords && hasCode) signals.bug = 2;

  // Daily reflection: "today", "felt", "tomorrow", or 3-things pattern
  const hasReflectionWords = /\b(today i|felt|grateful|tomorrow|what went well|what could)\b/.test(text);
  // Journal needs at least the reflection-word marker; bump it to score 2 so it crosses threshold
  if (hasReflectionWords && bulletCount >= 2) signals.journal = 2;

  // Pick the highest-scoring signal above threshold
  let best = null; let bestScore = 1;
  for (const k in signals) {
    if (signals[k] > bestScore) { best = k; bestScore = signals[k]; }
  }
  if (!best) return null;

  const families = {
    trading: { family: "trading", label: "Trade journal", hint: "ticker, R-multiple, or trade verbs" },
    study: { family: "study", label: "Lecture / chapter notes", hint: "course code or lecture vocabulary" },
    decision: { family: "decision", label: "Decision log", hint: "comparing options, pros/cons" },
    meeting: { family: "meeting", label: "Meeting notes", hint: "attendees, action items" },
    bug: { family: "bug", label: "Bug report", hint: "error/crash/fix with code" },
    journal: { family: "journal", label: "Daily reflection", hint: "today/felt/tomorrow pattern" }
  };
  return Object.assign({ confidence: bestScore }, families[best]);
}

// Pick a real template id matching the inferred family.
// Looks for a template whose `type` or `family` matches, prefers the "Quick" variant.
function pickTemplateForFamily(inferredFamily, allTemplates) {
  if (!inferredFamily) return null;
  // Map inferred family → preferred (type, family substring) hints
  const map = {
    trading: { type: "trading", familyHint: "journal" },
    study: { type: "study", familyHint: "lecture" },
    decision: { type: "project", familyHint: "decision" },
    meeting: { type: "project", familyHint: "meeting" },
    bug: { type: "coding", familyHint: "bug" },
    journal: { type: "journal", familyHint: "daily" }
  };
  const m = map[inferredFamily];
  if (!m) return null;
  // First pass: type + family hint + Quick variant
  let candidates = allTemplates.filter(t => t.type === m.type && (t.family || "").toLowerCase().indexOf(m.familyHint) !== -1);
  if (candidates.length === 0) candidates = allTemplates.filter(t => t.type === m.type);
  if (candidates.length === 0) return null;
  // Prefer Quick variant
  const quick = candidates.find(t => (t.variant || "").toLowerCase() === "quick");
  return quick || candidates[0];
}

// STAGE 5 — Search, wiki-links, backlinks
// ============================================================

// Parse a search query into structured filters + free-text terms.
// Operators: #tag, cat:X, coll:X, has:type, after:DATE, before:DATE
// Date shortcuts: today, yesterday, last-week, last-month
function parseSearchQuery(raw) {
  const out = { tags: [], cats: [], colls: [], has: [], after: null, before: null, terms: [] };
  if (!raw || !raw.trim()) return out;

  // Tokenize preserving quoted phrases
  const tokens = [];
  const re = /"([^"]+)"|(\S+)/g;
  let m;
  while ((m = re.exec(raw)) !== null) {
    tokens.push(m[1] != null ? m[1] : m[2]);
  }

  function parseDateShortcut(v) {
    const t = v.toLowerCase();
    const now = new Date();
    const startOfDay = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
    if (t === "today") return startOfDay(now);
    if (t === "yesterday") { const d = new Date(now); d.setDate(d.getDate() - 1); return startOfDay(d); }
    if (t === "last-week" || t === "week") { const d = new Date(now); d.setDate(d.getDate() - 7); return startOfDay(d); }
    if (t === "last-month" || t === "month") { const d = new Date(now); d.setMonth(d.getMonth() - 1); return startOfDay(d); }
    // YYYY-MM-DD
    if (/^\d{4}-\d{2}-\d{2}$/.test(t)) { const d = new Date(t + "T00:00:00"); if (!isNaN(d.getTime())) return d.getTime(); }
    return null;
  }

  for (let i = 0; i < tokens.length; i++) {
    const tok = tokens[i];
    if (!tok) continue;
    // Hashtag
    if (tok[0] === "#" && tok.length > 1) { out.tags.push(tok.slice(1).toLowerCase()); continue; }
    // Operator:value
    const colonIdx = tok.indexOf(":");
    if (colonIdx > 0 && colonIdx < tok.length - 1) {
      const op = tok.slice(0, colonIdx).toLowerCase();
      const val = tok.slice(colonIdx + 1).toLowerCase();
      if (op === "cat" || op === "category") { out.cats.push(val); continue; }
      if (op === "coll" || op === "collection") { out.colls.push(val); continue; }
      if (op === "has") { out.has.push(val); continue; }
      if (op === "after") { const d = parseDateShortcut(val); if (d != null) out.after = d; continue; }
      if (op === "before") {
        const d = parseDateShortcut(val);
        // For "before:X", treat as end-of-day so notes from that day are included
        if (d != null) out.before = d + (24 * 60 * 60 * 1000) - 1;
        continue;
      }
    }
    // Bare term
    out.terms.push(tok.toLowerCase());
  }
  return out;
}

// Does this note match the parsed query?
function matchesQuery(note, parsed, collections) {
  if (!parsed) return true;
  const blocks = note.blocks || [];
  const text = blocksToText(blocks).toLowerCase();
  // Tag filter
  if (parsed.tags.length > 0) {
    const noteTags = extractTags(blocksToText(blocks));
    for (let i = 0; i < parsed.tags.length; i++) {
      if (noteTags.indexOf(parsed.tags[i]) === -1) return false;
    }
  }
  // Category filter
  if (parsed.cats.length > 0) {
    if (!note.category) return false;
    if (parsed.cats.indexOf(note.category.toLowerCase()) === -1) return false;
  }
  // Collection filter (matches by collection name partial)
  if (parsed.colls.length > 0) {
    if (!note.collectionId) return false;
    const coll = (collections || []).find(c => c.id === note.collectionId);
    if (!coll) return false;
    const cName = (coll.name || "").toLowerCase();
    for (let i = 0; i < parsed.colls.length; i++) {
      if (cName.indexOf(parsed.colls[i]) === -1) return false;
    }
  }
  // Has-type filter
  if (parsed.has.length > 0) {
    const types = {};
    for (let i = 0; i < blocks.length; i++) types[blocks[i].type] = true;
    for (let i = 0; i < parsed.has.length; i++) {
      const h = parsed.has[i];
      // Aliases
      const want = h === "checklist" ? "check" : (h === "checkbox" ? "check" : h);
      if (!types[want]) return false;
    }
  }
  // Date range
  if (parsed.after != null && note.createdAt < parsed.after) return false;
  if (parsed.before != null && note.createdAt > parsed.before) return false;
  // Free-text terms — all must appear in the text
  for (let i = 0; i < parsed.terms.length; i++) {
    if (text.indexOf(parsed.terms[i]) === -1) return false;
  }
  return true;
}

// Extract wiki-link targets `[[note title]]` from text (skips inside code blocks/inline code)
function extractWikiLinks(text) {
  if (!text) return [];
  const stripped = text.replace(/```[\s\S]*?```/g, " ").replace(/`[^`]*`/g, " ");
  const re = /\[\[([^\]\n]{1,100})\]\]/g;
  const out = [];
  let m;
  while ((m = re.exec(stripped)) !== null) {
    const target = m[1].trim();
    if (target && out.indexOf(target) === -1) out.push(target);
  }
  return out;
}

// Build a lookup map: lowercase wiki-friendly title → note object.
// We strip trailing #hashtags from titles so a heading "# ORCL Q3 #earnings"
// is still matchable via [[ORCL Q3]].
function wikiNormalizeTitle(t) {
  if (!t) return "";
  // Strip trailing hashtag clauses like " #foo #bar"
  return t.replace(/(?:\s+#[a-zA-Z][\w-]{0,30})+\s*$/, "").trim().toLowerCase();
}
function buildTitleIndex(notes) {
  const idx = {};
  for (let i = 0; i < notes.length; i++) {
    const n = notes[i];
    const t = deriveTitleFromBlocks(n.blocks || []);
    if (t) {
      const key = wikiNormalizeTitle(t);
      if (key && !idx[key]) idx[key] = n;
    }
  }
  return idx;
}

// For a given note, find all other notes that mention it via [[title]]
function findBacklinks(note, allNotes) {
  if (!note) return [];
  const myTitle = wikiNormalizeTitle(deriveTitleFromBlocks(note.blocks || []) || "");
  if (!myTitle) return [];
  const out = [];
  for (let i = 0; i < allNotes.length; i++) {
    const other = allNotes[i];
    if (other.id === note.id) continue;
    const targets = extractWikiLinks(blocksToText(other.blocks || []));
    for (let j = 0; j < targets.length; j++) {
      if (wikiNormalizeTitle(targets[j]) === myTitle) { out.push(other); break; }
    }
  }
  return out;
}

// STAGE 6 — Polish: heatmap, export, focus, shortcuts
// ============================================================

// Build heatmap grid: 8 weeks × 7 days, anchored on today (rightmost column).
// Each cell = { date: Date, dateStr: "YYYY-MM-DD", count: N, isToday: bool, inFuture: bool }
function buildHeatmapGrid(notes, weeks) {
  const cols = weeks || 8;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  // The rightmost column is the current week (Sun-Sat).
  // Compute the Saturday of the current week as the anchor.
  const dow = today.getDay();
  const rightAnchor = new Date(today);
  rightAnchor.setDate(today.getDate() + (6 - dow));
  // Tally notes by dateStr
  const tally = {};
  for (let i = 0; i < notes.length; i++) {
    const d = new Date(notes[i].createdAt);
    const k = formatDate(d);
    tally[k] = (tally[k] || 0) + 1;
  }
  // Walk back cols*7 - 1 days from rightAnchor
  const grid = [];
  for (let c = 0; c < cols; c++) {
    const col = [];
    for (let r = 0; r < 7; r++) {
      const cellDate = new Date(rightAnchor);
      // offset: column from right is (cols - 1 - c) weeks back; row r is r-th day of that week
      cellDate.setDate(rightAnchor.getDate() - ((cols - 1 - c) * 7) - (6 - r));
      const dateStr = formatDate(cellDate);
      const count = tally[dateStr] || 0;
      const isToday = cellDate.getTime() === today.getTime();
      const inFuture = cellDate.getTime() > today.getTime();
      col.push({ date: cellDate, dateStr, count, isToday, inFuture });
    }
    grid.push(col);
  }
  return grid;
}

// Convert a single note to a markdown string (block-by-block)
function noteToMarkdown(note) {
  const blocks = note.blocks || [];
  const title = deriveTitleFromBlocks(blocks) || "Untitled note";
  const dt = new Date(note.createdAt);
  const dateLine = dt.toLocaleString("en-AU", { weekday: "long", day: "numeric", month: "long", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true });
  const lines = [];
  lines.push("## " + title);
  lines.push("*" + dateLine + (note.category ? " · " + note.category : "") + "*");
  lines.push("");
  // Skip the first non-empty block if it became the title, to avoid duplication
  let firstContentIdx = -1;
  for (let i = 0; i < blocks.length; i++) {
    if ((blocks[i].content || "").trim()) { firstContentIdx = i; break; }
  }
  const bodyBlocks = firstContentIdx >= 0 ? blocks.slice(firstContentIdx + 1) : blocks;
  lines.push(blocksToText(bodyBlocks));
  return lines.join("\n");
}

// Convert an array of notes + their collections into one markdown document
function notesToMarkdownExport(notes, collections, scopeLabel) {
  const out = [];
  out.push("# " + (scopeLabel || "Notes export"));
  out.push("");
  out.push("*Exported " + new Date().toLocaleString("en-AU") + " · " + notes.length + " note" + (notes.length !== 1 ? "s" : "") + "*");
  out.push("");
  out.push("---");
  out.push("");
  // Group by collection
  const grouped = {};
  for (let i = 0; i < notes.length; i++) {
    const cid = notes[i].collectionId || "__inbox";
    if (!grouped[cid]) grouped[cid] = [];
    grouped[cid].push(notes[i]);
  }
  // Render each group
  const collOrder = ["__inbox"].concat(collections.map(c => c.id).filter(id => grouped[id]));
  for (let i = 0; i < collOrder.length; i++) {
    const cid = collOrder[i];
    if (!grouped[cid]) continue;
    const coll = cid === "__inbox" ? null : collections.find(c => c.id === cid);
    out.push("");
    out.push("# " + (coll ? coll.name : "Inbox"));
    out.push("");
    const sorted = grouped[cid].slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    for (let j = 0; j < sorted.length; j++) {
      out.push(noteToMarkdown(sorted[j]));
      out.push("");
      out.push("---");
      out.push("");
    }
  }
  return out.join("\n");
}

// Trigger a download of a text blob as a file
function downloadTextFile(text, filename) {
  try {
    const blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) { console.error("Download failed:", e); }
}

const STORAGE_KEYS = { tasks: "planner_tasks_v3", recurring: "planner_recurring_v3", notes: "planner_notes_v3", notesLegacy: "planner_notes_v2", collections: "planner_collections_v1", savedSearches: "planner_saved_searches_v1", searchHistory: "planner_search_history_v1" };

function getWindowStorage() { try { if (typeof window !== "undefined" && window.storage && typeof window.storage.get === "function") return window.storage; } catch (e) {} return null; }
async function loadJSON(key, fallback) {
  const ws = getWindowStorage();
  if (ws) { try { const r = await ws.get(key); if (r && r.value) return JSON.parse(r.value); return fallback; } catch (e) {} }
  try { if (typeof localStorage !== "undefined") { const v = localStorage.getItem(key); if (v) return JSON.parse(v); } } catch (e) {}
  return fallback;
}
async function saveJSON(key, value) {
  const ws = getWindowStorage();
  if (ws) { try { await ws.set(key, JSON.stringify(value)); return; } catch (e) {} }
  try { if (typeof localStorage !== "undefined") localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

// ============================================================
// Time-range normalizer
// ============================================================
function normalizeRange(sh, sm, sMer, eh, em, eMer) {
  let startHr = sh, endHr = eh;
  if (sMer === "pm" && startHr < 12) startHr += 12;
  if (sMer === "am" && startHr === 12) startHr = 0;
  if (eMer === "pm" && endHr < 12) endHr += 12;
  if (eMer === "am" && endHr === 12) endHr = 0;
  if (!sMer && !eMer) { if (sh <= 12 && eh <= 12 && eh < sh && eh >= 1) endHr += 12; }
  else if (!sMer && eMer === "pm") { if (sh <= 6 && sh < eh) startHr += 12; }
  let startMin = startHr * 60 + sm;
  let endMin = endHr * 60 + em;
  if (endMin <= startMin) endMin += 24 * 60;
  return { startMin, endMin };
}

function detectCategory(text) {
  const lowerInput = " " + (text || "").toLowerCase() + " ";
  let bestCat = DEFAULT_CAT, bestScore = 0;
  for (let i = 0; i < CAT_ORDER.length; i++) {
    const cat = CAT_ORDER[i]; const def = CATEGORIES[cat];
    let score = 0;
    for (let j = 0; j < def.keywords.length; j++) {
      const kw = def.keywords[j];
      const re = new RegExp("\\b" + escapeRe(kw) + "\\b", "i");
      if (re.test(lowerInput)) score += kw.length + 2;
    }
    if (score > bestScore) { bestScore = score; bestCat = cat; }
  }
  return bestCat;
}

// Parser (for tasks only — notes are NOT auto-tagged)
// ============================================================
function parseInput(input, today) {
  if (!input || !input.trim()) return null;
  if (!today) today = new Date();
  const original = input.trim();
  const result = { title: original, category: DEFAULT_CAT, priority: "low", time: null, duration: 45, endTime: null, date: null, recurring: null, notes: "", linkedTaskIds: [] };
  const strips = [];

  if (/!!+/.test(original) || /\b(urgent|asap|critical)\b/i.test(original)) { result.priority = "high"; strips.push(/!!+/g); strips.push(/\b(urgent|asap|critical)\b/gi); }
  else if (/!/.test(original) || /\b(important|high priority)\b/i.test(original)) { result.priority = "medium"; strips.push(/!/g); strips.push(/\b(important|high priority)\b/gi); }

  let recurMatched = false;
  const dayPat = "(?:sun(?:day)?|mon(?:day)?|tues?(?:day)?|wed(?:nes(?:day)?|s)?|thu(?:rs?(?:day)?)?|fri(?:day)?|sat(?:urday)?)";

  if (/\b(every\s*day|everyday|daily|each\s*day|nightly)\b/i.test(original)) { result.recurring = { days: [0,1,2,3,4,5,6] }; strips.push(/\b(every\s*day|everyday|daily|each\s*day|nightly)\b/gi); recurMatched = true; }
  else if (/\bweekdays?\b/i.test(original)) { result.recurring = { days: [1,2,3,4,5] }; strips.push(/\bweekdays?\b/gi); recurMatched = true; }
  else if (/\bweekends?\b/i.test(original)) { result.recurring = { days: [0,6] }; strips.push(/\bweekends?\b/gi); recurMatched = true; }
  else {
    const everyRe = new RegExp("\\bevery\\s+((?:" + dayPat + ")(?:\\s*(?:,|and|&|\\s)\\s*(?:" + dayPat + "))*)\\b", "i");
    const em = original.match(everyRe);
    if (em) { const days = extractDays(em[1]); if (days.length) { result.recurring = { days }; strips.push(new RegExp(escapeRe(em[0]), "gi")); recurMatched = true; } }
    if (!recurMatched) {
      const pluralRe = /\b((?:mondays|tuesdays|wednesdays|thursdays|fridays|saturdays|sundays)(?:\s*(?:,|and|&)\s*(?:mondays|tuesdays|wednesdays|thursdays|fridays|saturdays|sundays))*)\b/i;
      const pm = original.match(pluralRe);
      if (pm) {
        const days = []; const re = /\b(mondays|tuesdays|wednesdays|thursdays|fridays|saturdays|sundays)\b/gi; let m;
        while ((m = re.exec(pm[1])) !== null) { const d = DAY_MAP[m[1].slice(0,-1).toLowerCase()]; if (d !== undefined && days.indexOf(d) === -1) days.push(d); }
        if (days.length) { result.recurring = { days }; strips.push(new RegExp(escapeRe(pm[0]), "gi")); recurMatched = true; }
      }
    }
  }

  if (!recurMatched) {
    if (/\btoday\b/i.test(original)) { result.date = formatDate(today); strips.push(/\btoday\b/gi); }
    else if (/\b(tomorrow|tmrw?)\b/i.test(original)) { const t = addDays(today, 1); result.date = formatDate(t); strips.push(/\b(tomorrow|tmrw?)\b/gi); }
    else {
      const dayRe = new RegExp("\\b(?:on\\s+)?(" + dayPat + ")\\b", "i");
      const dm = original.match(dayRe);
      if (dm) { const d = resolveDayKey(dm[1]); if (d !== null) { const t = new Date(today); t.setHours(0,0,0,0); let diff = d - t.getDay(); if (diff < 0) diff += 7; t.setDate(t.getDate() + diff); result.date = formatDate(t); strips.push(new RegExp(escapeRe(dm[0]), "gi")); } }
      else { result.date = formatDate(today); }
    }
  }

  let rangeMatched = false;
  const rangeRe = /\b(?:from\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|—|to|until|till)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/i;
  const rm = original.match(rangeRe);
  if (rm) {
    const sh = parseInt(rm[1], 10);
    const sm_ = rm[2] ? parseInt(rm[2], 10) : 0;
    const sMer = rm[3] ? rm[3].toLowerCase() : null;
    const eh = parseInt(rm[4], 10);
    const em_ = rm[5] ? parseInt(rm[5], 10) : 0;
    const eMer = rm[6] ? rm[6].toLowerCase() : null;
    const hasMer = sMer || eMer;
    const has24 = sh > 12 || eh > 12 || (rm[2] != null) || (rm[5] != null);
    const isBizHours = sh <= 12 && eh <= 12 && eh < sh;
    if (sh >= 0 && sh <= 23 && eh >= 0 && eh <= 23 && sm_ < 60 && em_ < 60 && (hasMer || has24 || isBizHours)) {
      const { startMin, endMin } = normalizeRange(sh, sm_, sMer, eh, em_, eMer);
      const dur = endMin - startMin;
      if (dur > 0 && dur <= 16 * 60) {
        result.time = { hour: Math.floor(startMin / 60) % 24, minute: startMin % 60 };
        result.duration = dur;
        result.endTime = { hour: Math.floor(endMin / 60) % 24, minute: endMin % 60 };
        strips.push(new RegExp(escapeRe(rm[0]), "gi"));
        rangeMatched = true;
      }
    }
  }

  if (!rangeMatched) {
    const t12 = original.match(/\b(?:at\s+|@\s*)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);
    if (t12) { let h = parseInt(t12[1], 10); const m = t12[2] ? parseInt(t12[2], 10) : 0; const ampm = t12[3].toLowerCase(); if (ampm === "pm" && h < 12) h += 12; if (ampm === "am" && h === 12) h = 0; if (h >= 0 && h < 24 && m >= 0 && m < 60) { result.time = { hour: h, minute: m }; strips.push(new RegExp(escapeRe(t12[0]), "gi")); } }
    else {
      const t24 = original.match(/\b(?:at\s+|@\s*)?(\d{1,2}):(\d{2})\b/);
      if (t24) { const h = parseInt(t24[1], 10); const m = parseInt(t24[2], 10); if (h >= 0 && h < 24 && m >= 0 && m < 60) { result.time = { hour: h, minute: m }; strips.push(new RegExp(escapeRe(t24[0]), "g")); } }
      else {
        if (/\bmorning\b/i.test(original))        { result.time = { hour: 9, minute: 0 };  strips.push(/\b(?:in the\s+)?morning\b/gi); }
        else if (/\bafternoon\b/i.test(original)) { result.time = { hour: 14, minute: 0 }; strips.push(/\b(?:in the\s+)?afternoon\b/gi); }
        else if (/\bevening\b/i.test(original))   { result.time = { hour: 19, minute: 0 }; strips.push(/\b(?:in the\s+)?evening\b/gi); }
        else if (/\bnight\b/i.test(original))     { result.time = { hour: 21, minute: 0 }; strips.push(/\b(?:at\s+)?night\b/gi); }
        else if (/\bnoon\b/i.test(original))      { result.time = { hour: 12, minute: 0 }; strips.push(/\b(?:at\s+)?noon\b/gi); }
        else if (/\bmidnight\b/i.test(original))  { result.time = { hour: 0, minute: 0 };  strips.push(/\b(?:at\s+)?midnight\b/gi); }
        else if (/\ball day\b/i.test(original))   { strips.push(/\ball day\b/gi); }
      }
    }
  }

  if (!rangeMatched) {
    const dur = original.match(/\b(\d+(?:\.\d+)?)\s*(h(?:ours?|rs?)?|m(?:ins?|inutes?)?)\b/i);
    if (dur) { const n = parseFloat(dur[1]); const unit = dur[2].toLowerCase(); if (unit.charAt(0) === "h") result.duration = Math.round(n * 60); else result.duration = Math.round(n); strips.push(new RegExp(escapeRe(dur[0]), "gi")); if (result.time) result.endTime = computeEndTime(result.time, result.duration); }
  }

  result.category = detectCategory(original);

  let title = original;
  for (let i = 0; i < strips.length; i++) title = title.replace(strips[i], " ");
  title = title.replace(/\s+/g, " ").trim();
  let prev = "";
  while (prev !== title) { prev = title; title = title.replace(/^(at|on|by|from|to|in|the|a|an|and|or|@|-|–|—|,|;|:|\.)\s+/i, "").replace(/\s+(at|on|by|from|to|in|and|or|@|-|–|—|,|;|:|\.)$/i, "").trim(); }
  if (title.length > 0) result.title = title.charAt(0).toUpperCase() + title.slice(1);
  if (!result.title || result.title.length < 2) result.title = original;
  return result;
}

function resolveDayKey(key) { const k = key.toLowerCase(); if (DAY_MAP[k] !== undefined) return DAY_MAP[k]; const prefixes = ["sun","mon","tue","wed","thu","fri","sat"]; for (let i = 0; i < prefixes.length; i++) { if (k.indexOf(prefixes[i]) === 0) return DAY_MAP[prefixes[i]]; } return null; }
function extractDays(str) { const days = []; const dayRe = /\b(sun(?:day)?|mon(?:day)?|tues?(?:day)?|wed(?:nes(?:day)?|s)?|thu(?:rs?(?:day)?)?|fri(?:day)?|sat(?:urday)?)\b/gi; let m; while ((m = dayRe.exec(str)) !== null) { const d = resolveDayKey(m[1]); if (d !== null && days.indexOf(d) === -1) days.push(d); } return days; }

// Click-outside hook
function useClickOutside(ref, handler) {
  useEffect(() => {
    function onDown(e) { if (ref.current && !ref.current.contains(e.target)) handler(); }
    document.addEventListener("mousedown", onDown);
    document.addEventListener("touchstart", onDown);
    return () => { document.removeEventListener("mousedown", onDown); document.removeEventListener("touchstart", onDown); };
  }, [ref, handler]);
}

// Helpers
function newCollection(name, type, parentId) {
  return {
    id: uid(),
    name: name || "Untitled",
    type: type || "general",
    parentId: parentId || null,
    order: Date.now(),
    createdAt: Date.now()
  };
}

function getChildCollections(collections, parentId) {
  return collections.filter(c => (c.parentId || null) === (parentId || null)).sort((a, b) => (a.order || 0) - (b.order || 0));
}

function getCollectionPath(collections, id) {
  // Returns array of {id, name} from root to this collection
  const map = {};
  for (let i = 0; i < collections.length; i++) map[collections[i].id] = collections[i];
  const path = [];
  let cur = map[id];
  let guard = 0;
  while (cur && guard < 20) {
    path.unshift(cur);
    cur = cur.parentId ? map[cur.parentId] : null;
    guard++;
  }
  return path;
}

function getCollectionWithDescendants(collections, id) {
  // Returns set of ids: this id + all descendants
  const out = new Set([id]);
  let added = true;
  while (added) {
    added = false;
    for (let i = 0; i < collections.length; i++) {
      const c = collections[i];
      if (c.parentId && out.has(c.parentId) && !out.has(c.id)) {
        out.add(c.id);
        added = true;
      }
    }
  }
  return out;
}

// Instantiate a template's blocks (fresh IDs)
function instantiateTemplate(tpl) {
  if (!tpl || !tpl.blocks) return [{ id: uid(), type: "text", content: "", checked: false }];
  return tpl.blocks.map(b => ({
    id: uid(),
    type: b.type,
    content: b.content || "",
    checked: !!b.checked,
    lang: b.lang || undefined
  }));
}

// Get suggested templates for a collection type (prioritize type-matching, then general/journal as universals)
function suggestedTemplates(collectionType, limit) {
  const out = [];
  const seen = new Set();
  function pushAll(arr) {
    for (let i = 0; i < arr.length; i++) {
      if (!seen.has(arr[i].id)) { seen.add(arr[i].id); out.push(arr[i]); }
    }
  }
  if (collectionType) {
    pushAll(TEMPLATES.filter(t => t.type === collectionType));
  }
  pushAll(TEMPLATES.filter(t => t.type === "general"));
  pushAll(TEMPLATES.filter(t => t.type === "journal"));
  return out.slice(0, limit || 8);
}

// Group templates by type for the "all" view
function templatesByType() {
  const map = {};
  for (let i = 0; i < TEMPLATES.length; i++) {
    const t = TEMPLATES[i];
    if (!map[t.type]) map[t.type] = [];
    map[t.type].push(t);
  }
  return map;
}

// --- Markdown → blocks migration (one-way, lossless for our subset) ---
function migrateMarkdownToBlocks(md) {
  if (!md || !md.trim()) return [newBlock("text", "")];
  const blocks = [];
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    // Code fence
    if (/^```/.test(line.trim())) {
      const lang = line.trim().slice(3).trim();
      const codeLines = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i].trim())) {
        codeLines.push(lines[i]);
        i++;
      }
      if (i < lines.length) i++; // skip closing fence
      const codeBlock = newBlock("code", codeLines.join("\n"));
      if (lang) codeBlock.lang = lang;
      blocks.push(codeBlock);
      continue;
    }
    // Headings
    const hMatch = line.match(/^(#{1,3})\s+(.*)$/);
    if (hMatch) { blocks.push(newBlock("h" + hMatch[1].length, hMatch[2].trim())); i++; continue; }
    // Checklist
    const cMatch = line.match(/^\s*[-*]\s+\[([ xX])\]\s+(.*)$/);
    if (cMatch) {
      const b = newBlock("check", cMatch[2].trim());
      b.checked = cMatch[1].toLowerCase() === "x";
      blocks.push(b); i++; continue;
    }
    // Bullet
    const bMatch = line.match(/^\s*[-*]\s+(.*)$/);
    if (bMatch) { blocks.push(newBlock("bullet", bMatch[1].trim())); i++; continue; }
    // Numbered
    const nMatch = line.match(/^\s*\d+[\.\)]\s+(.*)$/);
    if (nMatch) { blocks.push(newBlock("numbered", nMatch[1].trim())); i++; continue; }
    // Divider
    if (/^---+\s*$/.test(line) || /^\*\*\*+\s*$/.test(line)) { blocks.push(newBlock("divider", "")); i++; continue; }
    // Blank line → skip (paragraphs are single-line in our system; multi-line paras get merged)
    if (!line.trim()) { i++; continue; }
    // Paragraph: gather contiguous non-blank, non-special lines
    const paraLines = [line];
    i++;
    while (i < lines.length) {
      const next = lines[i];
      if (!next.trim()) break;
      if (/^```/.test(next.trim())) break;
      if (/^(#{1,3})\s/.test(next)) break;
      if (/^\s*[-*]\s/.test(next)) break;
      if (/^\s*\d+[\.\)]\s/.test(next)) break;
      if (/^---+\s*$/.test(next) || /^\*\*\*+\s*$/.test(next)) break;
      paraLines.push(next);
      i++;
    }
    blocks.push(newBlock("text", paraLines.join(" ").trim()));
  }
  if (blocks.length === 0) blocks.push(newBlock("text", ""));
  return blocks;
}

// Convert blocks back to a markdown string (for search, export, derived title)
function blocksToText(blocks) {
  if (!Array.isArray(blocks)) return "";
  return blocks.map(b => {
    switch (b.type) {
      case "h1": return "# " + b.content;
      case "h2": return "## " + b.content;
      case "h3": return "### " + b.content;
      case "bullet": return "- " + b.content;
      case "numbered": return "1. " + b.content;
      case "check": return "- [" + (b.checked ? "x" : " ") + "] " + b.content;
      case "code": return "```" + (b.lang || "") + "\n" + b.content + "\n```";
      case "math": return b.content;
      case "divider": return "---";
      case "diagram": {
        // Extract text labels from the diagram so they're searchable and exportable
        try {
          const data = JSON.parse(b.content || "{}");
          if (data.kind === "bar") {
            const lines = ["[" + (data.title || "Chart") + "]"];
            for (const d of (data.data || [])) lines.push((d.label || "") + ": " + d.value);
            return lines.join("\n");
          }
          if (data.nodes) {
            return "[" + (data.kind || "Diagram") + ": " + data.nodes.map(n => n.text).filter(Boolean).join(" · ") + "]";
          }
        } catch (e) {}
        return "[Diagram]";
      }
      default: return b.content;
    }
  }).filter(s => s != null).join("\n");
}

function deriveTitleFromBlocks(blocks) {
  if (!Array.isArray(blocks)) return "";
  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    const c = (b.content || "").trim();
    if (c) return c.replace(/^#{1,6}\s+/, "").split("\n")[0];
  }
  return "";
}

// --- Math evaluation ---
// Strip $ and commas from numbers, detect leading currency
function evaluateMathExpression(expr, scope) {
  if (typeof math === "undefined") return { error: "math library not loaded" };
  const trimmed = expr.trim();
  if (!trimmed) return { empty: true };
  // Detect leading currency symbol(s) anywhere — we strip them, evaluate, and report the most common
  const currencyMatches = trimmed.match(/[$£€¥₹]/g);
  const currency = currencyMatches && currencyMatches.length > 0 ? currencyMatches[0] : null;
  // Clean the expression: strip currency symbols, strip thousands commas inside numbers
  let cleaned = trimmed.replace(/[$£€¥₹]/g, "");
  // Strip commas between digits (1,000 → 1000) but not between args of a function (sin(1, 2))
  cleaned = cleaned.replace(/(\d),(\d{3})\b/g, "$1$2").replace(/(\d),(\d{3})\b/g, "$1$2"); // run twice
  try {
    const result = math.evaluate(cleaned, scope);
    return { result, currency };
  } catch (e) {
    return { error: e.message || "invalid" };
  }
}

function formatMathResult(result, currency) {
  if (result === undefined || result === null) return "";
  if (typeof result === "boolean") return result ? "true" : "false";
  if (typeof result === "number") {
    if (!isFinite(result)) return result.toString();
    // Smart rounding: 6 significant digits, trim trailing zeros
    let s;
    if (Math.abs(result) >= 1e15 || (Math.abs(result) > 0 && Math.abs(result) < 1e-4)) {
      s = result.toExponential(4);
    } else {
      s = Number(result.toFixed(6)).toString();
    }
    if (currency) {
      // Format with thousands separators, 2 decimals if it looks like money
      const n = Number(result);
      const fixed = Math.abs(n) >= 1 || n === 0 ? n.toFixed(2) : s;
      const withCommas = fixed.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return currency + withCommas;
    }
    return s;
  }
  if (result && typeof result.toString === "function") {
    try { return result.toString(); } catch (e) { return String(result); }
  }
  return String(result);
}

// --- Math block evaluator (multi-line, with variable scope) ---
function evaluateMathBlock(content) {
  const scope = {};
  const lines = (content || "").split("\n");
  const rendered = [];
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    if (!raw.trim()) { rendered.push({ kind: "blank" }); continue; }
    // Comment lines start with # or //
    if (/^\s*(#|\/\/)/.test(raw)) { rendered.push({ kind: "comment", text: raw }); continue; }
    const { result, currency, error, empty } = evaluateMathExpression(raw, scope);
    if (empty) { rendered.push({ kind: "blank" }); continue; }
    if (error) { rendered.push({ kind: "error", expr: raw, error }); continue; }
    // If the line is just an assignment (`x = 5`), show only the assignment
    const isAssign = /^\s*[a-zA-Z_]\w*\s*=/.test(raw) && !/=.*=/.test(raw.replace(/==/g, ""));
    rendered.push({
      kind: "line",
      expr: raw,
      result: formatMathResult(result, currency),
      isAssign
    });
  }
  return rendered;
}

// --- Code language auto-detect ---
const COMMON_LANGS = ["python", "javascript", "typescript", "java", "rust", "go", "ruby", "bash", "shell", "json", "yaml", "html", "css", "sql", "c", "cpp"];
function detectLanguage(code, hintLang) {
  if (hintLang) return hintLang;
  if (!code || !code.trim()) return null;
  if (typeof hljs === "undefined") return null;
  try {
    const r = hljs.highlightAuto(code, COMMON_LANGS);
    if (r && r.relevance >= 4 && r.language) return r.language;
  } catch (e) {}
  return null;
}

function highlightCode(code, lang) {
  if (typeof hljs === "undefined") return null;
  if (!code) return "";
  try {
    if (lang && hljs.getLanguage(lang)) {
      return hljs.highlight(code, { language: lang, ignoreIllegals: true }).value;
    }
    return hljs.highlightAuto(code, COMMON_LANGS).value;
  } catch (e) {
    return null;
  }
}

// --- Inline markdown rendering (only for text/heading/bullet/check/numbered blocks) ---
function renderInline(text, opts) {
  if (!text) return "";
  // Escape HTML first
  let s = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  // Code spans — done first so we can skip processing inside them
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  // Inline calculator: =expr  →  =expr = result
  // Matches at a word boundary, captures =( ... ) where the expression is balanced text without spaces+operators
  // We greedily grab until whitespace, comma, semicolon, or end of segment.
  // Skip if already inside a wiki-link or other special construct.
  s = s.replace(/(^|\s)=([^\s=<>][^\s=<>]{0,80})(?=$|\s|,|;|\.|\)|!|\?)/g, function(match, lead, expr) {
    // Skip if it looks like part of an HTML tag/code (defensive)
    if (expr.indexOf('<') !== -1 || expr.indexOf('>') !== -1) return match;
    try {
      const cleaned = expr.replace(/,/g, "").replace(/\$/g, "").replace(/£/g, "").replace(/€/g, "").replace(/¥/g, "").replace(/₹/g, "");
      // Reject if no math operators or function calls
      if (!/[\+\-\*\/\^\(]|sqrt|sin|cos|tan|log|ln|abs|round|floor|ceil/.test(cleaned)) return match;
      const v = math.evaluate(cleaned);
      if (v == null || (typeof v === "object" && !v.isUnit)) return match;
      let out;
      if (typeof v === "number") {
        if (!isFinite(v)) return match;
        // Money formatting heuristic
        if (/\$|£|€|¥|₹/.test(expr)) {
          const sym = (expr.match(/[\$£€¥₹]/) || ["$"])[0];
          out = sym + v.toFixed(2);
        } else if (Math.abs(v - Math.round(v)) < 1e-9) {
          out = String(Math.round(v));
        } else {
          out = v.toFixed(4).replace(/\.?0+$/, "");
        }
      } else {
        out = String(v);
      }
      return lead + '<span class="inline-calc">=' + expr + ' <span class="inline-calc-arrow">→</span> <span class="inline-calc-result">' + out + '</span></span>';
    } catch (e) { return match; }
  });
  // Wiki-links [[title]]
  s = s.replace(/\[\[([^\]\n]{1,100})\]\]/g, function(_, target) {
    const trimmed = target.trim();
    const exists = opts && opts.titleIndex ? !!opts.titleIndex[trimmed.toLowerCase()] : true;
    const cls = "wiki-link" + (exists ? "" : " wiki-missing");
    return '<span class="' + cls + '" data-wiki="' + trimmed.replace(/"/g, "&quot;") + '">' + trimmed + '</span>';
  });
  // Bold then italic
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^\*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  // Auto-link bare URLs (after escaping, so we look for http(s)://)
  s = s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  // Optional search-term highlighting
  if (opts && Array.isArray(opts.highlightTerms) && opts.highlightTerms.length > 0) {
    for (let i = 0; i < opts.highlightTerms.length; i++) {
      const term = opts.highlightTerms[i];
      if (!term || term.length < 2) continue;
      const re = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
      s = s.replace(re, '<mark class="search-hit">$1</mark>');
    }
  }
  return s;
}

// --- Slash menu filtering ---
function filterSlashItems(query) {
  if (!query) return SLASH_ITEMS;
  const q = query.toLowerCase();
  return SLASH_ITEMS.filter(it => {
    if (it.type.indexOf(q) !== -1) return true;
    for (let i = 0; i < it.keywords.length; i++) {
      if (it.keywords[i].indexOf(q) !== -1) return true;
    }
    return false;
  });
}

// Auto-grow textarea hook

function useAutoGrow(ref, value) {
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }, [ref, value]);
}

// ============================================================
// Slash menu component
// ============================================================
function SlashMenu({ query, onPick, onClose }) {
  const items = useMemo(() => filterSlashItems(query), [query]);
  const [focused, setFocused] = useState(0);
  const ref = useRef(null);

  useEffect(() => { setFocused(0); }, [query]);

  useEffect(() => {
    function onKey(e) {
      if (e.key === "ArrowDown") { e.preventDefault(); setFocused(f => Math.min(items.length - 1, f + 1)); }
      else if (e.key === "ArrowUp") { e.preventDefault(); setFocused(f => Math.max(0, f - 1)); }
      else if (e.key === "Enter") {
        if (items[focused]) { e.preventDefault(); onPick(items[focused].type); }
      } else if (e.key === "Escape") { e.preventDefault(); onClose(); }
    }
    function onClickOutside(e) {
      if (ref.current && !ref.current.contains(e.target)) onClose();
    }
    document.addEventListener("keydown", onKey, true);
    // Defer the click-outside listener attachment by a tick so the same mousedown
    // that opened the menu doesn't immediately close it.
    const tid = setTimeout(() => document.addEventListener("mousedown", onClickOutside, true), 0);
    return () => {
      document.removeEventListener("keydown", onKey, true);
      document.removeEventListener("mousedown", onClickOutside, true);
      clearTimeout(tid);
    };
  }, [items, focused, onPick, onClose]);

  if (items.length === 0) {
    return (
      <div className="slash-menu" ref={ref}>
        <div className="slash-section-label">No matching block type</div>
      </div>
    );
  }

  return (
    <div className="slash-menu" ref={ref}>
      <div className="slash-section-label">Insert block</div>
      {items.map((it, i) => {
        const meta = BLOCK_TYPES[it.type];
        return (
          <button key={it.type} className={"slash-item" + (i === focused ? " focused" : "")}
                  onMouseEnter={() => setFocused(i)}
                  onMouseDown={(e) => { e.preventDefault(); onPick(it.type); }}>
            <span className="slash-icon">{meta.icon}</span>
            <span className="slash-item-text">
              <span className="slash-item-name">{meta.label}</span>
              <span className="slash-item-desc">{meta.desc}</span>
            </span>
          </button>
        );
      })}
    </div>
  );
}

// DIAGRAM BLOCK — tree, mind map, bar chart
// ============================================================
function DiagramBlock({ block, onChange }) {
  // Parse stored diagram data
  const data = useMemo(() => {
    try { return JSON.parse(block.content || "{}"); }
    catch (e) { return defaultDiagramData("tree"); }
  }, [block.content]);

  function persist(next) {
    onChange(block.id, { content: JSON.stringify(next) });
  }

  function changeKind(kind) {
    if (kind === data.kind) return;
    if (!window.confirm("Switch diagram type to " + kind + "? This replaces the current content.")) return;
    persist(defaultDiagramData(kind));
  }

  return (
    <div className="block">
      <div className="block-row">
        <span className="block-handle">⋮⋮</span>
        <div className="block-content">
          <div className="diagram-block">
            <div className="diagram-toolbar">
              <span className="diagram-kind-label">Diagram</span>
              <div className="diagram-kind-pills">
                <button className={"diagram-kind-pill" + (data.kind === "tree" ? " active" : "")} onClick={() => changeKind("tree")}>Tree</button>
                <button className={"diagram-kind-pill" + (data.kind === "mindmap" ? " active" : "")} onClick={() => changeKind("mindmap")}>Mind map</button>
                <button className={"diagram-kind-pill" + (data.kind === "bar" ? " active" : "")} onClick={() => changeKind("bar")}>Bar chart</button>
              </div>
            </div>
            {data.kind === "bar"
              ? <BarChartEditor data={data} onChange={persist}/>
              : <NodeGraphEditor data={data} onChange={persist}/>}
          </div>
        </div>
      </div>
    </div>
  );
}

// ----- Node graph editor (used for tree + mindmap) -----
function NodeGraphEditor({ data, onChange }) {
  const svgRef = useRef(null);
  const [selected, setSelected] = useState(null);
  const [hovered, setHovered] = useState(null);
  const [drag, setDrag] = useState(null); // { id, offsetX, offsetY }
  const [editingNode, setEditingNode] = useState(null); // node id being text-edited
  const [draftText, setDraftText] = useState("");
  const [pendingConnect, setPendingConnect] = useState(null); // node id starting a connection
  const [view, setView] = useState({ tx: 0, ty: 0, scale: 1 });
  const [pan, setPan] = useState(null); // { startX, startY, startTx, startTy }

  // Bounds
  const W = 600, H = 380;

  function updateNode(id, patch) {
    const nodes = data.nodes.map(n => n.id === id ? Object.assign({}, n, patch) : n);
    onChange(Object.assign({}, data, { nodes }));
  }

  function addChildNode(parentId) {
    const parent = data.nodes.find(n => n.id === parentId);
    if (!parent) return;
    const newId = "n-" + Math.random().toString(36).slice(2, 9);
    const offsetX = data.kind === "mindmap" ? Math.cos(Math.random() * Math.PI * 2) * 110 : (Math.random() - 0.5) * 200;
    const offsetY = data.kind === "mindmap" ? Math.sin(Math.random() * Math.PI * 2) * 90 : 120;
    const newNode = {
      id: newId,
      text: "New",
      x: Math.max(50, Math.min(W - 50, parent.x + offsetX)),
      y: Math.max(40, Math.min(H - 40, parent.y + offsetY)),
      color: parent.color,
      shape: parent.shape || "rect"
    };
    const nodes = data.nodes.concat([newNode]);
    const edges = (data.edges || []).concat([{ from: parentId, to: newId }]);
    onChange(Object.assign({}, data, { nodes, edges }));
    setSelected(newId);
    setTimeout(() => { setEditingNode(newId); setDraftText("New"); }, 50);
  }

  function deleteNode(id) {
    const nodes = data.nodes.filter(n => n.id !== id);
    const edges = (data.edges || []).filter(e => e.from !== id && e.to !== id);
    if (nodes.length === 0) return; // never let the canvas become empty
    onChange(Object.assign({}, data, { nodes, edges }));
    setSelected(null);
  }

  function setNodeColor(id, color) { updateNode(id, { color }); }
  function setNodeShape(id, shape) { updateNode(id, { shape }); }

  function startEditText(node) {
    setEditingNode(node.id);
    setDraftText(node.text || "");
  }
  function commitEditText() {
    if (editingNode) {
      updateNode(editingNode, { text: draftText });
      setEditingNode(null);
    }
  }

  // Convert client coordinates to SVG-internal coords
  function clientToSvg(clientX, clientY) {
    const svg = svgRef.current;
    if (!svg) return { x: 0, y: 0 };
    const rect = svg.getBoundingClientRect();
    const xRel = ((clientX - rect.left) / rect.width) * W;
    const yRel = ((clientY - rect.top) / rect.height) * H;
    // Apply inverse view transform
    return { x: (xRel - view.tx) / view.scale, y: (yRel - view.ty) / view.scale };
  }

  // Node mouse down: start drag, or start connect if Shift-held
  function onNodeMouseDown(e, node) {
    e.stopPropagation();
    if (editingNode) return;
    if (e.shiftKey) {
      // Start a new edge from this node
      setPendingConnect(node.id);
      return;
    }
    const pos = clientToSvg(e.clientX, e.clientY);
    setDrag({ id: node.id, offsetX: pos.x - node.x, offsetY: pos.y - node.y });
    setSelected(node.id);
  }

  function onNodeClick(e, node) {
    e.stopPropagation();
    if (pendingConnect && pendingConnect !== node.id) {
      // Complete the edge
      const exists = (data.edges || []).some(ed => (ed.from === pendingConnect && ed.to === node.id) || (ed.from === node.id && ed.to === pendingConnect));
      if (!exists) {
        const edges = (data.edges || []).concat([{ from: pendingConnect, to: node.id }]);
        onChange(Object.assign({}, data, { edges }));
      }
      setPendingConnect(null);
      return;
    }
    setSelected(node.id);
  }

  function onNodeDoubleClick(e, node) {
    e.stopPropagation();
    startEditText(node);
  }

  // Pan handling (drag on empty SVG background)
  function onSvgMouseDown(e) {
    if (editingNode) return;
    setSelected(null);
    setPendingConnect(null);
    // Start pan
    setPan({ startX: e.clientX, startY: e.clientY, startTx: view.tx, startTy: view.ty });
  }

  function onSvgMouseMove(e) {
    if (drag) {
      const pos = clientToSvg(e.clientX, e.clientY);
      updateNode(drag.id, { x: Math.max(20, Math.min(W - 20, pos.x - drag.offsetX)), y: Math.max(20, Math.min(H - 20, pos.y - drag.offsetY)) });
    } else if (pan) {
      const dx = e.clientX - pan.startX;
      const dy = e.clientY - pan.startY;
      setView(v => ({ tx: pan.startTx + dx, ty: pan.startTy + dy, scale: v.scale }));
    }
  }
  function onSvgMouseUp() { setDrag(null); setPan(null); }
  function onSvgMouseLeave() { setDrag(null); setPan(null); }

  // Touch support — translate single-touch into mouse-like events
  function onTouchStart(e, node) {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    if (node) {
      const pos = clientToSvg(t.clientX, t.clientY);
      setDrag({ id: node.id, offsetX: pos.x - node.x, offsetY: pos.y - node.y });
      setSelected(node.id);
    } else {
      setPan({ startX: t.clientX, startY: t.clientY, startTx: view.tx, startTy: view.ty });
    }
  }
  function onTouchMove(e) {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    if (drag) {
      const pos = clientToSvg(t.clientX, t.clientY);
      updateNode(drag.id, { x: Math.max(20, Math.min(W - 20, pos.x - drag.offsetX)), y: Math.max(20, Math.min(H - 20, pos.y - drag.offsetY)) });
    } else if (pan) {
      const dx = t.clientX - pan.startX;
      const dy = t.clientY - pan.startY;
      setView(v => ({ tx: pan.startTx + dx, ty: pan.startTy + dy, scale: v.scale }));
    }
  }
  function onTouchEnd() { setDrag(null); setPan(null); }

  // Zoom via wheel
  function onWheel(e) {
    if (editingNode) return;
    e.preventDefault();
    const direction = e.deltaY > 0 ? -0.1 : 0.1;
    setView(v => ({ ...v, scale: Math.max(0.5, Math.min(2.5, v.scale + direction)) }));
  }

  // Auto-layout: place root at top center, recursively lay out children
  function autoLayout() {
    if (data.nodes.length === 0) return;
    const childrenOf = {};
    const parentOf = {};
    for (const e of (data.edges || [])) {
      if (!childrenOf[e.from]) childrenOf[e.from] = [];
      childrenOf[e.from].push(e.to);
      parentOf[e.to] = e.from;
    }
    const roots = data.nodes.filter(n => !parentOf[n.id]);
    if (roots.length === 0) return;
    const root = roots[0];

    if (data.kind === "mindmap") {
      // Radial layout: root in middle, first-level children on a circle, second-level further out
      const positions = {};
      positions[root.id] = { x: W / 2, y: H / 2 };
      const firstLevel = childrenOf[root.id] || [];
      const r1 = 130;
      for (let i = 0; i < firstLevel.length; i++) {
        const a = (i / firstLevel.length) * Math.PI * 2;
        positions[firstLevel[i]] = { x: W / 2 + Math.cos(a) * r1, y: H / 2 + Math.sin(a) * r1 * 0.7 };
        const second = childrenOf[firstLevel[i]] || [];
        for (let j = 0; j < second.length; j++) {
          const a2 = a + (j - (second.length - 1) / 2) * 0.5;
          positions[second[j]] = { x: W / 2 + Math.cos(a2) * (r1 + 90), y: H / 2 + Math.sin(a2) * (r1 + 90) * 0.7 };
        }
      }
      const nodes = data.nodes.map(n => positions[n.id] ? Object.assign({}, n, positions[n.id]) : n);
      onChange(Object.assign({}, data, { nodes }));
      return;
    }

    // Tree layout: top-down
    // First compute width of each subtree (with cycle protection)
    const widths = {};
    const visiting = {};
    function widthOf(id) {
      if (widths[id] !== undefined) return widths[id];
      if (visiting[id]) { widths[id] = 1; return 1; } // cycle detected — treat as leaf
      visiting[id] = true;
      const kids = childrenOf[id] || [];
      if (kids.length === 0) { widths[id] = 1; visiting[id] = false; return 1; }
      let sum = 0;
      for (const k of kids) sum += widthOf(k);
      widths[id] = Math.max(1, sum);
      visiting[id] = false;
      return widths[id];
    }
    widthOf(root.id);

    const HSPACING = 90;
    const VSPACING = 90;
    const totalWidth = widths[root.id] * HSPACING;
    const positions = {};
    function place(id, leftX, topY) {
      if (positions[id]) return; // already placed — cycle protection
      const w = widths[id] * HSPACING;
      positions[id] = { x: leftX + w / 2, y: topY };
      const kids = childrenOf[id] || [];
      let xCursor = leftX;
      for (const k of kids) {
        const kW = widths[k] * HSPACING;
        place(k, xCursor, topY + VSPACING);
        xCursor += kW;
      }
    }
    place(root.id, (W - totalWidth) / 2, 40);
    const nodes = data.nodes.map(n => positions[n.id] ? Object.assign({}, n, positions[n.id]) : n);
    onChange(Object.assign({}, data, { nodes }));
  }

  // Keyboard handling when a node is selected
  useEffect(() => {
    function onKey(e) {
      if (editingNode) return;
      if (!selected) return;
      const el = document.activeElement;
      if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) return;
      const selNode = data.nodes.find(n => n.id === selected);
      if (!selNode) return;
      if (e.key === "Tab") { e.preventDefault(); addChildNode(selected); }
      else if (e.key === "Enter") { e.preventDefault(); startEditText(selNode); }
      else if (e.key === "Backspace" || e.key === "Delete") {
        if (data.nodes.length > 1) { e.preventDefault(); deleteNode(selected); }
      }
    }
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [selected, editingNode, data]);

  // Export as PNG
  function exportPng() {
    const svg = svgRef.current;
    if (!svg) return;
    const xml = new XMLSerializer().serializeToString(svg);
    const svg64 = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(xml)));
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement("canvas");
      canvas.width = W * 2; canvas.height = H * 2;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "diagram-" + Date.now() + ".png";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
    };
    img.src = svg64;
  }

  const selNode = selected ? data.nodes.find(n => n.id === selected) : null;
  const edges = data.edges || [];

  return (
    <div className="diagram-canvas-wrap">
      <div className="diagram-action-bar">
        <button className="diagram-action" onClick={autoLayout} title="Auto-layout the diagram">
          ⊞ Auto-layout
        </button>
        {selected && (
          <button className="diagram-action" onClick={() => addChildNode(selected)} title="Add child node (Tab)">
            + Add child
          </button>
        )}
        {selected && data.nodes.length > 1 && (
          <button className="diagram-action danger" onClick={() => deleteNode(selected)} title="Delete selected (Backspace)">
            × Delete
          </button>
        )}
        <span className="diagram-spacer"/>
        <button className="diagram-action" onClick={exportPng} title="Export as PNG">⇩ PNG</button>
      </div>

      {selNode && (
        <div className="diagram-floating-toolbar">
          <span className="diagram-toolbar-label">Color:</span>
          {DIAGRAM_COLORS.map(c => (
            <button key={c} className={"diagram-swatch" + (selNode.color === c ? " active" : "")} style={{background: c}} onClick={() => setNodeColor(selected, c)} aria-label={"Color " + c}/>
          ))}
          <span className="diagram-toolbar-divider"/>
          <span className="diagram-toolbar-label">Shape:</span>
          {DIAGRAM_SHAPES.map(s => (
            <button key={s} className={"diagram-shape-btn" + (selNode.shape === s ? " active" : "")} onClick={() => setNodeShape(selected, s)}>
              {s === "rect" ? "▭" : s === "pill" ? "⬭" : "○"}
            </button>
          ))}
        </div>
      )}

      <svg
        ref={svgRef}
        className="diagram-svg"
        viewBox={"0 0 " + W + " " + H}
        preserveAspectRatio="xMidYMid meet"
        onMouseDown={onSvgMouseDown}
        onMouseMove={onSvgMouseMove}
        onMouseUp={onSvgMouseUp}
        onMouseLeave={onSvgMouseLeave}
        onTouchStart={(e) => onTouchStart(e, null)}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
        onWheel={onWheel}
      >
        <rect x="0" y="0" width={W} height={H} fill="#fafaf9"/>
        <g transform={"translate(" + view.tx + "," + view.ty + ") scale(" + view.scale + ")"}>
          {/* Edges */}
          {edges.map((e, i) => {
            const a = data.nodes.find(n => n.id === e.from);
            const b = data.nodes.find(n => n.id === e.to);
            if (!a || !b) return null;
            return <line key={"e-" + i} x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke="#9d9994" strokeWidth="1.5" strokeLinecap="round"/>;
          })}
          {/* Pending-connect indicator line */}
          {pendingConnect && hovered && pendingConnect !== hovered && (() => {
            const a = data.nodes.find(n => n.id === pendingConnect);
            const b = data.nodes.find(n => n.id === hovered);
            if (!a || !b) return null;
            return <line x1={a.x} y1={a.y} x2={b.x} y2={b.y} stroke="#6366f1" strokeWidth="2" strokeDasharray="4 3"/>;
          })()}
          {/* Nodes */}
          {data.nodes.map(node => {
            const isSelected = selected === node.id;
            const isHovered = hovered === node.id;
            const w = Math.max(70, (node.text || "Node").length * 7 + 24);
            const h = node.shape === "circle" ? Math.max(w, 50) : 36;
            const rad = node.shape === "circle" ? Math.max(w, 50) / 2 : (node.shape === "pill" ? h / 2 : 6);
            return (
              <g
                key={node.id}
                transform={"translate(" + node.x + "," + node.y + ")"}
                style={{ cursor: drag ? "grabbing" : "grab" }}
                onMouseDown={(e) => onNodeMouseDown(e, node)}
                onClick={(e) => onNodeClick(e, node)}
                onDoubleClick={(e) => onNodeDoubleClick(e, node)}
                onMouseEnter={() => setHovered(node.id)}
                onMouseLeave={() => setHovered(null)}
                onTouchStart={(e) => { e.stopPropagation(); onTouchStart(e, node); }}
              >
                {node.shape === "circle" ? (
                  <circle cx={0} cy={0} r={rad} fill={node.color} stroke={isSelected ? "#1c1917" : (isHovered ? "#57534e" : "rgba(0,0,0,0.15)")} strokeWidth={isSelected ? 2.5 : 1.5}/>
                ) : (
                  <rect x={-w/2} y={-h/2} width={w} height={h} rx={rad} ry={rad} fill={node.color} stroke={isSelected ? "#1c1917" : (isHovered ? "#57534e" : "rgba(0,0,0,0.15)")} strokeWidth={isSelected ? 2.5 : 1.5}/>
                )}
                <text x={0} y={4} textAnchor="middle" fontSize="13" fontWeight="500" fill="#ffffff" style={{pointerEvents: "none", userSelect: "none"}}>{(node.text || "").length > 18 ? node.text.slice(0, 17) + "…" : node.text}</text>
              </g>
            );
          })}
        </g>
      </svg>

      {/* Text-editing overlay positioned over selected node */}
      {editingNode && (() => {
        const n = data.nodes.find(nn => nn.id === editingNode);
        if (!n) return null;
        // Compute approximate screen position
        const svg = svgRef.current;
        if (!svg) return null;
        const rect = svg.getBoundingClientRect();
        const left = (((n.x * view.scale) + view.tx) / W) * rect.width + rect.left;
        const top = (((n.y * view.scale) + view.ty) / H) * rect.height + rect.top;
        return (
          <input
            className="diagram-text-edit"
            autoFocus
            value={draftText}
            onChange={e => setDraftText(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); commitEditText(); } else if (e.key === "Escape") { setEditingNode(null); } }}
            onBlur={commitEditText}
            style={{
              position: "fixed",
              left: (left - 80) + "px",
              top: (top - 14) + "px",
              width: "160px"
            }}
          />
        );
      })()}

      <div className="diagram-hint">
        <strong>Tip:</strong> Click a node to select · Drag empty space to pan · Double-click a node to edit text · Tab = add child · Shift+click two nodes to connect them
      </div>
    </div>
  );
}

// ----- Bar chart editor -----
function BarChartEditor({ data, onChange }) {
  const W = 600, H = 320;
  const padL = 50, padR = 20, padT = 40, padB = 60;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;

  const rows = data.data || [];
  const values = rows.map(r => Number(r.value) || 0);
  const maxValue = Math.max(1, ...values, 0);
  const minValue = Math.min(0, ...values);
  const range = maxValue - minValue;
  const barW = chartW / Math.max(1, rows.length) * 0.7;
  const barGap = chartW / Math.max(1, rows.length) * 0.3;

  // Smart Y-axis ticks — spans min to max (which may be negative)
  const tickCount = 5;
  const tickValues = [];
  for (let i = 0; i <= tickCount; i++) tickValues.push(minValue + (range * i / tickCount));

  // Y coordinate for a given data value
  function valueToY(v) {
    return padT + chartH - ((v - minValue) / range) * chartH;
  }
  const zeroY = valueToY(0);

  function updateRow(i, patch) {
    const next = rows.slice();
    next[i] = Object.assign({}, next[i], patch);
    onChange(Object.assign({}, data, { data: next }));
  }
  function addRow() {
    onChange(Object.assign({}, data, { data: rows.concat([{ label: "New", value: 0 }]) }));
  }
  function removeRow(i) {
    if (rows.length <= 1) return;
    onChange(Object.assign({}, data, { data: rows.filter((_, j) => j !== i) }));
  }

  const svgRef = useRef(null);
  function exportPng() {
    const svg = svgRef.current;
    if (!svg) return;
    const xml = new XMLSerializer().serializeToString(svg);
    const svg64 = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(xml)));
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement("canvas");
      canvas.width = W * 2; canvas.height = H * 2;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "chart-" + Date.now() + ".png";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
    };
    img.src = svg64;
  }

  return (
    <div className="diagram-canvas-wrap">
      <div className="diagram-action-bar">
        <input
          type="text"
          value={data.title || ""}
          onChange={e => onChange(Object.assign({}, data, { title: e.target.value }))}
          placeholder="Chart title"
          className="chart-title-input"
        />
        <span className="diagram-spacer"/>
        <div className="diagram-color-strip">
          {DIAGRAM_COLORS.map(c => (
            <button key={c} className={"diagram-swatch" + (data.color === c ? " active" : "")} style={{background: c}} onClick={() => onChange(Object.assign({}, data, { color: c }))} aria-label={"Color " + c}/>
          ))}
        </div>
        <button className="diagram-action" onClick={exportPng} title="Export as PNG">⇩ PNG</button>
      </div>

      <svg ref={svgRef} className="diagram-svg" viewBox={"0 0 " + W + " " + H} preserveAspectRatio="xMidYMid meet">
        <rect x="0" y="0" width={W} height={H} fill="#fafaf9"/>
        {/* Title */}
        {data.title && <text x={W/2} y={22} textAnchor="middle" fontSize="14" fontWeight="600" fill="#1c1917">{data.title}</text>}
        {/* Y-axis grid + labels */}
        {tickValues.map((t, i) => {
          const y = valueToY(t);
          const isZero = Math.abs(t) < 0.0001;
          return (
            <g key={i}>
              <line x1={padL} y1={y} x2={W - padR} y2={y} stroke={isZero ? "#a8a29e" : "#e7e5e4"} strokeWidth="1" strokeDasharray={(i === 0 || isZero) ? "" : "3 3"}/>
              <text x={padL - 8} y={y + 4} textAnchor="end" fontSize="10" fill="#78716c">{Math.abs(t) < 1000 ? t.toFixed(Math.abs(t) < 10 ? 1 : 0) : (t/1000).toFixed(1) + "k"}</text>
            </g>
          );
        })}
        {/* Bars — anchored to zero line, support negative values */}
        {rows.map((r, i) => {
          const value = Number(r.value) || 0;
          const x = padL + (i * (barW + barGap)) + barGap / 2;
          const yTop = value >= 0 ? valueToY(value) : zeroY;
          const yBottom = value >= 0 ? zeroY : valueToY(value);
          const barH = Math.max(0, yBottom - yTop);
          return (
            <g key={i}>
              <rect x={x} y={yTop} width={barW} height={barH} fill={data.color || "#378ADD"} rx="3" ry="3"/>
              <text x={x + barW/2} y={padT + chartH + 16} textAnchor="middle" fontSize="11" fill="#44403c">{r.label}</text>
