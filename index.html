  }
  .focus-meta-type-trading { background: linear-gradient(135deg, rgba(239, 159, 39, 0.12), rgba(239, 159, 39, 0.04)); border-color: rgba(239, 159, 39, 0.32); color: #6f4a10; }
  .focus-meta-type-study   { background: linear-gradient(135deg, rgba(127, 119, 221, 0.12), rgba(127, 119, 221, 0.04)); border-color: rgba(127, 119, 221, 0.32); color: #353170; }
  .focus-meta-type-coding  { background: linear-gradient(135deg, rgba(55, 138, 221, 0.12), rgba(55, 138, 221, 0.04)); border-color: rgba(55, 138, 221, 0.32); color: #18406b; }
  .focus-meta-type-finance { background: linear-gradient(135deg, rgba(202, 138, 4, 0.12), rgba(202, 138, 4, 0.04)); border-color: rgba(202, 138, 4, 0.32); color: #713F12; }
  .focus-meta-type-project { background: linear-gradient(135deg, rgba(216, 90, 48, 0.12), rgba(216, 90, 48, 0.04)); border-color: rgba(216, 90, 48, 0.32); color: #6b2c18; }
  .focus-meta-type-journal { background: linear-gradient(135deg, rgba(212, 83, 126, 0.12), rgba(212, 83, 126, 0.04)); border-color: rgba(212, 83, 126, 0.32); color: #6e293f; }
  .focus-meta-type-health  { background: linear-gradient(135deg, rgba(99, 153, 34, 0.12), rgba(99, 153, 34, 0.04)); border-color: rgba(99, 153, 34, 0.32); color: #324d11; }
  .focus-meta-type-general { background: var(--surface-alt); border-color: var(--border); color: var(--text-2); }

  .focus-title-wrap {
    padding: 8px 36px 18px;
    border-bottom: 1px solid var(--border);
    animation: fade .4s var(--ease-out) backwards;
    animation-delay: 120ms;
  }
  .focus-title {
    font-size: 32px;
    font-weight: 700;
    margin: 0;
    line-height: 1.18;
    letter-spacing: -0.028em;
    color: var(--text);
    word-break: break-word;
    background: linear-gradient(135deg, var(--text) 0%, #3a3733 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }

  /* Format toolbar — sits between title and body. Tap a block in the body
     to "select" it, then tap a button here to convert/insert. */
  .focus-format-toolbar {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 8px 36px;
    background: linear-gradient(180deg, var(--surface-warm) 0%, var(--surface-alt) 100%);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    flex-shrink: 0;
    /* Hide scrollbar while keeping scrollable on overflow */
    scrollbar-width: none;
  }
  .focus-format-toolbar::-webkit-scrollbar { display: none; }
  .focus-format-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 11px;
    min-height: 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-2);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: -0.005em;
    cursor: pointer;
    transition: all var(--t-fast);
    flex-shrink: 0;
    box-shadow: var(--shadow-xs);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .focus-format-btn:hover {
    border-color: var(--border-strong);
    background: var(--surface-warm);
    color: var(--text);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  .focus-format-btn:active {
    transform: translateY(0);
    box-shadow: var(--shadow-xs);
  }
  .focus-format-btn.is-active {
    background: linear-gradient(180deg, var(--accent) 0%, var(--accent-deep) 100%);
    border-color: var(--accent-deep);
    color: white;
    font-weight: 600;
    box-shadow:
      0 1px 2px rgba(67, 70, 209, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.18);
  }
  .focus-format-btn.is-active:hover {
    transform: translateY(-1px);
    box-shadow:
      0 4px 10px rgba(67, 70, 209, 0.32),
      inset 0 1px 0 rgba(255, 255, 255, 0.22);
  }
  .focus-format-btn-icon {
    font-weight: 700;
    font-size: 13px;
    letter-spacing: -0.01em;
    font-feature-settings: 'tnum' 1;
    line-height: 1;
  }
  .focus-format-btn-label {
    font-size: 12px;
    letter-spacing: -0.005em;
  }
  .focus-format-sep {
    width: 1px;
    height: 22px;
    background: var(--border);
    margin: 0 4px;
    flex-shrink: 0;
    align-self: center;
  }

  /* Mobile: hide text labels, show icons only — narrower toolbar */
  @media (max-width: 600px) {
    .focus-format-toolbar { padding: 8px 18px; gap: 2px; }
    .focus-format-btn { padding: 7px 9px; min-width: 36px; min-height: 36px; justify-content: center; }
    .focus-format-btn-label { display: none; }
    .focus-format-btn-icon { font-size: 14px; }
  }
  .focus-body {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 28px 36px 40px;
    animation: fade .45s var(--ease-out) backwards;
    animation-delay: 160ms;
    scroll-behavior: smooth;
    /* Subtle gradient mask at top/bottom for that paper-fade quality */
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 12px, black calc(100% - 12px), transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 12px, black calc(100% - 12px), transparent 100%);
  }
  /* Premium reading typography for the focus view body */
  .focus-body .blocks { padding-left: 0; }
  .focus-body .block-rendered,
  .focus-body .block-text-input {
    font-size: 16px;
    line-height: 1.75;
    letter-spacing: -0.005em;
  }
  .focus-body .block-heading-1 .block-text-input,
  .focus-body .block-heading-1 .block-rendered {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.025em;
    line-height: 1.25;
    padding: 14px 0 4px;
    color: var(--text);
  }
  .focus-body .block-heading-2 .block-text-input,
  .focus-body .block-heading-2 .block-rendered {
    font-size: 20px;
    font-weight: 650;
    letter-spacing: -0.018em;
    line-height: 1.3;
    padding: 10px 0 3px;
    color: var(--text);
  }
  .focus-body .block-heading-3 .block-text-input,
  .focus-body .block-heading-3 .block-rendered {
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 8px 0 2px;
    color: var(--text-2);
  }
  /* Checkbox alignment for the LARGER text in pro notes (focus view).
     Focus body uses 16px / 1.75 line-height. The first line's vertical
     CENTER sits at:  4px padding-top + (28px line-height / 2) = 18px
     from the container's top.

     For an 18×18 checkbox, margin-top needs to be 18 - 9 = 9px
     to put its CENTER at that exact 18px point.

     We use 11px (slightly lower than mathematical center) because the visual
     weight of text sits below the line-box center due to ascenders/descenders. */
  /* === FOCUS VIEW MARKER ALIGNMENT ===
     Focus body text: 16px / 1.75 line-height / 4px padding-top.
     First line center: 4 + (16 × 1.75 / 2) = 18px from container top.

     Same principle as the regular view: markers share the text's font-size
     and line-height so their baselines align automatically with the text.
     For the checkbox (a square, not text): margin-top = 18 - height/2. */
  .focus-body .block-bullet-marker {
    font-size: 16px;
    line-height: 1.75;
    padding-top: 4px;
    min-width: 16px;
  }
  .focus-body .block-numbered .block-num {
    font-size: 16px;
    line-height: 1.75;
    padding-top: 4px;
    min-width: 26px;
  }
  /* Checkbox: 18×18 box → margin-top = 18 - 9 = 9px to center at line center 18px */
  .focus-body .block-check-box {
    width: 18px;
    height: 18px;
    margin-top: 9px;
    border-radius: 5px;
    border-width: 1.5px;
  }
  .focus-body .block-check-box.checked::after {
    width: 9px; height: 5px;
    border-left-width: 2px;
    border-bottom-width: 2px;
  }
  .focus-body .block-check {
    gap: 11px;
    align-items: flex-start;
  }
  /* Block hover state inside focus view — subtle indent indicator */
  .focus-body .block { position: relative; transition: background var(--t-fast); }
  .focus-body .block:hover .block-handle { opacity: 0.55; }
  .focus-body .block-handle {
    opacity: 0;
    transition: opacity var(--t-fast);
    color: var(--text-3);
    cursor: grab;
    user-select: none;
    /* Base alignment for regular text/bullet/numbered/check blocks.
       Focus body text is 16px / 1.75 line-height with 4px padding-top.
       First line center: 4 + (28/2) = 18px from container top.
       Handle is 22px tall with align-items:center, so glyph sits at
       padding-top + 11px. For center at 18px: padding-top = 7px. */
    padding-top: 7px;
  }
  /* Heading blocks have larger text — recalculate per block */
  .focus-body .block-heading-1 .block-handle {
    /* H1: 26px / 1.25 = 32.5px line. Padding-top 14, line center 14 + 16.25 = 30.25.
       Handle glyph center = padding-top + 11. For 30: padding-top = 19px. */
    padding-top: 19px;
  }
  .focus-body .block-heading-2 .block-handle {
    /* H2: 20px / 1.3 = 26px line. Padding-top 10, line center 10 + 13 = 23.
       Handle glyph center = padding-top + 11. For 23: padding-top = 12px. */
    padding-top: 12px;
  }
  .focus-body .block-heading-3 .block-handle {
    /* H3: 13.5px / 1.45 (default) ≈ 19.5px line. Padding-top 8, center at 17.75.
       Handle glyph center = padding-top + 11. For 18: padding-top = 7px. */
    padding-top: 7px;
  }

  /* Status bar at bottom */
  .focus-statusbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 22px;
    background: linear-gradient(180deg, var(--surface-alt) 0%, var(--surface-cool) 100%);
    border-top: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--text-3);
    font-feature-settings: 'tnum' 1;
    flex-shrink: 0;
    font-weight: 500;
    letter-spacing: -0.005em;
  }
  .focus-status-item {
    white-space: nowrap;
    transition: color var(--t-fast);
  }
  .focus-status-item strong { color: var(--text-2); font-weight: 600; }
  .focus-status-dot { opacity: 0.4; }
  .focus-status-spacer { flex: 1; }
  .focus-status-hint { color: var(--text-3); opacity: 0.85; }
  .focus-status-hint kbd {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 10.5px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    color: var(--text-2);
    font-weight: 600;
    margin: 0 2px;
    box-shadow: var(--shadow-xs);
  }

  @media (max-width: 800px) {
    .focus-overlay { padding: 0; }
    .focus-card { max-height: 100vh; min-height: 100vh; border-radius: 0; max-width: 100%; }
    .focus-toolbar { padding: 8px 10px; }
    .focus-tool-label { display: none; }
    .focus-tool-back .focus-tool-label,
    .focus-tool-back span { display: inline; }
    .focus-tool-btn { padding: 8px; min-width: 36px; justify-content: center; }
    .focus-tool-back { padding: 8px 10px; }
    .focus-save-status { font-size: 10.5px; padding: 0 4px; }
    .focus-meta-strip { padding: 14px 18px 4px; }
    .focus-title-wrap { padding: 4px 18px 12px; }
    .focus-title { font-size: 22px; }
    .focus-body { padding: 16px 18px 24px; }
    .focus-body .block-rendered, .focus-body .block-text-input { font-size: 14.5px; }
    .focus-statusbar { padding: 7px 12px; font-size: 10.5px; gap: 6px; }
    .focus-status-hint { display: none; }
  }

  /* Shortcuts cheatsheet */
  .shortcuts-modal {
    position: fixed; inset: 0; z-index: 75;
    background: rgba(28, 25, 23, 0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; animation: fade .15s ease-out;
  }
  .shortcuts-card {
    background: var(--surface);
    width: 100%; max-width: 600px; max-height: 86vh;
    border-radius: var(--radius-lg);
    display: flex; flex-direction: column;
    animation: slideup .22s ease-out;
    overflow: hidden;
  }
  .shortcuts-head {
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .shortcuts-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .shortcuts-body { padding: 12px 18px 18px; overflow-y: auto; }
  .shortcuts-group { margin-top: 14px; }
  .shortcuts-group:first-child { margin-top: 0; }
  .shortcuts-group-title {
    font-size: 10.5px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin: 0 0 6px;
  }
  .shortcuts-list {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr);
    gap: 4px 14px;
    margin: 0;
    font-size: 12.5px;
  }
  .shortcuts-list dt { font-weight: 500; }
  .shortcuts-list dt kbd {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    background: var(--surface-alt); border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 4px;
    color: var(--text);
  }
  .shortcuts-list dd { margin: 0; color: var(--text-2); }

  @media (max-width: 640px) {
    .app { padding: 16px 10px 80px; }
    .header h1 { font-size: 24px; }
    .day-head { padding: 8px 2px; font-size: 10.5px; }
    .day-head .num { font-size: 13px; }
    .day-cell { padding: 5px 3px; min-height: 240px; gap: 4px; }
    .task { font-size: 10px; padding: 7px 7px 7px 11px; gap: 4px; }
    .task::before { width: 3px; }
    .task::after { left: 3px; height: 12px; }
    .task .check { width: 11px; height: 11px; }
    .task .t-time { font-size: 10.5px; }
    .task .priority-dot { top: 5px; right: 5px; width: 5px; height: 5px; }
    .task .t-meta { bottom: 3px; right: 5px; }
    .confetti { left: 10px; top: 11px; }
    .qa-preview { padding-left: 0; }
    .qa-help { padding-left: 0; }
    .time-input { min-width: 118px; padding: 6px 8px; }
    .note-body, .note-body-empty, .note-edit-wrap, .note-tags { padding-left: 0; }
    .notes-header h2 { font-size: 24px; }
    /* (Removed: .notes-search-wrap { max-width: 100%; } — this redundantly
       overrode the same media query's earlier max-width: 40px declaration,
       causing the collapsed search button to drift to the right edge of
       the notes header on mobile Safari. The .expanded rule already
       grows the wrap to full width when the user focuses it.) */
    /* Tighter card chrome on mobile gives the title more horizontal room */
    .note-card-body { padding: 11px 12px 11px; }
    .note-card-header { gap: 8px; }
    .note-actions { gap: 3px; }

    /* ---- Mobile tap targets (iOS HIG recommends 44pt) ---- */
    .qa-add { padding: 11px 18px; font-size: 14px; min-height: 42px; }
    .tpl-trigger { padding: 9px 14px; font-size: 13px; min-height: 38px; }
    .note-action { padding: 9px; min-width: 36px; min-height: 36px; }
    .note-capture { padding: 14px; border-radius: 12px; }
    .note-capture textarea { padding: 12px 14px; font-size: 15px; min-height: 84px; border-radius: 10px; }
    /* Disable iOS auto-zoom on input focus (font-size must be ≥16px to prevent it) */
    .notes-search, .note-capture textarea, .block-text-input, .block-math-input, .block-code-input { font-size: 16px; }
    .note-capture-foot {
      gap: 12px;
      flex-direction: column;
      align-items: flex-start;
    }
    .note-capture-hint { font-size: 11.5px; line-height: 1.6; }
    .note-capture-foot > div { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Legend (category list) — slightly tighter on mobile so it stays compact */
    .legend { gap: 5px; margin-top: 12px; }
    .legend-item { padding: 5px 12px 5px 7px; font-size: 12px; min-height: 30px; }
    .legend-icon { width: 22px; height: 22px; }
  }

  /* ============================================================
     TOUCH-DEVICE HOVER SUPPRESSION
     Some Android tablets and Chromebooks report hover capability, but
     plenty of touch-only devices misreport it. Suppressing the lift
     and bg-shift hovers on devices without a fine pointer prevents
     "stuck hover" after a tap, where the card visually hangs in the
     hovered state until the user touches something else.
     ============================================================ */
  @media (hover: none) or (pointer: coarse) {
    /* Cards / chips / buttons no longer lift on hover — the active
       state still gives tactile feedback on press. */
    .note-card:hover,
    .nav-btn:hover,
    .task:hover,
    .data-menu-item:hover,
    .qa-add:hover:not(:disabled),
    .focus-tool-btn:hover,
    .ws-modal-actions button:hover {
      transform: none;
    }
    /* Border-color and shadow hover changes can stay — they're not
       motion-based and don't get stuck visually after a tap. */
  }

  /* ============================================================
     PHASE 1 — Additive visual layer
     TodayCommandCard / DashboardStrip / EmptyDay / MobileBottomBar
     ============================================================ */

  /* ---- Today Command Card ---- */
  .today-card {
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-warm) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-md);
    display: grid;
    grid-template-columns: auto 1fr auto;
    column-gap: 20px;
    align-items: center;
    position: relative;
    overflow: hidden;
    animation: today-card-in 360ms cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .today-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(120% 80% at 100% 0%, var(--accent-glow), transparent 55%),
      radial-gradient(80% 120% at 0% 100%, rgba(217, 119, 6, 0.06), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  .today-card > * { position: relative; z-index: 1; }

  @keyframes today-card-in {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Progress ring */
  .today-card-ring {
    position: relative;
    width: 84px;
    height: 84px;
    flex-shrink: 0;
  }
  .today-card-ring svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .today-card-ring-bg {
    stroke: var(--border-strong);
    fill: none;
    stroke-width: 4.5;
  }
  .today-card-ring-fg {
    stroke: var(--accent);
    fill: none;
    stroke-width: 4.5;
    stroke-linecap: round;
    transition: stroke-dashoffset 700ms cubic-bezier(0.2, 0.7, 0.3, 1);
    filter: drop-shadow(0 1px 2px var(--accent-glow));
  }
  .today-card-ring-label {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .today-card-ring-label small {
    font-size: 9px;
    font-weight: 700;
    color: var(--text-3);
    margin-top: 5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* Main column (date + rows + dots) */
  .today-card-main {
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }
  .today-card-date {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 1px;
  }
  .today-card-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13.5px;
    min-width: 0;
  }
  .today-card-row-label {
    color: var(--text-3);
    font-weight: 700;
    font-size: 9.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    flex-shrink: 0;
    min-width: 42px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  /* Subtle pulsing accent dot that appears next to "NOW" when a task is
     actively in its time window. Replaces the previous lightning bolt
     emoji — quieter, more iOS-native feel. */
  .today-card-now-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent-glow);
    animation: now-dot-pulse 1800ms ease-in-out infinite;
    flex-shrink: 0;
  }
  /* When the active task is LIVE, swap dot to red and tighten the
     pulse cadence — separates "user explicitly tapped Live" from
     "task is in its scheduled time window". */
  .today-card-now-dot.is-live {
    background: var(--danger);
    box-shadow: 0 0 0 0 rgba(193, 48, 43, 0.30);
    animation: now-dot-pulse-live 1200ms ease-in-out infinite;
  }
  @keyframes now-dot-pulse-live {
    0%, 100% { box-shadow: 0 0 0 0 rgba(193, 48, 43, 0.4); transform: scale(1); }
    50%      { box-shadow: 0 0 0 5px transparent; transform: scale(1.2); }
  }
  /* The "Now" task title takes a quiet red accent when the task is
     live — pairs with the dot without shouting. */
  .today-card-row-task.is-live {
    color: var(--danger);
    font-weight: 600;
  }
  @keyframes now-dot-pulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
    50%      { box-shadow: 0 0 0 4px transparent; }
  }
  @media (prefers-reduced-motion: reduce) {
    .today-card-now-dot,
    .today-card-now-dot.is-live { animation: none; }
  }
  .today-card-row-task {
    color: var(--text);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    flex: 1;
  }
  .today-card-row-task.empty {
    color: var(--text-3);
    font-weight: 400;
  }
  .today-card-row-time {
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
    background: var(--surface-alt);
    padding: 2px 6px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }
  .today-card-dots {
    display: flex;
    gap: 5px;
    margin-top: 6px;
    flex-wrap: wrap;
  }
  .today-card-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(28, 25, 23, 0.06);
  }
  /* Phase B: today card category pills — replaces the small color dots.
     Uses the same .cat-* pastel system as task cards, note cards, etc.
     Reads as a key for what categories are scheduled today. */
  .today-card-cat-pill {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2.5px 8px;
    border-radius: 999px;
    line-height: 1.3;
    /* Pastel fill + ink color come from the .cat-* generic rules
       added in step 2. Just a thin border for crisp definition. */
    border: 1px solid rgba(28, 25, 23, 0.06);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  /* Small count badge inside the pill — only renders when > 1 pending
     task of that category remains. Sits to the right of the label,
     same ink color as the pill, slightly heavier separator. */
  .today-card-cat-pill-count {
    font-size: 9px;
    font-weight: 800;
    padding: 0 5px;
    border-radius: 999px;
    background: rgba(28, 25, 23, 0.10);
    line-height: 1.4;
    min-width: 14px;
    text-align: center;
    /* Tabular numbers so multi-digit counts (10+) don't shift width */
    font-variant-numeric: tabular-nums;
  }

  /* Time-remaining row — clock icon as label + total pending duration.
     Shows "—" when nothing is pending (matches the em-dash convention
     used by the ring when total tasks is 0). The icon is sized to
     match the cap-height of the "NOW"/"NEXT" labels so the three rows
     visually align on the left. */
  .today-card-row-label-icon {
    color: var(--text-3);
    display: inline-flex;
    align-items: center;
    justify-content: flex-start;
    /* Match the height/min-width of the text labels for vertical alignment */
    min-width: 42px;
    padding-top: 0;
  }
  .today-card-row-label-icon svg {
    opacity: 1;
  }
  .today-card-time-left-value {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  /* Live analog clock face. The whole element shakes briefly when a
     task gets completed (pendingMinutes drops). Hands rotate smoothly
     to their new positions thanks to a transition on the inline
     transform — easing has a tiny overshoot for mechanical feel. */
  .live-clock {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    /* Subtle dropshadow under the watch — premium touch */
    filter:
      drop-shadow(0 1px 1px rgba(28, 25, 23, 0.08))
      drop-shadow(0 0.5px 0 rgba(255, 255, 255, 0.6));
    transform-origin: center;
    will-change: transform;
    transition: filter 280ms ease;
  }
  /* When a task is live, the clock face wears a red halo — visual
     hook between the LIVE banner and the running countdown. The
     halo is a drop-shadow on the whole SVG so it follows the round
     outline rather than the box. Subtly breathes. */
  .live-clock.is-tracking-live {
    filter:
      drop-shadow(0 0 4px rgba(193, 48, 43, 0.55))
      drop-shadow(0 0 1.5px rgba(193, 48, 43, 0.40))
      drop-shadow(0 1px 1px rgba(28, 25, 23, 0.10));
    animation: live-clock-halo 2200ms ease-in-out infinite;
  }
  @keyframes live-clock-halo {
    0%, 100% { filter:
      drop-shadow(0 0 4px rgba(193, 48, 43, 0.55))
      drop-shadow(0 0 1.5px rgba(193, 48, 43, 0.40))
      drop-shadow(0 1px 1px rgba(28, 25, 23, 0.10)); }
    50%      { filter:
      drop-shadow(0 0 7px rgba(193, 48, 43, 0.65))
      drop-shadow(0 0 3px rgba(193, 48, 43, 0.50))
      drop-shadow(0 1px 1px rgba(28, 25, 23, 0.10)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .live-clock.is-tracking-live { animation: none; }
  }
  .live-clock-svg {
    overflow: visible;
  }
  /* Hands rotate via inline transform; the transition makes them
     sweep smoothly when pendingMinutes changes. Cubic-bezier has a
     light overshoot — feels mechanical, not robotic. */
  .live-clock-hand {
    transition: transform 720ms cubic-bezier(0.34, 1.32, 0.5, 1);
  }
  /* Second hand — shorter, linear transition so it ticks crisply
     rather than overshooting each second. The 59→0 wrap once a
     minute does a quick backward sweep — barely noticeable at this
     speed, and matches how cheap quartz watches handle it. */
  .live-clock-hand-second {
    transition: transform 260ms cubic-bezier(0.5, 0, 0.5, 1);
  }
  /* "Vibrate" on task completion — a short multi-axis wobble plus a
     tiny scale pop. Quick attack, settled bounce-back. Same shape as
     the bottom-bar tap pulse but stronger, since this is a
     celebratory micro-interaction. */
  .live-clock.is-pulsing {
    animation: live-clock-shake 520ms cubic-bezier(0.36, 0.07, 0.19, 0.97);
  }
  @keyframes live-clock-shake {
    0%   { transform: translateX(0)    rotate(0)    scale(1); }
    15%  { transform: translateX(-1.5px) rotate(-4deg) scale(1.10); }
    30%  { transform: translateX( 1.5px) rotate( 5deg) scale(1.12); }
    45%  { transform: translateX(-1px)   rotate(-3deg) scale(1.08); }
    60%  { transform: translateX( 1px)   rotate( 2deg) scale(1.05); }
    75%  { transform: translateX(-0.5px) rotate(-1deg) scale(1.03); }
    100% { transform: translateX(0)    rotate(0)    scale(1); }
  }
  /* Respect reduce-motion: kill the shake AND make hands jump rather
     than sweep, so users who avoid motion don't get any of it. */
  @media (prefers-reduced-motion: reduce) {
    .live-clock-hand { transition: none; }
    .live-clock.is-pulsing { animation: none; }
  }

  /* Action button */
  .today-card-action {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 140ms ease, transform 140ms ease, box-shadow 140ms ease;
    box-shadow:
      0 1px 1px rgba(28, 25, 23, 0.08),
      0 2px 6px -1px var(--accent-glow);
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .today-card-action:hover {
    background: var(--accent-deep);
    transform: translateY(-1px);
    box-shadow:
      0 1px 1px rgba(28, 25, 23, 0.08),
      0 6px 14px -2px var(--accent-glow);
  }
  .today-card-action:active { transform: translateY(0); }
  .today-card-action:focus-visible {
    outline: 2px solid var(--border-focus);
    outline-offset: 2px;
  }

  @media (max-width: 600px) {
    .today-card {
      grid-template-columns: auto 1fr;
      grid-template-rows: auto auto;
      column-gap: 14px;
      row-gap: 12px;
      padding: 14px 16px;
    }
    .today-card-action {
      grid-column: 1 / -1;
      justify-content: center;
      padding: 11px 14px;
    }
    .today-card-ring { width: 72px; height: 72px; }
  }

  /* ---- Dashboard strip ---- */
  .dash-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }
  .dash-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 11px 13px;
    display: flex;
    align-items: center;
    gap: 11px;
    box-shadow: var(--shadow-sm);
    min-width: 0;
    transition: border-color 140ms ease, transform 140ms ease;
  }
  .dash-card:hover { border-color: var(--border-strong); }
  .dash-card-icon {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    /* Phase B: softer warm tint instead of indigo accent. The icons
       are decorative — they don't need to share the chrome's brand
       accent. Cards that pass a per-card accent (Routines green,
       High Priority red, Notes purple) still override this. */
    background: rgba(120, 88, 40, 0.08);
    color: var(--text-2);
  }
  .dash-card-body {
    display: flex;
    flex-direction: column;
    min-width: 0;
    gap: 1px;
    flex: 1;
  }
  .dash-card-value {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .dash-card-label {
    font-size: 9.5px;
    font-weight: 700;
    color: var(--text-3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 1px;
  }
  .dash-card-visual {
    width: 100%;
    display: flex;
    align-items: end;
    gap: 2px;
    height: 8px;
    margin-top: 5px;
  }
  .dash-card-visual span {
    flex: 1;
    background: var(--border-strong);
    border-radius: 1.5px;
    height: 100%;
    transition: background 240ms ease;
  }
  .dash-card-visual span.on { background: var(--accent); }

  @media (max-width: 600px) {
    .dash-strip { grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
    .dash-card { padding: 10px 11px; gap: 9px; }
    .dash-card-icon { width: 28px; height: 28px; }
    .dash-card-value { font-size: 15px; }
  }

  /* ---- Empty day cell (inside grid) ---- */
  .day-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px 8px;
    border: 1.5px dashed var(--border-strong);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    background: transparent;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    gap: 6px;
    margin: 6px 0;
    min-height: 52px;
    transition: border-color 160ms ease, color 160ms ease, background 160ms ease;
  }
  .day-empty-icon { opacity: 0.55; }
  .day-cell:hover .day-empty {
    border-color: var(--accent-ring);
    color: var(--text-2);
    background: var(--accent-soft);
  }
  .day-cell.today .day-empty {
    border-color: var(--accent-ring);
    color: var(--text-3);
  }

  /* ---- Mobile bottom bar ---- */
  .mobile-bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: none;
    background: var(--surface-overlay);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--border);
    padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
    z-index: 40;
    box-shadow: 0 -1px 4px rgba(28, 25, 23, 0.04);
  }
  /* Hide the bottom bar whenever a sheet/modal scrim is on screen.
     Without this the bar floats over the sheet and (worse) intercepts
     scroll touches near the bottom edge — making it impossible to reach
     close/delete buttons that live at the end of a long task sheet.
     :has() is supported in iOS Safari 15.4+. */
  body:has(.scrim) .mobile-bottom-bar { display: none !important; }
  .mobile-bottom-bar-inner {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2px;
    max-width: 480px;
    margin: 0 auto;
  }
  .mobile-bottom-bar button {
    background: transparent;
    border: none;
    padding: 6px 4px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 3px;
    color: var(--text-2);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.02em;
    font-family: inherit;
    cursor: pointer;
    border-radius: var(--radius-md);
    -webkit-tap-highlight-color: transparent;
    transition: color 120ms ease;
  }
  .mobile-bottom-bar button:active { color: var(--accent); }
  .mobile-bottom-bar button:focus-visible {
    outline: 2px solid var(--border-focus);
    outline-offset: 2px;
  }
  .mobile-bottom-bar-icon-wrap {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    color: var(--text-2);
    transition: background 140ms ease, color 140ms ease, transform 140ms ease;
  }
  .mobile-bottom-bar button:active .mobile-bottom-bar-icon-wrap {
    background: var(--accent-soft);
    color: var(--accent);
  }

  /* Tap feedback — :active alone is too brief on mobile because the
     finger lifts in <100ms. We add a `.tapped` class via JS that
     persists for 360ms so the animation is actually visible. The
     animation is a single tasteful pulse: icon-wrap fills with accent
     soft, scales up briefly, then settles back. Label also flashes the
     accent color. */
  .mobile-bottom-bar button.tapped .mobile-bottom-bar-icon-wrap {
    animation: tap-pulse 360ms cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .mobile-bottom-bar button.tapped { color: var(--accent); }
  .mobile-bottom-bar button.tapped > span:not(.mobile-bottom-bar-icon-wrap) {
    animation: tap-label 360ms cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  @keyframes tap-pulse {
    0%   { background: transparent;        color: var(--text-2); transform: scale(1); }
    25%  { background: var(--accent-soft); color: var(--accent); transform: scale(1.18); }
    60%  { background: var(--accent-soft); color: var(--accent); transform: scale(1.0); }
    100% { background: transparent;        color: var(--text-2); transform: scale(1); }
  }
  @keyframes tap-label {
    0%   { color: var(--text-2); }
    25%  { color: var(--accent); }
    100% { color: var(--text-2); }
  }

  @media (prefers-reduced-motion: reduce) {
    .mobile-bottom-bar button.tapped .mobile-bottom-bar-icon-wrap,
    .mobile-bottom-bar button.tapped > span {
      animation: none;
    }
    /* Still give SOME feedback even in reduce-motion: instant color change */
    .mobile-bottom-bar button.tapped .mobile-bottom-bar-icon-wrap {
      background: var(--accent-soft);
      color: var(--accent);
    }
  }
  /* Add tab inherits the same neutral icon styling as Today/Notes/Search.
     (Previously we filled it with the accent color to give it visual
     prominence, but on a 4-tab bar with no FAB elevation it felt
     out of place — see screenshot feedback. All four tabs now look
     visually consistent.) */

  /* Show on small screens, and reserve room at the bottom of .app so
     content doesn't hide behind the bar. */
  @media (max-width: 600px) {
    .mobile-bottom-bar { display: block; }
    .app {
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
    }
  }

  /* ---- Reduced motion ---- */
  @media (prefers-reduced-motion: reduce) {
    .today-card { animation: none; }
    .today-card-ring-fg { transition: none; }
    .today-card-action,
    .dash-card,
    .day-empty,
    .mobile-bottom-bar-icon-wrap,
    .dash-card-visual span { transition: none; }
  }

  /* ---- END PHASE 1 ---- */


  /* ============================================================
     PHASE 2 — Notes visual polish (additive)
     - Category accent strip on note cards
     - Refined linked-task pills
     - Prettier template cards
     - Differentiated empty-state visuals
     - Light motion polish
     ============================================================ */

  /* Subtle vertical category strip on each note card. The card already has
     a top time-of-day gradient (TimeStrip) and a category badge in the
     header — this adds a third, quiet hint of category along the left
     edge. Width is small and opacity is restrained so it doesn't compete
     with the existing visual elements. */
  .note-card::after {
    content: "";
    position: absolute;
    left: 0;
    top: 8px;
    bottom: 8px;
    width: 2.5px;
    border-radius: 0 2px 2px 0;
    background: transparent;
    opacity: 0;
    transition: opacity var(--t-base, 180ms ease), background 200ms ease;
    pointer-events: none;
    z-index: 1;
  }
  .note-card.cat-trading::after  { background: #EF9F27; opacity: 0.7; }
  .note-card.cat-study::after    { background: #7F77DD; opacity: 0.7; }
  .note-card.cat-build::after    { background: #378ADD; opacity: 0.7; }
  .note-card.cat-cricket::after  { background: #1D9E75; opacity: 0.7; }
  .note-card.cat-social::after   { background: #D4537E; opacity: 0.7; }
  .note-card.cat-health::after   { background: #639922; opacity: 0.7; }
  .note-card.cat-personal::after { background: #D85A30; opacity: 0.7; }
  .note-card.cat-finance::after  { background: #EAB308; opacity: 0.7; }
  .note-card.cat-admin::after    { background: #888780; opacity: 0.6; }
  .note-card:hover::after        { opacity: 0.95; }
  /* Untagged notes get no strip — keeps "no category" visually quiet */

  /* Pastel wash — soft gradient from the category pastel on the left
     edge, fading to the card's normal surface. Note cards are big,
     so we don't paint the whole card pastel like tasks; just a 35%
     fade from the left. This carries the same visual language as the
     pastel task blocks without overwhelming the notes feed. */
  .note-card.cat-trading  { background: linear-gradient(90deg, #fdf2dc 0%, var(--surface) 35%); }
  .note-card.cat-study    { background: linear-gradient(90deg, #ecebfb 0%, var(--surface) 35%); }
  .note-card.cat-build    { background: linear-gradient(90deg, #e2effa 0%, var(--surface) 35%); }
  .note-card.cat-cricket  { background: linear-gradient(90deg, #def0e7 0%, var(--surface) 35%); }
  .note-card.cat-social   { background: linear-gradient(90deg, #fbe4ec 0%, var(--surface) 35%); }
  .note-card.cat-health   { background: linear-gradient(90deg, #e7f0d8 0%, var(--surface) 35%); }
  .note-card.cat-personal { background: linear-gradient(90deg, #fbe5da 0%, var(--surface) 35%); }
  .note-card.cat-finance  { background: linear-gradient(90deg, #faefcb 0%, var(--surface) 35%); }
  .note-card.cat-admin    { background: linear-gradient(90deg, #ededeb 0%, var(--surface) 35%); }

  /* Pinned notes: bump the strip to the accent color and make it slightly
     more prominent — pinned should feel a touch more present. */
  .note-card.pinned::after {
    background: var(--accent);
    opacity: 0.9;
    width: 3px;
  }

  /* Linked-task pill — small refinements for premium feel.
     Existing markup: .note-linked-chip > LinkIcon + .note-linked-chip-text + .note-linked-unlink */
  .note-linked-chip {
    transition:
      background var(--t-fast, 120ms ease),
      border-color var(--t-fast, 120ms ease),
      transform var(--t-fast, 120ms ease),
      box-shadow var(--t-fast, 120ms ease);
  }
  .note-linked-chip:hover {
    transform: translateY(-0.5px);
    box-shadow: var(--shadow-xs);
  }
  .note-linked-chip-text {
    cursor: pointer;
    transition: color var(--t-fast, 120ms ease);
  }
  .note-linked-chip-text:hover { text-decoration: underline; text-underline-offset: 2px; }

  /* Template cards — a touch more polish. Keep the existing layout but
     add a subtle gradient + lift, and a small accent dot in the corner
     for the "type" so scanning the grid is easier. */
  .tpl-card {
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-warm) 100%);
    box-shadow: var(--shadow-xs);
    transition: all 160ms cubic-bezier(0.2, 0.7, 0.3, 1);
    border-radius: var(--radius);
  }
  .tpl-card::before {
    width: 3px;
    border-radius: 1.5px 0 0 1.5px;
  }
  /* Phase A: pastel wash matching note cards. Each template's category
     uses the same pastel-fading-to-cream gradient as the note card it
     would create. t-* names are templates' own category set — they
     don't map 1:1 to .cat-* but each picks the closest brand pastel. */
  .tpl-card.t-trading  { background: linear-gradient(90deg, #fdf2dc 0%, var(--surface-warm) 35%); }
  .tpl-card.t-study    { background: linear-gradient(90deg, #ecebfb 0%, var(--surface-warm) 35%); }
  .tpl-card.t-coding   { background: linear-gradient(90deg, #e2effa 0%, var(--surface-warm) 35%); }
  .tpl-card.t-finance  { background: linear-gradient(90deg, #faefcb 0%, var(--surface-warm) 35%); }
  .tpl-card.t-journal  { background: linear-gradient(90deg, #fbe4ec 0%, var(--surface-warm) 35%); }
  .tpl-card.t-health   { background: linear-gradient(90deg, #e7f0d8 0%, var(--surface-warm) 35%); }
  .tpl-card.t-project  { background: linear-gradient(90deg, #fbe5da 0%, var(--surface-warm) 35%); }
  .tpl-card.t-general  { background: linear-gradient(90deg, #ededeb 0%, var(--surface-warm) 35%); }
  .tpl-card:hover {
    border-color: var(--border-strong);
    box-shadow:
      0 1px 2px rgba(28, 25, 23, 0.04),
      0 8px 18px -6px rgba(28, 25, 23, 0.08);
    transform: translateY(-1.5px);
  }
  .tpl-card-name {
    letter-spacing: -0.005em;
  }
  /* Block-type tags inside template cards — slightly more refined */
  .tpl-card-block-tag {
    transition: background 140ms ease;
  }
  .tpl-card-wrap:hover .tpl-card-block-tag {
    background: var(--surface-alt);
  }

  /* ---- Empty state variants ----
     The existing single empty state is being replaced by three case-specific
     variants in the JSX. CSS here just styles the shared pieces of all three. */
  .notes-empty .notes-empty-icon svg {
    transition: transform 480ms cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .notes-empty:hover .notes-empty-icon svg {
    transform: translateY(-1.5px);
  }
  /* Slight stagger for the empty-state inner pieces when it appears */
  .notes-empty {
    animation: notes-empty-in 380ms cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  @keyframes notes-empty-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Variant-specific tint — when there's a search active, the empty state
     gets a soft accent ring so it reads as "filter feedback" rather than
     "you have nothing." */
  .notes-empty.is-search .notes-empty-icon {
    color: var(--accent);
  }
  .notes-empty.is-collection .notes-empty-icon {
    color: var(--text-3);
  }
  .notes-empty.is-first-time .notes-empty-icon {
    color: var(--accent);
  }

  /* Motion polish — extra reduce-motion guards for what we just added. */
  @media (prefers-reduced-motion: reduce) {
    .note-card::after,
    .note-linked-chip,
    .note-linked-chip-text,
    .tpl-card,
    .tpl-card-block-tag,
    .notes-empty,
    .notes-empty .notes-empty-icon svg {
      transition: none !important;
      animation: none !important;
    }
  }

  /* ---- END PHASE 2 ---- */


  /* ============================================================
     PHASE 3 — Interactive dashboard mini-cards + MetricSheet
     ============================================================ */

  /* Dash card becomes a real button when interactive. We override
     default button styles (background, font inheritance, alignment)
     because all-but-one of the bar's children expect div-like layout. */
  button.dash-card {
    border: 1px solid var(--border);
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    width: 100%;
  }
  .dash-card.interactive {
    transition:
      transform var(--t-fast, 120ms ease),
      border-color var(--t-fast, 120ms ease),
      box-shadow var(--t-fast, 120ms ease),
      background var(--t-fast, 120ms ease);
  }
  .dash-card.interactive:hover {
    border-color: var(--border-strong);
    transform: translateY(-1px);
    box-shadow:
      0 1px 2px rgba(28, 25, 23, 0.04),
      0 6px 14px -4px rgba(28, 25, 23, 0.08);
  }
  .dash-card.interactive:active {
    transform: translateY(0) scale(0.985);
    background: var(--surface-warm);
  }
  .dash-card.interactive:focus-visible {
    outline: 2px solid var(--border-focus);
    outline-offset: 2px;
    border-color: var(--border-focus);
  }
  /* Disabled state — value is "—", nothing to drill into. Keep it
     visible but muted so the strip still reads as a unit. */
  .dash-card.disabled {
    opacity: 0.7;
    cursor: default;
  }
  .dash-card.disabled .dash-card-value { color: var(--text-3); }

  /* ---- Metric sheet ---- */
  .metric-sheet {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .metric-sheet-header {
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 2;
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto;
    column-gap: 10px;
    align-items: center;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    margin: -2px -2px 0;
    padding-left: 2px;
    padding-right: 2px;
  }
  .metric-sheet-title {
    grid-column: 1;
    grid-row: 1;
    font-size: 19px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .metric-sheet-subtitle {
    grid-column: 1;
    grid-row: 2;
    font-size: 12px;
    color: var(--text-3);
    margin-top: 2px;
  }
  .metric-sheet-close {
    grid-column: 2;
    grid-row: 1 / span 2;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background var(--t-fast, 120ms ease), color var(--t-fast, 120ms ease);
    -webkit-tap-highlight-color: transparent;
  }
  .metric-sheet-close:hover {
    background: var(--surface-warm);
    color: var(--text);
  }
  .metric-sheet-close:active { transform: scale(0.94); }

  .metric-sheet-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-bottom: 4px;
  }
  .metric-sheet-empty {
    padding: 32px 16px;
    text-align: center;
    color: var(--text-3);
    font-size: 13.5px;
  }

  /* Each row in the sheet — full-width button that opens the task. */
  .metric-sheet-row {
    position: relative;
    display: grid;
    grid-template-columns: auto 1fr auto;
    column-gap: 12px;
    align-items: center;
    padding: 11px 12px 11px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    -webkit-tap-highlight-color: transparent;
    transition:
      transform var(--t-fast, 120ms ease),
      border-color var(--t-fast, 120ms ease),
      box-shadow var(--t-fast, 120ms ease),
      background var(--t-fast, 120ms ease);
  }
  .metric-sheet-row:hover {
    border-color: var(--border-strong);
    box-shadow: var(--shadow-xs);
  }
  .metric-sheet-row:active {
    transform: scale(0.99);
    background: var(--surface-warm);
  }
  .metric-sheet-row.done {
    opacity: 0.55;
  }
  .metric-sheet-row.done .metric-sheet-row-title {
    text-decoration: line-through;
    text-decoration-color: var(--text-3);
  }
  .metric-sheet-row.high {
    border-color: rgba(193, 48, 43, 0.4);
  }
  .metric-sheet-row.high:hover {
    border-color: rgba(193, 48, 43, 0.7);
  }
  /* LIVE row in metric sheet — solid red border + faint red glow,
     and the LIVE flag badge gets a pulsing dot. Overrides .high
     styling because live is a stronger signal. */
  .metric-sheet-row.is-live {
    border-color: var(--danger);
    box-shadow:
      0 0 0 1px rgba(193, 48, 43, 0.15),
      0 4px 12px -3px rgba(193, 48, 43, 0.18);
  }
  .metric-sheet-row-flag-live {
    background: var(--danger) !important;
    color: white !important;
    display: inline-flex !important;
    align-items: center;
    gap: 4px;
  }
  .metric-sheet-row-flag-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.6);
    animation: live-flag-dot-pulse 1400ms ease-in-out infinite;
  }
  @keyframes live-flag-dot-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.6); }
    50%      { box-shadow: 0 0 0 3px transparent; }
  }
  @media (prefers-reduced-motion: reduce) {
    .metric-sheet-row-flag-dot { animation: none; }
  }

  /* Category strip on the left of each row — same visual hint as note cards. */
  .metric-sheet-row-cat-strip {
    grid-column: 1;
    grid-row: 1;
    width: 3px;
    align-self: stretch;
    margin: 2px 0;
    margin-left: -10px;
    border-radius: 0 2px 2px 0;
    background: var(--border-strong);
  }
  .metric-sheet-row.cat-trading  .metric-sheet-row-cat-strip { background: #EF9F27; }
  .metric-sheet-row.cat-study    .metric-sheet-row-cat-strip { background: #7F77DD; }
  .metric-sheet-row.cat-build    .metric-sheet-row-cat-strip { background: #378ADD; }
  .metric-sheet-row.cat-cricket  .metric-sheet-row-cat-strip { background: #1D9E75; }
  .metric-sheet-row.cat-social   .metric-sheet-row-cat-strip { background: #D4537E; }
  .metric-sheet-row.cat-health   .metric-sheet-row-cat-strip { background: #639922; }
  .metric-sheet-row.cat-personal .metric-sheet-row-cat-strip { background: #D85A30; }
  .metric-sheet-row.cat-finance  .metric-sheet-row-cat-strip { background: #EAB308; }
  .metric-sheet-row.cat-admin    .metric-sheet-row-cat-strip { background: #888780; }

  /* Pastel wash on metric-sheet rows — matches note cards and task
     cards so the whole system reads as one visual family. */
  .metric-sheet-row.cat-trading  { background: linear-gradient(90deg, #fdf2dc 0%, var(--surface) 40%); }
  .metric-sheet-row.cat-study    { background: linear-gradient(90deg, #ecebfb 0%, var(--surface) 40%); }
  .metric-sheet-row.cat-build    { background: linear-gradient(90deg, #e2effa 0%, var(--surface) 40%); }
  .metric-sheet-row.cat-cricket  { background: linear-gradient(90deg, #def0e7 0%, var(--surface) 40%); }
  .metric-sheet-row.cat-social   { background: linear-gradient(90deg, #fbe4ec 0%, var(--surface) 40%); }
  .metric-sheet-row.cat-health   { background: linear-gradient(90deg, #e7f0d8 0%, var(--surface) 40%); }
  .metric-sheet-row.cat-personal { background: linear-gradient(90deg, #fbe5da 0%, var(--surface) 40%); }
  .metric-sheet-row.cat-finance  { background: linear-gradient(90deg, #faefcb 0%, var(--surface) 40%); }
  .metric-sheet-row.cat-admin    { background: linear-gradient(90deg, #ededeb 0%, var(--surface) 40%); }

  .metric-sheet-row-body {
    grid-column: 2;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .metric-sheet-row-title {
    font-size: 14.5px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }
  .metric-sheet-row-meta {
    font-size: 11px;
    color: var(--text-3);
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .metric-sheet-row-dim {
    color: var(--text-muted);
  }
  .metric-sheet-row-flag {
    color: #c1302b;
    font-weight: 700;
    font-size: 9.5px;
    letter-spacing: 0.08em;
    background: rgba(193, 48, 43, 0.1);
    padding: 1.5px 6px;
    border-radius: var(--radius-sm);
  }
  .metric-sheet-row-tick {
    grid-column: 3;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .dash-card.interactive,
    .metric-sheet-row,
    .metric-sheet-close { transition: none; }
  }

  /* ---- END PHASE 3 ---- */

  /* ============================================================
     PHASE E — Decorative accents inspired by reference image
     Hand-drawn underlines and arrows. CSS/SVG only. Subtle.
     ============================================================ */

  /* Sketchy underline on the "Notes" section heading.
     A short black squiggle drawn as inline SVG, sitting just below
     the text. Encoded as a data URI background-image so we don't need
     to add new markup. Width is generous to accommodate "Notes 12"
     etc. and the SVG won't repeat. */
  .notes-header h2 {
    position: relative;
    padding-bottom: 6px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 90 6' fill='none' stroke='%23111111' stroke-width='1.6' stroke-linecap='round'><path d='M2 4 C 18 1.2, 36 5, 54 2.5 S 84 4.8, 88 3.4' /></svg>");
    background-repeat: no-repeat;
    background-position: 0 100%;
    background-size: 90px 6px;
  }
  /* On mobile the headline is smaller; shrink the underline a hair */
  @media (max-width: 640px) {
    .notes-header h2 {
      background-size: 76px 5px;
    }
  }

  /* Hand-drawn curved arrow — used once between TodayCommandCard and
     the dashboard strip. Pointing down-right, suggesting "and here's
     what's coming up". Small, dark, just enough personality. The
     element is empty; the SVG is a background image. */
  .lifeos-arrow {
    display: block;
    width: 44px;
    height: 36px;
    margin: -2px 0 -6px 16px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 36' fill='none' stroke='%23111111' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M4 4 C 8 14, 14 22, 26 26'/><path d='M20 22 L26 26 L23 19'/></svg>");
    background-repeat: no-repeat;
    background-position: 0 0;
    pointer-events: none;
    opacity: 0.65;
  }
  /* Hide the arrow on small screens — it's a decorative flourish,
     not load-bearing, and on narrow viewports the Today card and
     dashboard sit closer together. */
  @media (max-width: 600px) {
    .lifeos-arrow { display: none; }
  }
  /* Respect reduce-motion: nothing animated here, so nothing to gate.
     But hide the underline/arrow in print mode. */
  @media print {
    .notes-header h2 { background-image: none; padding-bottom: 0; }
    .lifeos-arrow { display: none; }
  }

  /* ---- END PHASE E ---- */

  const hasDecisionWords = /\b(pros?|cons?|decided|option [ab1-3]|vs\.?|verdict|chose|will go with)\b/.test(text);
  const bulletCount = blocks.filter(b => b.type === "bullet").length;
  if (hasDecisionWords && bulletCount >= 3) signals.decision = 2;

  // Meeting notes: attendees + action items
  const hasMeetingWords = /\b(attendees?|present|agenda|action items?|next steps?|follow.?up)\b/.test(text);
  if (hasMeetingWords) signals.meeting = 2;

  // Bug/debug: stack trace, error, fix
  const hasBugWords = /\b(bug|error|stack ?trace|fix|repro|reproduce|crash|exception)\b/.test(text);
  const hasCode = blocks.some(b => b.type === "code");
  if (hasBugWords && hasCode) signals.bug = 2;

  // Daily reflection: "today", "felt", "tomorrow", or 3-things pattern
  const hasReflectionWords = /\b(today i|felt|grateful|tomorrow|what went well|what could)\b/.test(text);
  // Journal needs at least the reflection-word marker; bump it to score 2 so it crosses threshold
  if (hasReflectionWords && bulletCount >= 2) signals.journal = 2;

  // Pick the highest-scoring signal above threshold
  let best = null;
  let bestScore = 1;
  for (const k in signals) {
    if (signals[k] > bestScore) {
      best = k;
      bestScore = signals[k];
    }
  }
  if (!best) return null;
  const families = {
    trading: {
      family: "trading",
      label: "Trade journal",
      hint: "ticker, R-multiple, or trade verbs"
    },
    study: {
      family: "study",
      label: "Lecture / chapter notes",
      hint: "course code or lecture vocabulary"
    },
    decision: {
      family: "decision",
      label: "Decision log",
      hint: "comparing options, pros/cons"
    },
    meeting: {
      family: "meeting",
      label: "Meeting notes",
      hint: "attendees, action items"
    },
    bug: {
      family: "bug",
      label: "Bug report",
      hint: "error/crash/fix with code"
    },
    journal: {
      family: "journal",
      label: "Daily reflection",
      hint: "today/felt/tomorrow pattern"
    }
  };
  return Object.assign({
    confidence: bestScore
  }, families[best]);
}

// Pick a real template id matching the inferred family.
// Looks for a template whose `type` or `family` matches, prefers the "Quick" variant.
function pickTemplateForFamily(inferredFamily, allTemplates) {
  if (!inferredFamily) return null;
  // Map inferred family → preferred (type, family substring) hints
  const map = {
    trading: {
      type: "trading",
      familyHint: "journal"
    },
    study: {
      type: "study",
      familyHint: "lecture"
    },
    decision: {
      type: "project",
      familyHint: "decision"
    },
    meeting: {
      type: "project",
      familyHint: "meeting"
    },
    bug: {
      type: "coding",
      familyHint: "bug"
    },
    journal: {
      type: "journal",
      familyHint: "daily"
    }
  };
  const m = map[inferredFamily];
  if (!m) return null;
  // First pass: type + family hint + Quick variant
  let candidates = allTemplates.filter(t => t.type === m.type && (t.family || "").toLowerCase().indexOf(m.familyHint) !== -1);
  if (candidates.length === 0) candidates = allTemplates.filter(t => t.type === m.type);
  if (candidates.length === 0) return null;
  // Prefer Quick variant
  const quick = candidates.find(t => (t.variant || "").toLowerCase() === "quick");
  return quick || candidates[0];
}

// Parse a search query into structured filters + free-text terms.
// Operators: #tag, cat:X, coll:X, has:type, after:DATE, before:DATE
// Date shortcuts: today, yesterday, last-week, last-month
function parseSearchQuery(raw) {
  const out = {
    tags: [],
    cats: [],
    colls: [],
    has: [],
    after: null,
    before: null,
    terms: []
  };
  if (!raw || !raw.trim()) return out;

  // Tokenize preserving quoted phrases
  const tokens = [];
  const re = /"([^"]+)"|(\S+)/g;
  let m;
  while ((m = re.exec(raw)) !== null) {
    tokens.push(m[1] != null ? m[1] : m[2]);
  }
  function parseDateShortcut(v) {
    const t = v.toLowerCase();
    const now = new Date();
    const startOfDay = d => {
      const x = new Date(d);
      x.setHours(0, 0, 0, 0);
      return x.getTime();
    };
    if (t === "today") return startOfDay(now);
    if (t === "yesterday") {
      const d = new Date(now);
      d.setDate(d.getDate() - 1);
      return startOfDay(d);
    }
    if (t === "last-week" || t === "week") {
      const d = new Date(now);
      d.setDate(d.getDate() - 7);
      return startOfDay(d);
    }
    if (t === "last-month" || t === "month") {
      const d = new Date(now);
      d.setMonth(d.getMonth() - 1);
      return startOfDay(d);
    }
    // YYYY-MM-DD
    if (/^\d{4}-\d{2}-\d{2}$/.test(t)) {
      const d = new Date(t + "T00:00:00");
      if (!isNaN(d.getTime())) return d.getTime();
    }
    return null;
  }
  for (let i = 0; i < tokens.length; i++) {
    const tok = tokens[i];
    if (!tok) continue;
    // Hashtag
    if (tok[0] === "#" && tok.length > 1) {
      out.tags.push(tok.slice(1).toLowerCase());
      continue;
    }
    // Operator:value
    const colonIdx = tok.indexOf(":");
    if (colonIdx > 0 && colonIdx < tok.length - 1) {
      const op = tok.slice(0, colonIdx).toLowerCase();
      const val = tok.slice(colonIdx + 1).toLowerCase();
      if (op === "cat" || op === "category") {
        out.cats.push(val);
        continue;
      }
      if (op === "coll" || op === "collection") {
        out.colls.push(val);
        continue;
      }
      if (op === "has") {
        out.has.push(val);
        continue;
      }
      if (op === "after") {
        const d = parseDateShortcut(val);
        if (d != null) out.after = d;
        continue;
      }
      if (op === "before") {
        const d = parseDateShortcut(val);
        // For "before:X", treat as end-of-day so notes from that day are included
        if (d != null) out.before = d + 24 * 60 * 60 * 1000 - 1;
        continue;
      }
    }
    // Bare term
    out.terms.push(tok.toLowerCase());
  }
  return out;
}

// Does this note match the parsed query?
function matchesQuery(note, parsed, collections) {
  if (!parsed) return true;
  const blocks = note.blocks || [];
  const text = blocksToText(blocks).toLowerCase();
  // Tag filter
  if (parsed.tags.length > 0) {
    const noteTags = extractTags(blocksToText(blocks));
    for (let i = 0; i < parsed.tags.length; i++) {
      if (noteTags.indexOf(parsed.tags[i]) === -1) return false;
    }
  }
  // Category filter
  if (parsed.cats.length > 0) {
    if (!note.category) return false;
    if (parsed.cats.indexOf(note.category.toLowerCase()) === -1) return false;
  }
  // Collection filter (matches by collection name partial)
  if (parsed.colls.length > 0) {
    if (!note.collectionId) return false;
    const coll = (collections || []).find(c => c.id === note.collectionId);
    if (!coll) return false;
    const cName = (coll.name || "").toLowerCase();
    for (let i = 0; i < parsed.colls.length; i++) {
      if (cName.indexOf(parsed.colls[i]) === -1) return false;
    }
  }
  // Has-type filter
  if (parsed.has.length > 0) {
    const types = {};
    for (let i = 0; i < blocks.length; i++) types[blocks[i].type] = true;
    for (let i = 0; i < parsed.has.length; i++) {
      const h = parsed.has[i];
      // Aliases
      const want = h === "checklist" ? "check" : h === "checkbox" ? "check" : h;
      if (!types[want]) return false;
    }
  }
  // Date range
  if (parsed.after != null && note.createdAt < parsed.after) return false;
  if (parsed.before != null && note.createdAt > parsed.before) return false;
  // Free-text terms — all must appear in the text
  for (let i = 0; i < parsed.terms.length; i++) {
    if (text.indexOf(parsed.terms[i]) === -1) return false;
  }
  return true;
}

// Extract wiki-link targets `[[note title]]` from text (skips inside code blocks/inline code)
function extractWikiLinks(text) {
  if (!text) return [];
  const stripped = text.replace(/```[\s\S]*?```/g, " ").replace(/`[^`]*`/g, " ");
  const re = /\[\[([^\]\n]{1,100})\]\]/g;
  const out = [];
  let m;
  while ((m = re.exec(stripped)) !== null) {
    const target = m[1].trim();
    if (target && out.indexOf(target) === -1) out.push(target);
  }
  return out;
}

// Build a lookup map: lowercase wiki-friendly title → note object.
// We strip trailing #hashtags from titles so a heading "# ORCL Q3 #earnings"
// is still matchable via [[ORCL Q3]].
function wikiNormalizeTitle(t) {
  if (!t) return "";
  // Strip trailing hashtag clauses like " #foo #bar"
  return t.replace(/(?:\s+#[a-zA-Z][\w-]{0,30})+\s*$/, "").trim().toLowerCase();
}
function buildTitleIndex(notes) {
  const idx = {};
  for (let i = 0; i < notes.length; i++) {
    const n = notes[i];
    const t = deriveTitleFromBlocks(n.blocks || []);
    if (t) {
      const key = wikiNormalizeTitle(t);
      if (key && !idx[key]) idx[key] = n;
    }
  }
  return idx;
}

// For a given note, find all other notes that mention it via [[title]]
function findBacklinks(note, allNotes) {
  if (!note) return [];
  const myTitle = wikiNormalizeTitle(deriveTitleFromBlocks(note.blocks || []) || "");
  if (!myTitle) return [];
  const out = [];
  for (let i = 0; i < allNotes.length; i++) {
    const other = allNotes[i];
    if (other.id === note.id) continue;
    const targets = extractWikiLinks(blocksToText(other.blocks || []));
    for (let j = 0; j < targets.length; j++) {
      if (wikiNormalizeTitle(targets[j]) === myTitle) {
        out.push(other);
        break;
      }
    }
  }
  return out;
}

// Build heatmap grid: 8 weeks × 7 days, anchored on today (rightmost column).
// Each cell = { date: Date, dateStr: "YYYY-MM-DD", count: N, isToday: bool, inFuture: bool }
function buildHeatmapGrid(notes, weeks) {
  const cols = weeks || 8;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  // The rightmost column is the current week (Sun-Sat).
  // Compute the Saturday of the current week as the anchor.
  const dow = today.getDay();
  const rightAnchor = new Date(today);
  rightAnchor.setDate(today.getDate() + (6 - dow));
  // Tally notes by dateStr
  const tally = {};
  for (let i = 0; i < notes.length; i++) {
    const d = new Date(notes[i].createdAt);
    const k = formatDate(d);
    tally[k] = (tally[k] || 0) + 1;
  }
  // Walk back cols*7 - 1 days from rightAnchor
  const grid = [];
  for (let c = 0; c < cols; c++) {
    const col = [];
    for (let r = 0; r < 7; r++) {
      const cellDate = new Date(rightAnchor);
      // offset: column from right is (cols - 1 - c) weeks back; row r is r-th day of that week
      cellDate.setDate(rightAnchor.getDate() - (cols - 1 - c) * 7 - (6 - r));
      const dateStr = formatDate(cellDate);
      const count = tally[dateStr] || 0;
      const isToday = cellDate.getTime() === today.getTime();
      const inFuture = cellDate.getTime() > today.getTime();
      col.push({
        date: cellDate,
        dateStr,
        count,
        isToday,
        inFuture
      });
    }
    grid.push(col);
  }
  return grid;
}

// Convert a single note to a markdown string (block-by-block)
function noteToMarkdown(note) {
  const blocks = note.blocks || [];
  const title = deriveTitleFromBlocks(blocks) || "Untitled note";
  const dt = new Date(note.createdAt);
  const dateLine = dt.toLocaleString("en-AU", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric",
    hour: "numeric",
    minute: "2-digit",
    hour12: true
  });
  const lines = [];
  lines.push("## " + title);
  lines.push("*" + dateLine + (note.category ? " · " + note.category : "") + "*");
  lines.push("");
  // Skip the first non-empty block if it became the title, to avoid duplication
  let firstContentIdx = -1;
  for (let i = 0; i < blocks.length; i++) {
    if ((blocks[i].content || "").trim()) {
      firstContentIdx = i;
      break;
    }
  }
  const bodyBlocks = firstContentIdx >= 0 ? blocks.slice(firstContentIdx + 1) : blocks;
  lines.push(blocksToText(bodyBlocks));
  return lines.join("\n");
}

// Convert an array of notes + their collections into one markdown document
function notesToMarkdownExport(notes, collections, scopeLabel) {
  const out = [];
  out.push("# " + (scopeLabel || "Notes export"));
  out.push("");
  out.push("*Exported " + new Date().toLocaleString("en-AU") + " · " + notes.length + " note" + (notes.length !== 1 ? "s" : "") + "*");
  out.push("");
  out.push("---");
  out.push("");
  // Group by collection
  const grouped = {};
  for (let i = 0; i < notes.length; i++) {
    const cid = notes[i].collectionId || "__inbox";
    if (!grouped[cid]) grouped[cid] = [];
    grouped[cid].push(notes[i]);
  }
  // Render each group
  const collOrder = ["__inbox"].concat(collections.map(c => c.id).filter(id => grouped[id]));
  for (let i = 0; i < collOrder.length; i++) {
    const cid = collOrder[i];
    if (!grouped[cid]) continue;
    const coll = cid === "__inbox" ? null : collections.find(c => c.id === cid);
    out.push("");
    out.push("# " + (coll ? coll.name : "Inbox"));
    out.push("");
    const sorted = grouped[cid].slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    for (let j = 0; j < sorted.length; j++) {
      out.push(noteToMarkdown(sorted[j]));
      out.push("");
      out.push("---");
      out.push("");
    }
  }
  return out.join("\n");
}

// Trigger a download of a text blob as a file
function downloadTextFile(text, filename) {
  try {
    const blob = new Blob([text], {
      type: "text/markdown;charset=utf-8"
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {
    console.error("Download failed:", e);
  }
}

const STORAGE_KEYS = {
  tasks: "planner_tasks_v3",
  recurring: "planner_recurring_v3",
  notes: "planner_notes_v3",
  notesLegacy: "planner_notes_v2",
  collections: "planner_collections_v1",
  savedSearches: "planner_saved_searches_v1",
  searchHistory: "planner_search_history_v1",
  hiddenTemplates: "planner_hidden_templates_v1"
};
function getWindowStorage() {
  try {
    if (typeof window !== "undefined" && window.storage && typeof window.storage.get === "function") return window.storage;
  } catch (e) {}
  return null;
}
async function loadJSON(key, fallback) {
  const ws = getWindowStorage();
  if (ws) {
    try {
      const r = await ws.get(key);
      if (r && r.value) return JSON.parse(r.value);
      return fallback;
    } catch (e) {}
  }
  try {
    if (typeof localStorage !== "undefined") {
      const v = localStorage.getItem(key);
      if (v) return JSON.parse(v);
    }
  } catch (e) {}
  return fallback;
}
// Storage write. Tries window.storage (Claude artifacts) first, then
// falls back to localStorage. On total failure we dispatch a custom
// event so the UI can surface a quiet warning — silent failures here
// caused real data loss in the past (e.g. when iOS Safari clears
// storage or it hits a quota).
async function saveJSON(key, value) {
  const ws = getWindowStorage();
  if (ws) {
    try {
      await ws.set(key, JSON.stringify(value));
      return;
    } catch (e) {/* fall through */}
  }
  try {
    if (typeof localStorage !== "undefined") {
      localStorage.setItem(key, JSON.stringify(value));
      return;
    }
  } catch (e) {
    try {
      window.dispatchEvent(new CustomEvent("planner-save-error", {
        detail: {
          key,
          message: e && e.message
        }
      }));
    } catch (_) {}
  }
}

// ============================================================
// Time-range normalizer
// ============================================================
function normalizeRange(sh, sm, sMer, eh, em, eMer) {
  let startHr = sh,
    endHr = eh;
  if (sMer === "pm" && startHr < 12) startHr += 12;
  if (sMer === "am" && startHr === 12) startHr = 0;
  if (eMer === "pm" && endHr < 12) endHr += 12;
  if (eMer === "am" && endHr === 12) endHr = 0;
  if (!sMer && !eMer) {
    if (sh <= 12 && eh <= 12 && eh < sh && eh >= 1) endHr += 12;
  } else if (!sMer && eMer === "pm") {
    if (sh <= 6 && sh < eh) startHr += 12;
  }
  let startMin = startHr * 60 + sm;
  let endMin = endHr * 60 + em;
  if (endMin <= startMin) endMin += 24 * 60;
  return {
    startMin,
    endMin
  };
}
function detectCategory(text) {
  const lowerInput = " " + (text || "").toLowerCase() + " ";
  let bestCat = DEFAULT_CAT,
    bestScore = 0;
  for (let i = 0; i < CAT_ORDER.length; i++) {
    const cat = CAT_ORDER[i];
    const def = CATEGORIES[cat];
    let score = 0;
    for (let j = 0; j < def.keywords.length; j++) {
      const kw = def.keywords[j];
      const re = new RegExp("\\b" + escapeRe(kw) + "\\b", "i");
      if (re.test(lowerInput)) {
        // Multi-word phrases are far more specific than single words, so
        // they should dominate scoring. "team practice" (cricket) should
        // always beat a generic single-word match in another category.
        // Formula: length × wordCount, plus a small constant so single
        // words still count for something.
        const wordCount = kw.split(/\s+/).length;
        score += kw.length * wordCount + 2;
      }
    }
    if (score > bestScore) {
      bestScore = score;
      bestCat = cat;
    }
  }
  return bestCat;
}

// ============================================================
// Parser (for tasks only — notes are NOT auto-tagged)
// ============================================================
function parseInput(input, today) {
  if (!input || !input.trim()) return null;
  if (!today) today = new Date();
  const original = input.trim();
  const result = {
    title: original,
    category: DEFAULT_CAT,
    priority: "low",
    time: null,
    duration: 45,
    endTime: null,
    date: null,
    recurring: null,
    notes: "",
    linkedTaskIds: []
  };
  const strips = [];
  if (/!!+/.test(original) || /\b(urgent|asap|critical)\b/i.test(original)) {
    result.priority = "high";
    strips.push(/!!+/g);
    strips.push(/\b(urgent|asap|critical)\b/gi);
  } else if (/!/.test(original) || /\b(important|high priority)\b/i.test(original)) {
    result.priority = "medium";
    strips.push(/!/g);
    strips.push(/\b(important|high priority)\b/gi);
  }
  let recurMatched = false;
  const dayPat = "(?:sun(?:day)?|mon(?:day)?|tues?(?:day)?|wed(?:nes(?:day)?|s)?|thu(?:rs?(?:day)?)?|fri(?:day)?|sat(?:urday)?)";
  if (/\b(every\s*day|everyday|daily|each\s*day|nightly)\b/i.test(original)) {
    result.recurring = {
      days: [0, 1, 2, 3, 4, 5, 6]
    };
    strips.push(/\b(every\s*day|everyday|daily|each\s*day|nightly)\b/gi);
    recurMatched = true;
  } else if (/\bweekdays?\b/i.test(original)) {
    result.recurring = {
      days: [1, 2, 3, 4, 5]
    };
    strips.push(/\bweekdays?\b/gi);
    recurMatched = true;
  } else if (/\bweekends?\b/i.test(original)) {
    result.recurring = {
      days: [0, 6]
    };
    strips.push(/\bweekends?\b/gi);
    recurMatched = true;
  } else {
    const everyRe = new RegExp("\\bevery\\s+((?:" + dayPat + ")(?:\\s*(?:,|and|&|\\s)\\s*(?:" + dayPat + "))*)\\b", "i");
    const em = original.match(everyRe);
    if (em) {
      const days = extractDays(em[1]);
      if (days.length) {
        result.recurring = {
          days
        };
        strips.push(new RegExp(escapeRe(em[0]), "gi"));
        recurMatched = true;
      }
    }
    if (!recurMatched) {
      const pluralRe = /\b((?:mondays|tuesdays|wednesdays|thursdays|fridays|saturdays|sundays)(?:\s*(?:,|and|&)\s*(?:mondays|tuesdays|wednesdays|thursdays|fridays|saturdays|sundays))*)\b/i;
      const pm = original.match(pluralRe);
      if (pm) {
        const days = [];
        const re = /\b(mondays|tuesdays|wednesdays|thursdays|fridays|saturdays|sundays)\b/gi;
        let m;
        while ((m = re.exec(pm[1])) !== null) {
          const d = DAY_MAP[m[1].slice(0, -1).toLowerCase()];
          if (d !== undefined && days.indexOf(d) === -1) days.push(d);
        }
        if (days.length) {
          result.recurring = {
            days
          };
          strips.push(new RegExp(escapeRe(pm[0]), "gi"));
          recurMatched = true;
        }
      }
    }
  }
  if (!recurMatched) {
    if (/\btoday\b/i.test(original)) {
      result.date = formatDate(today);
      strips.push(/\btoday\b/gi);
    } else if (/\b(tomorrow|tmrw?)\b/i.test(original)) {
      const t = addDays(today, 1);
      result.date = formatDate(t);
      strips.push(/\b(tomorrow|tmrw?)\b/gi);
    } else {
      const dayRe = new RegExp("\\b(?:on\\s+)?(" + dayPat + ")\\b", "i");
      const dm = original.match(dayRe);
      if (dm) {
        const d = resolveDayKey(dm[1]);
        if (d !== null) {
          const t = new Date(today);
          t.setHours(0, 0, 0, 0);
          let diff = d - t.getDay();
          if (diff < 0) diff += 7;
          t.setDate(t.getDate() + diff);
          result.date = formatDate(t);
          strips.push(new RegExp(escapeRe(dm[0]), "gi"));
        }
      } else {
        result.date = formatDate(today);
      }
    }
  }
  let rangeMatched = false;
  const rangeRe = /\b(?:from\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|—|to|until|till)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/i;
  const rm = original.match(rangeRe);
  if (rm) {
    const sh = parseInt(rm[1], 10);
    const sm_ = rm[2] ? parseInt(rm[2], 10) : 0;
