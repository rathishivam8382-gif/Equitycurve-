function QuickAdd({ input, setInput, preview, onAdd, onKeyDown, inputRef, showHelp }) {
  const cat = preview && preview.category ? CATEGORIES[preview.category] : null;
  let timeStr = "";
  if (preview) {
    if (preview.recurring) {
      const days = preview.recurring.days;
      if (days.length === 7) timeStr = "Every day";
      else if (days.length === 5 && days.indexOf(0) === -1 && days.indexOf(6) === -1) timeStr = "Weekdays";
      else if (days.length === 2 && days.indexOf(0) !== -1 && days.indexOf(6) !== -1) timeStr = "Weekends";
      else timeStr = days.map(d => DAY_NAMES_SHORT[d]).join(" · ");
    } else if (preview.date) {
      const dt = new Date(preview.date + "T00:00:00");
      timeStr = dt.toLocaleString("en-AU", { weekday: "short", day: "numeric", month: "short" });
    }
    if (preview.time) {
      timeStr += (timeStr ? " · " : "") + formatTime(preview.time);
      if (preview.endTime) timeStr += "–" + formatTime(preview.endTime);
      else if (preview.duration && preview.duration !== 45) timeStr += " · " + formatDuration(preview.duration);
    }
  }
  return (
    <div className="quickadd">
      <div className="qa-row">
        <div className="qa-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3v18M3 12h18"/></svg></div>
        <input ref={inputRef} className="qa-input" type="text" value={input} onChange={e => setInput(e.target.value)} onKeyDown={onKeyDown} placeholder="What's on… e.g. ‘work 11-5pm’ or ‘meditate every day 7am’" autoComplete="off" autoCorrect="off" spellCheck="false"/>
        <button className="qa-add" onClick={onAdd} disabled={!input.trim()}>Add</button>
      </div>
      {preview && input.trim() && (
        <div className="qa-preview">
          <span className="label">Auto-tagged →</span>
          {cat && (<span className={"qa-chip cat-" + preview.category}><CatIcon cat={preview.category} size={11}/>{cat.label}</span>)}
          {timeStr && <span className="qa-chip qa-chip-time">{timeStr}</span>}
          {preview.recurring && <span className="qa-chip qa-chip-recur"><RecurIcon size={10}/> Recurring</span>}
          {preview.priority === "high" && <span className="qa-chip qa-chip-prio-high">High priority</span>}
          {preview.priority === "medium" && <span className="qa-chip qa-chip-prio-med">Priority</span>}
        </div>
      )}
      {showHelp && !input.trim() && (
        <div className="qa-help">Try: <code>work 11-5pm</code> · <code>meditate every day 7am</code> · <code>!! submit assignment Thursday</code> · <code>gym every Mon Wed Fri 6-7am</code></div>
      )}
    </div>
  );
}

function WeekGrid(props) {
  const { weekDays, today, getTasksForDay, onSelect, onToggleComplete, onDragStart, onDragOver, onDrop, onDragEnd, dragging, dragOverDay, onDayClick } = props;
  const scrollRef = useRef(null);

  // When the week changes (or on mount), center today's column in the horizontal scroll view.
  // Runs synchronously before paint so there's no flash of "scrolled to Monday" before jumping to today.
  useLayoutEffect(() => {
    const scroller = scrollRef.current;
    if (!scroller) return;
    const todayCol = scroller.querySelector('.day-col.today');
    if (todayCol) {
      // Center today: place its left edge one column-width from the scroller's left edge
      const colWidth = todayCol.offsetWidth;
      const targetLeft = Math.max(0, todayCol.offsetLeft - colWidth);
      scroller.scrollLeft = targetLeft;
    } else {
      // No today in this week (user navigated to a different week) → scroll to start
      scroller.scrollLeft = 0;
    }
  }, [weekDays]);

  return (
    <div className="grid-wrap">
      <div className="week-scroll" ref={scrollRef}>
        {weekDays.map((d, i) => {
          const isToday = formatDate(d) === formatDate(today);
          const dateStr = formatDate(d);
          const dayTasks = getTasksForDay(d);
          const isDragOver = dragOverDay === dateStr;
          return (
            <div key={i} className={"day-col" + (isToday ? " today" : "")}>
              <div className={"day-head" + (isToday ? " today" : "")}>
                {DAY_NAMES_SHORT[d.getDay()]}
                <span className="num">{d.getDate()}</span>
              </div>
              <div
                className={"day-cell" + (isToday ? " today" : "") + (isDragOver ? " drag-over" : "")}
                onDragOver={(e) => onDragOver(dateStr, e)}
                onDrop={(e) => onDrop(dateStr, e)}
                onClick={(e) => onDayClick(d, e)}
              >
                {dayTasks.map((t, j) => (
                  <TaskBlock
                    key={t.id + "-" + j}
                    task={t}
                    dateStr={dateStr}
                    isDragging={dragging && dragging.id === t.id && !t.recurring}
                    onClick={() => onSelect(t)}
                    onToggleComplete={(e) => onToggleComplete(t, dateStr, e)}
                    onDragStart={(e) => onDragStart(t, e)}
                    onDragEnd={onDragEnd}
                  />
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

const CONFETTI_PALETTE = ["#EF9F27", "#7F77DD", "#378ADD", "#1D9E75", "#D4537E", "#639922", "#D85A30", "#c0382b"];
function buildConfetti() {
  const out = [];
  for (let i = 0; i < 14; i++) {
    const angle = (i / 14) * Math.PI * 2 + (Math.random() - 0.5) * 0.6;
    const dist = 22 + Math.random() * 18;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - 6; // upward bias
    const rot = (Math.random() - 0.5) * 720;
    const color = CONFETTI_PALETTE[i % CONFETTI_PALETTE.length];
    const isRound = i % 3 === 0;
    out.push({ dx, dy, rot, color, isRound, delay: Math.random() * 80 });
  }
  return out;
}

function TaskBlock({ task, dateStr, isDragging, onClick, onToggleComplete, onDragStart, onDragEnd }) {
  const done = task.recurring ? !!(task.completedDates && task.completedDates[dateStr]) : !!task.completed;
  const prioClass = task.priority === "high" ? " high" : (task.priority === "medium" ? " med" : "");
  const draggable = !task.recurring;
  const endStr = task.endTime ? formatTime(task.endTime) : (task.time && task.duration && task.duration !== 45 ? formatTime(computeEndTime(task.time, task.duration)) : null);
  const hasNotes = task.notes && task.notes.trim();
  const hasLinks = task.linkedTaskIds && task.linkedTaskIds.length > 0;

  const prevDoneRef = useRef(done);
  const [celebrating, setCelebrating] = useState(false);
  const [particles, setParticles] = useState(null);

  useEffect(() => {
    if (done && !prevDoneRef.current) {
      setParticles(buildConfetti());
      setCelebrating(true);
      const t = setTimeout(() => { setCelebrating(false); setParticles(null); }, 1000);
      prevDoneRef.current = done;
      return () => clearTimeout(t);
    }
    prevDoneRef.current = done;
  }, [done]);

  return (
    <div className={"task cat-" + task.category + prioClass + (done ? " done" : "") + (isDragging ? " dragging" : "") + (celebrating ? " celebrating" : "")} onClick={(e) => { if (e.target.closest(".check")) return; onClick(); }} role="button" tabIndex={0} draggable={draggable} onDragStart={draggable ? onDragStart : undefined} onDragEnd={draggable ? onDragEnd : undefined}>
      <span className={"check" + (done ? " done" : "") + (celebrating ? " fresh-done" : "")} onClick={onToggleComplete} onMouseDown={(e) => e.stopPropagation()} role="checkbox" aria-checked={done} aria-label={done ? "Mark not done" : "Mark done"}/>
      <div className="t-body">
        <span className="t-time">{task.time ? (formatTime(task.time) + (endStr ? "–" + endStr : "")) : "All day"}</span>
        <div className="t-title-row"><CatIcon cat={task.category} size={11}/><span className="t-title">{task.title}</span></div>
      </div>
      {(task.priority === "high" || task.priority === "medium") && <span className="priority-dot" aria-hidden="true"/>}
      {(task.recurring || hasNotes || hasLinks) && (<div className="t-meta">{task.recurring && <RecurIcon size={10}/>}{hasNotes && <NotesIcon size={10}/>}{hasLinks && <LinkIcon size={10}/>}</div>)}
      {particles && particles.map((p, i) => (
        <span key={i} className="confetti" aria-hidden="true" style={{
          background: p.color,
          width: p.isRound ? "5px" : "4px",
          height: p.isRound ? "5px" : "7px",
          borderRadius: p.isRound ? "50%" : "1.5px",
          animationDelay: p.delay + "ms",
          "--dx": p.dx + "px",
          "--dy": p.dy + "px",
          "--rot": p.rot + "deg"
        }}/>
      ))}
    </div>
  );
}

function Legend() {
  return (<div className="legend">{CAT_ORDER.map(k => (<span key={k} className={"legend-item legend-item-" + k}><span className={"legend-icon cat-" + k}><CatIcon cat={k} size={12}/></span>{CATEGORIES[k].label}</span>))}</div>);
}

// ============================================================
// Notes section (no auto-tagging)
// ============================================================
function NotesSection({ notes, collections, tasks, recurring, savedSearches, searchHistory, onAddSavedSearch, onDeleteSavedSearch, onRecordSearchHistory, onClearSearchHistory, onAddNote, onAddNoteFromTemplate, onUpdateNote, onDeleteNote, onTogglePin, onMoveNote, onLinkNoteToTask, onUnlinkNoteFromTask, onOpenTask, onAddCollection, onUpdateCollection, onDeleteCollection, onMoveCollection, navTarget, onClearNavTarget }) {
  const [input, setInput] = useState("");
  const [filter, setFilter] = useState("all");
  const [tagFilter, setTagFilter] = useState(null);
  const [search, setSearch] = useState("");
  // selectedCollection: null = "All notes", "inbox" = uncategorised, "today" = today filter, otherwise a collection id
  const [selectedCollection, setSelectedCollection] = useState(null);
  const [expandedCollections, setExpandedCollections] = useState({});
  const [modalOpen, setModalOpen] = useState(false);
  const [modalParentId, setModalParentId] = useState(null);
  const [renameDialog, setRenameDialog] = useState(null); // { id, name } when open
  const [confirmDeleteDialog, setConfirmDeleteDialog] = useState(null); // { id, name, childCount }
  const [saveSearchDialog, setSaveSearchDialog] = useState(null); // { defaultName }
  const [deleteSavedSearchDialog, setDeleteSavedSearchDialog] = useState(null); // { id, name }
  const [draggingNoteId, setDraggingNoteId] = useState(null);
  const [dropTargetCollection, setDropTargetCollection] = useState(null);
  const [templatePickerOpen, setTemplatePickerOpen] = useState(false);
  const [focusNoteId, setFocusNoteId] = useState(null);
  const [shortcutsOpen, setShortcutsOpen] = useState(false);
  const [searchFocused, setSearchFocused] = useState(false);
  const [saveSearchOpen, setSaveSearchOpen] = useState(false); // small inline save UI
  const [templateSuggestion, setTemplateSuggestion] = useState(null); // { noteId, family, label, hint, templateId }
  const [recentLinkSuggestion, setRecentLinkSuggestion] = useState(null); // { task, kind: "recent"|"upcoming" }
  const [taskPickerForNote, setTaskPickerForNote] = useState(null); // noteId when picker is open
  const [autoLinkEnabled, setAutoLinkEnabled] = useState(true);
  const [highlightedNoteId, setHighlightedNoteId] = useState(null);
  // Set of note IDs that the user has collapsed. Persists across sessions
  // via window.storage so collapsed state is remembered when they return.
  // Using a Set in memory for O(1) lookup; serialized to array on save.
  const [collapsedSet, setCollapsedSet] = useState(() => new Set());
  const [collapseLoaded, setCollapseLoaded] = useState(false);

  // Load persisted collapsed-state on mount
  useEffect(() => {
    let mounted = true;
    (async () => {
      const arr = await loadJSON("planner_collapsed_notes_v1", []);
      if (mounted && Array.isArray(arr)) {
        setCollapsedSet(new Set(arr));
      }
      if (mounted) setCollapseLoaded(true);
    })();
    return () => { mounted = false; };
  }, []);

  // Persist whenever the set changes (after initial load to avoid stomping)
  useEffect(() => {
    if (!collapseLoaded) return;
    saveJSON("planner_collapsed_notes_v1", Array.from(collapsedSet));
  }, [collapsedSet, collapseLoaded]);

  // Toggle a single note's collapsed state — returns a new Set instance so
  // React detects the change.
  function toggleNoteCollapsed(noteId) {
    setCollapsedSet(prev => {
      const next = new Set(prev);
      if (next.has(noteId)) next.delete(noteId);
      else next.add(noteId);
      return next;
    });
  }

  // Bulk: collapse all currently-visible notes
  function collapseAllVisible(ids) {
    setCollapsedSet(prev => {
      const next = new Set(prev);
      for (let i = 0; i < ids.length; i++) next.add(ids[i]);
      return next;
    });
  }
  // Bulk: expand all (clears the whole set — even non-visible notes,
  // which is what the user expects when they say "expand all")
  function expandAllVisible(ids) {
    setCollapsedSet(prev => {
      const next = new Set(prev);
      for (let i = 0; i < ids.length; i++) next.delete(ids[i]);
      return next;
    });
  }
  // Track narrow viewport so we can use shorter placeholders (long ones don't reliably wrap on iOS)
  const [isNarrow, setIsNarrow] = useState(() => typeof window !== "undefined" && window.innerWidth < 640);
  useEffect(() => {
    const onResize = () => setIsNarrow(window.innerWidth < 640);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  const noteRefs = useRef({});

  // Prune dead refs when notes list changes (prevents long-running memory growth)
  useEffect(() => {
    const liveIds = new Set(notes.map(n => n.id));
    for (const id in noteRefs.current) {
      if (!liveIds.has(id)) delete noteRefs.current[id];
    }
  }, [notes]);

  // Auto-dismiss suggestions after 20 seconds
  useEffect(() => {
    if (!templateSuggestion) return;
    const tid = setTimeout(() => setTemplateSuggestion(null), 20000);
    return () => clearTimeout(tid);
  }, [templateSuggestion]);
  useEffect(() => {
    if (!recentLinkSuggestion) return;
    const tid = setTimeout(() => setRecentLinkSuggestion(null), 20000);
    return () => clearTimeout(tid);
  }, [recentLinkSuggestion]);

  // Auto-dismiss either suggestion if the linked note gets deleted
  useEffect(() => {
    if (templateSuggestion && templateSuggestion.noteId && !notes.some(n => n.id === templateSuggestion.noteId)) {
      setTemplateSuggestion(null);
    }
    if (recentLinkSuggestion && recentLinkSuggestion.noteId && !notes.some(n => n.id === recentLinkSuggestion.noteId)) {
      setRecentLinkSuggestion(null);
    }
  }, [notes, templateSuggestion, recentLinkSuggestion]);

  // Record search history after the user stops typing for 1 second
  useEffect(() => {
    if (!search || search.trim().length < 2) return;
    const tid = setTimeout(() => onRecordSearchHistory && onRecordSearchHistory(search), 1000);
    return () => clearTimeout(tid);
  }, [search, onRecordSearchHistory]);

  // Recently-touched notes (last 3, edited within the past 7 days)
  const recentlyTouched = useMemo(() => {
    const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
    return notes
      .filter(n => (n.updatedAt || n.createdAt || 0) >= cutoff)
      .slice()
      .sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0))
      .slice(0, 3);
  }, [notes]);

  // Active task — re-check every 30 seconds to stay current
  const [activeTaskNow, setActiveTaskNow] = useState(() => getActiveTask(tasks, recurring));
  useEffect(() => {
    const tick = () => setActiveTaskNow(getActiveTask(tasks, recurring));
    tick();
    const id = setInterval(tick, 30 * 1000);
    return () => clearInterval(id);
  }, [tasks, recurring]);

  // Today filter / summary
  const todaysNotes = useMemo(() => notes.filter(n => isToday(n.createdAt)), [notes]);
  const todaysCompletedTasks = useMemo(() => {
    const dateStr = formatDate(new Date());
    let out = [];
    for (let i = 0; i < tasks.length; i++) {
      if (tasks[i].completed && tasks[i].date === dateStr) out.push(tasks[i]);
    }
    for (let i = 0; i < recurring.length; i++) {
      if (recurring[i].completedDates && recurring[i].completedDates[dateStr]) out.push(recurring[i]);
    }
    return out;
  }, [tasks, recurring]);

  // Navigate-to-note: when navTarget changes, scroll + highlight + clear nav target
  useEffect(() => {
    if (!navTarget || !navTarget.noteId) return;
    const note = notes.find(n => n.id === navTarget.noteId);
    if (!note) { if (onClearNavTarget) onClearNavTarget(); return; }
    // Switch to "All notes" view (or the note's collection if there is one) so the note is visible
    if (note.collectionId) {
      setSelectedCollection(note.collectionId);
      // expand parent chain
      const path = getCollectionPath(collections, note.collectionId);
      const next = Object.assign({}, expandedCollections);
      for (let i = 0; i < path.length - 1; i++) next[path[i].id] = true;
      setExpandedCollections(next);
    } else {
      setSelectedCollection(null);
    }
    setHighlightedNoteId(navTarget.noteId);
    // Scroll on next frame
    requestAnimationFrame(() => {
      const el = noteRefs.current[navTarget.noteId];
      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "center" });
    });
    const t = setTimeout(() => { setHighlightedNoteId(null); }, 2400);
    if (onClearNavTarget) onClearNavTarget();
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [navTarget]);

  // Current collection object (or null)
  const currentCollection = useMemo(() => {
    if (!selectedCollection || selectedCollection === "inbox" || selectedCollection === "today") return null;
    return collections.find(c => c.id === selectedCollection) || null;
  }, [collections, selectedCollection]);
  const currentCollectionType = currentCollection ? currentCollection.type : null;

  // The set of collection ids that include the current selection + all descendants (for filtering)
  const selectedDescendants = useMemo(() => {
    if (!selectedCollection || selectedCollection === "inbox") return null;
    return getCollectionWithDescendants(collections, selectedCollection);
  }, [collections, selectedCollection]);

  // Counts: notes per collection (including descendants)
  const notesCountByCollection = useMemo(() => {
    const m = { __all: notes.length, __inbox: 0 };
    for (let i = 0; i < notes.length; i++) {
      const cid = notes[i].collectionId;
      if (!cid) m.__inbox++;
      else m[cid] = (m[cid] || 0) + 1;
    }
    // Roll up descendants into parents
    const rollup = Object.assign({}, m);
    for (let i = 0; i < collections.length; i++) {
      const desc = getCollectionWithDescendants(collections, collections[i].id);
      let total = 0;
      desc.forEach(id => { total += (m[id] || 0); });
      rollup[collections[i].id] = total;
    }
    return rollup;
  }, [notes, collections]);

  function save() {
    if (!input.trim()) return;
    // Save into the currently selected collection (null = inbox)
    const targetCollection = (!selectedCollection || selectedCollection === "inbox" || selectedCollection === "today") ? null : selectedCollection;
    const links = (autoLinkEnabled && activeTaskNow) ? [activeTaskNow.id] : [];
    // addNote returns the new note's ID — capture it so suggestions attach to the correct note
    // even if the user saves another note immediately
    const newNoteId = onAddNote(input, targetCollection, links);
    const justSavedText = input;
    setInput("");
    if (!newNoteId) return;

    // Defer inference to next tick (microtask) so React has time to flush the new note into state
    setTimeout(() => {
      // Smart suggestion 1: detect template family from just-saved content
      const tempBlocks = migrateMarkdownToBlocks(justSavedText.trim());
      const inferred = inferTemplateFamily(tempBlocks);
      if (inferred) {
        const tpl = pickTemplateForFamily(inferred.family, TEMPLATES);
        if (tpl) {
          setTemplateSuggestion({ noteId: newNoteId, family: inferred.family, label: inferred.label, hint: inferred.hint, templateId: tpl.id });
        }
      }
      // Smart suggestion 2: link to recent/upcoming task (only if not already auto-linked)
      if (!(autoLinkEnabled && activeTaskNow)) {
        const win = getTaskWindow(tasks, recurring, new Date());
        if (win.recent.length > 0) setRecentLinkSuggestion({ noteId: newNoteId, task: win.recent[0].task, kind: "recent", minutesAgo: win.recent[0].minutesAgo });
        else if (win.upcoming.length > 0) setRecentLinkSuggestion({ noteId: newNoteId, task: win.upcoming[0].task, kind: "upcoming", minutesUntil: win.upcoming[0].minutesUntil });
      }
    }, 50);
  }
  function onKey(e) { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); save(); } }

  const counts = useMemo(() => {
    const c = { all: notes.length, untagged: 0 };
    for (let i = 0; i < CAT_ORDER.length; i++) c[CAT_ORDER[i]] = 0;
    for (let i = 0; i < notes.length; i++) {
      const cat = notes[i].category;
      if (!cat) c.untagged++;
      else if (c[cat] !== undefined) c[cat]++;
    }
    return c;
  }, [notes]);

  const tagMap = useMemo(() => {
    const m = {};
    for (let i = 0; i < notes.length; i++) {
      const tags = extractTags(blocksToText(notes[i].blocks || []));
      for (let j = 0; j < tags.length; j++) m[tags[j]] = (m[tags[j]] || 0) + 1;
    }
    return m;
  }, [notes]);
  const tagList = useMemo(() => Object.keys(tagMap).sort((a, b) => tagMap[b] - tagMap[a] || a.localeCompare(b)), [tagMap]);

  // Parsed search query — operators + free-text terms
  const parsedQuery = useMemo(() => parseSearchQuery(search), [search]);
  const hasActiveSearch = useMemo(() => {
    return parsedQuery.tags.length > 0 || parsedQuery.cats.length > 0 || parsedQuery.colls.length > 0 || parsedQuery.has.length > 0 || parsedQuery.after != null || parsedQuery.before != null || parsedQuery.terms.length > 0;
  }, [parsedQuery]);

  const filtered = useMemo(() => {
    let arr = notes;
    // Collection filter
    if (selectedCollection === "inbox") {
      arr = arr.filter(n => !n.collectionId);
    } else if (selectedCollection === "today") {
      arr = arr.filter(n => isToday(n.createdAt));
    } else if (selectedCollection && selectedDescendants) {
      arr = arr.filter(n => n.collectionId && selectedDescendants.has(n.collectionId));
    }
    // Category filter
    if (filter === "untagged") arr = arr.filter(n => !n.category);
    else if (filter !== "all") arr = arr.filter(n => n.category === filter);
    // Tag pill filter (separate from operator-syntax search)
    if (tagFilter) arr = arr.filter(n => extractTags(blocksToText(n.blocks || [])).indexOf(tagFilter) !== -1);
    // Operator-aware search
    if (hasActiveSearch) {
      arr = arr.filter(n => matchesQuery(n, parsedQuery, collections));
    }
    return arr.slice().sort((a, b) => {
      if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
  }, [notes, selectedCollection, selectedDescendants, filter, tagFilter, parsedQuery, hasActiveSearch, collections]);

  // Bulk-collapse summary: how many of the currently filtered notes are collapsed?
  // Used to decide whether the bulk button shows "Collapse all" or "Expand all".
  const collapseStats = useMemo(() => {
    let collapsedCount = 0;
    const ids = [];
    for (let i = 0; i < filtered.length; i++) {
      ids.push(filtered[i].id);
      if (collapsedSet.has(filtered[i].id)) collapsedCount++;
    }
    return { ids: ids, collapsedCount: collapsedCount, total: filtered.length };
  }, [filtered, collapsedSet]);
  const allCollapsed = collapseStats.total > 0 && collapseStats.collapsedCount === collapseStats.total;

  // Title index for wiki-links — recomputed when notes change
  const titleIndex = useMemo(() => buildTitleIndex(notes), [notes]);

  // Backlinks map: noteId → array of notes that mention it via [[title]]
  const backlinksByNoteId = useMemo(() => {
    const map = {};
    // Build once: for every note, find which titles it links to, and add a backlink in each target's bucket
    const titleToId = {};
    for (let i = 0; i < notes.length; i++) {
      const t = deriveTitleFromBlocks(notes[i].blocks || []);
      if (t) titleToId[wikiNormalizeTitle(t)] = notes[i].id;
    }
    for (let i = 0; i < notes.length; i++) {
      const src = notes[i];
      const targets = extractWikiLinks(blocksToText(src.blocks || []));
      const seen = new Set();
      for (let j = 0; j < targets.length; j++) {
        const targetId = titleToId[wikiNormalizeTitle(targets[j])];
        if (targetId && targetId !== src.id && !seen.has(targetId)) {
          seen.add(targetId);
          if (!map[targetId]) map[targetId] = [];
          map[targetId].push(src);
        }
      }
    }
    return map;
  }, [notes]);

  function handleTagClick(t) { setTagFilter(prev => prev === t ? null : t); }

  // Wiki-link click: try to find the note by title; if missing, create one and navigate to it.
  function handleWikiClick(target) {
    if (!target) return;
    const key = wikiNormalizeTitle(target);
    const found = titleIndex[key];
    if (found) {
      // Navigate via the parent's navTarget mechanism
      // We use a local synthetic event since we don't have access to setNavTarget;
      // instead we set selectedCollection + highlightedNoteId directly.
      const note = found;
      if (note.collectionId) {
        setSelectedCollection(note.collectionId);
        const path = getCollectionPath(collections, note.collectionId);
        const next = Object.assign({}, expandedCollections);
        for (let i = 0; i < path.length - 1; i++) next[path[i].id] = true;
        setExpandedCollections(next);
      } else {
        setSelectedCollection(null);
      }
      setHighlightedNoteId(note.id);
      requestAnimationFrame(() => {
        const el = noteRefs.current[note.id];
        if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "center" });
      });
      setTimeout(() => setHighlightedNoteId(null), 2400);
    } else {
      // Create a new empty note with target as its heading
      const targetCollection = (!selectedCollection || selectedCollection === "inbox" || selectedCollection === "today") ? null : selectedCollection;
      onAddNote("# " + target, targetCollection, []);
    }
  }

  // Open a note by id (used by backlinks)
  function handleOpenNoteById(noteId) {
    const note = notes.find(n => n.id === noteId);
    if (!note) return;
    if (note.collectionId) {
      setSelectedCollection(note.collectionId);
      const path = getCollectionPath(collections, note.collectionId);
      const next = Object.assign({}, expandedCollections);
      for (let i = 0; i < path.length - 1; i++) next[path[i].id] = true;
      setExpandedCollections(next);
    } else {
      setSelectedCollection(null);
    }
    setHighlightedNoteId(noteId);
    requestAnimationFrame(() => {
      const el = noteRefs.current[noteId];
      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "center" });
    });
    setTimeout(() => setHighlightedNoteId(null), 2400);
  }

  // Global ? shortcut — opens cheatsheet (ignored when typing in an input/textarea)
  useEffect(() => {
    function onKey(e) {
      if (e.key !== "?") return;
      const el = document.activeElement;
      if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable)) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      e.preventDefault();
      setShortcutsOpen(true);
    }
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, []);

  // Heatmap cell click → set search to filter that day
  function handleHeatmapPickDate(dateStr) {
    setSearch("after:" + dateStr + " before:" + dateStr);
  }

  // Export visible notes (uses current `filtered`) as a markdown file
  function handleExport() {
    if (!filtered || filtered.length === 0) return;
    // Compute scope label locally to avoid TDZ issues with closure on `headerLabel`
    let label = "All notes";
    if (selectedCollection === "inbox") label = "Inbox";
    else if (selectedCollection === "today") label = "Today";
    else if (selectedCollection && currentCollection) label = currentCollection.name;
    const md = notesToMarkdownExport(filtered, collections, label + " — " + filtered.length + " notes");
    const safe = label.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "notes";
    const dateTag = formatDate(new Date());
    downloadTextFile(md, "planner-" + safe + "-" + dateTag + ".md");
  }

  // Accept template suggestion: replace just-saved note's blocks with the chosen template's blocks.
  // Preserve any user content by appending it as a final text block.
  function acceptTemplateSuggestion() {
    if (!templateSuggestion || !templateSuggestion.noteId) return;
    const tpl = TEMPLATES.find(t => t.id === templateSuggestion.templateId);
    if (!tpl) return;
    const note = notes.find(n => n.id === templateSuggestion.noteId);
    if (!note) return;
    const userText = blocksToText(note.blocks || []).trim();
    // Build new blocks: template blocks + a "Original capture" appendix if there was content
    const tplBlocks = tpl.blocks.map(b => Object.assign({}, b, { id: uid() }));
    const newBlocks = userText
      ? tplBlocks.concat([{ id: uid(), type: "h3", content: "Original capture" }, { id: uid(), type: "text", content: userText }])
      : tplBlocks;
    onUpdateNote(note.id, { blocks: newBlocks, templateId: tpl.id });
    setTemplateSuggestion(null);
  }

  // Accept the recent/upcoming task link
  function acceptRecentLinkSuggestion() {
    if (!recentLinkSuggestion || !recentLinkSuggestion.noteId) return;
    onLinkNoteToTask(recentLinkSuggestion.noteId, recentLinkSuggestion.task.id);
    setRecentLinkSuggestion(null);
  }

  // Saved search handlers
  function handleSaveCurrentSearch() {
    if (!search.trim()) return;
    const defaultName = search.length > 30 ? search.slice(0, 27) + "…" : search;
    setSaveSearchDialog({ defaultName: defaultName });
    setSaveSearchOpen(false);
  }
  function commitSaveSearch(name) {
    if (!saveSearchDialog) { setSaveSearchDialog(null); return; }
    if (name && name.trim() && onAddSavedSearch) onAddSavedSearch(name.trim(), search);
    setSaveSearchDialog(null);
  }
  function runSavedSearch(s) { setSearch(s.query); }

  const focusNote = focusNoteId ? notes.find(n => n.id === focusNoteId) : null;

  // Modal
  function openNewCollectionModal(parentId) { setModalParentId(parentId || null); setModalOpen(true); }
  function closeModal() { setModalOpen(false); setModalParentId(null); }
  function createCollectionFromModal(name, type) {
    const id = onAddCollection(name, type, modalParentId);
    closeModal();
    // Auto-expand parent and select new collection
    if (modalParentId) setExpandedCollections(prev => Object.assign({}, prev, { [modalParentId]: true }));
    setSelectedCollection(id);
  }

  function handleRename(id, currentName) {
    setRenameDialog({ id: id, name: currentName });
  }
  function commitRename(newName) {
    if (!renameDialog || !newName || !newName.trim()) { setRenameDialog(null); return; }
    onUpdateCollection(renameDialog.id, { name: newName.trim() });
    setRenameDialog(null);
  }
  function handleDelete(id, name, childCount) {
    setConfirmDeleteDialog({ id: id, name: name, childCount: childCount });
  }
  function commitDelete() {
    if (!confirmDeleteDialog) return;
    if (selectedCollection === confirmDeleteDialog.id) setSelectedCollection(null);
    onDeleteCollection(confirmDeleteDialog.id);
    setConfirmDeleteDialog(null);
  }

  // Note drag
  function handleNoteDragStart(noteId, e) {
    setDraggingNoteId(noteId);
    try { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", noteId); } catch (_) {}
  }
  function handleNoteDragEnd() { setDraggingNoteId(null); setDropTargetCollection(null); }
  function handleCollectionDragOver(targetId, e) {
    if (draggingNoteId == null) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = "move"; } catch (_) {}
    if (dropTargetCollection !== targetId) setDropTargetCollection(targetId);
  }
  function handleCollectionDrop(targetId, e) {
    e.preventDefault();
    if (draggingNoteId) {
      onMoveNote(draggingNoteId, targetId === "inbox" ? null : targetId);
    }
    setDraggingNoteId(null);
    setDropTargetCollection(null);
  }

  // Breadcrumb path
  const breadcrumbPath = useMemo(() => {
    if (!selectedCollection || selectedCollection === "inbox") return null;
    return getCollectionPath(collections, selectedCollection);
  }, [collections, selectedCollection]);

  // Header label
  let headerLabel = "All notes";
  if (selectedCollection === "inbox") headerLabel = "Inbox";
  else if (selectedCollection === "today") headerLabel = "Today";
  else if (breadcrumbPath && breadcrumbPath.length > 0) headerLabel = breadcrumbPath[breadcrumbPath.length - 1].name;

  const captureHint = (currentCollection)
    ? ("Saving to: " + headerLabel)
    : (selectedCollection === "inbox" ? "Saving to Inbox" : "Saving to All notes");

  const rootCollections = getChildCollections(collections, null);

  return (
    <div className="notes-section">
      <div className="notes-header">
        <h2>Notes <span className="notes-count">{notes.length === 0 ? "" : notes.length}</span></h2>
        <div className={"notes-search-wrap" + ((searchFocused || search) ? " expanded" : "")}>
          <span className="notes-search-icon"><SearchIcon size={13}/></span>
          <input
            className="notes-search"
            type="text"
            placeholder="Search notes…"
            value={search}
            onChange={e => setSearch(e.target.value)}
            onFocus={() => setSearchFocused(true)}
            onBlur={() => setTimeout(() => setSearchFocused(false), 200)}
          />
          {search && (
            <button className="notes-search-clear" onClick={() => setSearch("")} aria-label="Clear search"><XIcon size={11}/></button>
          )}
          {searchFocused && !search && searchHistory && searchHistory.length > 0 && (
            <div className="search-history-pop">
              <div className="search-history-head">
                <span>Recent searches</span>
                <button className="search-history-clear" onClick={() => { onClearSearchHistory && onClearSearchHistory(); }}>Clear</button>
              </div>
              {searchHistory.slice(0, 6).map((q, i) => (
                <button key={i} className="search-history-item" onMouseDown={(e) => { e.preventDefault(); setSearch(q); }}>
                  <SearchIcon size={11}/> <span>{q}</span>
                </button>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* Saved searches pill bar */}
      {(savedSearches && savedSearches.length > 0) || hasActiveSearch ? (
        <div className="saved-searches-bar">
          {savedSearches && savedSearches.map(s => (
            <button key={s.id} className={"saved-search-pill" + (search === s.query ? " active" : "")} onClick={() => runSavedSearch(s)} title={s.query}>
              <svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 2 V14 L8 10 L13 14 V2 Z"/></svg>
              <span>{s.name}</span>
              <span className="saved-search-x" onClick={(e) => { e.stopPropagation(); setDeleteSavedSearchDialog({ id: s.id, name: s.name }); }}><XIcon size={8}/></span>
            </button>
          ))}
          {hasActiveSearch && (
            <button className="saved-search-add" onClick={handleSaveCurrentSearch} title="Save current search as a pill">
              + Save this search
            </button>
          )}
        </div>
      ) : null}

      {hasActiveSearch && (
        <SearchFilterChips parsed={parsedQuery} matchCount={filtered.length} onClear={() => setSearch("")}/>
      )}

      <div className="workspace">
        {/* Sidebar */}
        <aside className="ws-sidebar">
          <div className="ws-sidebar-inner">
            <div className="ws-section-label">Workspace</div>
            <div className="ws-tree">
              {/* All notes */}
              <div
                className={"ws-collection-row" + (selectedCollection === null ? " selected" : "") + (dropTargetCollection === null && draggingNoteId ? " drag-target" : "")}
                onClick={() => setSelectedCollection(null)}
                onDragOver={(e) => handleCollectionDragOver(null, e)}
                onDrop={(e) => handleCollectionDrop(null, e)}
              >
                <span className="ws-caret empty"/>
                <span className="ws-coll-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><path d="M3 5 H13 M3 8 H13 M3 11 H10"/></svg></span>
                <span className="ws-coll-name">All notes</span>
                {notesCountByCollection.__all > 0 && <span className="ws-coll-count">{notesCountByCollection.__all}</span>}
              </div>
              {/* Inbox */}
              <div
                className={"ws-collection-row" + (selectedCollection === "inbox" ? " selected" : "") + (dropTargetCollection === "inbox" && draggingNoteId ? " drag-target" : "")}
                onClick={() => setSelectedCollection("inbox")}
                onDragOver={(e) => handleCollectionDragOver("inbox", e)}
                onDrop={(e) => handleCollectionDrop("inbox", e)}
              >
                <span className="ws-caret empty"/>
                <span className="ws-coll-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><path d="M2 4 H14 L13 11 H3 Z M5 11 V13 H11 V11"/></svg></span>
                <span className="ws-coll-name">Inbox</span>
                {notesCountByCollection.__inbox > 0 && <span className="ws-coll-count">{notesCountByCollection.__inbox}</span>}
              </div>
              {/* Today */}
              {todaysNotes.length > 0 && (
                <div
                  className={"ws-collection-row" + (selectedCollection === "today" ? " selected" : "")}
                  onClick={() => setSelectedCollection("today")}
                >
                  <span className="ws-caret empty"/>
                  <span className="ws-coll-icon" style={{color: "var(--accent)"}}>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="8" r="5.5"/><path d="M8 5 V8 L10 9.5"/></svg>
                  </span>
                  <span className="ws-coll-name">Today</span>
                  <span className="ws-coll-count">{todaysNotes.length}</span>
                </div>
              )}

              {/* Collections tree */}
              {rootCollections.map(col => (
                <CollectionTreeItem
                  key={col.id}
                  collection={col}
                  allCollections={collections}
                  level={0}
                  selectedId={selectedCollection}
                  expanded={expandedCollections}
                  setExpanded={setExpandedCollections}
                  onSelect={setSelectedCollection}
                  onAddChild={openNewCollectionModal}
                  onRename={handleRename}
                  onDelete={handleDelete}
                  notesCountByCollection={notesCountByCollection}
                  draggingNoteId={draggingNoteId}
                  dropTargetCollection={dropTargetCollection}
                  onCollectionDragOver={handleCollectionDragOver}
                  onCollectionDrop={handleCollectionDrop}
                />
              ))}
            </div>

            {rootCollections.length === 0 && (
              <p className="ws-empty-hint">No collections yet. Create one to organize notes into notebooks and chapters.</p>
            )}

            <div className="ws-new-collection">
              <button className="ws-new-btn" onClick={() => openNewCollectionModal(null)}>
                <PlusIcon size={11}/>
                New collection
              </button>
            </div>

            <div className="ws-sidebar-footer">
              <button className="ws-footer-btn" onClick={handleExport} title="Download current view as a markdown file" disabled={!filtered || filtered.length === 0}>
                <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M8 2 V11 M5 8 L8 11 L11 8 M3 13 H13"/></svg>
                Export
              </button>
              <button className="ws-footer-btn" onClick={() => setShortcutsOpen(true)} title="Show keyboard shortcuts and search syntax (?)">
                <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M6 6 A2 2 0 0 1 10 6 C10 7.5 8 7.8 8 9.5 M8 11.5 V11.5"/></svg>
                Shortcuts
              </button>
            </div>
          </div>
        </aside>

        {/* Main pane */}
        <div className="ws-main">
          {breadcrumbPath && (
            <div className="ws-breadcrumb">
              <span className="ws-breadcrumb-item" onClick={() => setSelectedCollection(null)}>All notes</span>
              {breadcrumbPath.map((c, i) => (
                <React.Fragment key={c.id}>
                  <span className="ws-breadcrumb-sep">›</span>
                  <span
                    className={"ws-breadcrumb-item" + (i === breadcrumbPath.length - 1 ? " current" : "")}
                    onClick={() => i === breadcrumbPath.length - 1 ? null : setSelectedCollection(c.id)}
                    style={i === breadcrumbPath.length - 1 ? {color: COLLECTION_TYPES[c.type]?.color || "var(--text)"} : {}}
                  >
                    <CollectionTypeIcon type={c.type} size={12}/>
                    {c.name}
                  </span>
                </React.Fragment>
              ))}
              {/* Inline actions for the current (last) collection — visible on every platform */}
              {breadcrumbPath.length > 0 && (() => {
                const current = breadcrumbPath[breadcrumbPath.length - 1];
                const childCount = collections.filter(c => c.parentId === current.id).length;
                return (
                  <span className="ws-breadcrumb-actions">
                    <button
                      className="ws-breadcrumb-action"
                      onClick={() => handleRename(current.id, current.name)}
                      title="Rename collection"
                      aria-label="Rename collection"
                    >
                      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M11 2 L14 5 L5 14 H2 V11 Z"/></svg>
                      Rename
                    </button>
                    <button
                      className="ws-breadcrumb-action danger"
                      onClick={() => handleDelete(current.id, current.name, childCount)}
                      title="Delete collection"
                      aria-label="Delete collection"
                    >
                      <TrashIcon size={13}/>
                    </button>
                  </span>
                );
              })()}
            </div>
          )}

          {/* Recently-touched — pick up where you left off (visible on every view) */}
          {recentlyTouched.length > 0 && (
            <RecentlyTouchedPanel notes={recentlyTouched} onOpen={handleOpenNoteById}/>
          )}

          {/* Activity heatmap — visible on every view when there are notes */}
          {notes.length > 0 && (
            <ActivityHeatmap notes={notes} onPickDate={handleHeatmapPickDate}/>
          )}

          {/* Today summary — visible on every view when there's activity today */}
          {(todaysNotes.length > 0 || todaysCompletedTasks.length > 0) && (
            <TodaySummary
              notesCount={todaysNotes.length}
              tasksDone={todaysCompletedTasks.length}
              onOpen={() => setSelectedCollection("today")}
              isOpen={selectedCollection === "today"}

          )}

          {/* Active task indicator — appears when a calendar task is happening right now */}
          {activeTaskNow && (
            <ActiveTaskBanner
              task={activeTaskNow}
              autoLinkEnabled={autoLinkEnabled}
              onToggleAutoLink={() => setAutoLinkEnabled(v => !v)}
            />
          )}

          <div className="note-capture">
            <textarea value={input} onChange={e => setInput(e.target.value)} onKeyDown={onKey} placeholder={isNarrow ? "Capture a thought or idea…" : "Capture a thought, observation, or idea… (markdown + #hashtags supported)"} rows={3}/>
            <div className="note-capture-foot">
              <span className="note-capture-hint">

                    <rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/>
                    <path d="M5 6 H11 M5 8 H11 M5 10 H9"/>
                  </svg>
                  Templates
                </button>
                <button className="qa-add" onClick={save} disabled={!input.trim()}>Save note</button>
              </div>
            </div>
          </div>

          {/* Smart suggestion: template family detected from just-saved content */}
          {templateSuggestion && (
            <SmartSuggestionBanner
              icon="◐"
              kind="template"
              text={"Looks like " + templateSuggestion.label.toLowerCase() + " — apply that template?"}
              hint={templateSuggestion.hint}
              actionLabel="Apply template"
              onAccept={acceptTemplateSuggestion}
              onDismiss={() => setTemplateSuggestion(null)}

          {/* Smart suggestion: link to recent or upcoming task */}
          {recentLinkSuggestion && (
            <SmartSuggestionBanner
              icon={recentLinkSuggestion.kind === "recent" ? "↶" : "↷"}
              kind="recent-task"
              text={
                recentLinkSuggestion.kind === "recent"
                  ? "Link to '" + recentLinkSuggestion.task.title + "' (ended " + Math.round(recentLinkSuggestion.minutesAgo) + " min ago)?"
                  : "Link to '" + recentLinkSuggestion.task.title + "' (starts in " + Math.round(recentLinkSuggestion.minutesUntil) + " min)?"
              }
              actionLabel="Link"
              onAccept={acceptRecentLinkSuggestion}
              onDismiss={() => setRecentLinkSuggestion(null)}
            />
          )}

          {/* Inline template suggestion for empty typed collections */}
          {currentCollection && filtered.length === 0 && notes.filter(n => n.collectionId === currentCollection.id).length === 0 && (
            <InlineTemplateSuggest
              collectionType={currentCollectionType}
              collectionName={currentCollection.name}
              onPick={(tpl) => onAddNoteFromTemplate(tpl, currentCollection.id)}
              onBrowse={() => setTemplatePickerOpen(true)}
            />
          )}

          <div className="notes-filters-wrap">
            <div className="notes-filters">
              <button className={"notes-filter notes-filter-all" + (filter === "all" ? " active" : "")} onClick={() => setFilter("all")}>All{counts.all > 0 && <span className="notes-filter-count">{counts.all}</span>}</button>
              <button className={"notes-filter notes-filter-untagged" + (filter === "untagged" ? " active" : "")} onClick={() => setFilter("untagged")}>
                <span className="notes-filter-icon" style={{border: "1.4px dashed var(--border-strong)", background: "transparent"}}></span>

              </button>
              {CAT_ORDER.map(k => (
                <button key={k} className={"notes-filter notes-filter-cat cat-" + k + (filter === k ? " active" : "")} onClick={() => setFilter(k)}>
                  <span className={"notes-filter-icon cat-" + k}><CatIcon cat={k} size={11}/></span>
                  {CATEGORIES[k].label}
                  {counts[k] > 0 && <span className="notes-filter-count">{counts[k]}</span>}
                </button>
              ))}
              {/* Bulk collapse/expand — only shown when there are 2+ visible notes */}
              {collapseStats.total >= 2 && (
                <button
                  className="notes-filter notes-filter-bulk"
                  onClick={() => allCollapsed ? expandAllVisible(collapseStats.ids) : collapseAllVisible(collapseStats.ids)}
                  title={allCollapsed ? "Expand every visible note" : "Collapse every visible note"}
                >
                  <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                    {allCollapsed
                      ? <><path d="M3 6 L8 11 L13 6"/></>  /* down chevron — expand */
                      : <><path d="M3 10 L8 5 L13 10"/></> /* up chevron — collapse */
                    }
                  </svg>
                  {allCollapsed ? "Expand all" : "Collapse all"}

              )}
            </div>
          </div>

          {tagList.length > 0 && (
            <div className="notes-tag-filters">
              <span className="tag-filter-label">Tags</span>
              {tagList.map(t => (
                <button key={t} className={"tag-chip" + (tagFilter === t ? " active" : "")} onClick={() => handleTagClick(t)}>
                  #{t}<span className="tag-count">{tagMap[t]}</span>
                </button>
              ))}
              {tagFilter && (
                <button className="tag-chip clear" onClick={() => setTagFilter(null)} aria-label="Clear tag filter">
                  <XIcon size={9}/>
                </button>
              )}
            </div>
          )}

          <div className="notes-feed">
            {filtered.length === 0 ? (
              <div className="notes-empty">
                <div className="notes-empty-icon" aria-hidden="true">
                  <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                      <linearGradient id="empty-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                        <stop offset="0" stopColor="#7e80f5"/>
                        <stop offset="1" stopColor="#5b5cf2"/>
                      </linearGradient>
                    </defs>
                    <rect x="12" y="10" width="36" height="44" rx="5" fill="white" stroke="url(#empty-grad)" strokeWidth="1.8" strokeOpacity="0.5"/>
                    <rect x="16" y="9" width="32" height="42" rx="5" fill="white" stroke="url(#empty-grad)" strokeWidth="1.8"/>
                    <path d="M21 21 H43" stroke="#a8a29e" strokeWidth="1.5" strokeLinecap="round" strokeOpacity="0.6"/>
                    <path d="M21 27 H39" stroke="#a8a29e" strokeWidth="1.5" strokeLinecap="round" strokeOpacity="0.4"/>
                    <path d="M21 33 H43" stroke="#a8a29e" strokeWidth="1.5" strokeLinecap="round" strokeOpacity="0.3"/>
                    <path d="M21 39 H35" stroke="#a8a29e" strokeWidth="1.5" strokeLinecap="round" strokeOpacity="0.2"/>
                    <circle cx="48" cy="14" r="5" fill="url(#empty-grad)"/>
                    <path d="M46 14 L47.5 15.5 L50 13" stroke="white" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </div>
                <h3 className="notes-empty-title">
                  {notes.length === 0
                    ? "Start capturing"
                    : (selectedCollection && selectedCollection !== "inbox"
                        ? "This collection is empty"
                        : "No notes match the filter")}
                </h3>
                <p className="notes-empty-text">
                  {notes.length === 0
                    ? <>Type a thought above and press <kbd>⌘</kbd>+<kbd>Enter</kbd>. Use <kbd>/</kbd> inside a note to add tables, callouts, math, code, diagrams, and more.</>
                    : (selectedCollection && selectedCollection !== "inbox"
                        ? "Save a note above to add one here, or drag an existing note in from the sidebar."
                        : "Try clearing filters or searching for something else.")}
                </p>
              </div>
            ) : (
              filtered.map(n => (
                <NoteCard
                  key={n.id}
                  note={n}
                  isDragging={draggingNoteId === n.id}
                  isHighlighted={highlightedNoteId === n.id}
                  innerRef={(el) => { if (el) noteRefs.current[n.id] = el; }}
                  allTasks={tasks}
                  allRecurring={recurring}
                  pickerOpenForThis={taskPickerForNote === n.id}
                  onOpenTaskPicker={() => setTaskPickerForNote(n.id)}
                  onCloseTaskPicker={() => setTaskPickerForNote(null)}
                  onUpdate={onUpdateNote}
                  onDelete={onDeleteNote}
                  onTogglePin={onTogglePin}
                  onTagClick={handleTagClick}
                  onLinkTask={onLinkNoteToTask}
                  onUnlinkTask={onUnlinkNoteFromTask}
                  onOpenTask={onOpenTask}
                  onDragStart={(e) => handleNoteDragStart(n.id, e)}
                  onDragEnd={handleNoteDragEnd}
                  titleIndex={titleIndex}
                  highlightTerms={parsedQuery.terms}
                  onWikiClick={handleWikiClick}
                  backlinks={backlinksByNoteId[n.id]}
                  onOpenNote={handleOpenNoteById}
                  onFocus={(noteId) => setFocusNoteId(noteId)}
                  notesForAutocomplete={notes}
                  isCollapsed={collapsedSet.has(n.id)}

                />
              ))

          </div>
        </div>
      </div>

      {modalOpen && (
        <NewCollectionModal
          parentName={modalParentId ? (collections.find(c => c.id === modalParentId) || {}).name : null}
          onClose={closeModal}
          onCreate={createCollectionFromModal}
        />
      )}

      {renameDialog && (
        <RenameCollectionDialog
          currentName={renameDialog.name}
          onCancel={() => setRenameDialog(null)}
          onSubmit={commitRename}
        />
      )}

      {confirmDeleteDialog && (
        <ConfirmDeleteDialog
          name={confirmDeleteDialog.name}
          childCount={confirmDeleteDialog.childCount}
          onCancel={() => setConfirmDeleteDialog(null)}
          onConfirm={commitDelete}

      )}

      {saveSearchDialog && (
        <PromptModal
          title="Save this search"
          label="Name"
          initialValue={saveSearchDialog.defaultName}
          placeholder="e.g. Recent trading notes"
          confirmLabel="Save"
          onCancel={() => setSaveSearchDialog(null)}
          onSubmit={commitSaveSearch}
        />
      )}

      {deleteSavedSearchDialog && (
        <ConfirmModal
          title="Delete saved search"
          message={<span>Delete <strong>"{deleteSavedSearchDialog.name}"</strong>? The underlying notes are not affected.</span>}
          confirmLabel="Delete"

          onConfirm={() => { onDeleteSavedSearch(deleteSavedSearchDialog.id); setDeleteSavedSearchDialog(null); }}

      {templatePickerOpen && (
        <TemplatePicker
          currentCollectionType={currentCollectionType}
          currentCollectionName={currentCollection ? currentCollection.name : null}
          onClose={() => setTemplatePickerOpen(false)}
          onPick={(tpl) => {
            const targetCollection = (!selectedCollection || selectedCollection === "inbox" || selectedCollection === "today") ? null : selectedCollection;
            onAddNoteFromTemplate(tpl, targetCollection);

          }}

      )}

      {focusNote && (
        <NoteFocusView
          note={focusNote}
          collections={collections}
          titleIndex={titleIndex}
          onWikiClick={(target) => { setFocusNoteId(null); handleWikiClick(target); }}
          onClose={() => setFocusNoteId(null)}
          onUpdate={onUpdateNote}
          onDelete={onDeleteNote}
          onTogglePin={onTogglePin}
        />
      )}

      {shortcutsOpen && (
        <ShortcutsCheatsheet onClose={() => setShortcutsOpen(false)}/>
      )}
    </div>
  );
}

// Inline template suggestion (empty typed collection)
// ============================================================
function InlineTemplateSuggest({ collectionType, collectionName, onPick, onBrowse }) {
  const suggestions = useMemo(() => suggestedTemplates(collectionType, 4), [collectionType]);
  if (suggestions.length === 0) return null;
  return (
    <div className="tpl-inline-suggest">
      <div className="tpl-inline-header">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M8 1.5 L10 6 L14.5 6.5 L11 10 L12 14.5 L8 12 L4 14.5 L5 10 L1.5 6.5 L6 6 Z"/>
        </svg>
        <span>Try a template for <b>{collectionName}</b></span>
      </div>
      <div className="tpl-inline-grid">
        {suggestions.map(tpl => (<TemplateCard key={tpl.id} tpl={tpl} onPick={onPick}/>))}
      </div>
      <button className="tpl-inline-browse" onClick={onBrowse}>Browse all templates →</button>
    </div>
  );
}

// ============================================================
// Template picker modal
// ============================================================
function TemplatePicker({ currentCollectionType, currentCollectionName, onClose, onPick }) {
  const [query, setQuery] = useState("");
  const searchRef = useRef(null);
  useEffect(() => { if (searchRef.current) searchRef.current.focus(); }, []);

  // Filter logic
  const q = query.trim().toLowerCase();
  function matches(tpl) {
    if (!q) return true;
    if ((tpl.family || "").toLowerCase().indexOf(q) !== -1) return true;
    if ((tpl.variant || "").toLowerCase().indexOf(q) !== -1) return true;
    if ((tpl.desc || "").toLowerCase().indexOf(q) !== -1) return true;
    if ((tpl.type || "").toLowerCase().indexOf(q) !== -1) return true;
    return false;
  }

  const suggested = useMemo(() => {
    if (q) return [];
    return suggestedTemplates(currentCollectionType, 6);
  }, [currentCollectionType, q]);
  const suggestedIds = new Set(suggested.map(t => t.id));

  const byType = useMemo(() => {
    const m = templatesByType();
    const out = {};
    for (const t in m) {
      const arr = m[t].filter(matches).filter(tpl => !suggestedIds.has(tpl.id));
      if (arr.length > 0) out[t] = arr;
    }
    return out;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [query, suggestedIds]);

  function handleScrim(e) { if (e.target === e.currentTarget) onClose(); }

  // Order of types in "all templates"
  const orderedTypes = COLLECTION_TYPE_ORDER.filter(t => byType[t] && byType[t].length > 0);
  const nothingFound = suggested.length === 0 && orderedTypes.length === 0;

  return (
    <div className="tpl-modal" onClick={handleScrim}>
      <div className="tpl-modal-card" role="dialog" aria-modal="true">
        <div className="tpl-modal-header">
          <h3 className="tpl-modal-title">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/>
              <path d="M5 6 H11 M5 8 H11 M5 10 H9"/>
            </svg>
            Choose a template
          </h3>
          <div className="tpl-search-wrap">
            <span className="tpl-search-icon"><SearchIcon size={13}/></span>
            <input
              ref={searchRef}
              type="text" className="tpl-search"
              placeholder="Search templates…"
              value={query}
              onChange={e => setQuery(e.target.value)}
              onKeyDown={e => { if (e.key === "Escape") onClose(); }}
            />
          </div>
          <button className="tpl-modal-close" onClick={onClose} aria-label="Close"><XIcon size={14}/></button>
        </div>
        <div className="tpl-modal-body">
          {nothingFound && (
            <div className="tpl-empty">No templates match "{query}".</div>
          )}

          {suggested.length > 0 && !q && (
            <>
              <div className="tpl-section-label">
                <span>Suggested{currentCollectionName ? " for " + currentCollectionName : ""}</span>
              </div>
              <div className="tpl-grid">
                {suggested.map(tpl => (<TemplateCard key={tpl.id} tpl={tpl} onPick={onPick}/>))}
              </div>
            </>
          )}

          {orderedTypes.map(type => (
            <div key={type}>
              <div className="tpl-section-label">
                <span className="tpl-section-label-type-icon" style={{color: COLLECTION_TYPES[type].color}}>
                  <CollectionTypeIcon type={type} size={12}/>
                </span>
                <span>{COLLECTION_TYPES[type].label}</span>
              </div>
              <div className="tpl-grid">
                {byType[type].map(tpl => (<TemplateCard key={tpl.id} tpl={tpl} onPick={onPick}/>))}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function TemplateCard({ tpl, onPick }) {
  // Compute meta: block count and 2-3 standout block types
  const blockCount = tpl.blocks ? tpl.blocks.length : 0;
  const types = {};
  if (tpl.blocks) for (let i = 0; i < tpl.blocks.length; i++) types[tpl.blocks[i].type] = (types[tpl.blocks[i].type] || 0) + 1;
  // Highlight the "interesting" types
  const interesting = [];
  if (types.math) interesting.push("math×" + types.math);
  if (types.code) interesting.push("code×" + types.code);
  if (types.check) interesting.push("checklist×" + types.check);
  return (
    <button className={"tpl-card t-" + tpl.type} onClick={() => onPick(tpl)}>
      <div className="tpl-card-header">
        <span className="tpl-card-name">{tpl.family}{tpl.variant ? " — " + tpl.variant : ""}</span>
      </div>
      <div className="tpl-card-desc">{tpl.desc}</div>
      <div className="tpl-card-meta">
        <span>{blockCount} blocks</span>
        {interesting.length > 0 && (
          <span className="tpl-card-block-types">
            {interesting.map((s, i) => <span key={i} className="tpl-card-block-tag">{s}</span>)}
          </span>
        )}
      </div>
    </button>
  );
}

// Collection tree row — recursive
function CollectionTreeItem({ collection, allCollections, level, selectedId, expanded, setExpanded, onSelect, onAddChild, onRename, onDelete, notesCountByCollection, draggingNoteId, dropTargetCollection, onCollectionDragOver, onCollectionDrop }) {
  const children = getChildCollections(allCollections, collection.id);
  const isExpanded = !!expanded[collection.id];
  const isSelected = selectedId === collection.id;
  const isDropTarget = dropTargetCollection === collection.id && draggingNoteId != null;
  const typeColor = COLLECTION_TYPES[collection.type]?.color || "var(--text-2)";
  const count = notesCountByCollection[collection.id] || 0;

  function toggleExpand(e) {
    e.stopPropagation();
    setExpanded(prev => Object.assign({}, prev, { [collection.id]: !prev[collection.id] }));
  }

  return (
    <div className="ws-tree-item">
      <div
        className={"ws-collection-row" + (isSelected ? " selected" : "") + (isDropTarget ? " drag-target" : "")}
        onClick={() => onSelect(collection.id)}
        onDragOver={(e) => onCollectionDragOver(collection.id, e)}
        onDrop={(e) => onCollectionDrop(collection.id, e)}
        style={level > 0 ? {} : {}}
      >
        <span
          className={"ws-caret" + (isExpanded ? " expanded" : "") + (children.length === 0 ? " empty" : "")}
          onClick={children.length > 0 ? toggleExpand : undefined}
        >
          {children.length > 0 ? "▸" : ""}
        </span>
        <span className="ws-coll-icon" style={{color: typeColor}}>
          <CollectionTypeIcon type={collection.type} size={13}/>
        </span>
        <span className="ws-coll-name">{collection.name}</span>
        <span className="ws-collection-actions">
          <button className="ws-coll-action" onClick={(e) => { e.stopPropagation(); onAddChild(collection.id); }} title="Add chapter">
            <PlusIcon size={10}/>
          </button>
          <button className="ws-coll-action" onClick={(e) => { e.stopPropagation(); onRename(collection.id, collection.name); }} title="Rename">
            <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><path d="M11 2 L14 5 L5 14 L2 14 L2 11 Z"/></svg>
          </button>
          <button className="ws-coll-action danger" onClick={(e) => { e.stopPropagation(); onDelete(collection.id, collection.name, children.length); }} title="Delete">
            <TrashIcon size={11}/>
          </button>
        </span>
        {count > 0 && <span className="ws-coll-count">{count}</span>}
      </div>

      {isExpanded && children.length > 0 && (
        <div className="ws-collection-children">
          {children.map(child => (
            <CollectionTreeItem
              key={child.id}
              collection={child}
              allCollections={allCollections}
              level={level + 1}
              selectedId={selectedId}
              expanded={expanded}
              setExpanded={setExpanded}
              onSelect={onSelect}
              onAddChild={onAddChild}
              onRename={onRename}
              onDelete={onDelete}
              notesCountByCollection={notesCountByCollection}
              draggingNoteId={draggingNoteId}
              dropTargetCollection={dropTargetCollection}
              onCollectionDragOver={onCollectionDragOver}
              onCollectionDrop={onCollectionDrop}
            />
          ))}
        </div>
      )}
    </div>
  );
}

// New-collection modal
function NewCollectionModal({ parentName, onClose, onCreate }) {
  const [name, setName] = useState("");
  const [type, setType] = useState("general");
  const inputRef = useRef(null);

  useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);

  function handleSubmit() {
    if (!name.trim()) return;
    onCreate(name.trim(), type);
  }
  function handleKey(e) {
    if (e.key === "Enter") { e.preventDefault(); handleSubmit(); }
    else if (e.key === "Escape") { e.preventDefault(); onClose(); }
  }
  function handleScrim(e) { if (e.target === e.currentTarget) onClose(); }

  return (
    <div className="ws-modal" onClick={handleScrim}>
      <div className="ws-modal-card">
        <h3 className="ws-modal-title">
          {parentName ? "New chapter in “" + parentName + "”" : "New collection"}
        </h3>
        <input
          ref={inputRef}
          className="ws-modal-input"
          type="text"
          value={name}
          onChange={e => setName(e.target.value)}
          onKeyDown={handleKey}
          placeholder={parentName ? "Chapter name (e.g. Ch 3: Sorting)" : "Collection name (e.g. USYD Algorithms)"}
        />
        <span className="ws-modal-label">Type</span>
        <div className="ws-type-grid">
          {COLLECTION_TYPE_ORDER.map(k => (
            <button
              key={k}
              className={"ws-type-btn" + (type === k ? " selected" : "")}
              onClick={() => setType(k)}
              style={type === k ? {} : {}}
            >
              <span className="ws-type-btn-icon" style={{color: COLLECTION_TYPES[k].color}}>
                <CollectionTypeIcon type={k} size={18}/>
              </span>
              {COLLECTION_TYPES[k].label}
            </button>
          ))}
        </div>
        <div className="ws-modal-actions">
          <button onClick={onClose}>Cancel</button>
          <button className="primary" onClick={handleSubmit} disabled={!name.trim()}>
            Create
          </button>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// Rename collection dialog — in-app, works inside iframes/PWAs
// where window.prompt is blocked
// ============================================================
function RenameCollectionDialog({ currentName, onCancel, onSubmit }) {
  const [name, setName] = useState(currentName || "");
  const inputRef = useRef(null);
  useEffect(() => {
    if (inputRef.current) {
      inputRef.current.focus();
      try { inputRef.current.select(); } catch (e) {}
    }
  }, []);
  function handleKey(e) {
    if (e.key === "Enter") { e.preventDefault(); if (name.trim()) onSubmit(name); }
    else if (e.key === "Escape") { e.preventDefault(); onCancel(); }
  }
  function handleScrim(e) { if (e.target === e.currentTarget) onCancel(); }
  return (
    <div className="ws-modal" onClick={handleScrim}>
      <div className="ws-modal-card">
        <h3 className="ws-modal-title">Rename collection</h3>
        <input
          ref={inputRef}
          className="ws-modal-input"
          type="text"
          value={name}
          onChange={e => setName(e.target.value)}
          onKeyDown={handleKey}
          placeholder="Collection name"
        />
        <div className="ws-modal-actions">
          <button onClick={onCancel}>Cancel</button>
          <button className="primary" onClick={() => onSubmit(name)} disabled={!name.trim() || name.trim() === currentName}>
            Rename
          </button>
        </div>
      </div>
    </div>
  );
}

    return () => document.removeEventListener("keydown", onKey);
  }, [onCancel, onConfirm]);
  function handleScrim(e) { if (e.target === e.currentTarget) onCancel(); }
  const childMsg = childCount > 0
    ? " and its " + childCount + " chapter" + (childCount !== 1 ? "s" : "")

  return (
    <div className="ws-modal" onClick={handleScrim}>

}

// ============================================================
// Generic text-prompt modal — replaces window.prompt anywhere in the app

function PromptModal({ title, label, initialValue, placeholder, confirmLabel, onCancel, onSubmit }) {
  const [value, setValue] = useState(initialValue || "");
  const inputRef = useRef(null);
  useEffect(() => {
    if (inputRef.current) {
      inputRef.current.focus();
      try { inputRef.current.select(); } catch (e) {}
    }
  }, []);
  function handleKey(e) {
    if (e.key === "Enter") { e.preventDefault(); if (value.trim()) onSubmit(value); }
    else if (e.key === "Escape") { e.preventDefault(); onCancel(); }
  }
  function handleScrim(e) { if (e.target === e.currentTarget) onCancel(); }
  return (
    <div className="ws-modal" onClick={handleScrim}>

function TimeStrip({ timestamp, category }) {
  const d = new Date(timestamp);
  const hour = d.getHours(); const minute = d.getMinutes();
  const raw = (hour * 60 + minute) / (24 * 60) * 100;
  const pct = Math.max(2.5, Math.min(97.5, raw));
  const catColor = category ? (CAT_COLORS[category] || "#888780") : "#888780";
  return (
    <div className="time-strip" aria-hidden="true">
      <div className="time-strip-tick" style={{left: "25%"}}/>
      <div className="time-strip-tick" style={{left: "50%"}}/>
      <div className="time-strip-tick" style={{left: "75%"}}/>
      <div className="time-strip-marker" style={{ left: pct + "%", color: catColor, boxShadow: "0 0 0 1.5px " + catColor + ", 0 1px 3px rgba(0,0,0,0.18)" }} title={pad(hour) + ":" + pad(minute)}>
        {category ? <CatIcon cat={category} size={11}/> : <span className="untagged-dot"/>}
      </div>
    </div>
  );
}

function NoteCatPicker({ current, onPick, onClose }) {
