              <text x={x + barW/2} y={value >= 0 ? yTop - 5 : yBottom + 13} textAnchor="middle" fontSize="10" fontWeight="600" fill="#1c1917">{value}</text>
            </g>
          );
        })}
      </svg>

      <div className="chart-data-editor">
        <span className="chart-data-label">Data</span>
        <div className="chart-data-rows">
          {rows.map((r, i) => (
            <div key={i} className="chart-data-row">
              <input className="chart-cell-label" value={r.label} onChange={e => updateRow(i, { label: e.target.value })} placeholder="Label"/>
              <input className="chart-cell-value" type="number" value={r.value} onChange={e => updateRow(i, { value: parseFloat(e.target.value) || 0 })} placeholder="Value"/>
              <button className="chart-cell-remove" onClick={() => removeRow(i)} disabled={rows.length <= 1} aria-label="Remove">×</button>
            </div>
          ))}
        </div>
        <button className="chart-add-row" onClick={addRow}>+ Add row</button>
      </div>
    </div>
  );
}


function Block({ block, isFocused, focusOnMount, onChange, onEnter, onBackspaceEmpty, onArrowUp, onArrowDown, onFocus, onBlur, onSlash, onCheckToggle, numbering, titleIndex, highlightTerms, onWikiClick, notesForAutocomplete }) {
  const taRef = useRef(null);
  const [editing, setEditing] = useState(focusOnMount || false);
  const editingRef = useRef(editing);
  editingRef.current = editing;
  // Inline autocomplete state: { kind: "tag"|"wiki", prefix, items, focused }
  const [acState, setAcState] = useState(null);

  useAutoGrow(taRef, block.content);

  useEffect(() => {
    if (focusOnMount && taRef.current) {
      taRef.current.focus();
      const len = (block.content || "").length;
      try { taRef.current.setSelectionRange(len, len); } catch (e) {}
      setEditing(true);
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Detect if the cursor is currently inside a `#xxx` or `[[xxx` token. If so, surface suggestions.
  // Skip detection inside code/math blocks (raw input wins).
  function refreshAutocomplete() {
    if (block.type === "code" || block.type === "math") { setAcState(null); return; }
    if (!taRef.current) { setAcState(null); return; }
    const ta = taRef.current;
    const pos = ta.selectionStart;
    if (pos == null || pos !== ta.selectionEnd) { setAcState(null); return; }
    const text = ta.value || "";
    const upto = text.slice(0, pos);
    // Wiki-link match: `[[...` where ... has no closing `]]` and no newline
    const wikiMatch = upto.match(/\[\[([^\[\]\n]*)$/);
    if (wikiMatch) {
      const prefix = wikiMatch[1];
      const items = suggestWikiTargets(prefix, notesForAutocomplete || [], 6);
      if (items.length > 0) { setAcState({ kind: "wiki", prefix, items, focused: 0 }); return; }
      setAcState(null); return;
    }
    // Hashtag match: `#xxx` at word boundary
    const tagMatch = upto.match(/(?:^|[^\w])#([a-zA-Z][\w-]{0,30})$/);
    if (tagMatch) {
      const prefix = tagMatch[1];
      const items = suggestTags(prefix, notesForAutocomplete || [], 6);
      // Only show if we have items AND the user has typed at least 1 char (avoids noise on lone `#`)
      if (items.length > 0 && prefix.length > 0) { setAcState({ kind: "tag", prefix, items, focused: 0 }); return; }
      setAcState(null); return;
    }
    setAcState(null);
  }

  // Apply an autocomplete pick by replacing the in-progress token in the text
  function acceptAutocomplete(item) {
    if (!taRef.current || !acState) return;
    const ta = taRef.current;
    const pos = ta.selectionStart;
    const text = ta.value || "";
    const upto = text.slice(0, pos);
    let newUpto, completion;
    if (acState.kind === "wiki") {
      const m = upto.match(/\[\[([^\[\]\n]*)$/);
      if (!m) { setAcState(null); return; }
      const start = m.index + 2;
      newUpto = text.slice(0, start) + item.title + "]]";
      completion = item.title.length + 2; // +2 for ]]
    } else {
      const m = upto.match(/(?:^|[^\w])#([a-zA-Z][\w-]{0,30})$/);
      if (!m) { setAcState(null); return; }
      // The `#` is at m.index + 1 if there's a leading non-word char, else 0
      const hashPos = m.index + (m[0][0] === "#" ? 0 : 1);
      newUpto = text.slice(0, hashPos + 1) + item.tag;
      completion = item.tag.length + 1;
    }
    const newText = newUpto + text.slice(pos);
    const newCursor = newUpto.length;
    onChange(block.id, { content: newText });
    setAcState(null);
    // Restore cursor on next tick
    setTimeout(() => {
      if (taRef.current) {
        taRef.current.focus();
        try { taRef.current.setSelectionRange(newCursor, newCursor); } catch (e) {}
      }
    }, 0);
  }

  function handleKey(e) {
    // Autocomplete navigation (when dropdown is open)
    if (acState && acState.items.length > 0) {
      if (e.key === "ArrowDown") { e.preventDefault(); setAcState(s => Object.assign({}, s, { focused: Math.min(s.items.length - 1, s.focused + 1) })); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); setAcState(s => Object.assign({}, s, { focused: Math.max(0, s.focused - 1) })); return; }
      if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); acceptAutocomplete(acState.items[acState.focused]); return; }
      if (e.key === "Escape") { e.preventDefault(); setAcState(null); return; }
    }

    // Slash menu trigger: only when typing "/" at start of empty block (and not in code/math)
    if (e.key === "/" && (block.type !== "code" && block.type !== "math") && (block.content || "") === "" && onSlash) {
      e.preventDefault();
      onSlash(block.id);
      return;
    }

    // For text-like blocks, Enter splits/creates new block
    if (e.key === "Enter" && !e.shiftKey && block.type !== "code" && block.type !== "math") {
      e.preventDefault();
      onEnter(block.id, taRef.current ? taRef.current.selectionStart : 0);
      return;
    }
    // Inside code/math: plain Enter inserts newline (default behavior).
    // Shift+Enter in text exits to a new text block.
    if (e.key === "Enter" && e.shiftKey && (block.type === "code" || block.type === "math")) {
      e.preventDefault();
      onEnter(block.id, taRef.current ? taRef.current.selectionStart : 0, true);
      return;
    }

    if (e.key === "Backspace") {
      const ta = taRef.current;
      if (ta && ta.selectionStart === 0 && ta.selectionEnd === 0) {
        if ((block.content || "") === "" || block.type !== "text") {
          e.preventDefault();
          onBackspaceEmpty(block.id);
          return;
        }
      }
    }

    if (e.key === "ArrowUp" && taRef.current && taRef.current.selectionStart === 0) {
      e.preventDefault();
      onArrowUp(block.id);
      return;
    }
    if (e.key === "ArrowDown" && taRef.current && taRef.current.selectionStart === (block.content || "").length) {
      e.preventDefault();
      onArrowDown(block.id);
      return;
    }

    // Tab inside code → insert 2 spaces (basic)
    if (e.key === "Tab" && block.type === "code") {
      e.preventDefault();
      const ta = taRef.current;
      if (ta) {
        const start = ta.selectionStart, end = ta.selectionEnd;
        const newVal = (block.content || "").slice(0, start) + "  " + (block.content || "").slice(end);
        onChange(block.id, { content: newVal });
        setTimeout(() => { try { ta.setSelectionRange(start + 2, start + 2); } catch (e) {} }, 0);
      }
    }
  }

  function handleChange(e) {
    onChange(block.id, { content: e.target.value });
    // Defer to next tick so the textarea selection is up to date
    setTimeout(refreshAutocomplete, 0);
  }

  function handleSelect() { setTimeout(refreshAutocomplete, 0); }

  function handleFocus() { setEditing(true); if (onFocus) onFocus(block.id); }
  function handleBlur() {
    setEditing(false);
    // Delay close so a mousedown on a dropdown item can fire before the dropdown unmounts
    setTimeout(() => setAcState(null), 150);
    if (onBlur) onBlur(block.id);
  }

  // === Render dispatcher ===
  const content = block.content || "";

  // Divider — no input
  if (block.type === "divider") {
    return (
      <div className="block block-divider">
        <hr/>
      </div>
    );
  }

  // Diagram block
  if (block.type === "diagram") {
    return <DiagramBlock block={block} onChange={onChange}/>;
  }

  // Math block — special handling
  if (block.type === "math") {
    const lines = useMemo(() => evaluateMathBlock(content), [content]);
    return (
      <div className="block">
        <div className="block-row">
          <span className="block-handle">⋮⋮</span>
          <div className="block-content">
            <div className="block-math">
              <span className="block-math-label">ƒ math</span>
              {editing ? (
                <textarea
                  ref={taRef}
                  className="block-math-input"
                  value={content}
                  onChange={handleChange}
                  onKeyDown={handleKey}
                  onFocus={handleFocus}
                  onBlur={handleBlur}
                  placeholder="2 + 3&#10;tax = 0.1&#10;100 * (1 + tax)"
                  spellCheck="false"
                  autoCorrect="off"
                  autoCapitalize="off"
                  rows={Math.max(1, content.split("\n").length)}
                />
              ) : (
                <div className="block-math-rendered" onClick={() => setEditing(true)}>
                  {lines.length === 0 || (lines.length === 1 && lines[0].kind === "blank") ? (
                    <span className="block-rendered-empty">Click to add math — e.g. <code>2+3</code>, <code>tax = 0.1</code>, <code>100*(1+tax)</code></span>
                  ) : lines.map((ln, i) => {
                    if (ln.kind === "blank") return <div key={i} className="block-math-line" style={{height: "1.5em"}}></div>;
                    if (ln.kind === "comment") return <div key={i} className="block-math-line"><span className="block-math-comment">{ln.text}</span></div>;
                    if (ln.kind === "error") return (
                      <div key={i} className="block-math-line">
                        <span className="block-math-expr">{ln.expr}</span>
                        <span className="block-math-error">⚠ {ln.error}</span>
                      </div>
                    );
                    return (
                      <div key={i} className="block-math-line">
                        <span className="block-math-expr">{ln.expr}</span>
                        {!ln.isAssign && <span className="block-math-eq">=</span>}
                        {!ln.isAssign && <span className="block-math-result">{ln.result}</span>}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    );
  }

  // Code block
  if (block.type === "code") {
    const lang = block.lang || detectLanguage(content);
    const highlighted = !editing && content ? highlightCode(content, lang) : null;
    return (
      <div className="block">
        <div className="block-row">
          <span className="block-handle">⋮⋮</span>
          <div className="block-content">
            <div className="block-code">
              {lang && <span className="block-code-label">{lang}</span>}
              {editing ? (
                <textarea
                  ref={taRef}
                  className="block-code-input"
                  value={content}
                  onChange={handleChange}
                  onKeyDown={handleKey}
                  onFocus={handleFocus}
                  onBlur={handleBlur}
                  placeholder="// paste or type code…"
                  spellCheck="false"
                  autoCorrect="off"
                  autoCapitalize="off"
                  rows={Math.max(1, content.split("\n").length)}
                />
              ) : (
                <pre className="block-code-rendered" onClick={() => setEditing(true)}>
                  {!content ? (
                    <span className="block-rendered-empty">Click to add code…</span>
                  ) : highlighted ? (
                    <code dangerouslySetInnerHTML={{__html: highlighted}}/>
                  ) : (
                    <code>{content}</code>
                  )}
                </pre>
              )}
            </div>
          </div>
        </div>
      </div>
    );
  }

  // Checklist
  if (block.type === "check") {
    return (
      <div className={"block block-check" + (block.checked ? " checked" : "")} style={{position: "relative"}}>
        <div className="block-row">
          <span className="block-handle">⋮⋮</span>
          <div className="block-content" style={{display: "flex", gap: "8px", alignItems: "flex-start"}}>
            <span className={"block-check-box" + (block.checked ? " checked" : "")}
                  onClick={() => onCheckToggle(block.id)} role="checkbox" aria-checked={!!block.checked}/>
            {editing ? (
              <textarea
                ref={taRef}
                className="block-text-input"
                value={content}
                onChange={handleChange}
                onKeyDown={handleKey}
                onFocus={handleFocus}
                onBlur={handleBlur}
                onSelect={handleSelect}
                placeholder="Checklist item…"
                rows={1}
              />
            ) : (
              <div className="block-rendered" onClick={(e) => {
                const wl = e.target.closest && e.target.closest("[data-wiki]");
                if (wl && onWikiClick) { e.stopPropagation(); onWikiClick(wl.getAttribute("data-wiki")); return; }
                setEditing(true);
              }} dangerouslySetInnerHTML={{__html: content ? renderInline(content, { titleIndex, highlightTerms }) : '<span class="block-rendered-empty">Checklist item…</span>'}}/>
            )}
          </div>
        </div>
        {acState && acState.items.length > 0 && (
          <AutocompletePopover state={acState} onPick={acceptAutocomplete} onClose={() => setAcState(null)}/>
        )}
      </div>
    );
  }

  // Bullet / Numbered / Text / Headings
  let placeholder = "Type, or press / for commands…";
  if (block.type === "h1") placeholder = "Heading 1";
  else if (block.type === "h2") placeholder = "Heading 2";
  else if (block.type === "h3") placeholder = "Heading 3";
  else if (block.type === "bullet") placeholder = "List item…";
  else if (block.type === "numbered") placeholder = "List item…";

  const wrapClass = "block block-" + (block.type === "h1" || block.type === "h2" || block.type === "h3" ? "heading-" + block.type[1] : block.type);

  return (
    <div className={wrapClass} style={{position: "relative"}}>
      <div className="block-row">
        <span className="block-handle">⋮⋮</span>
        <div className="block-content" style={
          block.type === "bullet" ? {display: "flex", alignItems: "flex-start", gap: "8px"} :
          block.type === "numbered" ? {display: "flex", alignItems: "flex-start", gap: "6px"} :
          {}
        }>
          {block.type === "bullet" && <span style={{flexShrink: 0, color: "var(--text-2)", fontSize: 14, lineHeight: 1.6, paddingTop: 4}}>•</span>}
          {block.type === "numbered" && <span className="block-num">{numbering || 1}.</span>}
          {editing ? (
            <textarea
              ref={taRef}
              className="block-text-input"
              value={content}
              onChange={handleChange}
              onKeyDown={handleKey}
              onFocus={handleFocus}
              onBlur={handleBlur}
              onSelect={handleSelect}
              onClick={handleSelect}
              placeholder={placeholder}
              rows={1}
              style={{flex: 1}}
            />
          ) : (
            <div className="block-rendered" onClick={(e) => {
                const wl = e.target.closest && e.target.closest("[data-wiki]");
                if (wl && onWikiClick) { e.stopPropagation(); onWikiClick(wl.getAttribute("data-wiki")); return; }
                setEditing(true);
              }}
                 style={{flex: block.type === "bullet" || block.type === "numbered" ? 1 : "initial"}}
                 dangerouslySetInnerHTML={{__html: content ? renderInline(content, { titleIndex, highlightTerms }) : '<span class="block-rendered-empty">' + placeholder + '</span>'}}/>
          )}
        </div>
      </div>
      {acState && acState.items.length > 0 && (
        <AutocompletePopover state={acState} onPick={acceptAutocomplete} onClose={() => setAcState(null)}/>
      )}
    </div>
  );
}

// ============================================================
// Inline autocomplete popover (used by Block for #tags and [[wiki]])
// ============================================================
function AutocompletePopover({ state, onPick }) {
  const kind = state.kind;
  return (
    <div className="inline-autocomplete" style={{top: "100%", left: 24, marginTop: 2}}>
      <div className="inline-autocomplete-head">
        {kind === "wiki" ? "Link to note" : "Tag"}
      </div>
      {state.items.map((item, i) => (
        <button
          key={i}
          className={"inline-autocomplete-item" + (i === state.focused ? " focused" : "")}
          onMouseDown={(e) => { e.preventDefault(); onPick(item); }}
        >
          <span className="inline-autocomplete-item-text">
            {kind === "wiki" ? item.title : ("#" + item.tag)}
          </span>
          {kind === "tag" && <span className="inline-autocomplete-item-count">{item.count}</span>}
        </button>
      ))}
    </div>
  );
}

// ============================================================
// Block editor — orchestrates a list of blocks for a note
// ============================================================
function BlockEditor({ blocks, onChange, titleIndex, highlightTerms, onWikiClick, notesForAutocomplete }) {
  const [focusId, setFocusId] = useState(null);
  const [slashFor, setSlashFor] = useState(null); // block id where slash menu is open
  const [slashQuery, setSlashQuery] = useState("");
  const focusOnMountRef = useRef(null);

  // Build numbering for numbered-list blocks (resets on non-numbered)
  const numbering = useMemo(() => {
    const map = {};
    let n = 0;
    for (let i = 0; i < blocks.length; i++) {
      if (blocks[i].type === "numbered") { n++; map[blocks[i].id] = n; }
      else { n = 0; }
    }
    return map;
  }, [blocks]);

  function updateBlock(id, updates) {
    onChange(blocks.map(b => b.id === id ? Object.assign({}, b, updates) : b));
  }

  function handleEnter(id, caretPos, forceText) {
    const idx = blocks.findIndex(b => b.id === id);
    if (idx === -1) return;
    const cur = blocks[idx];
    const content = cur.content || "";

    // For code/math, default Enter is newline (we won't be called); Shift+Enter triggers this with forceText=true.
    let newBlocks = blocks.slice();
    if (forceText || cur.type === "code" || cur.type === "math") {
      // Insert a new empty text block after
      const fresh = newBlock("text", "");
      newBlocks.splice(idx + 1, 0, fresh);
      focusOnMountRef.current = fresh.id;
      onChange(newBlocks);
      return;
    }

    // For empty heading/checklist/bullet/numbered → convert to text instead of splitting
    if (!content && (cur.type !== "text")) {
      newBlocks[idx] = Object.assign({}, cur, { type: "text", checked: false });
      focusOnMountRef.current = cur.id;
      onChange(newBlocks);
      return;
    }

    // Split at caret
    const before = content.slice(0, caretPos);
    const after = content.slice(caretPos);
    // Inherit type for list-like blocks (so Enter inside a bullet creates another bullet)
    const inheritType = (cur.type === "bullet" || cur.type === "numbered" || cur.type === "check") ? cur.type : "text";
    const fresh = newBlock(inheritType, after);
    if (inheritType === "check") fresh.checked = false;
    newBlocks[idx] = Object.assign({}, cur, { content: before });
    newBlocks.splice(idx + 1, 0, fresh);
    focusOnMountRef.current = fresh.id;
    onChange(newBlocks);
  }

  function handleBackspaceEmpty(id) {
    const idx = blocks.findIndex(b => b.id === id);
    if (idx === -1) return;
    const cur = blocks[idx];

    // If not text, convert to text (so backspacing a bullet/heading first un-decorates it)
    if (cur.type !== "text" && (cur.content || "")) {
      onChange(blocks.map(b => b.id === id ? Object.assign({}, b, { type: "text", checked: false }) : b));
      focusOnMountRef.current = id;
      return;
    }

    // Otherwise delete this block and merge into previous
    if (idx === 0) {
      // Already at top with empty → keep one block
      if (blocks.length === 1) return;
      // Delete and focus next
      const next = blocks[1];
      onChange(blocks.slice(1));
      focusOnMountRef.current = next.id;
      return;
    }
    const prev = blocks[idx - 1];
    const merged = (prev.content || "") + (cur.content || "");
    const out = blocks.slice();
    out[idx - 1] = Object.assign({}, prev, { content: merged });
    out.splice(idx, 1);
    focusOnMountRef.current = prev.id;
    onChange(out);
  }

  function handleArrowUp(id) {
    const idx = blocks.findIndex(b => b.id === id);
    if (idx <= 0) return;
    focusOnMountRef.current = blocks[idx - 1].id;
    setFocusId(blocks[idx - 1].id);
  }
  function handleArrowDown(id) {
    const idx = blocks.findIndex(b => b.id === id);
    if (idx === -1 || idx >= blocks.length - 1) return;
    focusOnMountRef.current = blocks[idx + 1].id;
    setFocusId(blocks[idx + 1].id);
  }

  function handleSlashOpen(id) { setSlashFor(id); setSlashQuery(""); }
  function handleSlashPick(type) {
    const id = slashFor;
    setSlashFor(null); setSlashQuery("");
    if (!id) return;
    const idx = blocks.findIndex(b => b.id === id);
    if (idx === -1) return;
    const cur = blocks[idx];
    // Replace the current empty block with the chosen type
    const replaced = Object.assign({}, cur, { type, content: "", checked: false });
    if (type === "divider") {
      // For divider, also add an empty text block after to keep typing
      const fresh = newBlock("text", "");
      const out = blocks.slice();
      out[idx] = replaced;
      out.splice(idx + 1, 0, fresh);
      focusOnMountRef.current = fresh.id;
      onChange(out);
    } else {
      onChange(blocks.map(b => b.id === id ? replaced : b));
      focusOnMountRef.current = id;
    }
  }
  function handleSlashClose() { setSlashFor(null); setSlashQuery(""); }

  function handleCheckToggle(id) {
    onChange(blocks.map(b => b.id === id ? Object.assign({}, b, { checked: !b.checked }) : b));
  }

  function addBlockAfter(idx, type) {
    const fresh = newBlock(type || "text", "");
    const out = blocks.slice();
    out.splice(idx + 1, 0, fresh);
    focusOnMountRef.current = fresh.id;
    onChange(out);
  }

  // Reset focusOnMountRef after one tick so it doesn't keep refocusing
  useEffect(() => {
    if (focusOnMountRef.current) {
      const id = focusOnMountRef.current;
      // Clear after render so subsequent renders don't re-focus
      const t = setTimeout(() => { focusOnMountRef.current = null; }, 50);
      return () => clearTimeout(t);
    }
  }, [blocks]);

  if (!blocks || blocks.length === 0) {
    return null;
  }

  return (
    <div className="blocks">
      {blocks.map((b, i) => (
        <div key={b.id} style={{position: "relative"}}>
          <Block
            block={b}
            isFocused={focusId === b.id}
            focusOnMount={focusOnMountRef.current === b.id}
            onChange={updateBlock}
            onEnter={handleEnter}
            onBackspaceEmpty={handleBackspaceEmpty}
            onArrowUp={handleArrowUp}
            onArrowDown={handleArrowDown}
            onFocus={(id) => setFocusId(id)}
            onSlash={handleSlashOpen}
            onCheckToggle={handleCheckToggle}
            numbering={numbering[b.id]}
            titleIndex={titleIndex}
            highlightTerms={highlightTerms}
            onWikiClick={onWikiClick}
            notesForAutocomplete={notesForAutocomplete}
          />
          {slashFor === b.id && (
            <div style={{position: "absolute", top: "calc(100% - 4px)", left: 24, zIndex: 60}}>
              <SlashMenu query={slashQuery} onPick={handleSlashPick} onClose={handleSlashClose}/>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}


function App() {
  const [tasks, setTasks] = useState([]);
  const [recurring, setRecurring] = useState([]);
  const [notes, setNotes] = useState([]);
  const [collections, setCollections] = useState([]);
  const [savedSearches, setSavedSearches] = useState([]); // [{ id, name, query }]
  const [searchHistory, setSearchHistory] = useState([]); // [query, query, ...] most-recent first
  const [loaded, setLoaded] = useState(false);
  const [weekOffset, setWeekOffset] = useState(0);
  const [input, setInput] = useState("");
  const [selected, setSelected] = useState(null);
  const [dragging, setDragging] = useState(null);
  const [dragOverDay, setDragOverDay] = useState(null);
  const [navTarget, setNavTarget] = useState(null); // { noteId, ts } for jumping to a note from elsewhere
  const inputRef = useRef(null);

  useEffect(() => {
    let mounted = true;
    (async () => {
      const t = await loadJSON(STORAGE_KEYS.tasks, []);
      const r = await loadJSON(STORAGE_KEYS.recurring, []);
      let n = await loadJSON(STORAGE_KEYS.notes, null);
      const col = await loadJSON(STORAGE_KEYS.collections, []);
      const ss = await loadJSON(STORAGE_KEYS.savedSearches, []);
      const sh = await loadJSON(STORAGE_KEYS.searchHistory, []);
      // Migrate from legacy v2 (body-only)
      if (n == null) {
        const legacy = await loadJSON(STORAGE_KEYS.notesLegacy, []);
        if (Array.isArray(legacy) && legacy.length > 0) {
          n = legacy.map(note => Object.assign({}, note, {
            blocks: note.blocks && note.blocks.length ? note.blocks : migrateMarkdownToBlocks(note.body || ""),
            body: undefined
          }));
        } else {
          n = [];
        }
      }
      // Safety: any note without blocks gets one + ensure collectionId field + linkedTaskIds
      n = (Array.isArray(n) ? n : []).map(note => {
        const fixed = Object.assign({}, note);
        if (!fixed.blocks || !Array.isArray(fixed.blocks) || fixed.blocks.length === 0) {
          fixed.blocks = migrateMarkdownToBlocks(note.body || "");
        }
        if (fixed.collectionId === undefined) fixed.collectionId = null;
        if (!Array.isArray(fixed.linkedTaskIds)) fixed.linkedTaskIds = [];
        return fixed;
      });
      if (!mounted) return;
      const ensureLinks = (arr) => arr.map(x => Object.assign({linkedTaskIds: []}, x, { linkedTaskIds: x.linkedTaskIds || [] }));
      setTasks(Array.isArray(t) ? ensureLinks(t) : []);
      setRecurring(Array.isArray(r) ? ensureLinks(r) : []);
      setNotes(n);
      setCollections(Array.isArray(col) ? col : []);
      setSavedSearches(Array.isArray(ss) ? ss : []);
      setSearchHistory(Array.isArray(sh) ? sh : []);
      setLoaded(true);
    })();
    return () => { mounted = false; };
  }, []);

  useEffect(() => { if (loaded) saveJSON(STORAGE_KEYS.tasks, tasks); }, [tasks, loaded]);
  useEffect(() => { if (loaded) saveJSON(STORAGE_KEYS.recurring, recurring); }, [recurring, loaded]);
  useEffect(() => { if (loaded) saveJSON(STORAGE_KEYS.notes, notes); }, [notes, loaded]);
  useEffect(() => { if (loaded) saveJSON(STORAGE_KEYS.collections, collections); }, [collections, loaded]);
  useEffect(() => { if (loaded) saveJSON(STORAGE_KEYS.savedSearches, savedSearches); }, [savedSearches, loaded]);
  useEffect(() => { if (loaded) saveJSON(STORAGE_KEYS.searchHistory, searchHistory); }, [searchHistory, loaded]);

  const today = useMemo(() => { const d = new Date(); d.setHours(0,0,0,0); return d; }, []);
  const weekStart = useMemo(() => getWeekStart(today, weekOffset), [today, weekOffset]);
  const weekDays = useMemo(() => { const arr = []; for (let i = 0; i < 7; i++) arr.push(addDays(weekStart, i)); return arr; }, [weekStart]);
  const preview = useMemo(() => parseInput(input, today), [input, today]);

  function handleAdd() {
    if (!preview || !preview.title) return;
    const item = Object.assign({ id: uid(), createdAt: Date.now(), completed: false, completedDates: {}, notes: "", linkedTaskIds: [] }, preview);
    if (preview.recurring) setRecurring(prev => prev.concat([item]));
    else setTasks(prev => prev.concat([item]));
    setInput("");
  }

  function handleKeyDown(e) { if (e.key === "Enter") { e.preventDefault(); handleAdd(); } }

  function updateTask(item, updates) {
    if (item.recurring) setRecurring(prev => prev.map(r => r.id === item.id ? Object.assign({}, r, updates) : r));
    else setTasks(prev => prev.map(t => t.id === item.id ? Object.assign({}, t, updates) : t));
    if (selected && selected.id === item.id) setSelected(prev => prev ? Object.assign({}, prev, updates) : prev);
  }

  function handleDelete(item) {
    const id = item.id;
    if (item.recurring) setRecurring(prev => prev.filter(r => r.id !== id));
    else setTasks(prev => prev.filter(t => t.id !== id));
    // Remove all incoming task links
    const strip = (arr) => arr.map(t => t.linkedTaskIds ? Object.assign({}, t, { linkedTaskIds: t.linkedTaskIds.filter(lid => lid !== id) }) : t);
    setTasks(strip); setRecurring(strip);
    // Also strip from notes
    setNotes(prev => prev.map(n => n.linkedTaskIds && n.linkedTaskIds.indexOf(id) !== -1
      ? Object.assign({}, n, { linkedTaskIds: n.linkedTaskIds.filter(lid => lid !== id) })
      : n));
    setSelected(null);
  }

  function toggleComplete(item, dateStr, e) {
    if (e) { e.stopPropagation(); e.preventDefault(); }
    if (item.recurring) { const cd = Object.assign({}, item.completedDates || {}); if (cd[dateStr]) delete cd[dateStr]; else cd[dateStr] = true; updateTask(item, { completedDates: cd }); }
    else { updateTask(item, { completed: !item.completed }); }
  }

  function moveTask(item, newDateStr) { if (item.recurring) return; updateTask(item, { date: newDateStr }); }

  // Bidirectional linking
  function linkTask(itemId, targetId) {
    function addLink(arr, idA, idB) {
      return arr.map(t => {
        if (t.id !== idA) return t;
        const cur = t.linkedTaskIds || [];
        if (cur.indexOf(idB) !== -1) return t;
        return Object.assign({}, t, { linkedTaskIds: cur.concat([idB]) });
      });
    }
    setTasks(prev => addLink(addLink(prev, itemId, targetId), targetId, itemId));
    setRecurring(prev => addLink(addLink(prev, itemId, targetId), targetId, itemId));
    if (selected) {
      // Refresh selected with new linkedTaskIds
      setSelected(prev => {
        if (!prev) return prev;
        if (prev.id === itemId) {
          const cur = prev.linkedTaskIds || [];
          if (cur.indexOf(targetId) !== -1) return prev;
          return Object.assign({}, prev, { linkedTaskIds: cur.concat([targetId]) });
        }
        return prev;
      });
    }
  }

  function unlinkTask(itemId, targetId) {
    const removeLink = (arr, idA, idB) => arr.map(t => t.id === idA ? Object.assign({}, t, { linkedTaskIds: (t.linkedTaskIds || []).filter(id => id !== idB) }) : t);
    setTasks(prev => removeLink(removeLink(prev, itemId, targetId), targetId, itemId));
    setRecurring(prev => removeLink(removeLink(prev, itemId, targetId), targetId, itemId));
    if (selected && selected.id === itemId) {
      setSelected(prev => prev ? Object.assign({}, prev, { linkedTaskIds: (prev.linkedTaskIds || []).filter(id => id !== targetId) }) : prev);
    }
  }

  function findTaskById(id) {
    return tasks.find(t => t.id === id) || recurring.find(r => r.id === id) || null;
  }

  function getTasksForDay(date) {
    const dateStr = formatDate(date);
    const dow = date.getDay();
    const oneOff = tasks.filter(t => t.date === dateStr);
    const recur = recurring.filter(r => r.recurring && r.recurring.days.indexOf(dow) !== -1);
    const all = oneOff.concat(recur);
    return all.sort((a, b) => {
      const aTime = a.time ? a.time.hour * 60 + a.time.minute : 9999;
      const bTime = b.time ? b.time.hour * 60 + b.time.minute : 9999;
      if (aTime !== bTime) return aTime - bTime;
      const pOrder = { high: 0, medium: 1, low: 2 };
      const pd = pOrder[a.priority] - pOrder[b.priority];
      if (pd !== 0) return pd;
      return (a.createdAt || 0) - (b.createdAt || 0);
    });
  }

  const weekLabel = useMemo(() => {
    const s = weekDays[0], e = weekDays[6];
    const sm = s.toLocaleString("en-AU", { month: "short" });
    const em = e.toLocaleString("en-AU", { month: "short" });
    const sy = s.getFullYear(), ey = e.getFullYear();
    if (sy !== ey) return s.getDate() + " " + sm + " " + sy + " – " + e.getDate() + " " + em + " " + ey;
    if (sm === em) return s.getDate() + " – " + e.getDate() + " " + em + " " + ey;
    return s.getDate() + " " + sm + " – " + e.getDate() + " " + em + " " + ey;
  }, [weekDays]);

  const headingLabel = weekOffset === 0 ? "This week" : (weekOffset === 1 ? "Next week" : (weekOffset === -1 ? "Last week" : "Week of " + weekDays[0].toLocaleString("en-AU", { day: "numeric", month: "short" })));

  const handleDragStart = useCallback((task, e) => { if (task.recurring) { e.preventDefault(); return; } setDragging(task); try { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", task.id); } catch (_) {} }, []);
  const handleDragOver = useCallback((dateStr, e) => { if (!dragging) return; e.preventDefault(); try { e.dataTransfer.dropEffect = "move"; } catch (_) {} if (dragOverDay !== dateStr) setDragOverDay(dateStr); }, [dragging, dragOverDay]);
  const handleDrop = useCallback((dateStr, e) => { e.preventDefault(); if (dragging) moveTask(dragging, dateStr); setDragging(null); setDragOverDay(null); }, [dragging]);
  const handleDragEnd = useCallback(() => { setDragging(null); setDragOverDay(null); }, []);

  function handleDayClick(date, e) {
    if (e.target.closest(".task")) return;
    const dayName = DAY_NAMES_SHORT[date.getDay()];
    setInput(prev => (prev.trim() + " " + dayName + " ").replace(/^\s+/, "").replace(/\s+/g, " "));
    if (inputRef.current) inputRef.current.focus();
  }

  // Notes (below calendar) — NO auto-tagging, manual via card
  function addNote(body, collectionId, linkedTaskIds) {
    if (!body || !body.trim()) return null;
    const note = {
      id: uid(),
      blocks: migrateMarkdownToBlocks(body.trim()),
      category: null,
      pinned: false,
      collectionId: collectionId || null,
      linkedTaskIds: Array.isArray(linkedTaskIds) ? linkedTaskIds.slice() : [],
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
    setNotes(prev => [note].concat(prev));
    return note.id;
  }
  function addNoteFromTemplate(template, collectionId, linkedTaskIds) {
    if (!template) return null;
    const note = {
      id: uid(),
      blocks: instantiateTemplate(template),
      category: null,
      pinned: false,
      collectionId: collectionId || null,
      linkedTaskIds: Array.isArray(linkedTaskIds) ? linkedTaskIds.slice() : [],
      createdAt: Date.now(),
      updatedAt: Date.now(),
      templateId: template.id
    };
    setNotes(prev => [note].concat(prev));
    return note.id;
  }
  function updateNote(id, updates) { setNotes(prev => prev.map(n => n.id === id ? Object.assign({}, n, updates, { updatedAt: Date.now() }) : n)); }
  function deleteNote(id) { setNotes(prev => prev.filter(n => n.id !== id)); }
  function togglePinNote(id) { setNotes(prev => prev.map(n => n.id === id ? Object.assign({}, n, { pinned: !n.pinned }) : n)); }
  function moveNoteToCollection(noteId, collectionId) {
    setNotes(prev => prev.map(n => n.id === noteId ? Object.assign({}, n, { collectionId: collectionId || null, updatedAt: Date.now() }) : n));
  }

  // Note ↔ task linking
  function linkNoteToTask(noteId, taskId) {
    setNotes(prev => prev.map(n => {
      if (n.id !== noteId) return n;
      const cur = n.linkedTaskIds || [];
      if (cur.indexOf(taskId) !== -1) return n;
      return Object.assign({}, n, { linkedTaskIds: cur.concat([taskId]), updatedAt: Date.now() });
    }));
  }
  function unlinkNoteFromTask(noteId, taskId) {
    setNotes(prev => prev.map(n => {
      if (n.id !== noteId) return n;
      return Object.assign({}, n, { linkedTaskIds: (n.linkedTaskIds || []).filter(id => id !== taskId), updatedAt: Date.now() });
    }));
  }

  // Saved searches CRUD
  function addSavedSearch(name, query) {
    if (!name || !name.trim() || !query || !query.trim()) return;
    setSavedSearches(prev => prev.concat([{ id: uid(), name: name.trim(), query: query.trim() }]));
  }
  function deleteSavedSearch(id) {
    setSavedSearches(prev => prev.filter(s => s.id !== id));
  }
  // Search history: record at most one per query, most-recent first, capped at 8
  // Wrapped in useCallback so child effects don't re-fire on every parent render
  const recordSearchHistory = useCallback(function(query) {
    const q = (query || "").trim();
    if (!q || q.length < 2) return;
    setSearchHistory(prev => {
      const filtered = prev.filter(p => p !== q);
      return [q].concat(filtered).slice(0, 8);
    });
  }, []);
  const clearSearchHistory = useCallback(function() { setSearchHistory([]); }, []);

  // Collections CRUD
  function addCollection(name, type, parentId) {
    const c = newCollection(name, type, parentId);
    setCollections(prev => prev.concat([c]));
    return c.id;
  }
  function updateCollection(id, updates) {
    setCollections(prev => prev.map(c => c.id === id ? Object.assign({}, c, updates) : c));
  }
  function deleteCollection(id) {
    // Move all notes in this collection (and descendants) to inbox (null)
    const descendants = getCollectionWithDescendants(collections, id);
    setNotes(prev => prev.map(n => descendants.has(n.collectionId) ? Object.assign({}, n, { collectionId: null, updatedAt: Date.now() }) : n));
    // Delete collection + descendants
    setCollections(prev => prev.filter(c => !descendants.has(c.id)));
  }
  function moveCollection(id, newParentId) {
    // Guard: can't move into self or descendant
    if (id === newParentId) return;
    if (newParentId) {
      const descendants = getCollectionWithDescendants(collections, id);
      if (descendants.has(newParentId)) return;
    }
    setCollections(prev => prev.map(c => c.id === id ? Object.assign({}, c, { parentId: newParentId || null }) : c));
  }

  if (!loaded) return <div style={{padding: "40px", textAlign: "center", color: "var(--text-3)"}}>Loading…</div>;

  return (
    <div className="app">
      <div className="header">
        <div>
          <h1>{headingLabel}</h1>
          <p className="sub">{weekLabel}</p>
        </div>
        <div className="nav-buttons">
          <button className="nav-btn" onClick={() => setWeekOffset(w => w - 1)} aria-label="Previous week">‹</button>
          <button className="nav-btn today" onClick={() => setWeekOffset(0)}>Today</button>
          <button className="nav-btn" onClick={() => setWeekOffset(w => w + 1)} aria-label="Next week">›</button>
        </div>
      </div>

      <QuickAdd input={input} setInput={setInput} preview={preview} onAdd={handleAdd} onKeyDown={handleKeyDown} inputRef={inputRef} showHelp={tasks.length + recurring.length === 0}/>

      <WeekGrid weekDays={weekDays} today={today} getTasksForDay={getTasksForDay} onSelect={setSelected} onToggleComplete={toggleComplete} onDragStart={handleDragStart} onDragOver={handleDragOver} onDrop={handleDrop} onDragEnd={handleDragEnd} dragging={dragging} dragOverDay={dragOverDay} onDayClick={handleDayClick}/>

      <Legend />

      <NotesSection
        notes={notes}
        collections={collections}
        tasks={tasks}
        recurring={recurring}
        savedSearches={savedSearches}
        searchHistory={searchHistory}
        onAddSavedSearch={addSavedSearch}
        onDeleteSavedSearch={deleteSavedSearch}
        onRecordSearchHistory={recordSearchHistory}
        onClearSearchHistory={clearSearchHistory}
        onAddNote={addNote}
        onAddNoteFromTemplate={addNoteFromTemplate}
        onUpdateNote={updateNote}
        onDeleteNote={deleteNote}
        onTogglePin={togglePinNote}
        onMoveNote={moveNoteToCollection}
        onLinkNoteToTask={linkNoteToTask}
        onUnlinkNoteFromTask={unlinkNoteFromTask}
        onOpenTask={setSelected}
        onAddCollection={addCollection}
        onUpdateCollection={updateCollection}
        onDeleteCollection={deleteCollection}
        onMoveCollection={moveCollection}
        navTarget={navTarget}
        onClearNavTarget={() => setNavTarget(null)}
      />

      {selected && (
        <TaskSheet
          item={selected}
          today={today}
          allTasks={tasks}
          allRecurring={recurring}
          allNotes={notes}
          collections={collections}
          findTaskById={findTaskById}
          onClose={() => setSelected(null)}
          onDelete={handleDelete}
          onUpdate={updateTask}
          onOpenTask={setSelected}
          onOpenNote={(noteId) => { setSelected(null); setNavTarget({ noteId, ts: Date.now() }); }}
          onLink={linkTask}
          onUnlink={unlinkTask}
        />
      )}
    </div>
  );
}

function QuickAdd({ input, setInput, preview, onAdd, onKeyDown, inputRef, showHelp }) {
  const cat = preview && preview.category ? CATEGORIES[preview.category] : null;
  let timeStr = "";
  if (preview) {
    if (preview.recurring) {
      const days = preview.recurring.days;
      if (days.length === 7) timeStr = "Every day";
      else if (days.length === 5 && days.indexOf(0) === -1 && days.indexOf(6) === -1) timeStr = "Weekdays";
      else if (days.length === 2 && days.indexOf(0) !== -1 && days.indexOf(6) !== -1) timeStr = "Weekends";
      else timeStr = days.map(d => DAY_NAMES_SHORT[d]).join(" · ");
    } else if (preview.date) {
      const dt = new Date(preview.date + "T00:00:00");
      timeStr = dt.toLocaleString("en-AU", { weekday: "short", day: "numeric", month: "short" });
    }
    if (preview.time) {
      timeStr += (timeStr ? " · " : "") + formatTime(preview.time);
      if (preview.endTime) timeStr += "–" + formatTime(preview.endTime);
      else if (preview.duration && preview.duration !== 45) timeStr += " · " + formatDuration(preview.duration);
    }
  }
  return (
    <div className="quickadd">
      <div className="qa-row">
        <div className="qa-icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3v18M3 12h18"/></svg></div>
        <input ref={inputRef} className="qa-input" type="text" value={input} onChange={e => setInput(e.target.value)} onKeyDown={onKeyDown} placeholder="What's on… e.g. ‘work 11-5pm’ or ‘meditate every day 7am’" autoComplete="off" autoCorrect="off" spellCheck="false"/>
        <button className="qa-add" onClick={onAdd} disabled={!input.trim()}>Add</button>
      </div>
      {preview && input.trim() && (
        <div className="qa-preview">
          <span className="label">Auto-tagged →</span>
          {cat && (<span className={"qa-chip cat-" + preview.category}><CatIcon cat={preview.category} size={11}/>{cat.label}</span>)}
          {timeStr && <span className="qa-chip qa-chip-time">{timeStr}</span>}
          {preview.recurring && <span className="qa-chip qa-chip-recur"><RecurIcon size={10}/> Recurring</span>}
          {preview.priority === "high" && <span className="qa-chip qa-chip-prio-high">High priority</span>}
          {preview.priority === "medium" && <span className="qa-chip qa-chip-prio-med">Priority</span>}
        </div>
      )}
      {showHelp && !input.trim() && (
        <div className="qa-help">Try: <code>work 11-5pm</code> · <code>meditate every day 7am</code> · <code>!! submit assignment Thursday</code> · <code>gym every Mon Wed Fri 6-7am</code></div>
      )}
    </div>
  );
}

function WeekGrid(props) {
  const { weekDays, today, getTasksForDay, onSelect, onToggleComplete, onDragStart, onDragOver, onDrop, onDragEnd, dragging, dragOverDay, onDayClick } = props;
  const scrollRef = useRef(null);

  // When the week changes (or on mount), center today's column in the horizontal scroll view.
  // Runs synchronously before paint so there's no flash of "scrolled to Monday" before jumping to today.
  useLayoutEffect(() => {
    const scroller = scrollRef.current;
    if (!scroller) return;
    const todayCol = scroller.querySelector('.day-col.today');
    if (todayCol) {
      // Center today: place its left edge one column-width from the scroller's left edge
      const colWidth = todayCol.offsetWidth;
      const targetLeft = Math.max(0, todayCol.offsetLeft - colWidth);
      scroller.scrollLeft = targetLeft;
    } else {
      // No today in this week (user navigated to a different week) → scroll to start
      scroller.scrollLeft = 0;
    }
  }, [weekDays]);

  return (
    <div className="grid-wrap">
      <div className="week-scroll" ref={scrollRef}>
        {weekDays.map((d, i) => {
          const isToday = formatDate(d) === formatDate(today);
          const dateStr = formatDate(d);
          const dayTasks = getTasksForDay(d);
          const isDragOver = dragOverDay === dateStr;
          return (
            <div key={i} className={"day-col" + (isToday ? " today" : "")}>
              <div className={"day-head" + (isToday ? " today" : "")}>
                {DAY_NAMES_SHORT[d.getDay()]}
                <span className="num">{d.getDate()}</span>
              </div>
              <div
                className={"day-cell" + (isToday ? " today" : "") + (isDragOver ? " drag-over" : "")}
                onDragOver={(e) => onDragOver(dateStr, e)}
                onDrop={(e) => onDrop(dateStr, e)}
                onClick={(e) => onDayClick(d, e)}
              >
                {dayTasks.map((t, j) => (
                  <TaskBlock
                    key={t.id + "-" + j}
                    task={t}
                    dateStr={dateStr}
                    isDragging={dragging && dragging.id === t.id && !t.recurring}
                    onClick={() => onSelect(t)}
                    onToggleComplete={(e) => onToggleComplete(t, dateStr, e)}
                    onDragStart={(e) => onDragStart(t, e)}
                    onDragEnd={onDragEnd}
                  />
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

const CONFETTI_PALETTE = ["#EF9F27", "#7F77DD", "#378ADD", "#1D9E75", "#D4537E", "#639922", "#D85A30", "#c0382b"];
function buildConfetti() {
  const out = [];
  for (let i = 0; i < 14; i++) {
    const angle = (i / 14) * Math.PI * 2 + (Math.random() - 0.5) * 0.6;
    const dist = 22 + Math.random() * 18;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - 6; // upward bias
    const rot = (Math.random() - 0.5) * 720;
    const color = CONFETTI_PALETTE[i % CONFETTI_PALETTE.length];
    const isRound = i % 3 === 0;
    out.push({ dx, dy, rot, color, isRound, delay: Math.random() * 80 });
  }
  return out;
}

function TaskBlock({ task, dateStr, isDragging, onClick, onToggleComplete, onDragStart, onDragEnd }) {
  const done = task.recurring ? !!(task.completedDates && task.completedDates[dateStr]) : !!task.completed;
  const prioClass = task.priority === "high" ? " high" : (task.priority === "medium" ? " med" : "");
  const draggable = !task.recurring;
  const endStr = task.endTime ? formatTime(task.endTime) : (task.time && task.duration && task.duration !== 45 ? formatTime(computeEndTime(task.time, task.duration)) : null);
  const hasNotes = task.notes && task.notes.trim();
  const hasLinks = task.linkedTaskIds && task.linkedTaskIds.length > 0;

  const prevDoneRef = useRef(done);
  const [celebrating, setCelebrating] = useState(false);
  const [particles, setParticles] = useState(null);

  useEffect(() => {
    if (done && !prevDoneRef.current) {
      setParticles(buildConfetti());
      setCelebrating(true);
      const t = setTimeout(() => { setCelebrating(false); setParticles(null); }, 1000);
      prevDoneRef.current = done;
      return () => clearTimeout(t);
    }
    prevDoneRef.current = done;
  }, [done]);

  return (
    <div className={"task cat-" + task.category + prioClass + (done ? " done" : "") + (isDragging ? " dragging" : "") + (celebrating ? " celebrating" : "")} onClick={(e) => { if (e.target.closest(".check")) return; onClick(); }} role="button" tabIndex={0} draggable={draggable} onDragStart={draggable ? onDragStart : undefined} onDragEnd={draggable ? onDragEnd : undefined}>
      <span className={"check" + (done ? " done" : "") + (celebrating ? " fresh-done" : "")} onClick={onToggleComplete} onMouseDown={(e) => e.stopPropagation()} role="checkbox" aria-checked={done} aria-label={done ? "Mark not done" : "Mark done"}/>
      <div className="t-body">
        <span className="t-time">{task.time ? (formatTime(task.time) + (endStr ? "–" + endStr : "")) : "All day"}</span>
        <div className="t-title-row"><CatIcon cat={task.category} size={11}/><span className="t-title">{task.title}</span></div>
      </div>
      {(task.priority === "high" || task.priority === "medium") && <span className="priority-dot" aria-hidden="true"/>}
      {(task.recurring || hasNotes || hasLinks) && (<div className="t-meta">{task.recurring && <RecurIcon size={10}/>}{hasNotes && <NotesIcon size={10}/>}{hasLinks && <LinkIcon size={10}/>}</div>)}
      {particles && particles.map((p, i) => (
        <span key={i} className="confetti" aria-hidden="true" style={{
          background: p.color,
          width: p.isRound ? "5px" : "4px",
          height: p.isRound ? "5px" : "7px",
          borderRadius: p.isRound ? "50%" : "1.5px",
          animationDelay: p.delay + "ms",
          "--dx": p.dx + "px",
          "--dy": p.dy + "px",
          "--rot": p.rot + "deg"
        }}/>
      ))}
    </div>
  );
}

function Legend() {
  return (<div className="legend">{CAT_ORDER.map(k => (<span key={k} className={"legend-item legend-item-" + k}><span className={"legend-icon cat-" + k}><CatIcon cat={k} size={12}/></span>{CATEGORIES[k].label}</span>))}</div>);
}

// ============================================================
// Notes section (no auto-tagging)
// ============================================================
function NotesSection({ notes, collections, tasks, recurring, savedSearches, searchHistory, onAddSavedSearch, onDeleteSavedSearch, onRecordSearchHistory, onClearSearchHistory, onAddNote, onAddNoteFromTemplate, onUpdateNote, onDeleteNote, onTogglePin, onMoveNote, onLinkNoteToTask, onUnlinkNoteFromTask, onOpenTask, onAddCollection, onUpdateCollection, onDeleteCollection, onMoveCollection, navTarget, onClearNavTarget }) {
  const [input, setInput] = useState("");
  const [filter, setFilter] = useState("all");
  const [tagFilter, setTagFilter] = useState(null);
  const [search, setSearch] = useState("");
  // selectedCollection: null = "All notes", "inbox" = uncategorised, "today" = today filter, otherwise a collection id
  const [selectedCollection, setSelectedCollection] = useState(null);
  const [expandedCollections, setExpandedCollections] = useState({});
  const [modalOpen, setModalOpen] = useState(false);
  const [modalParentId, setModalParentId] = useState(null);
  const [draggingNoteId, setDraggingNoteId] = useState(null);
  const [dropTargetCollection, setDropTargetCollection] = useState(null);
  const [templatePickerOpen, setTemplatePickerOpen] = useState(false);
  const [focusNoteId, setFocusNoteId] = useState(null);
  const [shortcutsOpen, setShortcutsOpen] = useState(false);
  const [searchFocused, setSearchFocused] = useState(false);
  const [saveSearchOpen, setSaveSearchOpen] = useState(false); // small inline save UI
  const [templateSuggestion, setTemplateSuggestion] = useState(null); // { noteId, family, label, hint, templateId }
  const [recentLinkSuggestion, setRecentLinkSuggestion] = useState(null); // { task, kind: "recent"|"upcoming" }
  const [taskPickerForNote, setTaskPickerForNote] = useState(null); // noteId when picker is open
  const [autoLinkEnabled, setAutoLinkEnabled] = useState(true);
  const [highlightedNoteId, setHighlightedNoteId] = useState(null);
  // Track narrow viewport so we can use shorter placeholders (long ones don't reliably wrap on iOS)
  const [isNarrow, setIsNarrow] = useState(() => typeof window !== "undefined" && window.innerWidth < 640);
  useEffect(() => {
    const onResize = () => setIsNarrow(window.innerWidth < 640);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  const noteRefs = useRef({});

  // Prune dead refs when notes list changes (prevents long-running memory growth)
  useEffect(() => {
    const liveIds = new Set(notes.map(n => n.id));
    for (const id in noteRefs.current) {
      if (!liveIds.has(id)) delete noteRefs.current[id];
    }
  }, [notes]);

  // Auto-dismiss suggestions after 20 seconds
  useEffect(() => {
    if (!templateSuggestion) return;
    const tid = setTimeout(() => setTemplateSuggestion(null), 20000);
    return () => clearTimeout(tid);
  }, [templateSuggestion]);
  useEffect(() => {
    if (!recentLinkSuggestion) return;
    const tid = setTimeout(() => setRecentLinkSuggestion(null), 20000);
    return () => clearTimeout(tid);
  }, [recentLinkSuggestion]);

  // Auto-dismiss either suggestion if the linked note gets deleted
  useEffect(() => {
    if (templateSuggestion && templateSuggestion.noteId && !notes.some(n => n.id === templateSuggestion.noteId)) {
      setTemplateSuggestion(null);
    }
    if (recentLinkSuggestion && recentLinkSuggestion.noteId && !notes.some(n => n.id === recentLinkSuggestion.noteId)) {
      setRecentLinkSuggestion(null);
    }
  }, [notes, templateSuggestion, recentLinkSuggestion]);

  // Record search history after the user stops typing for 1 second
  useEffect(() => {
    if (!search || search.trim().length < 2) return;
    const tid = setTimeout(() => onRecordSearchHistory && onRecordSearchHistory(search), 1000);
    return () => clearTimeout(tid);
  }, [search, onRecordSearchHistory]);

  // Recently-touched notes (last 3, edited within the past 7 days)
  const recentlyTouched = useMemo(() => {
    const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
    return notes
      .filter(n => (n.updatedAt || n.createdAt || 0) >= cutoff)
      .slice()
      .sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0))
      .slice(0, 3);
  }, [notes]);

  // Active task — re-check every 30 seconds to stay current
  const [activeTaskNow, setActiveTaskNow] = useState(() => getActiveTask(tasks, recurring));
  useEffect(() => {
    const tick = () => setActiveTaskNow(getActiveTask(tasks, recurring));
    tick();
    const id = setInterval(tick, 30 * 1000);
    return () => clearInterval(id);
  }, [tasks, recurring]);

  // Today filter / summary
  const todaysNotes = useMemo(() => notes.filter(n => isToday(n.createdAt)), [notes]);
  const todaysCompletedTasks = useMemo(() => {
    const dateStr = formatDate(new Date());
    let out = [];
    for (let i = 0; i < tasks.length; i++) {
      if (tasks[i].completed && tasks[i].date === dateStr) out.push(tasks[i]);
    }
    for (let i = 0; i < recurring.length; i++) {
      if (recurring[i].completedDates && recurring[i].completedDates[dateStr]) out.push(recurring[i]);
    }
    return out;
  }, [tasks, recurring]);

  // Navigate-to-note: when navTarget changes, scroll + highlight + clear nav target
  useEffect(() => {
    if (!navTarget || !navTarget.noteId) return;
    const note = notes.find(n => n.id === navTarget.noteId);
    if (!note) { if (onClearNavTarget) onClearNavTarget(); return; }
    // Switch to "All notes" view (or the note's collection if there is one) so the note is visible
    if (note.collectionId) {
      setSelectedCollection(note.collectionId);
      // expand parent chain
      const path = getCollectionPath(collections, note.collectionId);
      const next = Object.assign({}, expandedCollections);
      for (let i = 0; i < path.length - 1; i++) next[path[i].id] = true;
      setExpandedCollections(next);
    } else {
      setSelectedCollection(null);
    }
    setHighlightedNoteId(navTarget.noteId);
    // Scroll on next frame
    requestAnimationFrame(() => {
      const el = noteRefs.current[navTarget.noteId];
      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "center" });
    });
    const t = setTimeout(() => { setHighlightedNoteId(null); }, 2400);
    if (onClearNavTarget) onClearNavTarget();
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [navTarget]);

  // Current collection object (or null)
  const currentCollection = useMemo(() => {
    if (!selectedCollection || selectedCollection === "inbox" || selectedCollection === "today") return null;
    return collections.find(c => c.id === selectedCollection) || null;
  }, [collections, selectedCollection]);
  const currentCollectionType = currentCollection ? currentCollection.type : null;

  // The set of collection ids that include the current selection + all descendants (for filtering)
  const selectedDescendants = useMemo(() => {
    if (!selectedCollection || selectedCollection === "inbox") return null;
    return getCollectionWithDescendants(collections, selectedCollection);
  }, [collections, selectedCollection]);

  // Counts: notes per collection (including descendants)
  const notesCountByCollection = useMemo(() => {
    const m = { __all: notes.length, __inbox: 0 };
    for (let i = 0; i < notes.length; i++) {
      const cid = notes[i].collectionId;
      if (!cid) m.__inbox++;
      else m[cid] = (m[cid] || 0) + 1;
    }
    // Roll up descendants into parents
    const rollup = Object.assign({}, m);
    for (let i = 0; i < collections.length; i++) {
      const desc = getCollectionWithDescendants(collections, collections[i].id);
      let total = 0;
      desc.forEach(id => { total += (m[id] || 0); });
      rollup[collections[i].id] = total;
    }
    return rollup;
  }, [notes, collections]);

  function save() {
    if (!input.trim()) return;
    // Save into the currently selected collection (null = inbox)
    const targetCollection = (!selectedCollection || selectedCollection === "inbox" || selectedCollection === "today") ? null : selectedCollection;
    const links = (autoLinkEnabled && activeTaskNow) ? [activeTaskNow.id] : [];
    // addNote returns the new note's ID — capture it so suggestions attach to the correct note
    // even if the user saves another note immediately
    const newNoteId = onAddNote(input, targetCollection, links);
    const justSavedText = input;
    setInput("");
    if (!newNoteId) return;

    // Defer inference to next tick (microtask) so React has time to flush the new note into state
    setTimeout(() => {
      // Smart suggestion 1: detect template family from just-saved content
      const tempBlocks = migrateMarkdownToBlocks(justSavedText.trim());
      const inferred = inferTemplateFamily(tempBlocks);
      if (inferred) {
        const tpl = pickTemplateForFamily(inferred.family, TEMPLATES);
        if (tpl) {
          setTemplateSuggestion({ noteId: newNoteId, family: inferred.family, label: inferred.label, hint: inferred.hint, templateId: tpl.id });
        }
      }
      // Smart suggestion 2: link to recent/upcoming task (only if not already auto-linked)
      if (!(autoLinkEnabled && activeTaskNow)) {
        const win = getTaskWindow(tasks, recurring, new Date());
        if (win.recent.length > 0) setRecentLinkSuggestion({ noteId: newNoteId, task: win.recent[0].task, kind: "recent", minutesAgo: win.recent[0].minutesAgo });
        else if (win.upcoming.length > 0) setRecentLinkSuggestion({ noteId: newNoteId, task: win.upcoming[0].task, kind: "upcoming", minutesUntil: win.upcoming[0].minutesUntil });
      }
    }, 50);
  }
  function onKey(e) { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); save(); } }

  const counts = useMemo(() => {
    const c = { all: notes.length, untagged: 0 };
    for (let i = 0; i < CAT_ORDER.length; i++) c[CAT_ORDER[i]] = 0;
    for (let i = 0; i < notes.length; i++) {
      const cat = notes[i].category;
      if (!cat) c.untagged++;
      else if (c[cat] !== undefined) c[cat]++;
    }
    return c;
  }, [notes]);

  const tagMap = useMemo(() => {
    const m = {};
    for (let i = 0; i < notes.length; i++) {
      const tags = extractTags(blocksToText(notes[i].blocks || []));
      for (let j = 0; j < tags.length; j++) m[tags[j]] = (m[tags[j]] || 0) + 1;
    }
    return m;
  }, [notes]);
  const tagList = useMemo(() => Object.keys(tagMap).sort((a, b) => tagMap[b] - tagMap[a] || a.localeCompare(b)), [tagMap]);

  // Parsed search query — operators + free-text terms
  const parsedQuery = useMemo(() => parseSearchQuery(search), [search]);
  const hasActiveSearch = useMemo(() => {
    return parsedQuery.tags.length > 0 || parsedQuery.cats.length > 0 || parsedQuery.colls.length > 0 || parsedQuery.has.length > 0 || parsedQuery.after != null || parsedQuery.before != null || parsedQuery.terms.length > 0;
  }, [parsedQuery]);

  const filtered = useMemo(() => {
    let arr = notes;
    // Collection filter
    if (selectedCollection === "inbox") {
      arr = arr.filter(n => !n.collectionId);
    } else if (selectedCollection === "today") {
      arr = arr.filter(n => isToday(n.createdAt));
    } else if (selectedCollection && selectedDescendants) {
      arr = arr.filter(n => n.collectionId && selectedDescendants.has(n.collectionId));
    }
    // Category filter
    if (filter === "untagged") arr = arr.filter(n => !n.category);
    else if (filter !== "all") arr = arr.filter(n => n.category === filter);
    // Tag pill filter (separate from operator-syntax search)
    if (tagFilter) arr = arr.filter(n => extractTags(blocksToText(n.blocks || [])).indexOf(tagFilter) !== -1);
    // Operator-aware search
    if (hasActiveSearch) {
      arr = arr.filter(n => matchesQuery(n, parsedQuery, collections));
    }
    return arr.slice().sort((a, b) => {
      if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
  }, [notes, selectedCollection, selectedDescendants, filter, tagFilter, parsedQuery, hasActiveSearch, collections]);

  // Title index for wiki-links — recomputed when notes change
  const titleIndex = useMemo(() => buildTitleIndex(notes), [notes]);

  // Backlinks map: noteId → array of notes that mention it via [[title]]
  const backlinksByNoteId = useMemo(() => {
    const map = {};
    // Build once: for every note, find which titles it links to, and add a backlink in each target's bucket
    const titleToId = {};
    for (let i = 0; i < notes.length; i++) {
      const t = deriveTitleFromBlocks(notes[i].blocks || []);
      if (t) titleToId[wikiNormalizeTitle(t)] = notes[i].id;
    }
    for (let i = 0; i < notes.length; i++) {
      const src = notes[i];
      const targets = extractWikiLinks(blocksToText(src.blocks || []));
      const seen = new Set();
      for (let j = 0; j < targets.length; j++) {
        const targetId = titleToId[wikiNormalizeTitle(targets[j])];
        if (targetId && targetId !== src.id && !seen.has(targetId)) {
          seen.add(targetId);
          if (!map[targetId]) map[targetId] = [];
          map[targetId].push(src);
        }
      }
    }
    return map;
  }, [notes]);

  function handleTagClick(t) { setTagFilter(prev => prev === t ? null : t); }

  // Wiki-link click: try to find the note by title; if missing, create one and navigate to it.
  function handleWikiClick(target) {
    if (!target) return;
    const key = wikiNormalizeTitle(target);
    const found = titleIndex[key];
    if (found) {
      // Navigate via the parent's navTarget mechanism
      // We use a local synthetic event since we don't have access to setNavTarget;
      // instead we set selectedCollection + highlightedNoteId directly.
      const note = found;
      if (note.collectionId) {
        setSelectedCollection(note.collectionId);
        const path = getCollectionPath(collections, note.collectionId);
        const next = Object.assign({}, expandedCollections);
        for (let i = 0; i < path.length - 1; i++) next[path[i].id] = true;
        setExpandedCollections(next);
      } else {
        setSelectedCollection(null);
      }
      setHighlightedNoteId(note.id);
      requestAnimationFrame(() => {
        const el = noteRefs.current[note.id];
        if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "center" });
      });
      setTimeout(() => setHighlightedNoteId(null), 2400);
    } else {
      // Create a new empty note with target as its heading
      const targetCollection = (!selectedCollection || selectedCollection === "inbox" || selectedCollection === "today") ? null : selectedCollection;
      onAddNote("# " + target, targetCollection, []);
    }
  }

  // Open a note by id (used by backlinks)
  function handleOpenNoteById(noteId) {
    const note = notes.find(n => n.id === noteId);
    if (!note) return;
    if (note.collectionId) {
      setSelectedCollection(note.collectionId);
      const path = getCollectionPath(collections, note.collectionId);
      const next = Object.assign({}, expandedCollections);
      for (let i = 0; i < path.length - 1; i++) next[path[i].id] = true;
      setExpandedCollections(next);
    } else {
      setSelectedCollection(null);
    }
    setHighlightedNoteId(noteId);
    requestAnimationFrame(() => {
      const el = noteRefs.current[noteId];
      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "center" });
    });
    setTimeout(() => setHighlightedNoteId(null), 2400);
  }

  // Global ? shortcut — opens cheatsheet (ignored when typing in an input/textarea)
  useEffect(() => {
    function onKey(e) {
      if (e.key !== "?") return;
      const el = document.activeElement;
      if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable)) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      e.preventDefault();
      setShortcutsOpen(true);
    }
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, []);

  // Heatmap cell click → set search to filter that day
  function handleHeatmapPickDate(dateStr) {
    setSearch("after:" + dateStr + " before:" + dateStr);
  }

  // Export visible notes (uses current `filtered`) as a markdown file
  function handleExport() {
    if (!filtered || filtered.length === 0) return;
    // Compute scope label locally to avoid TDZ issues with closure on `headerLabel`
    let label = "All notes";
    if (selectedCollection === "inbox") label = "Inbox";
    else if (selectedCollection === "today") label = "Today";
    else if (selectedCollection && currentCollection) label = currentCollection.name;
    const md = notesToMarkdownExport(filtered, collections, label + " — " + filtered.length + " notes");
    const safe = label.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "notes";
    const dateTag = formatDate(new Date());
    downloadTextFile(md, "planner-" + safe + "-" + dateTag + ".md");
  }

  // Accept template suggestion: replace just-saved note's blocks with the chosen template's blocks.
  // Preserve any user content by appending it as a final text block.
  function acceptTemplateSuggestion() {
    if (!templateSuggestion || !templateSuggestion.noteId) return;
    const tpl = TEMPLATES.find(t => t.id === templateSuggestion.templateId);
    if (!tpl) return;
    const note = notes.find(n => n.id === templateSuggestion.noteId);
    if (!note) return;
    const userText = blocksToText(note.blocks || []).trim();
    // Build new blocks: template blocks + a "Original capture" appendix if there was content
    const tplBlocks = tpl.blocks.map(b => Object.assign({}, b, { id: uid() }));
    const newBlocks = userText
      ? tplBlocks.concat([{ id: uid(), type: "h3", content: "Original capture" }, { id: uid(), type: "text", content: userText }])
      : tplBlocks;
    onUpdateNote(note.id, { blocks: newBlocks, templateId: tpl.id });
    setTemplateSuggestion(null);
  }

  // Accept the recent/upcoming task link
  function acceptRecentLinkSuggestion() {
    if (!recentLinkSuggestion || !recentLinkSuggestion.noteId) return;
    onLinkNoteToTask(recentLinkSuggestion.noteId, recentLinkSuggestion.task.id);
    setRecentLinkSuggestion(null);
  }

  // Saved search handlers
  function handleSaveCurrentSearch() {
    if (!search.trim()) return;
    const name = window.prompt("Name this search:", search.length > 30 ? search.slice(0, 27) + "…" : search);
    if (name && name.trim()) onAddSavedSearch && onAddSavedSearch(name, search);
    setSaveSearchOpen(false);
  }
  function runSavedSearch(s) { setSearch(s.query); }

  const focusNote = focusNoteId ? notes.find(n => n.id === focusNoteId) : null;

  // Modal
  function openNewCollectionModal(parentId) { setModalParentId(parentId || null); setModalOpen(true); }
  function closeModal() { setModalOpen(false); setModalParentId(null); }
  function createCollectionFromModal(name, type) {
    const id = onAddCollection(name, type, modalParentId);
    closeModal();
    // Auto-expand parent and select new collection
    if (modalParentId) setExpandedCollections(prev => Object.assign({}, prev, { [modalParentId]: true }));
    setSelectedCollection(id);
  }

  function handleRename(id, currentName) {
    const next = window.prompt("Rename collection:", currentName);
    if (next != null && next.trim()) onUpdateCollection(id, { name: next.trim() });
  }
  function handleDelete(id, name, childCount) {
    const msg = childCount > 0
      ? "Delete \"" + name + "\" and its " + childCount + " chapter" + (childCount !== 1 ? "s" : "") + "?\n\nAny notes inside will move to All notes."
      : "Delete \"" + name + "\"?\n\nAny notes inside will move to All notes.";
    if (window.confirm(msg)) {
      if (selectedCollection === id) setSelectedCollection(null);
      onDeleteCollection(id);
    }
  }

  // Note drag
  function handleNoteDragStart(noteId, e) {
    setDraggingNoteId(noteId);
    try { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", noteId); } catch (_) {}
  }
  function handleNoteDragEnd() { setDraggingNoteId(null); setDropTargetCollection(null); }
  function handleCollectionDragOver(targetId, e) {
    if (draggingNoteId == null) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = "move"; } catch (_) {}
    if (dropTargetCollection !== targetId) setDropTargetCollection(targetId);
  }
  function handleCollectionDrop(targetId, e) {
    e.preventDefault();
    if (draggingNoteId) {
      onMoveNote(draggingNoteId, targetId === "inbox" ? null : targetId);
    }
    setDraggingNoteId(null);
    setDropTargetCollection(null);
  }

  // Breadcrumb path
  const breadcrumbPath = useMemo(() => {
    if (!selectedCollection || selectedCollection === "inbox") return null;
    return getCollectionPath(collections, selectedCollection);
  }, [collections, selectedCollection]);

  // Header label
  let headerLabel = "All notes";
  if (selectedCollection === "inbox") headerLabel = "Inbox";
  else if (selectedCollection === "today") headerLabel = "Today";
  else if (breadcrumbPath && breadcrumbPath.length > 0) headerLabel = breadcrumbPath[breadcrumbPath.length - 1].name;

  const captureHint = (currentCollection)
    ? ("Saving to: " + headerLabel)
    : (selectedCollection === "inbox" ? "Saving to Inbox" : "Saving to All notes");

  const rootCollections = getChildCollections(collections, null);

  return (
    <div className="notes-section">
      <div className="notes-header">
        <h2>Notes <span className="notes-count">{notes.length === 0 ? "" : notes.length}</span></h2>
        <div className={"notes-search-wrap" + ((searchFocused || search) ? " expanded" : "")}>
          <span className="notes-search-icon"><SearchIcon size={13}/></span>
          <input
            className="notes-search"
            type="text"
            placeholder="Search notes…"
            value={search}
            onChange={e => setSearch(e.target.value)}
            onFocus={() => setSearchFocused(true)}
            onBlur={() => setTimeout(() => setSearchFocused(false), 200)}
          />
          {search && (
            <button className="notes-search-clear" onClick={() => setSearch("")} aria-label="Clear search"><XIcon size={11}/></button>
          )}
          {searchFocused && !search && searchHistory && searchHistory.length > 0 && (
            <div className="search-history-pop">
              <div className="search-history-head">
                <span>Recent searches</span>
                <button className="search-history-clear" onClick={() => { onClearSearchHistory && onClearSearchHistory(); }}>Clear</button>
              </div>
              {searchHistory.slice(0, 6).map((q, i) => (
                <button key={i} className="search-history-item" onMouseDown={(e) => { e.preventDefault(); setSearch(q); }}>
                  <SearchIcon size={11}/> <span>{q}</span>
                </button>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* Saved searches pill bar */}
      {(savedSearches && savedSearches.length > 0) || hasActiveSearch ? (
        <div className="saved-searches-bar">
          {savedSearches && savedSearches.map(s => (
            <button key={s.id} className={"saved-search-pill" + (search === s.query ? " active" : "")} onClick={() => runSavedSearch(s)} title={s.query}>
              <svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 2 V14 L8 10 L13 14 V2 Z"/></svg>
              <span>{s.name}</span>
              <span className="saved-search-x" onClick={(e) => { e.stopPropagation(); if (window.confirm("Delete saved search \"" + s.name + "\"?")) onDeleteSavedSearch(s.id); }}><XIcon size={8}/></span>
            </button>
          ))}
          {hasActiveSearch && (
            <button className="saved-search-add" onClick={handleSaveCurrentSearch} title="Save current search as a pill">
              + Save this search
            </button>
          )}
        </div>
      ) : null}

      {hasActiveSearch && (
        <SearchFilterChips parsed={parsedQuery} matchCount={filtered.length} onClear={() => setSearch("")}/>
      )}

      <div className="workspace">
        {/* Sidebar */}
        <aside className="ws-sidebar">
          <div className="ws-sidebar-inner">
            <div className="ws-section-label">Workspace</div>
            <div className="ws-tree">
              {/* All notes */}
              <div
                className={"ws-collection-row" + (selectedCollection === null ? " selected" : "") + (dropTargetCollection === null && draggingNoteId ? " drag-target" : "")}
                onClick={() => setSelectedCollection(null)}
                onDragOver={(e) => handleCollectionDragOver(null, e)}
                onDrop={(e) => handleCollectionDrop(null, e)}
              >
                <span className="ws-caret empty"/>
                <span className="ws-coll-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><path d="M3 5 H13 M3 8 H13 M3 11 H10"/></svg></span>
                <span className="ws-coll-name">All notes</span>
                <span className="ws-coll-count">{notesCountByCollection.__all}</span>
              </div>
              {/* Inbox */}
              <div
                className={"ws-collection-row" + (selectedCollection === "inbox" ? " selected" : "") + (dropTargetCollection === "inbox" && draggingNoteId ? " drag-target" : "")}
                onClick={() => setSelectedCollection("inbox")}
                onDragOver={(e) => handleCollectionDragOver("inbox", e)}
                onDrop={(e) => handleCollectionDrop("inbox", e)}
              >
                <span className="ws-caret empty"/>
                <span className="ws-coll-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><path d="M2 4 H14 L13 11 H3 Z M5 11 V13 H11 V11"/></svg></span>
                <span className="ws-coll-name">Inbox</span>
                <span className="ws-coll-count">{notesCountByCollection.__inbox || 0}</span>
              </div>
              {/* Today */}
              {todaysNotes.length > 0 && (
                <div
                  className={"ws-collection-row" + (selectedCollection === "today" ? " selected" : "")}
                  onClick={() => setSelectedCollection("today")}
                >
                  <span className="ws-caret empty"/>
                  <span className="ws-coll-icon" style={{color: "var(--accent)"}}>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="8" r="5.5"/><path d="M8 5 V8 L10 9.5"/></svg>
                  </span>
                  <span className="ws-coll-name">Today</span>
                  <span className="ws-coll-count">{todaysNotes.length}</span>
                </div>
              )}

              {/* Collections tree */}
              {rootCollections.map(col => (
                <CollectionTreeItem
                  key={col.id}
                  collection={col}
                  allCollections={collections}
                  level={0}
                  selectedId={selectedCollection}
                  expanded={expandedCollections}
                  setExpanded={setExpandedCollections}
                  onSelect={setSelectedCollection}
                  onAddChild={openNewCollectionModal}
                  onRename={handleRename}
                  onDelete={handleDelete}
                  notesCountByCollection={notesCountByCollection}
                  draggingNoteId={draggingNoteId}
                  dropTargetCollection={dropTargetCollection}
                  onCollectionDragOver={handleCollectionDragOver}
                  onCollectionDrop={handleCollectionDrop}
                />
              ))}
            </div>

            {rootCollections.length === 0 && (
              <p className="ws-empty-hint">No collections yet. Create one to organize notes into notebooks and chapters.</p>
            )}

            <div className="ws-new-collection">
              <button className="ws-new-btn" onClick={() => openNewCollectionModal(null)}>
                <PlusIcon size={11}/>
                New collection
              </button>
            </div>

            <div className="ws-sidebar-footer">
              <button className="ws-footer-btn" onClick={handleExport} title="Download current view as a markdown file" disabled={!filtered || filtered.length === 0}>
                <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M8 2 V11 M5 8 L8 11 L11 8 M3 13 H13"/></svg>
                Export
              </button>
