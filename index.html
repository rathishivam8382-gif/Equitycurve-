              <button className="ws-footer-btn" onClick={() => setShortcutsOpen(true)} title="Show keyboard shortcuts and search syntax (?)">
                <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M6 6 A2 2 0 0 1 10 6 C10 7.5 8 7.8 8 9.5 M8 11.5 V11.5"/></svg>
                Shortcuts
              </button>
            </div>
          </div>
        </aside>

        {/* Main pane */}
        <div className="ws-main">
          {breadcrumbPath && (
            <div className="ws-breadcrumb">
              <span className="ws-breadcrumb-item" onClick={() => setSelectedCollection(null)}>All notes</span>
              {breadcrumbPath.map((c, i) => (
                <React.Fragment key={c.id}>
                  <span className="ws-breadcrumb-sep">›</span>
                  <span
                    className={"ws-breadcrumb-item" + (i === breadcrumbPath.length - 1 ? " current" : "")}
                    onClick={() => i === breadcrumbPath.length - 1 ? null : setSelectedCollection(c.id)}
                    style={i === breadcrumbPath.length - 1 ? {color: COLLECTION_TYPES[c.type]?.color || "var(--text)"} : {}}
                  >
                    <CollectionTypeIcon type={c.type} size={12}/>
                    {c.name}
                  </span>
                </React.Fragment>
              ))}
            </div>
          )}

          {/* Recently-touched — pick up where you left off */}
          {(!selectedCollection || selectedCollection === null) && recentlyTouched.length > 0 && (
            <RecentlyTouchedPanel notes={recentlyTouched} onOpen={handleOpenNoteById}/>
          )}

          {/* Activity heatmap — shows on All notes view when there are notes */}
          {(!selectedCollection || selectedCollection === null) && notes.length > 0 && (
            <ActivityHeatmap notes={notes} onPickDate={handleHeatmapPickDate}/>
          )}

          {/* Today summary — visible on All notes view when there's activity today */}
          {(!selectedCollection || selectedCollection === "today") && (todaysNotes.length > 0 || todaysCompletedTasks.length > 0) && (
            <TodaySummary
              notesCount={todaysNotes.length}
              tasksDone={todaysCompletedTasks.length}
              onOpen={() => setSelectedCollection("today")}
              isOpen={selectedCollection === "today"}
            />
          )}

          {/* Active task indicator — appears when a calendar task is happening right now */}
          {activeTaskNow && (
            <ActiveTaskBanner
              task={activeTaskNow}
              autoLinkEnabled={autoLinkEnabled}
              onToggleAutoLink={() => setAutoLinkEnabled(v => !v)}
            />
          )}

          <div className="note-capture">
            <textarea value={input} onChange={e => setInput(e.target.value)} onKeyDown={onKey} placeholder={isNarrow ? "Capture a thought or idea…" : "Capture a thought, observation, or idea… (markdown + #hashtags supported)"} rows={3}/>
            <div className="note-capture-foot">
              <span className="note-capture-hint">
                <kbd>⌘</kbd>/<kbd>Ctrl</kbd> + <kbd>Enter</kbd> to save · {captureHint}
              </span>
              <div style={{display: "flex", gap: "6px"}}>
                <button className="tpl-trigger" onClick={() => setTemplatePickerOpen(true)} title="Insert a structured template">
                  <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                    <rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/>
                    <path d="M5 6 H11 M5 8 H11 M5 10 H9"/>
                  </svg>
                  Templates
                </button>
                <button className="qa-add" onClick={save} disabled={!input.trim()}>Save note</button>
              </div>
            </div>
          </div>

          {/* Smart suggestion: template family detected from just-saved content */}
          {templateSuggestion && (
            <SmartSuggestionBanner
              icon="◐"
              kind="template"
              text={"Looks like " + templateSuggestion.label.toLowerCase() + " — apply that template?"}
              hint={templateSuggestion.hint}
              actionLabel="Apply template"
              onAccept={acceptTemplateSuggestion}
              onDismiss={() => setTemplateSuggestion(null)}
            />
          )}

          {/* Smart suggestion: link to recent or upcoming task */}
          {recentLinkSuggestion && (
            <SmartSuggestionBanner
              icon={recentLinkSuggestion.kind === "recent" ? "↶" : "↷"}
              kind="recent-task"
              text={
                recentLinkSuggestion.kind === "recent"
                  ? "Link to '" + recentLinkSuggestion.task.title + "' (ended " + Math.round(recentLinkSuggestion.minutesAgo) + " min ago)?"
                  : "Link to '" + recentLinkSuggestion.task.title + "' (starts in " + Math.round(recentLinkSuggestion.minutesUntil) + " min)?"
              }
              actionLabel="Link"
              onAccept={acceptRecentLinkSuggestion}
              onDismiss={() => setRecentLinkSuggestion(null)}
            />
          )}

          {/* Inline template suggestion for empty typed collections */}
          {currentCollection && filtered.length === 0 && notes.filter(n => n.collectionId === currentCollection.id).length === 0 && (
            <InlineTemplateSuggest
              collectionType={currentCollectionType}
              collectionName={currentCollection.name}
              onPick={(tpl) => onAddNoteFromTemplate(tpl, currentCollection.id)}
              onBrowse={() => setTemplatePickerOpen(true)}
            />
          )}

          <div className="notes-filters">
            <button className={"notes-filter" + (filter === "all" ? " active" : "")} onClick={() => setFilter("all")}>All <span className="notes-filter-count">{counts.all}</span></button>
            <button className={"notes-filter" + (filter === "untagged" ? " active" : "")} onClick={() => setFilter("untagged")}>
              <span className="notes-filter-icon" style={{border: "1.4px dashed var(--border-strong)", background: "transparent"}}></span>
              Untagged <span className="notes-filter-count">{counts.untagged}</span>
            </button>
            {CAT_ORDER.map(k => (
              <button key={k} className={"notes-filter" + (filter === k ? " active" : "")} onClick={() => setFilter(k)}>
                <span className={"notes-filter-icon cat-" + k}><CatIcon cat={k} size={11}/></span>
                {CATEGORIES[k].label}
                <span className="notes-filter-count">{counts[k]}</span>
              </button>
            ))}
          </div>

          {tagList.length > 0 && (
            <div className="notes-tag-filters">
              <span className="tag-filter-label">Tags</span>
              {tagList.map(t => (
                <button key={t} className={"tag-chip" + (tagFilter === t ? " active" : "")} onClick={() => handleTagClick(t)}>
                  #{t}<span className="tag-count">{tagMap[t]}</span>
                </button>
              ))}
              {tagFilter && (
                <button className="tag-chip clear" onClick={() => setTagFilter(null)} aria-label="Clear tag filter">
                  <XIcon size={9}/>
                </button>
              )}
            </div>
          )}

          <div className="notes-feed">
            {filtered.length === 0 ? (
              <div className="notes-empty">
                {notes.length === 0
                  ? "No notes yet. Capture anything above. Organize them into collections via the sidebar."
                  : (selectedCollection && selectedCollection !== "inbox"
                      ? "This collection is empty. Save a note above to add one here."
                      : "No notes match the current filter.")}
              </div>
            ) : (
              filtered.map(n => (
                <NoteCard
                  key={n.id}
                  note={n}
                  isDragging={draggingNoteId === n.id}
                  isHighlighted={highlightedNoteId === n.id}
                  innerRef={(el) => { if (el) noteRefs.current[n.id] = el; }}
                  allTasks={tasks}
                  allRecurring={recurring}
                  pickerOpenForThis={taskPickerForNote === n.id}
                  onOpenTaskPicker={() => setTaskPickerForNote(n.id)}
                  onCloseTaskPicker={() => setTaskPickerForNote(null)}
                  onUpdate={onUpdateNote}
                  onDelete={onDeleteNote}
                  onTogglePin={onTogglePin}
                  onTagClick={handleTagClick}
                  onLinkTask={onLinkNoteToTask}
                  onUnlinkTask={onUnlinkNoteFromTask}
                  onOpenTask={onOpenTask}
                  onDragStart={(e) => handleNoteDragStart(n.id, e)}
                  onDragEnd={handleNoteDragEnd}
                  titleIndex={titleIndex}
                  highlightTerms={parsedQuery.terms}
                  onWikiClick={handleWikiClick}
                  backlinks={backlinksByNoteId[n.id]}
                  onOpenNote={handleOpenNoteById}
                  onFocus={(noteId) => setFocusNoteId(noteId)}
                  notesForAutocomplete={notes}
                />
              ))
            )}
          </div>
        </div>
      </div>

      {modalOpen && (
        <NewCollectionModal
          parentName={modalParentId ? (collections.find(c => c.id === modalParentId) || {}).name : null}
          onClose={closeModal}
          onCreate={createCollectionFromModal}
        />
      )}

      {templatePickerOpen && (
        <TemplatePicker
          currentCollectionType={currentCollectionType}
          currentCollectionName={currentCollection ? currentCollection.name : null}
          onClose={() => setTemplatePickerOpen(false)}
          onPick={(tpl) => {
            const targetCollection = (!selectedCollection || selectedCollection === "inbox" || selectedCollection === "today") ? null : selectedCollection;
            onAddNoteFromTemplate(tpl, targetCollection);
            setTemplatePickerOpen(false);
          }}
        />
      )}

      {focusNote && (
        <NoteFocusView
          note={focusNote}
          collections={collections}
          titleIndex={titleIndex}
          onWikiClick={(target) => { setFocusNoteId(null); handleWikiClick(target); }}
          onClose={() => setFocusNoteId(null)}
          onUpdate={onUpdateNote}
        />
      )}

      {shortcutsOpen && (
        <ShortcutsCheatsheet onClose={() => setShortcutsOpen(false)}/>
      )}
    </div>
  );
}

// Inline template suggestion (empty typed collection)
// ============================================================
function InlineTemplateSuggest({ collectionType, collectionName, onPick, onBrowse }) {
  const suggestions = useMemo(() => suggestedTemplates(collectionType, 4), [collectionType]);
  if (suggestions.length === 0) return null;
  return (
    <div className="tpl-inline-suggest">
      <div className="tpl-inline-header">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M8 1.5 L10 6 L14.5 6.5 L11 10 L12 14.5 L8 12 L4 14.5 L5 10 L1.5 6.5 L6 6 Z"/>
        </svg>
        <span>Try a template for <b>{collectionName}</b></span>
      </div>
      <div className="tpl-inline-grid">
        {suggestions.map(tpl => (<TemplateCard key={tpl.id} tpl={tpl} onPick={onPick}/>))}
      </div>
      <button className="tpl-inline-browse" onClick={onBrowse}>Browse all templates →</button>
    </div>
  );
}

// ============================================================
// Template picker modal
// ============================================================
function TemplatePicker({ currentCollectionType, currentCollectionName, onClose, onPick }) {
  const [query, setQuery] = useState("");
  const searchRef = useRef(null);
  useEffect(() => { if (searchRef.current) searchRef.current.focus(); }, []);

  // Filter logic
  const q = query.trim().toLowerCase();
  function matches(tpl) {
    if (!q) return true;
    if ((tpl.family || "").toLowerCase().indexOf(q) !== -1) return true;
    if ((tpl.variant || "").toLowerCase().indexOf(q) !== -1) return true;
    if ((tpl.desc || "").toLowerCase().indexOf(q) !== -1) return true;
    if ((tpl.type || "").toLowerCase().indexOf(q) !== -1) return true;
    return false;
  }

  const suggested = useMemo(() => {
    if (q) return [];
    return suggestedTemplates(currentCollectionType, 6);
  }, [currentCollectionType, q]);
  const suggestedIds = new Set(suggested.map(t => t.id));

  const byType = useMemo(() => {
    const m = templatesByType();
    const out = {};
    for (const t in m) {
      const arr = m[t].filter(matches).filter(tpl => !suggestedIds.has(tpl.id));
      if (arr.length > 0) out[t] = arr;
    }
    return out;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [query, suggestedIds]);

  function handleScrim(e) { if (e.target === e.currentTarget) onClose(); }

  // Order of types in "all templates"
  const orderedTypes = COLLECTION_TYPE_ORDER.filter(t => byType[t] && byType[t].length > 0);
  const nothingFound = suggested.length === 0 && orderedTypes.length === 0;

  return (
    <div className="tpl-modal" onClick={handleScrim}>
      <div className="tpl-modal-card" role="dialog" aria-modal="true">
        <div className="tpl-modal-header">
          <h3 className="tpl-modal-title">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
              <rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/>
              <path d="M5 6 H11 M5 8 H11 M5 10 H9"/>
            </svg>
            Choose a template
          </h3>
          <div className="tpl-search-wrap">
            <span className="tpl-search-icon"><SearchIcon size={13}/></span>
            <input
              ref={searchRef}
              type="text" className="tpl-search"
              placeholder="Search templates…"
              value={query}
              onChange={e => setQuery(e.target.value)}
              onKeyDown={e => { if (e.key === "Escape") onClose(); }}
            />
          </div>
          <button className="tpl-modal-close" onClick={onClose} aria-label="Close"><XIcon size={14}/></button>
        </div>
        <div className="tpl-modal-body">
          {nothingFound && (
            <div className="tpl-empty">No templates match "{query}".</div>
          )}

          {suggested.length > 0 && !q && (
            <>
              <div className="tpl-section-label">
                <span>Suggested{currentCollectionName ? " for " + currentCollectionName : ""}</span>
              </div>
              <div className="tpl-grid">
                {suggested.map(tpl => (<TemplateCard key={tpl.id} tpl={tpl} onPick={onPick}/>))}
              </div>
            </>
          )}

          {orderedTypes.map(type => (
            <div key={type}>
              <div className="tpl-section-label">
                <span className="tpl-section-label-type-icon" style={{color: COLLECTION_TYPES[type].color}}>
                  <CollectionTypeIcon type={type} size={12}/>
                </span>
                <span>{COLLECTION_TYPES[type].label}</span>
              </div>
              <div className="tpl-grid">
                {byType[type].map(tpl => (<TemplateCard key={tpl.id} tpl={tpl} onPick={onPick}/>))}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function TemplateCard({ tpl, onPick }) {
  // Compute meta: block count and 2-3 standout block types
  const blockCount = tpl.blocks ? tpl.blocks.length : 0;
  const types = {};
  if (tpl.blocks) for (let i = 0; i < tpl.blocks.length; i++) types[tpl.blocks[i].type] = (types[tpl.blocks[i].type] || 0) + 1;
  // Highlight the "interesting" types
  const interesting = [];
  if (types.math) interesting.push("math×" + types.math);
  if (types.code) interesting.push("code×" + types.code);
  if (types.check) interesting.push("checklist×" + types.check);
  return (
    <button className={"tpl-card t-" + tpl.type} onClick={() => onPick(tpl)}>
      <div className="tpl-card-header">
        <span className="tpl-card-name">{tpl.family}{tpl.variant ? " — " + tpl.variant : ""}</span>
      </div>
      <div className="tpl-card-desc">{tpl.desc}</div>
      <div className="tpl-card-meta">
        <span>{blockCount} blocks</span>
        {interesting.length > 0 && (
          <span className="tpl-card-block-types">
            {interesting.map((s, i) => <span key={i} className="tpl-card-block-tag">{s}</span>)}
          </span>
        )}
      </div>
    </button>
  );
}

// Collection tree row — recursive
function CollectionTreeItem({ collection, allCollections, level, selectedId, expanded, setExpanded, onSelect, onAddChild, onRename, onDelete, notesCountByCollection, draggingNoteId, dropTargetCollection, onCollectionDragOver, onCollectionDrop }) {
  const children = getChildCollections(allCollections, collection.id);
  const isExpanded = !!expanded[collection.id];
  const isSelected = selectedId === collection.id;
  const isDropTarget = dropTargetCollection === collection.id && draggingNoteId != null;
  const typeColor = COLLECTION_TYPES[collection.type]?.color || "var(--text-2)";
  const count = notesCountByCollection[collection.id] || 0;

  function toggleExpand(e) {
    e.stopPropagation();
    setExpanded(prev => Object.assign({}, prev, { [collection.id]: !prev[collection.id] }));
  }

  return (
    <div className="ws-tree-item">
      <div
        className={"ws-collection-row" + (isSelected ? " selected" : "") + (isDropTarget ? " drag-target" : "")}
        onClick={() => onSelect(collection.id)}
        onDragOver={(e) => onCollectionDragOver(collection.id, e)}
        onDrop={(e) => onCollectionDrop(collection.id, e)}
        style={level > 0 ? {} : {}}
      >
        <span
          className={"ws-caret" + (isExpanded ? " expanded" : "") + (children.length === 0 ? " empty" : "")}
          onClick={children.length > 0 ? toggleExpand : undefined}
        >
          {children.length > 0 ? "▸" : ""}
        </span>
        <span className="ws-coll-icon" style={{color: typeColor}}>
          <CollectionTypeIcon type={collection.type} size={13}/>
        </span>
        <span className="ws-coll-name">{collection.name}</span>
        <span className="ws-collection-actions">
          <button className="ws-coll-action" onClick={(e) => { e.stopPropagation(); onAddChild(collection.id); }} title="Add chapter">
            <PlusIcon size={10}/>
          </button>
          <button className="ws-coll-action" onClick={(e) => { e.stopPropagation(); onRename(collection.id, collection.name); }} title="Rename">
            <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><path d="M11 2 L14 5 L5 14 L2 14 L2 11 Z"/></svg>
          </button>
          <button className="ws-coll-action danger" onClick={(e) => { e.stopPropagation(); onDelete(collection.id, collection.name, children.length); }} title="Delete">
            <TrashIcon size={11}/>
          </button>
        </span>
        <span className="ws-coll-count">{count || ""}</span>
      </div>

      {isExpanded && children.length > 0 && (
        <div className="ws-collection-children">
          {children.map(child => (
            <CollectionTreeItem
              key={child.id}
              collection={child}
              allCollections={allCollections}
              level={level + 1}
              selectedId={selectedId}
              expanded={expanded}
              setExpanded={setExpanded}
              onSelect={onSelect}
              onAddChild={onAddChild}
              onRename={onRename}
              onDelete={onDelete}
              notesCountByCollection={notesCountByCollection}
              draggingNoteId={draggingNoteId}
              dropTargetCollection={dropTargetCollection}
              onCollectionDragOver={onCollectionDragOver}
              onCollectionDrop={onCollectionDrop}
            />
          ))}
        </div>
      )}
    </div>
  );
}

// New-collection modal
function NewCollectionModal({ parentName, onClose, onCreate }) {
  const [name, setName] = useState("");
  const [type, setType] = useState("general");
  const inputRef = useRef(null);

  useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);

  function handleSubmit() {
    if (!name.trim()) return;
    onCreate(name.trim(), type);
  }
  function handleKey(e) {
    if (e.key === "Enter") { e.preventDefault(); handleSubmit(); }
    else if (e.key === "Escape") { e.preventDefault(); onClose(); }
  }
  function handleScrim(e) { if (e.target === e.currentTarget) onClose(); }

  return (
    <div className="ws-modal" onClick={handleScrim}>
      <div className="ws-modal-card">
        <h3 className="ws-modal-title">
          {parentName ? "New chapter in “" + parentName + "”" : "New collection"}
        </h3>
        <input
          ref={inputRef}
          className="ws-modal-input"
          type="text"
          value={name}
          onChange={e => setName(e.target.value)}
          onKeyDown={handleKey}
          placeholder={parentName ? "Chapter name (e.g. Ch 3: Sorting)" : "Collection name (e.g. USYD Algorithms)"}
        />
        <span className="ws-modal-label">Type</span>
        <div className="ws-type-grid">
          {COLLECTION_TYPE_ORDER.map(k => (
            <button
              key={k}
              className={"ws-type-btn" + (type === k ? " selected" : "")}
              onClick={() => setType(k)}
              style={type === k ? {} : {}}
            >
              <span className="ws-type-btn-icon" style={{color: COLLECTION_TYPES[k].color}}>
                <CollectionTypeIcon type={k} size={18}/>
              </span>
              {COLLECTION_TYPES[k].label}
            </button>
          ))}
        </div>
        <div className="ws-modal-actions">
          <button onClick={onClose}>Cancel</button>
          <button className="primary" onClick={handleSubmit} disabled={!name.trim()}>
            Create
          </button>
        </div>
      </div>
    </div>
  );
}

function TimeStrip({ timestamp, category }) {
  const d = new Date(timestamp);
  const hour = d.getHours(); const minute = d.getMinutes();
  const raw = (hour * 60 + minute) / (24 * 60) * 100;
  const pct = Math.max(2.5, Math.min(97.5, raw));
  const catColor = category ? (CAT_COLORS[category] || "#888780") : "#888780";
  return (
    <div className="time-strip" aria-hidden="true">
      <div className="time-strip-tick" style={{left: "25%"}}/>
      <div className="time-strip-tick" style={{left: "50%"}}/>
      <div className="time-strip-tick" style={{left: "75%"}}/>
      <div className="time-strip-marker" style={{ left: pct + "%", color: catColor, boxShadow: "0 0 0 1.5px " + catColor + ", 0 1px 3px rgba(0,0,0,0.18)" }} title={pad(hour) + ":" + pad(minute)}>
        {category ? <CatIcon cat={category} size={11}/> : <span className="untagged-dot"/>}
      </div>
    </div>
  );
}

function NoteCatPicker({ current, onPick, onClose }) {
  const ref = useRef(null);
  useClickOutside(ref, onClose);
  return (
    <div className="cat-picker" ref={ref}>
      <button className={"cat-picker-item" + (!current ? " active" : "")} onClick={() => { onPick(null); onClose(); }}>
        <span className="cat-picker-untagged-dot"></span>Untagged
      </button>
      <div className="cat-picker-sep"/>
      {CAT_ORDER.map(k => (
        <button key={k} className={"cat-picker-item" + (current === k ? " active" : "")} onClick={() => { onPick(k); onClose(); }}>
          <span className={"cat-picker-tile cat-" + k}><CatIcon cat={k} size={11}/></span>
          {CATEGORIES[k].label}
        </button>
      ))}
    </div>
  );
}

function NoteCard({ note, onUpdate, onDelete, onTogglePin, onTagClick, onDragStart, onDragEnd, isDragging, isHighlighted, innerRef, allTasks, allRecurring, pickerOpenForThis, onOpenTaskPicker, onCloseTaskPicker, onLinkTask, onUnlinkTask, onOpenTask, titleIndex, highlightTerms, onWikiClick, backlinks, onOpenNote, onFocus, notesForAutocomplete }) {
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [pickerOpen, setPickerOpen] = useState(false);

  const blocks = note.blocks || [];
  const cleanTitle = useMemo(() => deriveTitleFromBlocks(blocks), [blocks]);
  const serialized = useMemo(() => blocksToText(blocks), [blocks]);
  const tags = useMemo(() => extractTags(serialized), [serialized]);

  const linkedTasks = useMemo(() => {
    const ids = note.linkedTaskIds || [];
    if (ids.length === 0) return [];
    const out = [];
    const all = (allTasks || []).concat(allRecurring || []);
    for (let i = 0; i < ids.length; i++) {
      const found = all.find(t => t.id === ids[i]);
      if (found) out.push(found);
    }
    return out;
  }, [note.linkedTaskIds, allTasks, allRecurring]);

  function updateBlocks(nextBlocks) {
    onUpdate(note.id, { blocks: nextBlocks });
  }

  const metaLabel = relativeTimeLabel(note.createdAt);
  const dt = new Date(note.createdAt);
  const fullDate = dt.toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short", year: dt.getFullYear() !== new Date().getFullYear() ? "numeric" : undefined });
  const catKey = note.category || "untagged";

  function handleStripDragStart(e) {
    if (onDragStart) onDragStart(e);
  }

  return (
    <div ref={innerRef} className={"note-card cat-" + catKey + (note.pinned ? " pinned" : "") + (isDragging ? " dragging-note" : "") + (isHighlighted ? " highlight-flash" : "")}>
      <div
        draggable={!!onDragStart}
        onDragStart={handleStripDragStart}
        onDragEnd={onDragEnd}
        style={{cursor: onDragStart ? "grab" : "default"}}
        title="Drag to move into a collection"
      >
        <TimeStrip timestamp={note.createdAt} category={note.category}/>
      </div>
      <div className="note-card-body">
        <div className="note-card-header">
          <div className="note-cat-badge-wrap">
            <button className={"note-cat-badge cat-" + catKey} onClick={(e) => { e.stopPropagation(); setPickerOpen(o => !o); }} onMouseDown={(e) => e.stopPropagation()} aria-label="Change tag">
              {note.category ? <CatIcon cat={note.category} size={14}/> : <PlusIcon size={10}/>}
            </button>
            {pickerOpen && (<NoteCatPicker current={note.category} onPick={(c) => onUpdate(note.id, { category: c })} onClose={() => setPickerOpen(false)}/>)}
          </div>
          <div className="note-title-wrap">
            <h3 className="note-title">{cleanTitle || "Untitled note"}</h3>
            <p className="note-card-meta"><span>{metaLabel}</span><span className="dot-sep">·</span><span>{fullDate}</span></p>
          </div>
          <div className="note-actions">
            {onFocus && (
              <button className="note-action" onClick={() => onFocus(note.id)} aria-label="Open in focus mode" title="Focus mode (read fullscreen)">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M2 6 V2 H6 M14 6 V2 H10 M2 10 V14 H6 M14 10 V14 H10"/></svg>
              </button>
            )}
            <button className={"note-action" + (note.pinned ? " active" : "")} onClick={() => onTogglePin(note.id)} aria-label={note.pinned ? "Unpin" : "Pin"} title={note.pinned ? "Unpin" : "Pin to top"}>
              <PinIcon size={14} filled={note.pinned}/>
            </button>
            <button className="note-action danger" onClick={() => { if (confirmDelete) { onDelete(note.id); } else { setConfirmDelete(true); setTimeout(() => setConfirmDelete(false), 2500); } }} aria-label="Delete" title={confirmDelete ? "Click again to confirm" : "Delete"}>
              <TrashIcon size={14}/>
            </button>
          </div>
        </div>

        <BlockEditor blocks={blocks} onChange={updateBlocks} titleIndex={titleIndex} highlightTerms={highlightTerms} onWikiClick={onWikiClick} notesForAutocomplete={notesForAutocomplete}/>

        {tags.length > 0 && (
          <div className="note-tags">
            {tags.map(t => (
              <button key={t} className="note-tag" onClick={(e) => { e.stopPropagation(); if (onTagClick) onTagClick(t); }}>#{t}</button>
            ))}
          </div>
        )}

        {/* Linked tasks */}
        <div className="note-linked-tasks">
          {linkedTasks.map(t => {
            const lab = makeTaskLabel(t);
            return (
              <span key={t.id} className={"note-linked-chip cat-" + t.category}>
                <LinkIcon size={10}/>
                <span className="note-linked-chip-text" onClick={() => onOpenTask && onOpenTask(t)} title="Open task">
                  {lab.title}

                <button className="note-linked-unlink" onClick={(e) => { e.stopPropagation(); onUnlinkTask(note.id, t.id); }} aria-label="Unlink" title="Unlink">
                  <XIcon size={9}/>
                </button>

          })}
          {onOpenTaskPicker && (
            <button className="note-linked-add" onClick={(e) => { e.stopPropagation(); onOpenTaskPicker(); }}>

            note={note}
            allTasks={allTasks}
            allRecurring={allRecurring}
            onClose={onCloseTaskPicker}

        {backlinks && backlinks.length > 0 && (
          <div className="backlinks">
            <div className="backlinks-label">
              <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M9 5.5 H12 A3 3 0 0 1 12 11 H10"/><path d="M7 11 H4 A3 3 0 0 1 4 5 H6.5"/><path d="M6.5 8 H9.5"/></svg>

            </div>

                  <button key={b.id} className={"backlink-item cat-" + catKey} onClick={(e) => { e.stopPropagation(); if (onOpenNote) onOpenNote(b.id); }}>

                  </button>
                );
              })}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ============================================================
// Task picker for note ↔ task linking
// ============================================================
function TaskPickerForNote({ note, allTasks, allRecurring, onClose, onPick }) {
  const [query, setQuery] = useState("");
  const searchRef = useRef(null);
  useEffect(() => { if (searchRef.current) searchRef.current.focus(); }, []);

  // Build sorted candidate list: today's tasks first, then upcoming, then recurring, exclude already-linked
  const candidates = useMemo(() => {
    const linkedSet = new Set(note.linkedTaskIds || []);
    const todayStr = formatDate(new Date());
    const oneOff = (allTasks || []).filter(t => !linkedSet.has(t.id));
    const recur = (allRecurring || []).filter(r => !linkedSet.has(r.id));
    // Sort one-off by date (today first)
    oneOff.sort((a, b) => {
      const aIsToday = a.date === todayStr;
      const bIsToday = b.date === todayStr;
      if (aIsToday !== bIsToday) return aIsToday ? -1 : 1;
      return (a.date || "").localeCompare(b.date || "");
    });
    return { oneOff, recur };
  }, [note.linkedTaskIds, allTasks, allRecurring]);

  function matches(t) {
    if (!query.trim()) return true;
    const q = query.trim().toLowerCase();
    return (t.title || "").toLowerCase().indexOf(q) !== -1 || (t.category || "").indexOf(q) !== -1;
  }

  const oneOffFiltered = candidates.oneOff.filter(matches).slice(0, 30);
  const recurFiltered = candidates.recur.filter(matches).slice(0, 15);

  function handleScrim(e) { if (e.target === e.currentTarget) onClose(); }

  return (
    <div className="task-picker-scrim" onClick={handleScrim}>
      <div className="task-picker-card">
        <div className="task-picker-header">
          <h3 className="task-picker-title">
            <LinkIcon size={13}/>
            Link to a task
          </h3>
          <button className="tpl-modal-close" onClick={onClose} aria-label="Close"><XIcon size={14}/></button>
        </div>
        <div className="tpl-search-wrap" style={{margin: "8px 14px 4px"}}>
          <span className="tpl-search-icon"><SearchIcon size={13}/></span>
          <input
            ref={searchRef}
            type="text" className="tpl-search"
            placeholder="Search tasks…"
            value={query}
            onChange={e => setQuery(e.target.value)}
            onKeyDown={e => { if (e.key === "Escape") onClose(); }}
          />
        </div>
        <div className="task-picker-body">
          {oneOffFiltered.length === 0 && recurFiltered.length === 0 && (
            <div className="tpl-empty">No matching tasks.</div>
          )}
          {oneOffFiltered.length > 0 && (
            <>
              <div className="tpl-section-label">Tasks</div>
              {oneOffFiltered.map(t => {
                const lab = makeTaskLabel(t);
                return (
                  <button key={t.id} className="task-picker-item" onClick={() => onPick(t.id)}>
                    <span className={"task-picker-item-icon cat-" + t.category}><CatIcon cat={t.category} size={11}/></span>
                    <span className="task-picker-item-text">
                      <span className="task-picker-item-title">{lab.title}</span>
                      <span className="task-picker-item-when">{lab.when}</span>
                    </span>
                  </button>
                );
              })}
            </>
          )}
          {recurFiltered.length > 0 && (
            <>
              <div className="tpl-section-label">Recurring</div>
              {recurFiltered.map(t => {
                const lab = makeTaskLabel(t);
                return (
                  <button key={t.id} className="task-picker-item" onClick={() => onPick(t.id)}>
                    <span className={"task-picker-item-icon cat-" + t.category}><CatIcon cat={t.category} size={11}/></span>
                    <span className="task-picker-item-text">
                      <span className="task-picker-item-title">{lab.title}</span>
                      <span className="task-picker-item-when">{lab.when} ↻</span>
                    </span>
                  </button>
                );
              })}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

// Search-filter chips — show active operators with one-click clear
// ============================================================
function SearchFilterChips({ parsed, matchCount, onClear }) {
  const chips = [];
  parsed.tags.forEach(t => chips.push({ label: "#" + t, kind: "tag" }));
  parsed.cats.forEach(c => chips.push({ label: "cat:" + c, kind: "cat" }));
  parsed.colls.forEach(c => chips.push({ label: "coll:" + c, kind: "coll" }));
  parsed.has.forEach(h => chips.push({ label: "has:" + h, kind: "has" }));
  if (parsed.after != null) chips.push({ label: "after:" + new Date(parsed.after).toLocaleDateString("en-AU", { day: "numeric", month: "short" }), kind: "after" });
  if (parsed.before != null) chips.push({ label: "before:" + new Date(parsed.before).toLocaleDateString("en-AU", { day: "numeric", month: "short" }), kind: "before" });
  parsed.terms.forEach(t => chips.push({ label: '"' + t + '"', kind: "term" }));
  return (
    <div className="search-filter-bar">
      <span className="search-filter-count">{matchCount} match{matchCount !== 1 ? "es" : ""}</span>
      <span className="search-filter-chips">
        {chips.map((c, i) => (
          <span key={i} className={"search-filter-chip kind-" + c.kind}>{c.label}</span>
        ))}
      </span>
      <button className="search-filter-clear" onClick={onClear}>Clear</button>
    </div>
  );
}

// ============================================================
// Activity heatmap — 8 weeks of note creation density
// ============================================================
function ActivityHeatmap({ notes, onPickDate }) {
  const grid = useMemo(() => buildHeatmapGrid(notes, 8), [notes]);
  const [hover, setHover] = useState(null); // { cell, x, y }
  const total = useMemo(() => grid.reduce((s, col) => s + col.reduce((ss, c) => ss + c.count, 0), 0), [grid]);

  // Bucket count → intensity level 0–4
  function level(n) {
    if (n === 0) return 0;
    if (n === 1) return 1;
    if (n <= 3) return 2;
    if (n <= 6) return 3;
    return 4;
  }

  // Month labels above columns (only when month changes)
  const monthLabels = [];
  let lastMonth = -1;
  for (let c = 0; c < grid.length; c++) {
    const firstDay = grid[c][0].date;
    const m = firstDay.getMonth();
    if (m !== lastMonth) { monthLabels.push({ col: c, name: firstDay.toLocaleString("en-AU", { month: "short" }) }); lastMonth = m; }
    else { monthLabels.push(null); }
  }

  function fmtFull(d) {
    return d.toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "long" });
  }

  return (
    <div className="activity-heatmap">
      <div className="heatmap-head">
        <span className="heatmap-title">Last 8 weeks</span>
        <span className="heatmap-total">{total} note{total !== 1 ? "s" : ""}</span>
      </div>
      <div className="heatmap-grid-wrap">
        <div className="heatmap-months">
          {monthLabels.map((m, i) => (
            <span key={i} className="heatmap-month">{m ? m.name : ""}</span>
          ))}
        </div>
        <div className="heatmap-grid">
          {grid.map((col, ci) => (
            <div key={ci} className="heatmap-col">
              {col.map((cell, ri) => (
                <div
                  key={ri}
                  className={"heatmap-cell level-" + level(cell.count) + (cell.isToday ? " is-today" : "") + (cell.inFuture ? " is-future" : "")}
                  onMouseEnter={(e) => setHover({ cell, x: e.clientX, y: e.clientY })}
                  onMouseLeave={() => setHover(null)}
                  onClick={() => { if (!cell.inFuture && onPickDate) onPickDate(cell.dateStr); }}
                  role="button"
                  tabIndex={0}
                  aria-label={cell.count + " notes on " + fmtFull(cell.date)}
                />
              ))}
            </div>
          ))}
        </div>
      </div>
      <div className="heatmap-legend">
        <span className="heatmap-legend-label">Less</span>
        <span className="heatmap-cell level-0"/>
        <span className="heatmap-cell level-1"/>
        <span className="heatmap-cell level-2"/>
        <span className="heatmap-cell level-3"/>
        <span className="heatmap-cell level-4"/>
        <span className="heatmap-legend-label">More</span>
      </div>
      {hover && (
        <div className="heatmap-tooltip" style={{ left: hover.x, top: hover.y }}>
          <strong>{hover.cell.count}</strong> note{hover.cell.count !== 1 ? "s" : ""}
          <br/><span style={{opacity:0.7}}>{fmtFull(hover.cell.date)}</span>
        </div>
      )}
    </div>
  );
}

// ============================================================
// Note focus view — fullscreen single-note reading/editing
// ============================================================
function NoteFocusView({ note, collections, titleIndex, onWikiClick, onClose, onUpdate }) {
  const blocks = note.blocks || [];
  const title = deriveTitleFromBlocks(blocks) || "Untitled note";
  const dt = new Date(note.createdAt);
  const dateLine = dt.toLocaleString("en-AU", { weekday: "long", day: "numeric", month: "long", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true });
  const coll = note.collectionId ? (collections || []).find(c => c.id === note.collectionId) : null;

  useEffect(() => {
    function onKey(e) { if (e.key === "Escape") onClose(); }
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, [onClose]);

  function updateBlocks(next) { onUpdate(note.id, { blocks: next }); }
  function handleScrim(e) { if (e.target === e.currentTarget) onClose(); }

  return (
    <div className="focus-overlay" onClick={handleScrim}>
      <div className="focus-card">
        <div className="focus-header">
          <div className="focus-meta">
            <span className="focus-meta-line">{dateLine}{coll ? " · " + coll.name : ""}</span>
            <h1 className="focus-title">{title}</h1>
          </div>
          <button className="focus-close" onClick={onClose} aria-label="Exit focus mode" title="Exit focus (Esc)">
            <XIcon size={14}/>
          </button>
        </div>
        <div className="focus-body">
          <BlockEditor blocks={blocks} onChange={updateBlocks} titleIndex={titleIndex} onWikiClick={onWikiClick}/>
        </div>
      </div>
    </div>
  );
}

    },
    {
      title: "Global",
      items: [
        ["?", "Open this cheatsheet"],
        ["Esc", "Close any modal / focus view"]
      ]
    }
  ];

  return (
    <div className="shortcuts-modal" onClick={handleScrim}>
      <div className="shortcuts-card">
        <div className="shortcuts-head">
          <h3>Keyboard & syntax</h3>
          <button className="tpl-modal-close" onClick={onClose}><XIcon size={14}/></button>
        </div>
        <div className="shortcuts-body">
          {groups.map((g, i) => (
            <div key={i} className="shortcuts-group">
              <h4 className="shortcuts-group-title">{g.title}</h4>
              <dl className="shortcuts-list">
                {g.items.map((it, j) => (
                  <React.Fragment key={j}>
                    <dt><kbd>{it[0]}</kbd></dt>
                    <dd>{it[1]}</dd>
                  </React.Fragment>
                ))}
              </dl>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ============================================================
// Task sheet — with PRO NOTES + templates + linking
// ============================================================
function TaskSheet({ item, today, allTasks, allRecurring, allNotes, collections, findTaskById, onClose, onDelete, onUpdate, onOpenTask, onOpenNote, onLink, onUnlink }) {
  const [notes, setNotes] = useState(item.notes || "");
  const [linkSelect, setLinkSelect] = useState("");
  const notesRef = useRef(null);
  const sheetRef = useRef(null);
  const saveRef = useRef(notes);
  saveRef.current = notes;
  const itemIdRef = useRef(item.id);

  // Re-init notes + link selector + scroll when switching to a linked task
  useEffect(() => {
    if (itemIdRef.current !== item.id) {
      itemIdRef.current = item.id;
      setNotes(item.notes || "");
      setLinkSelect("");
      if (sheetRef.current) sheetRef.current.scrollTop = 0;
    }
  }, [item.id, item.notes]);

  // Save on unmount
  useEffect(() => {
    return () => { if (saveRef.current !== item.notes) onUpdate(item, { notes: saveRef.current }); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Debounced save while typing
  useEffect(() => {
    const id = setTimeout(() => { if (notes !== item.notes) onUpdate(item, { notes }); }, 600);
    return () => clearTimeout(id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [notes]);

  function handleScrimClick(e) { if (e.target === e.currentTarget) onClose(); }
  function setPriority(p) { onUpdate(item, { priority: p }); }
  function setMoveDate(dateStr) { if (item.recurring) return; onUpdate(item, { date: dateStr }); }
  function handleStartTimeChange(e) { const parsed = parseTimeStr(e.target.value); if (!parsed) return; const updates = { time: parsed }; if (item.endTime) updates.duration = computeDuration(parsed, item.endTime); onUpdate(item, updates); }
  function handleEndTimeChange(e) { const parsed = parseTimeStr(e.target.value); if (!parsed) return; if (!item.time) return; onUpdate(item, { endTime: parsed, duration: computeDuration(item.time, parsed) }); }
  function clearTime() { onUpdate(item, { time: null, endTime: null, duration: 45 }); }
  function addTime() { onUpdate(item, { time: { hour: 9, minute: 0 }, endTime: { hour: 10, minute: 0 }, duration: 60 }); }

  function insertTemplate(name) {
    const next = appendTemplate(notes, name);
    setNotes(next);
    setTimeout(() => { if (notesRef.current) { notesRef.current.focus(); notesRef.current.setSelectionRange(next.length, next.length); notesRef.current.scrollTop = notesRef.current.scrollHeight; } }, 0);
  }

  function flushNotesAnd(fn) {
    if (saveRef.current !== item.notes) onUpdate(item, { notes: saveRef.current });
    fn();
  }

  function handleLink() {
    if (!linkSelect) return;
    onLink(item.id, linkSelect);
    setLinkSelect("");
  }

  function openLinked(linkedId) {
    const linked = findTaskById(linkedId);
    if (!linked) return;
    flushNotesAnd(() => onOpenTask(linked));
  }

  let when = "";
  if (item.recurring) {
    const days = item.recurring.days;
    if (days.length === 7) when = "Every day";
    else if (days.length === 5 && days.indexOf(0) === -1 && days.indexOf(6) === -1) when = "Weekdays";
    else if (days.length === 2 && days.indexOf(0) !== -1 && days.indexOf(6) !== -1) when = "Weekends";
    else when = "Every " + days.map(d => DAY_NAMES_FULL[d]).join(", ");
  } else if (item.date) {
    const dt = new Date(item.date + "T00:00:00");
    when = dt.toLocaleString("en-AU", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }
  const catDef = CATEGORIES[item.category] || CATEGORIES[DEFAULT_CAT];
  const durStr = item.time && item.endTime ? formatDuration(computeDuration(item.time, item.endTime)) : "";

  const moveOptions = [];
  for (let i = 0; i < 14; i++) { const d = addDays(today, i); moveOptions.push({ dateStr: formatDate(d), label: i === 0 ? "Today" : i === 1 ? "Tmrw" : DAY_NAMES_SHORT[d.getDay()], day: i === 0 || i === 1 ? "" : d.getDate().toString() }); }

  // Linking candidates: all tasks + recurring except self and already-linked
  const linkedIds = item.linkedTaskIds || [];
  const allCandidates = useMemo(() => {
    const arr = [];
    for (let i = 0; i < allTasks.length; i++) { const t = allTasks[i]; if (t.id !== item.id && linkedIds.indexOf(t.id) === -1) arr.push(t); }
    for (let i = 0; i < allRecurring.length; i++) { const r = allRecurring[i]; if (r.id !== item.id && linkedIds.indexOf(r.id) === -1) arr.push(r); }
    return arr;
  }, [allTasks, allRecurring, item.id, linkedIds]);

  const linkedTasks = linkedIds.map(id => findTaskById(id)).filter(Boolean);

  return (
    <div className="scrim" onClick={handleScrimClick}>
      <div className="sheet" role="dialog" aria-modal="true" ref={sheetRef}>
        <span className={"sheet-cat cat-" + item.category}><CatIcon cat={item.category} size={12}/>{catDef.label}</span>
        <h2 className="sheet-title">{item.title}</h2>
        <p className="sheet-meta">{when}</p>

        <div className="sheet-section">
          <span className="sheet-label">Time</span>
          {item.time ? (
            <div className="time-edit-row">
              <input type="time" className="time-input" value={formatTime(item.time)} onChange={handleStartTimeChange} aria-label="Start time"/>
              <span className="time-sep">→</span>
              <input type="time" className="time-input" value={item.endTime ? formatTime(item.endTime) : ""} onChange={handleEndTimeChange} aria-label="End time"/>
              {durStr && <span className="time-dur">{durStr}</span>}
              <button className="time-clear-btn" onClick={clearTime}>All day</button>
            </div>
          ) : (<button className="time-add-btn" onClick={addTime}>+ Set time</button>)}
        </div>

        <div className="sheet-section">
          <span className="sheet-label">Priority</span>
          <div className="prio-row">
            <button className={"prio-btn" + (item.priority === "low" ? " active" : "")} onClick={() => setPriority("low")}>Low</button>
            <button className={"prio-btn med" + (item.priority === "medium" ? " active med" : "")} onClick={() => setPriority("medium")}>Medium</button>
            <button className={"prio-btn high" + (item.priority === "high" ? " active high" : "")} onClick={() => setPriority("high")}>High</button>
          </div>
        </div>

        {!item.recurring && (
          <div className="sheet-section">
            <span className="sheet-label">Move to</span>
            <div className="move-row">
              {moveOptions.map((opt, i) => (
                <button key={i} className={"move-btn" + (item.date === opt.dateStr ? " current" : "")} onClick={() => setMoveDate(opt.dateStr)}>
                  {opt.day && <span className="move-day">{opt.label}</span>}
                  {opt.day ? opt.day : opt.label}
                </button>
              ))}
            </div>
          </div>
        )}

        <div className="sheet-section">
          <span className="sheet-label">Pro notes</span>
          <textarea ref={notesRef} className="notes-input" value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Notes for this task — markdown supported. Use the buttons below to stamp in mini-templates." rows={5}/>
          <div className="tpl-row">
            <button className="tpl-btn" onClick={() => insertTemplate("checklist")}>+ Checklist</button>
            <button className="tpl-btn" onClick={() => insertTemplate("plan")}>+ Plan</button>
            <button className="tpl-btn" onClick={() => insertTemplate("journal")}>+ Journal</button>
            <button className="tpl-btn" onClick={() => insertTemplate("outcome")}>+ Outcome</button>
          </div>
        </div>

        <div className="sheet-section">
          <span className="sheet-label">Link another task</span>
          <div className="link-row">
            <select className="link-select" value={linkSelect} onChange={e => setLinkSelect(e.target.value)}>
              <option value="">{allCandidates.length === 0 ? "Nothing else to link" : "Pick a task to link…"}</option>
              {allCandidates.map(c => {
                const lab = makeTaskLabel(c);
                return <option key={c.id} value={c.id}>{lab.title} — {lab.when}{c.recurring ? " (recurring)" : ""}</option>;
              })}
            </select>
            <button className="link-btn" onClick={handleLink} disabled={!linkSelect}>Link</button>
          </div>
          <div className="linked-list">
            {linkedTasks.length === 0 ? (
              <p className="linked-empty">No linked tasks yet. Link prep → execution → journal so they stay connected.</p>
            ) : linkedTasks.map(lt => {
              const lab = makeTaskLabel(lt);
              return (
                <div key={lt.id} className="linked-item" onClick={() => openLinked(lt.id)} role="button" tabIndex={0}>
                  <span className={"linked-item-icon cat-" + lt.category}><CatIcon cat={lt.category} size={12}/></span>
                  <span className="linked-item-text">{lab.title}<span className="when">— {lab.when}{lt.recurring ? " (↻)" : ""}</span></span>
                  <button className="linked-unlink" onClick={(e) => { e.stopPropagation(); onUnlink(item.id, lt.id); }} aria-label="Unlink" title="Unlink"><XIcon size={11}/></button>
                </div>
              );
            })}
          </div>
        </div>

        {allNotes && (() => {
          const linkedNotes = allNotes.filter(n => n.linkedTaskIds && n.linkedTaskIds.indexOf(item.id) !== -1);
          return (
            <div className="sheet-section">
              <span className="sheet-label">Linked notes</span>
              <div className="linked-list">
                {linkedNotes.length === 0 ? (
                  <p className="linked-empty">No notes linked to this task yet. Notes captured during this task's time window will auto-link.</p>
                ) : linkedNotes.map(ln => {
                  const title = deriveTitleFromBlocks(ln.blocks || []) || "Untitled note";
                  const dt = new Date(ln.createdAt);
                  const when = dt.toLocaleString("en-AU", { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit", hour12: true });
                  const collectionName = ln.collectionId && collections ? (collections.find(c => c.id === ln.collectionId) || {}).name : null;
                  const catKey = ln.category || "admin";
                  return (
                    <div key={ln.id} className="linked-item" onClick={() => onOpenNote && onOpenNote(ln.id)} role="button" tabIndex={0} title="Open note">
                      <span className={"linked-item-icon cat-" + catKey}>
                        {ln.category ? <CatIcon cat={ln.category} size={12}/> : <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"><path d="M3 2.5 H11 L13 4.5 V13.5 H3 Z M11 2.5 V4.5 H13"/></svg>}
                      </span>
                      <span className="linked-item-text">
                        {title}
                        <span className="when">— {when}{collectionName ? " · " + collectionName : ""}</span>
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })()}

        {item.recurring && (<p style={{margin: "14px 0 0", color: "var(--text-3)", fontSize: 11.5}}><RecurIcon size={11}/> This is a recurring task. Deleting removes all occurrences and unlinks it from everything.</p>)}

        <div className="sheet-actions">
          <button className="sheet-btn" onClick={onClose}>Close</button>
          <button className="sheet-btn danger" onClick={() => onDelete(item)}>Delete</button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
